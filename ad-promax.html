<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROMAX COMMAND CENTER v7.1</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --neon: #00f2ff; --bg: rgba(0, 10, 20, 0.9); }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #admin-map { position: absolute; inset: 0; z-index: 1; filter: brightness(0.3) contrast(1.2); }

        /* Bảng dữ liệu */
        .hud-panel {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: var(--bg); border: 1px solid var(--neon);
            padding: 15px; border-radius: 12px; width: 200px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); pointer-events: none;
        }
        .label { font-size: 10px; color: var(--neon); letter-spacing: 1px; }
        .val { font-size: 22px; color: white; font-weight: bold; margin-bottom: 10px; }

        /* AI Trợ lý - Có thể di chuyển */
        #ai-assistant {
            position: absolute; bottom: 40px; right: 20px; z-index: 9999;
            width: 100px; height: 100px; display: flex; flex-direction: column; align-items: center;
            touch-action: none; cursor: grab;
        }
        .avatar-circle {
            width: 80px; height: 80px; border-radius: 50%;
            border: 3px solid var(--neon); box-shadow: 0 0 25px var(--neon);
            object-fit: cover; background: #111;
        }
        .mic-btn {
            position: absolute; bottom: 10px; right: 5px;
            background: #ff003c; border: none; width: 38px; height: 38px;
            border-radius: 50%; color: white; font-size: 20px; cursor: pointer;
            box-shadow: 0 0 15px #ff003c; z-index: 10000;
        }
        .recording { animation: pulse 0.8s infinite; background: #fff; color: #ff003c; }

        /* Bong bóng hội thoại */
        #speech-bubble {
            position: absolute; bottom: 110px; right: 0; width: 220px;
            background: white; color: black; padding: 15px; border-radius: 18px;
            display: none; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="admin-map"></div>

    <div class="hud-panel">
        <div class="label">DOANH THU THỰC</div>
        <div id="revenue" class="val">0đ</div>
        <div class="label">TRỰC TUYẾN</div>
        <div id="online" class="val">0</div>
    </div>

    <div id="ai-assistant">
        <div id="speech-bubble">Đang nghe sếp nói...</div>
        <img id="ai-img" class="avatar-circle" src="https://i.imgur.com/8Qp2e0O.png" onclick="document.getElementById('ai-upload').click()">
        <button class="mic-btn" id="mic-start">🎤</button>
        <input type="file" id="ai-upload" hidden accept="image/*">
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Bản đồ vệ tinh tối
        let map = L.map('admin-map', {zoomControl: false}).setView([21.0285, 105.8542], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // 2. DI CHUYỂN AI (Sửa lỗi cho điện thoại)
        const aiBox = document.getElementById('ai-assistant');
        let isMoving = false, startX, startY;

        const onStart = (e) => {
            isMoving = true;
            const ev = e.touches ? e.touches[0] : e;
            startX = ev.clientX - aiBox.offsetLeft;
            startY = ev.clientY - aiBox.offsetTop;
            aiBox.style.cursor = 'grabbing';
        };
        const onMove = (e) => {
            if (!isMoving) return;
            const ev = e.touches ? e.touches[0] : e;
            aiBox.style.left = (ev.clientX - startX) + 'px';
            aiBox.style.top = (ev.clientY - startY) + 'px';
            aiBox.style.bottom = 'auto'; aiBox.style.right = 'auto';
        };
        const onEnd = () => isMoving = false;

        aiBox.addEventListener('mousedown', onStart);
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        aiBox.addEventListener('touchstart', onStart);
        document.addEventListener('touchmove', onMove, {passive: false});
        document.addEventListener('touchend', onEnd);

        // 3. THAY AVATAR
        document.getElementById('ai-upload').onchange = function(e) {
            const reader = new FileReader();
            reader.onload = (ev) => document.getElementById('ai-img').src = ev.target.result;
            reader.readAsDataURL(e.target.files[0]);
        };

        // 4. DỮ LIỆU THẬT
        async function syncData() {
            try {
                const res = await fetch('https://taxi-promax.vercel.app/api/customers?token=309f930afb5691846cd5abbbd3624d507fa8fb5d715d9da03474a711cf262fb2');
                const data = await res.json();
                document.getElementById('revenue').innerText = data.total_revenue.toLocaleString() + "đ";
                document.getElementById('online').innerText = data.customers.length;
            } catch(e) {}
        }
        setInterval(syncData, 5000); syncData();

        // 5. FIX LỖI MICRO & GIỌNG NỮ 2 CHIỀU
        const micBtn = document.getElementById('mic-start');
        const bubble = document.getElementById('speech-bubble');
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (Speech) {
            const recognition = new Speech();
            recognition.lang = 'vi-VN';
            recognition.interimResults = false;

            micBtn.onclick = () => {
                // Kích hoạt âm thanh (Fix lỗi trình duyệt chặn)
                window.speechSynthesis.getVoices(); 
                recognition.start();
                micBtn.classList.add('recording');
                bubble.innerText = "Sếp cứ nói, em đang nghe...";
                bubble.style.display = 'block';
            };

            recognition.onresult = async (event) => {
                micBtn.classList.remove('recording');
                const userText = event.results[0][0].transcript;
                bubble.innerText = "Anh Đạt nói: " + userText;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=AIzaSyBYIpmslXFTkETW7cfiPeLJ0oPcgMJUn2g`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({contents: [{parts: [{text: "Bạn là trợ lý Linh, giọng nữ cực kỳ ngọt ngào, lễ phép. Trả lời ngắn lệnh của sếp Đạt: " + userText}]}]})
                    });
                    const d = await response.json();
                    const reply = d.candidates[0].content.parts[0].text;
                    
                    bubble.innerText = reply;
                    speakLinh(reply);
                } catch(e) {
                    bubble.innerText = "Lỗi kết nối rồi sếp ơi!";
                }
            };

            recognition.onerror = () => micBtn.classList.remove('recording');
        }

        function speakLinh(text) {
            // Hủy các giọng đang nói dở
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'vi-VN';
            
            // Cấu hình giọng nữ ngọt ngào
            msg.pitch = 1.3; // Độ cao giọng nữ
            msg.rate = 0.9;  // Tốc độ nói vừa phải, truyền cảm
            msg.volume = 1;  // Âm lượng tối đa

            window.speechSynthesis.speak(msg);
        }
    </script>
</body>
</html>
