<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAXI PROMAX CONTROL HUB</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --neon: #00f2ff; --bg: #000a0f; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
        
        /* Bản đồ vệ tinh phong cách quân đội */
        #main-map { position: absolute; inset: 0; z-index: 1; filter: brightness(0.3) contrast(1.3) saturate(0.2); }

        /* Bảng doanh thu trung tâm */
        .admin-panel {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(0, 20, 30, 0.9); border: 2px solid var(--neon);
            padding: 15px 25px; border-radius: 10px; color: white;
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.2);
        }
        .admin-panel b { font-size: 11px; color: var(--neon); text-transform: uppercase; letter-spacing: 2px; }
        .admin-panel div { font-size: 28px; font-weight: 900; margin: 5px 0 15px 0; text-shadow: 0 0 10px var(--neon); }

        /* Trợ lý Linh - Di động & Lưu trữ */
        #ai-hero {
            position: absolute; z-index: 9999; width: 120px; height: 120px;
            display: flex; flex-direction: column; align-items: center; touch-action: none;
        }
        #ai-avatar {
            width: 90px; height: 90px; border-radius: 50%;
            border: 3px solid var(--neon); background: #000;
            object-fit: cover; box-shadow: 0 0 20px var(--neon); cursor: grab;
        }
        .mic-trigger {
            position: absolute; bottom: 10px; right: 10px;
            background: #ff003c; border: none; width: 42px; height: 42px;
            border-radius: 50%; color: white; font-size: 22px; cursor: pointer;
            box-shadow: 0 0 15px #ff003c; transition: 0.3s;
        }
        .mic-trigger.active { animation: pulse 0.7s infinite; background: #fff; color: #ff003c; }

        #speech-bubble {
            position: absolute; bottom: 130px; width: 220px;
            background: white; color: #000; padding: 15px; border-radius: 15px;
            display: none; font-size: 14px; font-weight: bold; line-height: 1.4;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 2px solid var(--neon);
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="main-map"></div>

    <div class="admin-panel">
        <b>Doanh Thu Tổng</b>
        <div id="rev-val">Đang tải...</div>
        <b>Thiết Bị Hoạt Động</b>
        <div id="online-val">0</div>
    </div>

    <div id="ai-hero">
        <div id="speech-bubble">Dạ sếp Đạt!</div>
        <img id="ai-avatar" src="https://i.imgur.com/8Qp2e0O.png" onclick="document.getElementById('file-in').click()">
        <button class="mic-trigger" id="mic-btn">🎤</button>
        <input type="file" id="file-in" hidden accept="image/*">
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- CẤU HÌNH BẢN ĐỒ ---
        const map = L.map('main-map', {zoomControl: false}).setView([21.0285, 105.8542], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        const hero = document.getElementById('ai-hero');
        const avt = document.getElementById('ai-avatar');

        // --- KHÔI PHỤC DỮ LIỆU ĐÃ LƯU ---
        if(localStorage.getItem('dat-ai-x')) {
            hero.style.left = localStorage.getItem('dat-ai-x') + 'px';
            hero.style.top = localStorage.getItem('dat-ai-y') + 'px';
        } else { hero.style.bottom = "50px"; hero.style.right = "30px"; }
        
        if(localStorage.getItem('dat-ai-img')) {
            avt.src = localStorage.getItem('dat-ai-img');
        }

        // --- CƠ CHẾ KÉO THẢ & LƯU VỊ TRÍ ---
        let drag = false, gap = [0,0];
        const startDrag = (e) => {
            drag = true;
            let ev = e.touches ? e.touches[0] : e;
            gap = [hero.offsetLeft - ev.clientX, hero.offsetTop - ev.clientY];
        };
        const moveDrag = (e) => {
            if(!drag) return;
            let ev = e.touches ? e.touches[0] : e;
            let x = ev.clientX + gap[0];
            let y = ev.clientY + gap[1];
            hero.style.left = x + 'px'; hero.style.top = y + 'px';
            hero.style.bottom = 'auto'; hero.style.right = 'auto';
            localStorage.setItem('dat-ai-x', x);
            localStorage.setItem('dat-ai-y', y);
        };
        document.addEventListener('mousemove', moveDrag); document.addEventListener('mouseup', () => drag = false);
        hero.addEventListener('touchstart', startDrag); document.addEventListener('touchmove', moveDrag, {passive: false}); document.addEventListener('touchend', () => drag = false);

        // --- ĐỔI ẢNH & LƯU VĨNH VIỄN ---
        document.getElementById('file-in').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (v) => {
                avt.src = v.target.result;
                localStorage.setItem('dat-ai-img', v.target.result);
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        // --- KẾT NỐI API TAXI PROMAX ---
        async function syncApp() {
            try {
                const r = await fetch('https://taxi-promax.vercel.app/api/customers?token=309f930afb5691846cd5abbbd3624d507fa8fb5d715d9da03474a711cf262fb2');
                const d = await r.json();
                document.getElementById('rev-val').innerText = d.total_revenue.toLocaleString() + "đ";
                document.getElementById('online-val').innerText = d.customers.length;
            } catch(e) { console.error("Lỗi đồng bộ app"); }
        }
        setInterval(syncApp, 5000); syncApp();

        // --- TRỢ LÝ LINH - FIX LỖI KẾT NỐI ---
        const mic = document.getElementById('mic-btn');
        const bubble = document.getElementById('speech-bubble');
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (Speech) {
            const rec = new Speech();
            rec.lang = 'vi-VN';

            mic.onclick = () => {
                window.speechSynthesis.cancel();
                rec.start();
                mic.classList.add('active');
                bubble.innerText = "Linh đang nghe sếp ơi...";
                bubble.style.display = 'block';
            };

            rec.onresult = async (e) => {
                mic.classList.remove('active');
                const text = e.results[0][0].transcript;
                bubble.innerText = "Sếp dặn: " + text;

                try {
                    // API KEY GEMINI - SỬ DỤNG MODEL FLASH ĐỂ TỐI ƯU TỐC ĐỘ
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyBYIpmslXFTkETW7cfiPeLJ0oPcgMJUn2g`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({contents: [{parts: [{text: "Bạn là Linh, trợ lý taxi, giọng nữ ngọt ngào, lễ phép. Trả lời sếp Đạt (nguyenxuandat20091985@gmail.com) cực ngắn gọn: " + text}]}]})
                    });
                    const data = await res.json();
                    const reply = data.candidates[0].content.parts[0].text;
                    bubble.innerText = reply;
                    
                    const speak = new SpeechSynthesisUtterance(reply);
                    speak.lang = 'vi-VN'; speak.pitch = 1.4;
                    window.speechSynthesis.speak(speak);
                } catch(err) {
                    bubble.innerText = "Sếp ơi, kết nối AI bị nghẽn, sếp thử lại giúp em!";
                }
            };
            rec.onerror = () => mic.classList.remove('active');
        }
    </script>
</body>
</html>
