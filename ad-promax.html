<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMMANDER - TAXI PROMAX AI</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --neon: #00f2ff; --warn: #ff003c; --panel: rgba(5, 15, 15, 0.9); }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* Bản đồ nền trung tâm */
        #admin-map { position: absolute; inset: 0; z-index: 1; filter: brightness(0.6) contrast(1.2); }

        /* Lớp giao diện Hologram phía trên */
        .overlay { position: relative; z-index: 10; pointer-events: none; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .overlay * { pointer-events: auto; }

        /* Panel Thông số phía trên */
        .top-stats { display: flex; gap: 20px; justify-content: center; }
        .glass-card { background: var(--panel); border: 1px solid var(--neon); border-radius: 15px; padding: 15px 30px; box-shadow: 0 0 20px rgba(0,242,255,0.2); backdrop-filter: blur(10px); }
        .stat-val { font-size: 24px; font-weight: bold; color: var(--neon); text-shadow: 0 0 10px var(--neon); text-align: center; }
        .stat-label { font-size: 10px; text-transform: uppercase; color: #888; text-align: center; }

        /* Khu vực AI Trợ lý - Góc phải */
        #ai-assistant { width: 350px; height: 450px; align-self: flex-end; display: flex; flex-direction: column; }
        .ai-chat-box { flex: 1; overflow-y: auto; background: rgba(0,0,0,0.8); border: 1px solid var(--neon); border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 13px; color: #00f2ff; }
        .ai-input { background: rgba(0,242,255,0.1); border: 1px solid var(--neon); color: white; padding: 10px; border-radius: 5px; outline: none; }

        /* Danh sách khách hàng bên trái */
        #unit-list { width: 250px; height: 60vh; }
        .unit-item { background: rgba(0,0,0,0.6); border-left: 3px solid var(--neon); padding: 10px; margin-bottom: 5px; font-size: 12px; }

        /* Hiệu ứng Scanner */
        .scanner-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--neon); opacity: 0.3; animation: scan 4s linear infinite; z-index: 5; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body>

    <div class="scanner-line"></div>
    <div id="admin-map"></div>

    <div class="overlay">
        <div class="top-stats">
            <div class="glass-card">
                <div class="stat-val" id="total-revenue">0đ</div>
                <div class="stat-label">TỔNG DOANH THU HỆ THỐNG</div>
            </div>
            <div class="glass-card">
                <div class="stat-val" id="online-count">0</div>
                <div class="stat-label">THIẾT BỊ ĐANG TRỰC TUYẾN</div>
            </div>
        </div>

        <div id="unit-list" class="glass-card">
            <h4 style="margin:0 0 10px 0; font-size:12px; border-bottom:1px solid var(--neon)">📡 RADAR SIGNALS</h4>
            <div id="units-container" style="overflow-y:auto; height: 90%;"></div>
        </div>

        <div id="ai-assistant" class="glass-card">
            <h4 style="margin:0 0 10px 0; font-size:12px; color:var(--neon)">🤖 AI COMMANDER (GEMINI-PRO)</h4>
            <div id="ai-messages" class="ai-chat-box">Hệ thống sẵn sàng. Chào Chỉ huy Đạt!</div>
            <input type="text" id="ai-cmd" class="ai-input" placeholder="Ra lệnh cho hệ thống..." onkeypress="handleAI(event)">
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Cấu hình mã bảo mật của anh
        const CONFIG = {
            API: "https://taxi-promax.vercel.app/api/customers",
            TOKEN: "309f930afb5691846cd5abbbd3624d507fa8fb5d715d9da03474a711cf262fb2",
            GEMINI: "AIzaSyBYIpmslXFTkETW7cfiPeLJ0oPcgMJUn2g"
        };

        // 1. Khởi tạo Bản đồ Radar
        let map = L.map('admin-map', {zoomControl: false}).setView([21.0285, 105.8542], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        let markers = {};

        // 2. Đồng bộ dữ liệu Real-time
        async function syncData() {
            try {
                const res = await fetch(`${CONFIG.API}?token=${CONFIG.TOKEN}`);
                const data = await res.json();
                
                document.getElementById('total-revenue').innerText = data.total_revenue.toLocaleString() + "đ";
                document.getElementById('online-count').innerText = data.customers.length;

                const container = document.getElementById('units-container');
                container.innerHTML = "";
                
                data.customers.forEach(c => {
                    container.innerHTML += `<div class="unit-item"><b>UNIT-${c.id}</b><br>STATUS: OK | PKG: ${c.package}</div>`;
                    
                    if (markers[c.id]) {
                        markers[c.id].setLatLng([c.lat, c.lng]);
                    } else {
                        markers[c.id] = L.circleMarker([c.lat, c.lng], {radius: 6, color: '#00f2ff', fillOpacity: 0.8}).addTo(map);
                    }
                });
            } catch(e) { console.log("Re-connecting..."); }
        }

        // 3. Xử lý AI Gemini điều hành
        async function handleAI(e) {
            if(e.key === 'Enter') {
                const prompt = e.target.value;
                const chatBox = document.getElementById('ai-messages');
                chatBox.innerHTML += `<div>👤: ${prompt}</div>`;
                e.target.value = "";

                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${CONFIG.GEMINI}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({contents: [{parts: [{text: "Bạn là trợ lý điều hành hệ thống Taxi Promax của sếp Đạt. Hãy trả lời ngắn gọn, chuyên nghiệp: " + prompt}]}]})
                    });
                    const d = await res.json();
                    const reply = d.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `<div style="color:#0f0">🤖: ${reply}</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                } catch(err) { chatBox.innerHTML += `<div>❌ Lỗi kết nối AI</div>`; }
            }
        }

        setInterval(syncData, 5000);
        window.onload = () => {
            const pass = prompt("AUTHENTICATION REQUIRED:");
            if(pass !== "1985") window.location.href = "index.html";
            else syncData();
        };
    </script>
</body>
</html>
