<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COMMANDER v5.0</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --neon: #00f2ff; --bg: #000808; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        #admin-map { position: absolute; inset: 0; z-index: 1; filter: brightness(0.4) contrast(1.3); }

        /* AI Orb - Tự động bay */
        #ai-bot {
            position: absolute; width: 70px; height: 70px; z-index: 9999;
            cursor: pointer; pointer-events: auto; transition: transform 0.1s linear;
        }
        .orb {
            width: 100%; height: 100%; border-radius: 50%;
            background: radial-gradient(circle, var(--neon), transparent 70%);
            box-shadow: 0 0 30px var(--neon); animation: pulse 1.5s infinite;
        }

        /* Khung chat cạnh AI */
        #chat-bubble {
            position: absolute; left: 80px; top: 0; width: 220px;
            background: rgba(0,0,0,0.85); border: 1px solid var(--neon);
            padding: 12px; border-radius: 15px; display: none; backdrop-filter: blur(10px);
        }

        /* Bảng doanh thu cố định - Không nhảy lung tung */
        .dashboard {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(0,15,15,0.8); border-left: 5px solid var(--neon);
            padding: 20px; border-radius: 0 15px 15px 0; backdrop-filter: blur(10px);
        }
        .stat-item { margin-bottom: 10px; }
        .label { font-size: 11px; color: #888; letter-spacing: 2px; }
        .num { font-size: 24px; font-weight: bold; color: var(--neon); }

        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
    </style>
</head>
<body>

    <div id="admin-map"></div>

    <div class="dashboard">
        <div class="stat-item">
            <div class="label">DOANH THU THỰC</div>
            <div id="revenue" class="num">0đ</div>
        </div>
        <div class="stat-item">
            <div class="label">VỊ TRÍ ĐANG QUÉT</div>
            <div id="unit-count" class="num" style="color: white;">0</div>
        </div>
    </div>

    <div id="ai-bot" onclick="toggleChat()">
        <div class="orb"></div>
        <div id="chat-bubble">
            <div id="ai-msg" style="font-size:12px; margin-bottom:8px;">Tôi là trợ lý Promax. Sếp cần gì ạ?</div>
            <input type="text" id="ai-in" placeholder="Lệnh..." 
                   style="width:90%; background:none; border:none; border-bottom:1px solid var(--neon); color:white; outline:none;"
                   onkeypress="talk(event)">
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Khởi tạo bản đồ chuyên sâu
        let map = L.map('admin-map', {zoomControl: false}).setView([21.0285, 105.8542], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // 2. AI TỰ BAY QUANH MÀN HÌNH (Auto-Pilot)
        let bot = document.getElementById('ai-bot');
        let posX = 100, posY = 100, speedX = 1.5, speedY = 1.2;

        function moveAI() {
            if(!isChatting) {
                posX += speedX; posY += speedY;
                if(posX + 70 > window.innerWidth || posX < 0) speedX *= -1;
                if(posY + 70 > window.innerHeight || posY < 0) speedY *= -1;
                bot.style.left = posX + 'px';
                bot.style.top = posY + 'px';
            }
            requestAnimationFrame(moveAI);
        }
        let isChatting = false;
        function toggleChat() { 
            isChatting = !isChatting;
            document.getElementById('chat-bubble').style.display = isChatting ? 'block' : 'none';
        }
        moveAI();

        // 3. XỬ LÝ DỮ LIỆU THẬT (Thay link Vercel của anh vào đây)
        async function loadData() {
            try {
                const res = await fetch('https://taxi-promax.vercel.app/api/customers?token=309f930afb5691846cd5abbbd3624d507fa8fb5d715d9da03474a711cf262fb2');
                const data = await res.json();
                document.getElementById('revenue').innerText = data.total_revenue.toLocaleString() + "đ";
                document.getElementById('unit-count').innerText = data.customers.length;
                // Cập nhật marker trên bản đồ ở đây...
            } catch(e) { console.log("Waiting for Server..."); }
        }
        setInterval(loadData, 5000);

        // 4. AI CHUYỆN (Gemini)
        async function talk(e) {
            if(e.key === 'Enter') {
                const q = e.target.value;
                document.getElementById('ai-msg').innerText = "Đang phân tích...";
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=AIzaSyBYIpmslXFTkETW7cfiPeLJ0oPcgMJUn2g`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({contents: [{parts: [{text: "Sếp Đạt hỏi: " + q}]}]})
                });
                const d = await res.json();
                document.getElementById('ai-msg').innerText = d.candidates[0].content.parts[0].text;
                e.target.value = "";
            }
        }
    </script>
</body>
</html>
