<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHÒNG CHỈ HUY TAXI PROMAX</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --neon: #00f2ff; }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        #admin-map { position: absolute; inset: 0; z-index: 1; filter: brightness(0.4); }

        /* Avatar AI có thể di chuyển */
        #ai-container {
            position: absolute; width: 100px; z-index: 9999;
            cursor: move; touch-action: none; display: flex; flex-direction: column; align-items: center;
        }
        #avatar-img {
            width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--neon);
            box-shadow: 0 0 20px var(--neon); object-fit: cover; background: #222;
        }
        
        /* Menu điều khiển */
        .controls {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; border: 1px solid var(--neon);
        }

        /* Khung hội thoại */
        .chat-box {
            background: rgba(0,0,0,0.9); border: 1px solid var(--neon); border-radius: 15px;
            padding: 10px; width: 200px; margin-top: 10px; display: none;
        }

        .mic-btn {
            background: var(--neon); border: none; border-radius: 50%; width: 40px; height: 40px;
            cursor: pointer; font-size: 20px; margin-top: 5px; box-shadow: 0 0 10px var(--neon);
        }
        .mic-active { background: #ff003c; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="admin-map"></div>

    <div class="controls">
        <label style="font-size: 12px; cursor: pointer;">
            📷 ĐỔI AVATAR AI
            <input type="file" id="upload-avatar" accept="image/*" style="display:none">
        </label>
    </div>

    <div id="ai-container">
        <img id="avatar-img" src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="AI">
        <button id="mic-btn" class="mic-btn">🎤</button>
        
        <div id="chat-bubble" class="chat-box">
            <div id="ai-msg" style="font-size:12px; margin-bottom:5px; color:var(--neon)">Chào sếp! Nói gì đi ạ...</div>
            <div id="user-speech" style="font-size:10px; color:#aaa; font-style:italic"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Khởi tạo bản đồ
        let map = L.map('admin-map', {zoomControl: false}).setView([21.0285, 105.8542], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // 2. Kéo thả AI (Chống bay lượn)
        const ai = document.getElementById('ai-container');
        let isDragging = false, offset = [0,0];

        ai.addEventListener('mousedown', (e) => {
            isDragging = true;
            offset = [ai.offsetLeft - e.clientX, ai.offsetTop - e.clientY];
            document.getElementById('chat-bubble').style.display = 'block';
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                ai.style.left = (e.clientX + offset[0]) + 'px';
                ai.style.top = (e.clientY + offset[1]) + 'px';
            }
        });
        document.addEventListener('mouseup', () => isDragging = false);

        // Hỗ trợ cảm ứng điện thoại
        ai.addEventListener('touchstart', (e) => {
            isDragging = true;
            offset = [ai.offsetLeft - e.touches[0].clientX, ai.offsetTop - e.touches[0].clientY];
            document.getElementById('chat-bubble').style.display = 'block';
        });
        ai.addEventListener('touchmove', (e) => {
            if (isDragging) {
                ai.style.left = (e.touches[0].clientX + offset[0]) + 'px';
                ai.style.top = (e.touches[0].clientY + offset[1]) + 'px';
            }
        });

        // 3. Thay đổi Avatar từ điện thoại
        document.getElementById('upload-avatar').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('avatar-img').src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        });

        // 4. MICROPHONE 2 CHIỀU (Nhận diện giọng nói)
        const micBtn = document.getElementById('mic-btn');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'vi-VN';

            micBtn.onclick = () => {
                recognition.start();
                micBtn.classList.add('mic-active');
            };

            recognition.onresult = async (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('user-speech').innerText = "Anh nói: " + text;
                micBtn.classList.remove('mic-active');
                
                // Gửi sang Gemini xử lý
                askGemini(text);
            };
        } else {
            alert("Trình duyệt không hỗ trợ Micro!");
        }

        async function askGemini(q) {
            document.getElementById('ai-msg').innerText = "Đang suy nghĩ...";
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=AIzaSyBYIpmslXFTkETW7cfiPeLJ0oPcgMJUn2g`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({contents: [{parts: [{text: "Bạn là trợ lý ảo tên Promax của anh Đạt. Trả lời cực ngắn: " + q}]}]})
                });
                const d = await res.json();
                const reply = d.candidates[0].content.parts[0].text;
                document.getElementById('ai-msg').innerText = reply;
                
                // AI Nói lại (Text to Speech)
                const speech = new SpeechSynthesisUtterance(reply);
                speech.lang = 'vi-VN';
                window.speechSynthesis.speak(speech);
            } catch(e) { document.getElementById('ai-msg').innerText = "Lỗi sóng rồi sếp!"; }
        }
    </script>
</body>
</html>
