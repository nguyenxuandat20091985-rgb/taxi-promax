<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI COMMANDER PROMAX</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --neon: #00f2ff; --bg: rgba(0, 10, 20, 0.9); }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        #admin-map { position: absolute; inset: 0; z-index: 1; filter: brightness(0.4); }

        /* Bảng dữ liệu phi thuyền */
        .hud-panel {
            position: absolute; top: 15px; left: 15px; z-index: 100;
            background: var(--bg); border: 1px solid var(--neon);
            padding: 15px; border-radius: 10px; width: 220px;
            box-shadow: 0 0 15px var(--neon); pointer-events: none;
        }
        .data-row { margin-bottom: 10px; }
        .label { font-size: 10px; color: var(--neon); font-weight: bold; }
        .val { font-size: 20px; color: white; font-weight: bold; }

        /* AI Trợ lý - Có thể di chuyển */
        #ai-assistant {
            position: absolute; bottom: 50px; right: 20px; z-index: 9999;
            width: 90px; height: 90px; cursor: grab; touch-action: none;
        }
        .avatar-circle {
            width: 80px; height: 80px; border-radius: 50%;
            border: 3px solid var(--neon); box-shadow: 0 0 20px var(--neon);
            object-fit: cover; background: #222;
        }
        .mic-btn {
            position: absolute; bottom: -5px; right: -5px;
            background: #ff003c; border: none; width: 35px; height: 35px;
            border-radius: 50%; color: white; font-size: 18px; cursor: pointer;
            box-shadow: 0 0 10px #ff003c;
        }

        /* Bong bóng hội thoại */
        #speech-bubble {
            position: absolute; bottom: 100px; right: 0; width: 200px;
            background: white; color: black; padding: 12px; border-radius: 15px;
            display: none; font-size: 13px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="admin-map"></div>

    <div class="hud-panel">
        <div class="data-row">
            <div class="label">DOANH THU HỆ THỐNG</div>
            <div id="revenue" class="val">0đ</div>
        </div>
        <div class="data-row">
            <div class="label">THIẾT BỊ ONLINE</div>
            <div id="online" class="val">0</div>
        </div>
    </div>

    <div id="ai-assistant">
        <div id="speech-bubble">Đang nghe đây sếp...</div>
        <img id="ai-img" class="avatar-circle" src="https://i.imgur.com/8Qp2e0O.png" onclick="triggerUpload()">
        <button class="mic-btn" id="mic-start">🎤</button>
        <input type="file" id="ai-upload" hidden accept="image/*">
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Bản đồ
        let map = L.map('admin-map', {zoomControl: false}).setView([21.0285, 105.8542], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // 2. CƠ CHẾ DI CHUYỂN MỚI (Touch & Mouse)
        const aiBox = document.getElementById('ai-assistant');
        let isMoving = false;
        let startX, startY, currentX = 0, currentY = 0;

        const moveStart = (e) => {
            isMoving = true;
            const event = e.touches ? e.touches[0] : e;
            startX = event.clientX - aiBox.offsetLeft;
            startY = event.clientY - aiBox.offsetTop;
            aiBox.style.cursor = 'grabbing';
        };

        const moveProcess = (e) => {
            if (!isMoving) return;
            e.preventDefault();
            const event = e.touches ? e.touches[0] : e;
            let x = event.clientX - startX;
            let y = event.clientY - startY;
            aiBox.style.left = x + 'px';
            aiBox.style.top = y + 'px';
            aiBox.style.bottom = 'auto'; // Hủy cố định bottom
            aiBox.style.right = 'auto';  // Hủy cố định right
        };

        const moveEnd = () => { isMoving = false; aiBox.style.cursor = 'grab'; };

        aiBox.addEventListener('mousedown', moveStart);
        document.addEventListener('mousemove', moveProcess);
        document.addEventListener('mouseup', moveEnd);
        aiBox.addEventListener('touchstart', moveStart);
        document.addEventListener('touchmove', moveProcess, {passive: false});
        document.addEventListener('touchend', moveEnd);

        // 3. THAY ĐỔI AVATAR
        function triggerUpload() { document.getElementById('ai-upload').click(); }
        document.getElementById('ai-upload').onchange = function(e) {
            const reader = new FileReader();
            reader.onload = (ev) => { document.getElementById('ai-img').src = ev.target.result; };
            reader.readAsDataURL(e.target.files[0]);
        };

        // 4. DỮ LIỆU THẬT
        async function sync() {
            try {
                const res = await fetch('https://taxi-promax.vercel.app/api/customers?token=309f930afb5691846cd5abbbd3624d507fa8fb5d715d9da03474a711cf262fb2');
                const data = await res.json();
                document.getElementById('revenue').innerText = data.total_revenue.toLocaleString() + "đ";
                document.getElementById('online').innerText = data.customers.length;
            } catch(e) {}
        }
        setInterval(sync, 5000); sync();

        // 5. GIỌNG NỮ NGỌT NGÀO & MICRO
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Speech) {
            const rec = new Speech();
            rec.lang = 'vi-VN';
            document.getElementById('mic-start').onclick = () => {
                rec.start();
                document.getElementById('speech-bubble').style.display = 'block';
            };

            rec.onresult = async (event) => {
                const text = event.results[0][0].transcript;
                // Gọi Gemini (Key của anh đã tích hợp sẵn)
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=AIzaSyBYIpmslXFTkETW7cfiPeLJ0oPcgMJUn2g`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({contents: [{parts: [{text: "Bạn là trợ lý ảo Linh, giọng nữ ngọt ngào. Trả lời cực ngắn lệnh sau: " + text}]}]})
                });
                const d = await res.json();
                const reply = d.candidates[0].content.parts[0].text;
                
                document.getElementById('speech-bubble').innerText = reply;
                
                // Phát giọng nữ
                const msg = new SpeechSynthesisUtterance(reply);
                msg.lang = 'vi-VN';
                msg.pitch = 1.3; // Chỉnh giọng nữ trong trẻo
                window.speechSynthesis.speak(msg);
            };
        }
    </script>
</body>
</html>
