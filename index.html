<div class="container py-3">
    <div class="header-container">
        <div class="brand-name">🚖 Taxi Promax</div>
        <div class="action-cluster">
            <div class="btn-group-top">
                <button class="btn-main btn-start" id="btn-start">Bắt đầu</button>
                <button class="btn-main btn-stop" id="btn-stop" disabled>Kết thúc</button>
            </div>
            <button class="btn-pos" id="btn-location">📍 Vị trí hiện tại</button>
        </div>
    </div>

    <div class="stat-grid mb-3">
        <div class="stat-box box-blue"><div>Quãng đường</div><div class="fw-bold" id="distance-value">0.00 km</div></div>
        <div class="stat-box box-green"><div>Thời gian</div><div class="fw-bold" id="time-value">00:00:00</div></div>
        <div class="stat-box box-yellow"><div>Tạm tính</div><div class="fw-bold"><span id="price-value">0</span> đ</div></div>
        <div class="stat-box box-cyan"><div>Trạng thái</div><div class="fw-bold" id="status-value">Đang chờ</div></div>
    </div>

    <div id="map" style="height: 250px; border-radius: 15px; border: 1px solid #ddd; margin-bottom: 20px;"></div>

    <footer class="text-center">
        <hr>
        <p class="small text-muted mb-0">HỆ THỐNG TAXI THÔNG MINH v5.1</p>
        <p class="fw-bold">Bản quyền thuộc về NGUYỄN XUÂN ĐẠT</p>
    </footer>
</div>
