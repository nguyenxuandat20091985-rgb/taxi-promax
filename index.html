<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAXI PROMAX - CHUYÊN NGHIỆP</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary: #0054a3; --accent: #00bfa5; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; overflow: hidden; }
        #map { height: 100vh; width: 100vw; }
        .glass { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); }
        .tab-view { display: none; }
        .active-tab { display: block; }
        .pulse { animation: pulse-ring 1.5s infinite; }
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

    <div id="loginScreen" class="fixed inset-0 z-[9999] bg-white flex flex-col justify-center items-center p-6">
        <h1 class="text-2xl font-bold text-blue-800 mb-6">TAXI PROMAX LOGIN</h1>
        <input type="text" id="inpName" placeholder="Tên tài xế" class="w-full p-3 border rounded-xl mb-3">
        <select id="inpCar" class="w-full p-3 border rounded-xl mb-3">
            <option value="electric">Xe điện</option>
            <option value="gas">Xe xăng</option>
        </select>
        <button onclick="login()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">ĐĂNG NHẬP</button>
    </div>

    <div id="map"></div>

    <div class="fixed top-0 left-0 right-0 p-4 z-[1000] flex justify-between items-center pointer-events-none">
        <div class="bg-white p-3 rounded-xl shadow-lg pointer-events-auto">
            <div class="text-xs text-gray-500">ĐƠN BỎ QUA HÔM NAY</div>
            <div id="skippedCount" class="text-xl font-bold text-red-600">0</div>
        </div>
        <div class="bg-white p-3 rounded-xl shadow-lg pointer-events-auto">
            <label class="flex items-center space-x-2">
                <span>Chế độ Vẫy</span>
                <input type="checkbox" id="vayMode" checked class="w-6 h-6">
            </label>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white p-4 z-[1000] rounded-t-3xl shadow-2xl">
        <div class="flex justify-around mb-4">
            <button onclick="switchTab('home')" class="text-xs font-bold text-blue-700">🏠 Trang chủ</button>
            <button onclick="switchTab('wallet')" class="text-xs font-bold">💰 Ví tiền</button>
            <button onclick="switchTab('history')" class="text-xs font-bold">📊 Lịch sử</button>
            <button onclick="switchTab('profile')" class="text-xs font-bold">👤 Tôi</button>
        </div>
        <button id="btnMain" onclick="handleAction()" class="w-full bg-teal-500 text-white p-4 rounded-2xl font-bold">BẮT ĐẦU HOẠT ĐỘNG</button>
    </div>

    <div id="orderModal" class="hidden fixed inset-0 z-[2000] bg-black/50 flex justify-center items-center p-4">
        <div class="bg-white w-full rounded-3xl p-6">
            <h2 class="text-lg font-bold text-red-500 mb-4">🚨 CÓ ĐƠN KHÁCH MỚI</h2>
            <p>Khách: <span id="cusName">...</span></p>
            <p>Điểm đón: <span id="cusPickup">...</span></p>
            <div class="flex gap-4 mt-6">
                <button onclick="declineOrder()" class="flex-1 p-3 bg-gray-200 rounded-xl">Bỏ qua</button>
                <button onclick="acceptOrder()" class="flex-1 p-3 bg-blue-600 text-white rounded-xl">Nhận chuyến</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, driverMarker;
        let skippedTrips = localStorage.getItem('skipped_trips') || 0;

        // Init Map
        map = L.map('map', { zoomControl: false }).setView([21.02, 105.83], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        function login() {
            document.getElementById('loginScreen').style.display = 'none';
        }

        function handleAction() {
            // Logic bắt đầu/kết thúc chuyến
            alert("Đã gửi tín hiệu lên hệ thống PROMAX AI...");
        }

        function declineOrder() {
            skippedTrips++;
            localStorage.setItem('skipped_trips', skippedTrips);
            document.getElementById('skippedCount').innerText = skippedTrips;
            document.getElementById('orderModal').classList.add('hidden');
        }

        function acceptOrder() {
            // Điều hướng mở Maps
            const url = `https://www.google.com/maps/dir/?api=1&destination=21.03,105.84`;
            window.open(url, '_blank');
            document.getElementById('orderModal').classList.add('hidden');
        }

        function switchTab(tab) {
            // Logic chuyển tab
        }

        // Cập nhật số liệu ban đầu
        document.getElementById('skippedCount').innerText = skippedTrips;
    </script>
</body>
</html>
