<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - Driver App</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #00bfa5; --bg: #f4f7f6; --text: #333; --white: #ffffff; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: var(--bg); overflow: hidden; }

        /* Map Container */
        #map { height: 100vh; width: 100vw; position: absolute; z-index: 1; }

        /* Glowing Marker */
        .driver-marker { position: relative; display: flex; justify-content: center; align-items: center; }
        .pulse-ring { width: 40px; height: 40px; border-radius: 50%; background: rgba(0, 191, 165, 0.4); animation: pulsate 2s infinite; }
        .inner-dot { width: 15px; height: 15px; background: var(--primary); border-radius: 50%; position: absolute; border: 2px solid white; }
        @keyframes pulsate { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

        /* UI Overlay */
        .tab-content { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none; background: rgba(255,255,255,0.95); padding: 20px; padding-bottom: 100px; box-sizing: border-box; }
        .tab-content.active { display: block; }

        .header-bar { position: fixed; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 20; }
        .wallet-badge { background: white; padding: 8px 15px; border-radius: 20px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); color: var(--primary); }

        .footer-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px 0; z-index: 20; box-shadow: 0 -5px 10px rgba(0,0,0,0.05); }
        .nav-item { text-align: center; cursor: pointer; color: #888; font-size: 12px; }
        .nav-item.active { color: var(--primary); }

        /* Modal styling */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; display: none; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 90%; padding: 20px; border-radius: 20px; text-align: center; }
        .btn-action { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 15px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Map -->
    <div id="map"></div>

    <!-- UI Overlay (Tabs) -->
    <div id="tab-home" class="tab-content active">
        <div class="header-bar">
            <div class="wallet-badge">💰 610.300đ</div>
            <div class="wallet-badge" id="status-toggle" style="background:#e8f5e9; color:#2e7d32;">● Đang trực tuyến</div>
        </div>
        <!-- Nội dung Trang chủ -->
    </div>

    <div id="tab-wallet" class="tab-content">
        <h2>Ví Tài Xế</h2>
        <p>Lịch sử nạp/rút và số dư.</p>
    </div>

    <div id="tab-history" class="tab-content">
        <h2>Lịch sử chuyến đi</h2>
        <!-- Dữ liệu chuyến đi -->
    </div>

    <div id="tab-profile" class="tab-content">
        <h2>Nguyễn Xuân Đạt</h2>
        <p>Hạng tài xế: Xanh</p>
    </div>

    <!-- Modal Nhận Cuốc (Chuyến vẫy) -->
    <div id="trip-modal" class="modal">
        <div class="modal-body">
            <h3>🚨 ĐƠN HÀNG MỚI</h3>
            <p>Khách hàng: Hoàng Minh Chiến</p>
            <p>📍 Điểm đón: Nhà hàng Hồng Hạnh 6</p>
            <button class="btn-action" onclick="alert('Đã nhận chuyến!')">ĐÓN KHÁCH</button>
            <button class="btn-action" style="background:#ff5252;" onclick="document.getElementById('trip-modal').style.display='none'">BỎ QUA</button>
        </div>
    </div>

    <!-- Footer Navigation -->
    <div class="footer-nav">
        <div class="nav-item active" onclick="showTab('home')">🏠<br>Trang chủ</div>
        <div class="nav-item" onclick="showTab('wallet')">💰<br>Ví tiền</div>
        <div class="nav-item" onclick="showTab('history')">📊<br>Lịch sử</div>
        <div class="nav-item" onclick="showTab('profile')">👤<br>Tôi</div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Init Map
        const map = L.map('map', {zoomControl: false}).setView([20.95, 107.03], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Custom Glowing Marker
        const pulseIcon = L.divIcon({
            className: 'driver-marker',
            html: '<div class="pulse-ring"></div><div class="inner-dot"></div>',
            iconSize: [40, 40]
        });
        L.marker([20.95, 107.03], {icon: pulseIcon}).addTo(map);

        // Tab Switching
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Simulate incoming ride (Integration hook)
        setTimeout(() => {
            document.getElementById('trip-modal').style.display = 'flex';
            // Play sound here
            new Audio('https://actions.google.com/sounds/v1/notifications/beep_short.ogg').play();
        }, 3000);
    </script>
</body>
</html>
