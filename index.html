<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/744/744465.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/744/744465.png">
    
    <title>TAXI PROMAX - XANH SM STYLE</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #00bfa5; --dark: #002d26; --gold: #ffc107; --danger: #ff5252; --bg: #f0f4f3; --glass: rgba(255, 255, 255, 0.9); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; background: var(--bg); }
        
        /* TĂNG DIỆN TÍCH BẢN ĐỒ */
        #map { height: 100vh; width: 100vw; z-index: 1; filter: contrast(1.1) brightness(1.05); } 

        /* HEADER ÉP GỌN */
        .header { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 1000; }
        .badge { background: var(--glass); padding: 6px 14px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 11px; font-weight: 700; color: var(--dark); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); } 

        /* THÔNG SỐ ÉP MỎNG CHIỀU CAO */
        .stats-bar { position: fixed; top: 45px; left: 10px; right: 10px; background: var(--glass); backdrop-filter: blur(15px); border-radius: 15px; display: flex; padding: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); z-index: 1000; border: 1px solid white; }
        .stat-item { flex: 1; text-align: center; }
        .stat-label { font-size: 9px; color: #66837f; font-weight: 800; text-transform: uppercase; }
        .stat-value { font-size: 22px; font-weight: 900; color: var(--dark); margin-top: 2px; } 

        /* PANEL ĐIỀU KHIỂN DẸT */
        .footer-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; z-index: 2000; border-radius: 25px 25px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); padding: 12px 15px 8px; }
        .nav-grid { display: flex; justify-content: space-around; margin-top: 10px; padding-top: 8px; border-top: 1px solid #f0f4f3; }
        .nav-item { border: none; background: none; color: #a0b2b0; font-size: 10px; font-weight: 700; text-align: center; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 2px; } 

        /* TAB NỘI DUNG */
        .tab-content { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 110px); background: #f8faf9; z-index: 1500; display: none; flex-direction: column; overflow-y: auto; padding-bottom: 40px; }
        .p-header { background: var(--dark); color: white; padding: 30px 20px; text-align: center; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; position: relative; }
        .back-home { position: absolute; top: 30px; left: 20px; color: var(--primary); font-weight: 800; font-size: 12px; text-decoration: none; }
        
        /* LỊCH SỬ CHUYÊN NGHIỆP */
        .history-card { background: white; margin: 10px 15px; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--primary); }
        .history-info b { display: block; font-size: 16px; color: var(--dark); }
        .history-info span { font-size: 12px; color: #888; }
        .history-price { font-weight: 900; color: var(--primary); font-size: 16px; }

        .btn-main { width: 100%; padding: 15px; border-radius: 18px; border: none; background: var(--primary); color: white; font-size: 18px; font-weight: 900; box-shadow: 0 8px 20px rgba(0,191,165,0.3); transition: 0.3s; }
        .sm-marker { width: 30px; height: 30px; background: var(--primary); border: 3px solid white; border-radius: 50%; box-shadow: 0 0 15px rgba(0,191,165,0.6); position: relative; }
        .sm-arrow { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid var(--primary); }
        .custom-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,45,38,0.8); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: white; width: 85%; max-width: 320px; padding: 25px; border-radius: 30px; text-align: center; }
    </style>
</head>
<body oncontextmenu="return false;"> 

    <div class="header" id="headerUI">
        <div class="badge" id="idShow">🆔 ĐANG QUÉT...</div>
        <div class="badge" style="color:var(--gold)" id="planShow">⭐ PROMAX VIP</div>
    </div> 

    <div class="stats-bar" id="statsUI">
        <div class="stat-item" style="border-right: 1px solid #e0e0e0;">
            <div class="stat-label">CƯỚC PHÍ (đ)</div>
            <div id="cost" class="stat-value">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">QUÃNG ĐƯỜNG (KM)</div>
            <div id="km" class="stat-value">0.00</div>
        </div>
    </div> 

    <div id="map"></div> 

    <div id="tab-lichsu" class="tab-content">
        <div class="p-header"><h3>LỊCH SỬ CHUYẾN ĐI</h3></div>
        <div id="historyList" style="padding-top:10px;">
            <div style="text-align:center; color:#999; margin-top:20px;">Chưa có chuyến đi nào.</div>
        </div>
    </div>

    <div id="tab-vi" class="tab-content">
        <div class="p-header"><h3>VÍ CỦA TÔI</h3></div>
        <div style="text-align:center; padding: 20px;">
            <img id="qrImg" style="width:200px; border-radius:15px;" src="">
            <p id="qrContent" style="font-weight:bold; color:var(--danger); margin-top:10px;"></p>
            <p style="font-size:12px;">Chủ TK: NGUYEN XUAN DAT</p>
        </div>
    </div>

    <div id="tab-toi" class="tab-content">
        <div class="p-header"><h3>CÀI ĐẶT CÁ NHÂN</h3></div>
        <div style="padding:20px;">
            <div class="history-card">
                <div class="history-info"><b>Bản Quyền</b><span>Nguyễn Xuân Đạt</span></div>
            </div>
            <div class="history-card">
                <div class="history-info"><b>Phiên Bản</b><span>Taxi Promax 2.0 (Slim)</span></div>
            </div>
        </div>
    </div>

    <div class="footer-panel">
        <div id="homeControls">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:12px; font-weight:700;">
                <span>GIÁ/KM</span>
                <span style="color:var(--danger)"><span id="rateLabel">15,000</span>đ</span>
            </div>
            <input type="range" min="10000" max="50000" step="1000" value="15000" style="width:100%; margin-bottom:12px; accent-color:var(--primary)" oninput="updateRate(this.value)">
            <button id="mainBtn" class="btn-main" onclick="handleTrip()">BẮT ĐẦU CHUYẾN ĐI</button>
        </div> 

        <div class="nav-grid">
            <button class="nav-item active" onclick="showTab('home', this)"><i>🏠</i>Trang chủ</button>
            <button class="nav-item" onclick="showTab('vi', this)"><i>💰</i>Ví tiền</button>
            <button class="nav-item" onclick="showTab('lichsu', this)"><i>📊</i>Lịch sử</button>
            <button class="nav-item" onclick="showTab('toi', this)"><i>👤</i>Tôi</button>
        </div>
    </div> 

    <div id="endModal" class="custom-modal">
        <div class="modal-content">
            <div style="font-size:50px;">🏁</div>
            <h3 style="margin:10px 0;">KẾT THÚC CHUYẾN</h3>
            <div id="endSummary" style="margin-bottom:20px;"></div>
            <button class="btn-main" onclick="closeModal('endModal')">HOÀN TẤT</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const TX_ID = localStorage.getItem('tx_id') || 'TX-' + Math.random().toString(36).substr(2, 5).toUpperCase();
        localStorage.setItem('tx_id', TX_ID);
        document.getElementById('idShow').innerText = "🆔 " + TX_ID;

        var map = L.map('map', { zoomControl: false }).setView([21.0285, 105.8542], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); 

        var smIcon = L.divIcon({ className: 'sm-div-icon', html: "<div class='sm-marker'><div class='sm-arrow'></div></div>", iconSize: [30, 30], iconAnchor: [15, 15] });
        var marker = L.marker([21.0285, 105.8542], { icon: smIcon }).addTo(map); 

        let isRunning = false, totalKm = 0, lastPos = null, currentRate = 15000, history = JSON.parse(localStorage.getItem('taxi_history') || '[]');

        function updateRate(v) { currentRate = v; document.getElementById('rateLabel').innerText = parseInt(v).toLocaleString(); } 

        function handleTrip() {
            const btn = document.getElementById('mainBtn');
            if(!isRunning) {
                isRunning = true;
                btn.innerText = "KẾT THÚC CHUYẾN";
                btn.style.background = "var(--danger)";
                totalKm = 0; lastPos = null;
                map.locate({ watch: true, enableHighAccuracy: true });
            } else {
                isRunning = false;
                btn.innerText = "BẮT ĐẦU CHUYẾN ĐI";
                btn.style.background = "var(--primary)";
                map.stopLocate();
                saveHistory();
                document.getElementById('endSummary').innerHTML = `Quãng đường: <b>${totalKm.toFixed(2)} KM</b><br>Tổng tiền: <b style="color:var(--primary)">${Math.floor(totalKm * currentRate).toLocaleString()}đ</b>`;
                document.getElementById('endModal').style.display = 'flex';
            }
        } 

        map.on('locationfound', (e) => {
            marker.setLatLng(e.latlng);
            map.panTo(e.latlng);
            if(isRunning) {
                if(lastPos) {
                    let d = e.latlng.distanceTo(lastPos) / 1000;
                    if(d > 0.005) { totalKm += d; lastPos = e.latlng; updateUI(); }
                } else { lastPos = e.latlng; }
            }
        }); 

        function updateUI() {
            document.getElementById('km').innerText = totalKm.toFixed(2);
            document.getElementById('cost').innerText = Math.floor(totalKm * currentRate).toLocaleString();
        }

        function saveHistory() {
            const trip = {
                date: new Date().toLocaleString('vi-VN'),
                km: totalKm.toFixed(2),
                cost: Math.floor(totalKm * currentRate).toLocaleString()
            };
            history.unshift(trip);
            if(history.length > 10) history.pop();
            localStorage.setItem('taxi_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if(history.length === 0) return;
            list.innerHTML = history.map(t => `
                <div class="history-card">
                    <div class="history-info"><b>${t.km} KM</b><span>${t.date}</span></div>
                    <div class="history-price">${t.cost}đ</div>
                </div>
            `).join('');
        }

        function showTab(tab, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(tab === 'home') document.getElementById('homeControls').style.display = 'block';
            else {
                document.getElementById('homeControls').style.display = 'none';
                document.getElementById('tab-' + tab).style.display = 'flex';
                if(tab === 'vi') selectPack(49000, 'VIP');
                if(tab === 'lichsu') renderHistory();
            }
        }

        function selectPack(price, name) {
            const content = `${TX_ID} NAP ${name}`;
            document.getElementById('qrContent').innerText = content;
            document.getElementById('qrImg').src = `https://img.vietqr.io/image/bidv-4430269669-compact2.png?amount=${price}&addInfo=${encodeURIComponent(content)}`;
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        renderHistory();
    </script>
</body>
</html>
