<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TAXI PROMAX - NGUYỄN XUÂN ĐẠT</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css"> </head>
<body oncontextmenu="return false;"> 

    <div class="header">
        <div class="badge" id="idShow">🆔 ĐANG QUÉT...</div>
        <div class="badge" style="color:var(--gold)" id="planShow">⭐ GÓI: KIỂM TRA...</div>
    </div> 

    <div class="stats-bar" id="statsUI">
        <div class="stat-item" style="border-right: 1px solid #eee;">
            <div class="stat-label">CƯỚC (VNĐ)</div>
            <div id="cost" class="stat-value">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">KHOẢNG CÁCH (KM)</div>
            <div id="km" class="stat-value">0.00</div>
        </div>
    </div> 

    <div id="map"></div> 

    <div id="tab-vi" class="tab-content">
        <div class="p-header">
            <div style="font-size: 20px; font-weight: 800;">HỆ THỐNG GÓI CƯỚC</div>
            <div id="trialBox" style="font-size: 11px; opacity: 0.9;">TỰ ĐỘNG KÍCH HOẠT QUA BIDV</div>
        </div>
        <div class="p-grid" id="pricing-list">
            <div class="p-card" onclick="tpHandlePayment(0, 'Gói THỬ 7D')">
                <div class="tp-badge-trial">MIỄN PHÍ</div>
                <b>TRẢI NGHIỆM</b><span>0đ</span>
                <ul><li>✅ Dùng thử 7 ngày</li><li>✅ Đầy đủ tính năng</li></ul>
                <div class="p-btn">KÍCH HOẠT</div>
            </div>
            </div>
    </div> 

    <div id="tab-lichsu" class="tab-content">
        <div class="p-header">LỊCH SỬ CHUYẾN ĐI</div>
        <div id="historyList"></div>
    </div> 

    <div id="tab-toi" class="tab-content">
        <div class="p-header">THIẾT LẬP</div>
        <div style="padding:20px;">
            <div class="profile-card">
                <p>SĐT: <b id="profilePhone">...</b></p>
                <p>Mã thiết bị: <b id="profileID">...</b></p>
                <button class="btn-main" style="background:#666;" onclick="clearRegistration()">ĐĂNG XUẤT</button>
            </div>
        </div>
    </div> 

    <div class="footer-panel">
        <div id="homeControls">
            <input type="range" min="10000" max="50000" step="1000" value="15000" oninput="updateRate(this.value)">
            <button id="mainBtn" class="btn-main" onclick="handleTrip()">BẮT ĐẦU CHUYẾN ĐI</button>
        </div> 
        <div class="nav-grid">
            <button class="nav-item active" onclick="showTab('home', this)"><i>🏠</i>Trang chủ</button>
            <button class="nav-item" onclick="showTab('vi', this)"><i>💰</i>Ví tiền</button>
            <button class="nav-item" onclick="showTab('lichsu', this)"><i>📊</i>Lịch sử</button>
            <button class="nav-item" onclick="showTab('toi', this)"><i>👤</i>Tôi</button>
        </div>
    </div> 

    <div id="regModal" class="custom-modal">
        <div class="modal-content">
            <h3>ĐĂNG KÝ TÀI XẾ</h3>
            <input type="tel" id="regPhone" placeholder="Nhập số điện thoại...">
            <button class="btn-main" onclick="processRegistration()">KÍCH HOẠT APP</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script> <script src="js/payment.js"></script>
</body>
</html>
