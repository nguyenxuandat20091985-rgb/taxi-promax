<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax Infinity - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main-green: #2ecc71; --main-blue: #3498db; --glass: rgba(255, 255, 255, 0.9); }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #f4f7f6; overflow: hidden; }
        
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; background: #e5e3df; } 

        /* Header */
        .top-bar {
            position: absolute; top: 15px; width: 92%; left: 4%; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
        }
        .info-pill { 
            background: rgba(0,0,0,0.7); color: white; padding: 6px 14px; 
            border-radius: 20px; font-size: 11px; backdrop-filter: blur(5px); font-weight: bold;
        } 

        /* Nút hồng cài đặt */
        .btn-config {
            position: absolute; top: 65px; left: 15px; z-index: 10;
            width: 55px; height: 55px; background: #ffc0cb; border: 2px solid white;
            border-radius: 50%; display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 8px; font-weight: bold; color: #d63031;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); cursor: pointer;
        }

        /* Smart HUD */
        .smart-hud {
            position: absolute; bottom: 185px; width: 92%; left: 4%; z-index: 10;
            background: var(--glass); border-radius: 25px; backdrop-filter: blur(10px);
            display: flex; padding: 15px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .hud-col { flex: 1; text-align: center; }
        .hud-col:first-child { border-right: 1px solid rgba(0,0,0,0.05); }
        .money { font-size: 32px; color: var(--main-green); font-weight: 900; }
        .km { font-size: 24px; color: var(--main-blue); font-weight: bold; }
        .label { font-size: 9px; color: #666; text-transform: uppercase; font-weight: bold; margin-top: 5px; } 

        /* Điều khiển Bottom */
        .bottom-panel {
            position: absolute; bottom: 0; width: 100%; z-index: 20;
            background: white; border-top-left-radius: 30px; border-top-right-radius: 30px;
            padding: 20px 0 10px 0; box-shadow: 0 -5px 25px rgba(0,0,0,0.1);
        }
        .main-btns { width: 90%; margin: 0 auto 15px auto; display: flex; gap: 10px; }
        .btn-go { flex: 2; background: var(--main-green); color: white; border: none; padding: 16px; border-radius: 18px; font-weight: 900; font-size: 16px; }
        .btn-stop { flex: 1; background: #fff; color: #e74c3c; border: 2px solid #e74c3c; border-radius: 18px; font-weight: bold; } 

        /* Menu Icon */
        .nav-icons { display: flex; justify-content: space-around; width: 95%; margin: 0 auto; border-top: 1px solid #f0f0f0; padding-top: 12px; }
        .nav-item { text-align: center; color: #95a5a6; text-decoration: none; font-size: 10px; font-weight: bold; width: 25%; cursor: pointer; }
        .nav-item span { display: block; font-size: 22px; margin-bottom: 4px; }
        .nav-item.active { color: var(--main-green); }

        /* Popup xịn */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal { background: white; padding: 25px; border-radius: 25px; width: 80%; text-align: center; }
        .modal input { width: 100%; margin: 20px 0; }
        .modal-btn { background: var(--main-green); color: white; border: none; padding: 12px; width: 100%; border-radius: 15px; font-weight: bold; }
    </style>
</head>
<body> 

<div id="map"></div> 

<div class="top-bar">
    <div class="info-pill">🆔 TX-DAT-2026</div>
    <div class="info-pill" style="background: #f1c40f; color: #000;">⚡ GÓI: FREE</div>
</div> 

<div class="btn-config" onclick="openPrice()">
    <span>⚙️ GIÁ</span>
    <span style="font-size: 10px;" id="price-lbl">15K/KM</span>
</div> 

<div class="smart-hud">
    <div class="hud-col">
        <div class="money" id="fare-txt">0</div>
        <div class="label">VNĐ ĐANG NHẢY</div>
    </div>
    <div class="hud-col">
        <div class="km" id="km-txt">0.00</div>
        <div class="label">KILÔMÉT ĐÃ ĐI</div>
    </div>
</div> 

<div class="bottom-panel">
    <div class="main-btns">
        <button class="btn-go" id="startBtn" onclick="startTrip()">▶ BẮT ĐẦU CHUYẾN</button>
        <button class="btn-stop" onclick="stopTrip()">KẾT THÚC</button>
    </div> 

    <div class="nav-icons">
        <div class="nav-item active" onclick="location.reload()"><span>🏠</span>Trang chủ</div>
        <div class="nav-item" onclick="openMsg('Tính năng nạp tiền đang cập nhật!')"><span>💰</span>Nạp tiền</div>
        <div class="nav-item" onclick="openMsg('Lịch sử di chuyển trống.')"><span>📊</span>Lịch sử</div>
        <div class="nav-item" onclick="openMsg('Đang vào trang quản lý...')"><span>⚙️</span>Quản lý</div>
    </div>
    <div style="text-align: center; font-size: 9px; color: #bdc3c7; margin-top: 8px;">PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
</div> 

<div id="priceBox" class="overlay">
    <div class="modal">
        <h3 style="margin:0">Cài đặt giá (VNĐ/Km)</h3>
        <div id="preview-p" style="font-size:24px; font-weight:bold; color:#e84393; margin:15px">15,000</div>
        <input type="range" min="10" max="100" value="15" id="range-p" oninput="document.getElementById('preview-p').innerText=(this.value*1000).toLocaleString()+'đ'">
        <button class="modal-btn" onclick="savePrice()">XÁC NHẬN</button>
    </div>
</div>

<div id="msgBox" class="overlay">
    <div class="modal">
        <p id="msg-txt" style="font-weight:bold"></p>
        <button class="modal-btn" onclick="document.querySelectorAll('.overlay').forEach(el=>el.style.display='none')">ĐÓNG</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Bản đồ Voyager rõ nét - Chống giật
    var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([20.95, 107.07], 16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
    
    var carIcon = L.circleMarker([0,0], { radius: 10, color: '#fff', weight: 3, fillColor: '#2ecc71', fillOpacity: 1 }).addTo(map); 

    let kmPrice = 15000, totalKm = 0, watchId = null, lastLoc = null; 

    // Chức năng menu
    function openPrice() { document.getElementById('priceBox').style.display='flex'; }
    function savePrice() {
        let v = document.getElementById('range-p').value;
        kmPrice = v * 1000;
        document.getElementById('price-lbl').innerText = v + "K/KM";
        document.getElementById('priceBox').style.display='none';
    }
    function openMsg(txt) {
        document.getElementById('msg-txt').innerText = txt;
        document.getElementById('msgBox').style.display='flex';
    }

    // Chức năng GPS mượt mà
    function startTrip() {
        if(watchId) return;
        document.getElementById('startBtn').style.background = '#1b5e20';
        document.getElementById('startBtn').innerText = "⚡ ĐANG CHẠY...";
        
        watchId = navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            const cur = [latitude, longitude];

            // Smooth Movement: Chỉ flyTo khi khoảng cách đủ lớn để tránh giật hình
            if (!lastLoc || map.distance(lastLoc, cur) > 10) {
                map.panTo(cur, { animate: true, duration: 1.5 });
            }
            carIcon.setLatLng(cur); 

            if (lastLoc && accuracy < 40) {
                const d = map.distance(lastLoc, cur) / 1000;
                if (d > 0.003) { 
                    totalKm += d; 
                    document.getElementById('km-txt').innerText = totalKm.toFixed(2);
                    document.getElementById('fare-txt').innerText = Math.round(totalKm * kmPrice).toLocaleString('vi-VN');
                }
            }
            lastLoc = cur;
        }, null, { enableHighAccuracy: true, maximumAge: 1000 });
    } 

    function stopTrip() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        watchId = null; lastLoc = null;
        document.getElementById('startBtn').style.background = '#2ecc71';
        document.getElementById('startBtn').innerText = "▶ BẮT ĐẦU CHUYẾN";
        openMsg("Kết thúc! Tổng tiền: " + document.getElementById('fare-txt').innerText + "đ");
    }
</script>
</body>
</html>
