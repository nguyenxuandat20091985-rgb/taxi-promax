<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/744/744465.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/744/744465.png">

    <title>TAXI PROMAX - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #00bfa5; --dark: #002d26; --gold: #ffc107; --danger: #ff5252; --bg: #0b1515; --glass: rgba(11, 21, 21, 0.9); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; background: var(--bg); }
        
        /* NÂNG CẤP 1: BẢN ĐỒ SIÊU NÉT DARK MODE */
        #map { height: 100vh; width: 100vw; z-index: 1; filter: saturate(1.2) brightness(0.8) contrast(1.1); }
        .leaflet-container { background: #0b1515 !important; }

        .header { position: fixed; top: env(safe-area-inset-top, 10px); left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 1000; pointer-events: none; }
        .badge { pointer-events: auto; background: var(--glass); padding: 10px 18px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 11px; font-weight: 800; color: #fff; border: 1px solid rgba(255,255,255,0.1); }

        .stats-bar { position: fixed; top: 65px; left: 10px; right: 10px; background: var(--glass); border-radius: 20px; display: flex; padding: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); z-index: 1000; border: 1px solid rgba(0,191,165,0.3); backdrop-filter: blur(10px); }
        .stat-item { flex: 1; text-align: center; }
        .stat-label { font-size: 9px; color: var(--primary); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 26px; font-weight: 900; color: #fff; margin-top: 2px; text-shadow: 0 0 10px rgba(0,191,165,0.5); }

        .footer-panel { position: fixed; bottom: 0; left: 0; right: 0; background: var(--glass); z-index: 2000; border-radius: 30px 30px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); padding: 20px 20px calc(env(safe-area-inset-bottom) + 10px); border-top: 1px solid rgba(0,191,165,0.2); }
        .nav-grid { display: flex; justify-content: space-around; margin-top: 15px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); }
        .nav-item { border: none; background: none; color: #666; font-size: 10px; font-weight: 700; text-align: center; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }

        .brand-footer { font-size: 10px; text-align: center; color: var(--primary); padding: 8px 0; font-weight: bold; letter-spacing: 1px; opacity: 0.8; }

        .tab-content { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b1515; z-index: 1500; display: none; flex-direction: column; overflow-y: auto; padding-bottom: 150px; }
        .p-header { background: linear-gradient(135deg, var(--primary), var(--dark)); color: white; padding: 40px 20px; text-align: center; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }

        /* KHU VỰC CẤM SỬA CHỮA - GIỮ NGUYÊN */
        .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .p-card { background: #1a2626; border: 1px solid #333; border-radius: 18px; padding: 15px; color: #fff; }
        .p-card.active { border-color: var(--primary); background: rgba(0,191,165,0.1); }
        .p-card span { color: var(--primary); font-weight: 800; }

        .sm-marker { width: 30px; height: 30px; background: var(--primary); border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 20px var(--primary); position: relative; transition: transform 0.3s ease; }
        .sm-arrow { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid var(--primary); }

        .btn-main { width: 100%; padding: 18px; border-radius: 20px; border: none; background: var(--primary); color: white; font-size: 18px; font-weight: 900; box-shadow: 0 10px 25px rgba(0,191,165,0.4); text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge" id="idShow">🆔 ĐANG QUÉT...</div>
        <div class="badge" style="color:var(--gold)" id="planShow">⭐ GÓI: VIP TRỌN ĐỜI</div>
    </div>

    <div class="stats-bar" id="statsUI">
        <div class="stat-item" style="border-right: 1px solid rgba(255,255,255,0.1);">
            <div class="stat-label">CƯỚC (VNĐ)</div>
            <div id="cost" class="stat-value">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">KHOẢNG CÁCH (KM)</div>
            <div id="km" class="stat-value">0.00</div>
        </div>
    </div>

    <div id="map"></div>

    <div id="tab-vi" class="tab-content">
        <div class="p-header">
            <div style="font-size: 20px; font-weight: 800;">VÍ TIỀN HỆ THỐNG</div>
        </div>
        <div class="p-grid">
            <div class="p-card"><b>GÓI BASIC</b><span>19.000đ</span></div>
            <div class="p-card active"><b>VIP TRỌN ĐỜI</b><span>999.000đ</span></div>
        </div>
        <div style="text-align:center; padding: 20px;">
            <img id="qrImg" style="width:200px; border-radius:15px; border: 5px solid white;" src="https://img.vietqr.io/image/bidv-4430269669-compact2.png?amount=999000&addInfo=NAP%20TRON%20DOI">
        </div>
    </div>

    <div id="tab-lichsu" class="tab-content">
        <div class="p-header">LỊCH SỬ CHUYẾN ĐI</div>
        <div id="historyList"></div>
    </div>

    <div id="tab-toi" class="tab-content">
        <div class="p-header">TÀI KHOẢN CỦA TÔI</div>
        <div style="padding:20px; color:white;">Mã tài xế: <b id="profileID">...</b></div>
    </div>

    <div class="footer-panel">
        <div id="homeControls">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:13px; font-weight:800; color: #fff;">
                <span>CƯỚC PHÍ/KM</span>
                <span style="color:var(--primary)"><span id="rateLabel">15,000</span>đ</span>
            </div>
            <input type="range" min="10000" max="50000" step="1000" value="15000" oninput="updateRate(this.value)" style="width:100%; margin-bottom:15px; accent-color: var(--primary);">
            <button id="mainBtn" class="btn-main" onclick="handleTrip()">BẮT ĐẦU CHUYẾN ĐI</button>
        </div>

        <div class="nav-grid">
            <button class="nav-item active" onclick="showTab('home', this)"><i>🏠</i>Trang chủ</button>
            <button class="nav-item" onclick="showTab('vi', this)"><i>💰</i>Ví tiền</button>
            <button class="nav-item" onclick="showTab('lichsu', this)"><i>📊</i>Lịch sử</button>
            <button class="nav-item" onclick="showTab('toi', this)"><i>👤</i>Tôi</button>
        </div>
        <div class="brand-footer">PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // NÂNG CẤP 4: MÀN HÌNH LUÔN SÁNG (WAKE LOCK)
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('keepAwake' in screen) { screen.keepAwake = true; }
                else if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
            } catch (err) { console.log("WakeLock lỗi hoặc không hỗ trợ"); }
        }
        requestWakeLock();

        const TX_ID = localStorage.getItem('tx_id') || 'DAT-' + Math.random().toString(36).substr(2, 5).toUpperCase();
        localStorage.setItem('tx_id', TX_ID);
        document.getElementById('idShow').innerText = "🆔 " + TX_ID;
        document.getElementById('profileID').innerText = TX_ID;

        // NÂNG CẤP 1: BẢN ĐỒ LUXURY DARK
        var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([21.02, 105.83], 17);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        var smIcon = L.divIcon({
            className: 'sm-div-icon',
            html: "<div class='sm-marker' id='car-icon'><div class='sm-arrow'></div></div>",
            iconSize: [30, 30], iconAnchor: [15, 15]
        });
        var marker = L.marker([21.02, 105.83], { icon: smIcon }).addTo(map);

        let isRunning = false, totalKm = 0, lastPos = null, currentRate = 15000;

        function updateRate(v) { 
            currentRate = v; 
            document.getElementById('rateLabel').innerText = parseInt(v).toLocaleString(); 
        }

        function handleTrip() {
            const btn = document.getElementById('mainBtn');
            if(!isRunning) {
                isRunning = true;
                btn.innerText = "KẾT THÚC CHUYẾN ĐI";
                btn.style.background = "var(--danger)";
                totalKm = 0; lastPos = null;
                document.getElementById('km').innerText = "0.00";
                document.getElementById('cost').innerText = "0";
            } else {
                isRunning = false;
                btn.innerText = "BẮT ĐẦU CHUYẾN ĐI";
                btn.style.background = "var(--primary)";
                let finalCost = Math.round(totalKm * currentRate);
                saveHistory(totalKm.toFixed(2), finalCost.toLocaleString());
            }
        }

        function saveHistory(km, cost) {
            const list = document.getElementById('historyList');
            const item = document.createElement('div');
            item.className = 'p-card';
            item.style.margin = "10px";
            item.innerHTML = `<b>${new Date().toLocaleTimeString()}</b> Quãng đường: ${km} KM - Tiền cước: <span>${cost}đ</span>`;
            list.prepend(item);
        }

        // NÂNG CẤP 2 & 3: ĐỊNH VỊ THEO XE & THUẬT TOÁN CHẶN NHẢY TIỀN
        navigator.geolocation.watchPosition((e) => {
            const { latitude, longitude, heading } = e.coords;
            const newPos = L.latLng(latitude, longitude);

            // Xoay icon theo hướng di chuyển
            if (heading) { document.getElementById('car-icon').style.transform = `rotate(${heading}deg)`; }

            marker.setLatLng(newPos);
            // NÂNG CẤP 2: LUÔN BÁM THEO XE
            map.panTo(newPos);

            if(isRunning) {
                if(lastPos) {
                    let d = newPos.distanceTo(lastPos) / 1000;
                    
                    // NÂNG CẤP 3: THUẬT TOÁN XANH SM (LỌC GPS NHIỄU)
                    // Chỉ tính tiền nếu xe thực sự di chuyển trên 20m (0.02km)
                    if(d > 0.02) { 
                        totalKm += d;
                        lastPos = newPos;
                        document.getElementById('km').innerText = totalKm.toFixed(2);
                        document.getElementById('cost').innerText = Math.round(totalKm * currentRate).toLocaleString();
                    }
                } else { lastPos = newPos; }
            }
        }, null, { enableHighAccuracy: true });

        function showTab(tab, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(tab === 'home') document.getElementById('homeControls').style.display = 'block';
            else {
                document.getElementById('homeControls').style.display = 'none';
                document.getElementById('tab-' + tab).style.display = 'flex';
            }
        }
    </script>
    <script src="ai-module/ai-config.js"></script>
    <script src="ai-module/ai-client.js"></script>
</body>
</html>
