<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đồng Hồ Taxi ProMax</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .meter-container { text-align: center; padding: 20px; }
        .fare-display { font-size: 3rem; color: #2ecc71; font-weight: bold; margin: 20px 0; }
        .distance-display { font-size: 1.5rem; color: #34495e; }
        .btn-control { 
            width: 80%; padding: 20px; font-size: 1.2rem; border: none; border-radius: 10px; 
            color: white; font-weight: bold; cursor: pointer; margin-top: 20px;
        }
        .btn-start { background: #2ecc71; }
        .btn-stop { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="header">
            <h1>🚕 ĐỒNG HỒ TÍNH TIỀN</h1>
            <p id="current-time">Đang tải...</p>
        </div>

        <div class="meter-container">
            <div class="distance-display">Quãng đường: <span id="meter-km">0.0</span> Km</div>
            <div class="fare-display" id="meter-fare">0 VNĐ</div>
            
            <button id="btn-toggle" class="btn-control btn-start" onclick="toggleTrip()">
                <i class="fas fa-play"></i> BẮT ĐẦU CHUYẾN
            </button>
            
            <div style="margin-top: 30px; text-align: left; background: #eee; padding: 15px; border-radius: 8px;">
                <p><strong>Cấu hình giá:</strong></p>
                <p>• Mở cửa: 12.000đ</p>
                <p>• Tiếp theo: 15.000đ/Km</p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        setInterval(() => {
            document.getElementById('current-time').innerText = new Date().toLocaleTimeString('vi-VN');
        }, 1000);

        function toggleTrip() {
            const btn = document.getElementById('btn-toggle');
            if (btn.classList.contains('btn-start')) {
                taxiApp.startTrip();
                btn.innerHTML = '<i class="fas fa-stop"></i> KẾT THÚC & THANH TOÁN';
                btn.className = 'btn-control btn-stop';
            } else {
                taxiApp.stopTrip();
                btn.innerHTML = '<i class="fas fa-play"></i> BẮT ĐẦU CHUYẾN MỚI';
                btn.className = 'btn-control btn-start';
            }
        }
    </script>
</body>
</html>
