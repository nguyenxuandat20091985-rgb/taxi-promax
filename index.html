<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax Signature - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --xanh-sm: #26ae90; --bg-light: #f8fafc; --text-dark: #1e293b; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-light); overflow: hidden; }

        /* Bản đồ High-Res chuẩn Xanh SM */
        #map { position: absolute; inset: 0; z-index: 1; }

        /* Widget Tiền mặt sang trọng ở trên */
        .wallet-widget {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: white; padding: 10px 25px; border-radius: 40px;
            display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
        }
        .wallet-amount { font-size: 22px; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px; }

        /* Panel điều khiển đẳng cấp */
        .premium-panel {
            position: absolute; bottom: 0; width: 100%; z-index: 20;
            background: white; border-radius: 35px 35px 0 0; padding: 25px 0 15px 0;
            box-shadow: 0 -15px 40px rgba(0,0,0,0.08);
        }
        .online-status { display: flex; align-items: center; justify-content: center; margin-bottom: 15px; color: var(--xanh-sm); font-weight: 700; font-size: 14px; }
        .pulse-dot { width: 10px; height: 10px; background: var(--xanh-sm); border-radius: 50%; margin-right: 10px; animation: pulse 2s infinite; }

        .btn-action {
            width: 90%; margin: 0 auto 25px auto; display: block;
            background: var(--xanh-sm); color: white; border: none; padding: 18px;
            border-radius: 20px; font-weight: 800; font-size: 18px;
            box-shadow: 0 8px 20px rgba(38, 174, 144, 0.35); transition: 0.2s;
        }
        .btn-action:active { transform: scale(0.96); opacity: 0.9; }

        /* Menu Icon tinh tế */
        .nav-pro { display: flex; justify-content: space-around; padding: 0 15px; }
        .nav-pro-item { text-align: center; color: #94a3b8; text-decoration: none; width: 20%; cursor: pointer; transition: 0.2s; }
        .nav-pro-item img { width: 32px; height: 32px; margin-bottom: 6px; display: block; margin: 0 auto; filter: grayscale(1); opacity: 0.6; }
        .nav-pro-item.active { color: var(--xanh-sm); }
        .nav-pro-item.active img { filter: none; opacity: 1; }
        .nav-pro-item span { font-size: 11px; font-weight: 700; display: block; margin-top: 5px; }

        /* Modal hiển thị tính năng (Tránh lỗi link) */
        #featureModal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(8px);
        }
        .modal-card { background: white; width: 85%; border-radius: 30px; padding: 30px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .modal-icon { font-size: 50px; margin-bottom: 15px; display: block; }
        .modal-btn { background: var(--xanh-sm); color: white; border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: 700; margin-top: 20px; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="map"></div>

<div class="wallet-widget">
    <span style="font-size: 24px;">💵</span>
    <div class="wallet-amount" id="money-display">506.900đ</div>
</div>

<div class="premium-panel">
    <div class="online-status">
        <div class="pulse-dot"></div>
        <span id="status-text">Đang trực tuyến</span>
    </div>

    <button class="btn-action" id="mainBtn" onclick="toggleSystem()">▶ BẮT ĐẦU CHUYẾN</button>

    <div class="nav-pro">
        <div class="nav-pro-item active" onclick="location.reload()">
            <img src="https://cdn-icons-png.flaticon.com/512/609/609803.png">
            <span>Trang chủ</span>
        </div>
        <div class="nav-pro-item" onclick="openFeature('Nạp tiền', '💰', 'Hệ thống nạp tiền đang bảo trì để nâng cấp bảo mật.')">
            <img src="https://cdn-icons-png.flaticon.com/512/2489/2489756.png">
            <span>Nạp tiền</span>
        </div>
        <div class="nav-pro-item" onclick="openFeature('Lịch sử', '📊', 'Đang tải dữ liệu lịch sử chuyến đi của anh...')">
            <img src="https://cdn-icons-png.flaticon.com/512/1055/1055644.png">
            <span>Lịch sử</span>
        </div>
        <div class="nav-pro-item" onclick="openFeature('Cài đặt', '⚙️', 'Cài đặt giá: 15.000đ/km. Anh có muốn thay đổi?')">
            <img src="https://cdn-icons-png.flaticon.com/512/3524/3524659.png">
            <span>Cài đặt</span>
        </div>
    </div>
    <div style="text-align: center; font-size: 10px; color: #cbd5e1; margin-top: 15px; font-weight: 600;">DEVELOPED BY NGUYEN XUAN DAT</div>
</div>

<div id="featureModal">
    <div class="modal-card">
        <span class="modal-icon" id="modalIcon">💰</span>
        <h2 id="modalTitle" style="margin: 0; color: var(--text-dark);">Nạp tiền</h2>
        <p id="modalDesc" style="color: #64748b; line-height: 1.5; margin-top: 15px;"></p>
        <button class="modal-btn" onclick="closeModal()">ĐÃ HIỂU</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Bản đồ High-Res cực nét
    var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([20.95, 107.07], 17);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    // Marker xe hiện đại với hiệu ứng hào quang
    var car = L.circleMarker([0,0], { radius: 10, color: '#fff', weight: 4, fillColor: '#26ae90', fillOpacity: 1 }).addTo(map);

    let isRunning = false, watchId = null, km = 0, lastPos = null;

    function openFeature(title, icon, desc) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalIcon').innerText = icon;
        document.getElementById('modalDesc').innerText = desc;
        document.getElementById('featureModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('featureModal').style.display = 'none'; }

    function toggleSystem() {
        const btn = document.getElementById('mainBtn');
        if(!isRunning) {
            isRunning = true;
            btn.innerText = "⏹ KẾT THÚC CHUYẾN";
            btn.style.background = "#ef4444";
            document.getElementById('status-text').innerText = "Đang trong hành trình...";
            startTracking();
        } else {
            isRunning = false;
            btn.innerText = "▶ BẮT ĐẦU CHUYẾN";
            btn.style.background = "#26ae90";
            document.getElementById('status-text').innerText = "Đang trực tuyến";
            stopTracking();
        }
    }

    function startTracking() {
        watchId = navigator.geolocation.watchPosition(pos => {
            const cur = [pos.coords.latitude, pos.coords.longitude];
            map.flyTo(cur, 17, { animate: true, duration: 1 });
            car.setLatLng(cur);

            if (lastPos && pos.coords.accuracy < 30) {
                const d = map.distance(lastPos, cur) / 1000;
                if (d > 0.002) {
                    km += d;
                    document.getElementById('money-display').innerText = Math.round(km * 15000).toLocaleString() + "đ";
                }
            }
            lastPos = cur;
        }, null, { enableHighAccuracy: true });
    }

    function stopTracking() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        openFeature('HÓA ĐƠN', '🏁', 'Quãng đường: ' + km.toFixed(2) + ' km\nThành tiền: ' + document.getElementById('money-display').innerText);
        km = 0;
        document.getElementById('money-display').innerText = "0đ";
    }
</script>
</body>
</html>
