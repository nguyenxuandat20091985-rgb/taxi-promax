<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main-green: #2ecc71; --main-blue: #3498db; --glass: rgba(255, 255, 255, 0.98); }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; background: #f0f3f5; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* 🟢 Đèn Trực Tuyến - To và Uy tín */
        .status-header {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: var(--main-green); color: white;
            padding: 10px 25px; border-radius: 30px; font-size: 13px; font-weight: 900;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4); text-transform: uppercase; letter-spacing: 1px;
        }

        /* 🏗️ Cột Icon Trái - Thiết kế thanh dài đồng bộ */
        .left-info-panel {
            position: absolute; top: 70px; left: 15px; z-index: 100;
            display: flex; flex-direction: column; gap: 10px;
        }
        .info-bar {
            width: 110px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        .bar-gold { background: linear-gradient(to right, #f1c40f, #f39c12); color: black; }
        .bar-black { background: #2c3e50; color: white; }
        .bar-price { background: white; color: var(--main-green); border: 2px solid var(--main-green); cursor: pointer; }

        /* 📟 HUD mỏng tối giản */
        .hud-display {
            position: absolute; bottom: 130px; width: 92%; left: 4%; z-index: 100;
            background: var(--glass); border-radius: 15px; display: flex; padding: 12px 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .hud-item { flex: 1; text-align: center; }
        .hud-val { font-size: 26px; font-weight: 900; margin-bottom: 2px; }
        .v-green { color: var(--main-green); }
        .v-blue { color: var(--main-blue); }
        .hud-label { font-size: 10px; color: #7f8c8d; font-weight: bold; }

        /* 📱 Bottom Panel - Giãn cách icon cực đẹp */
        .footer-panel {
            position: absolute; bottom: 0; width: 100%; z-index: 200;
            background: white; border-top-left-radius: 25px; border-top-right-radius: 25px;
            padding: 15px 0 10px 0; box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
        }
        .action-btns { width: 90%; margin: 0 auto 15px auto; display: flex; gap: 10px; }
        .btn-main { flex: 2; background: var(--main-green); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 900; font-size: 15px; }
        .btn-sub { flex: 1; background: #fff; color: #e74c3c; border: 2px solid #e74c3c; border-radius: 12px; font-weight: 800; }

        .nav-menu { display: flex; justify-content: space-around; padding: 0 10px; }
        .nav-item { text-align: center; color: #bdc3c7; font-size: 10px; font-weight: bold; flex: 1; }
        .nav-item span { display: block; font-size: 22px; margin-bottom: 5px; }
        .nav-item.active { color: var(--main-green); }

        /* ✍️ Chữ ký anh Đạt - Uy tín thương hiệu */
        .brand-signature {
            text-align: center; font-size: 9px; color: #95a5a6; 
            margin-top: 12px; font-weight: bold; letter-spacing: 1.5px;
        }

        /* Hiệu ứng xe nhấp nháy */
        .car-node { background: var(--main-green); width: 14px; height: 14px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px var(--main-green); }
    </style>
</head>
<body>

<div class="status-header">● ĐANG TRỰC TUYẾN</div>
<div id="map"></div>

<div class="left-info-panel">
    <div class="info-bar bar-gold">GÓI: FREE</div>
    <div class="info-bar bar-black">ID: TX-7269</div>
    <div class="info-bar bar-price" onclick="updatePrice()">⚙️ GIÁ: 15.000</div>
</div>

<div class="hud-display">
    <div class="hud-item"><div class="hud-val v-green" id="fare">0</div><div class="hud-label">VNĐ</div></div>
    <div class="hud-item"><div class="hud-val v-blue" id="distance">0.00</div><div class="hud-label">KILÔMÉT</div></div>
</div>

<div class="footer-panel">
    <div class="action-btns">
        <button class="btn-main" onclick="startEngine()">▶ BẮT ĐẦU CHUYẾN</button>
        <button class="btn-sub" onclick="stopEngine()">KẾT THÚC</button>
    </div>
    <div class="nav-menu">
        <div class="nav-item active" onclick="location.reload()"><span>🏠</span>Trang chủ</div>
        <div class="nav-item" onclick="window.location.href='payment.html'"><span>💰</span>Nạp tiền</div>
        <div class="nav-item" onclick="alert('Đang tải lịch sử...')"><span>📊</span>Lịch sử</div>
        <div class="nav-item" onclick="window.location.href='admin.html'"><span>⚙️</span>Quản lý</div>
    </div>
    <div class="brand-signature">PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([20.95, 107.07], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
    var marker = L.marker([20.95, 107.07], { icon: L.divIcon({ className: 'car-node' }) }).addTo(map);

    function startEngine() { alert("Hệ thống GPS đã sẵn sàng!"); }
    function stopEngine() { location.reload(); }
    function updatePrice() { let p = prompt("Nhập giá mới:", "15000"); if(p) alert("Đã cập nhật giá!"); }
</script>
</body>
</html>
