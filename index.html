<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>TAXI PROMAX LUXURY</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #008080; --dark: #002d26; --gold: #ffc107; --danger: #ff5252; --bg: #f0f4f3; --glass: rgba(255, 255, 255, 0.98); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; background: #000; }
        
        /* BẢN ĐỒ FULL MÀN HÌNH 8K STYLE */
        #map { height: 100vh; width: 100vw; z-index: 1; filter: saturate(1.2) contrast(1.1); }

        /* HEADER THÔNG MINH CO GIÃN */
        .header { position: fixed; top: env(safe-area-inset-top, 10px); left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 1000; }
        .badge { background: var(--glass); padding: 10px 18px; border-radius: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); font-size: 12px; font-weight: 800; color: var(--dark); border: 1.5px solid var(--primary); }

        /* PANEL THÔNG SỐ CỰC NÉT */
        .stats-bar { position: fixed; top: calc(env(safe-area-inset-top, 10px) + 50px); left: 15px; right: 15px; background: var(--glass); border-radius: 20px; display: flex; padding: 15px; box-shadow: 0 10px 30px rgba(0,128,128,0.2); z-index: 1000; border: 1px solid white; }
        .stat-item { flex: 1; text-align: center; }
        .stat-label { font-size: 10px; color: #7f8c8d; font-weight: 800; }
        .stat-value { font-size: 26px; font-weight: 900; color: var(--primary); }

        /* FOOTER PANEL CÔNG THÁI HỌC */
        .footer-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; z-index: 2000; border-radius: 30px 30px 0 0; padding: 20px 20px calc(env(safe-area-inset-bottom, 10px) + 10px); box-shadow: 0 -15px 40px rgba(0,0,0,0.1); }
        .nav-grid { display: flex; justify-content: space-around; margin-top: 15px; padding-top: 10px; border-top: 1px solid #f0f0f0; }
        .nav-item { border: none; background: none; color: #ccc; font-size: 11px; font-weight: 700; flex: 1; text-align: center; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 24px; display: block; margin-bottom: 5px; }

        .btn-main { width: 100%; padding: 18px; border-radius: 20px; border: none; background: var(--primary); color: white; font-size: 20px; font-weight: 900; box-shadow: 0 8px 25px rgba(0,128,128,0.4); }
        
        /* ROBOT TRỰC QUAN */
        .sm-marker { width: 30px; height: 30px; background: #00fbff; border: 4px solid white; border-radius: 50%; box-shadow: 0 0 20px #00fbff; }

        .tab-content { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 1500; display: none; flex-direction: column; padding-top: env(safe-area-inset-top); }
        .p-header { background: var(--primary); color: white; padding: 30px 20px; text-align: center; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header">
        <div class="badge" id="idShow">🆔 ID: ...</div>
        <div class="badge" style="color:var(--primary)" id="planShow">📡 ĐANG THEO DÕI 24/7</div>
    </div>

    <div class="stats-bar">
        <div class="stat-item" style="border-right: 1px solid #eee;">
            <div class="stat-label">TỔNG TIỀN (VNĐ)</div>
            <div id="cost" class="stat-value">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">QUÃNG ĐƯỜNG (KM)</div>
            <div id="km" class="stat-value">0.00</div>
        </div>
    </div>

    <div id="map"></div>

    <div id="tab-vi" class="tab-content">
        <div class="p-header"><h1>VÍ TIỀN</h1></div>
        <div id="vi-content-bao-mat"></div> </div>
    <div id="tab-lichsu" class="tab-content">
        <div class="p-header"><h1>LỊCH SỬ</h1></div>
        <div id="historyList"></div> </div>
    <div id="tab-toi" class="tab-content">
        <div class="p-header"><h1>TÔI</h1></div>
        <div id="toi-content-bao-mat"></div> </div>

    <div class="footer-panel">
        <div id="homeControls">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:800;">
                <span>GIÁ ĐỊNH MỨC</span>
                <span style="color:var(--primary)"><span id="rateLabel">15,000</span>đ/km</span>
            </div>
            <input type="range" min="10000" max="50000" step="1000" value="15000" style="width:100%; margin-bottom:15px;" oninput="updateRate(this.value)">
            <button id="mainBtn" class="btn-main" onclick="handleTrip()">BẮT ĐẦU CHUYẾN ĐI</button>
        </div>

        <div class="nav-grid">
            <button class="nav-item active" onclick="showTab('home', this)"><i>🏠</i>Trang chủ</button>
            <button class="nav-item" onclick="showTab('vi', this)"><i>💰</i>Ví tiền</button>
            <button class="nav-item" onclick="showTab('lichsu', this)"><i>📊</i>Lịch sử</button>
            <button class="nav-item" onclick="showTab('toi', this)"><i>👤</i>Tôi</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. CHỐNG TẮT MÀN HÌNH (WAKE LOCK)
        let wakeLock = null;
        async function requestWakeLock() {
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }
        requestWakeLock();
        document.addEventListener('visibilitychange', () => { if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock(); });

        // 2. BẢN ĐỒ SIÊU NÉT STYLE XANH SM (8K RENDER)
        var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([21.02, 105.83], 17);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/voyager_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 20, subdomains: 'abcd'
        }).addTo(map);

        var smIcon = L.divIcon({ className: 'sm-div-icon', html: "<div class='sm-marker'></div>", iconSize: [30, 30] });
        var marker = L.marker([21.02, 105.83], { icon: smIcon }).addTo(map);

        // 3. THUẬT TOÁN DỨT ĐIỂM NHẢY TIỀN (ALGO XANH SM/GRAB)
        let isRunning = false, totalKm = 0, lastPos = null, currentRate = 15000;
        const MIN_MOVE_THRESHOLD = 0.03; // XE PHẢI ĐI TRÊN 30 MÉT MỚI BẮT ĐẦU TÍNH (DỨT ĐIỂM NHẢY ẢO)

        function handleTrip() {
            const btn = document.getElementById('mainBtn');
            if(!isRunning) {
                isRunning = true;
                btn.innerText = "KẾT THÚC"; btn.style.background = "var(--danger)";
                totalKm = 0; lastPos = null;
                document.getElementById('km').innerText = "0.00";
                document.getElementById('cost').innerText = "0";
            } else {
                isRunning = false;
                btn.innerText = "BẮT ĐẦU"; btn.style.background = "var(--primary)";
            }
        }

        // 4. ĐỊNH VỊ 24/24 - THEO DÕI KHÔNG CỐ ĐỊNH
        navigator.geolocation.watchPosition((p) => {
            const newPos = L.latLng(p.coords.latitude, p.coords.longitude);
            marker.setLatLng(newPos);
            map.panTo(newPos);

            if(isRunning) {
                if(lastPos) {
                    let d = newPos.distanceTo(lastPos) / 1000;
                    // NẾU ĐI QUÁ 30M THÌ MỚI CỘNG KM (THUẬT TOÁN CHỐNG NHẢY ẢO)
                    if(d > MIN_MOVE_THRESHOLD) {
                        totalKm += d;
                        lastPos = newPos;
                        document.getElementById('km').innerText = totalKm.toFixed(2);
                        document.getElementById('cost').innerText = Math.round(totalKm * currentRate).toLocaleString();
                    }
                } else { lastPos = newPos; }
            }
        }, null, { enableHighAccuracy: true });

        function updateRate(v) { 
            currentRate = v; 
            document.getElementById('rateLabel').innerText = parseInt(v).toLocaleString(); 
        }

        function showTab(tab, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(tab === 'home') document.getElementById('homeControls').style.display = 'block';
            else {
                document.getElementById('homeControls').style.display = 'none';
                document.getElementById('tab-' + tab).style.display = 'flex';
            }
        }
    </script>
</body>
</html>
