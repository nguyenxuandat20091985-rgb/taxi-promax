<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TAXI PROMAX v4.0 - ENTERPRISE</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root { --y: #f1c40f; --b: #000; --g: #1c1c1e; --r: #ff3b30; --s: #4cd964; --bl: #007aff; }
        body { background: var(--b); color: #fff; margin: 0; font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER */
        .header { background: var(--g); padding: 15px; border-bottom: 2px solid var(--y); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; color: var(--y); font-size: 18px; }
        .badge { background: var(--r); padding: 2px 8px; border-radius: 10px; font-size: 10px; }

        /* BẢN ĐỒ LIVE */
        #map { flex: 1; background: #222; width: 100%; border-bottom: 2px solid #333; }

        /* ĐỒNG HỒ TÍNH TIỀN */
        .meter { padding: 20px; background: linear-gradient(180deg, #111, #000); text-align: center; }
        .money { font-size: 65px; font-weight: 900; color: var(--y); font-family: 'Courier New', monospace; }
        .stats-row { display: flex; justify-content: space-around; margin-top: 15px; }
        .stat-box span { font-size: 10px; color: #888; display: block; }
        .stat-box b { font-size: 20px; color: #fff; }

        /* NÚT ĐIỀU KHIỂN */
        .controls { padding: 15px; background: var(--b); }
        .btn-main { width: 100%; height: 65px; border-radius: 15px; border: none; font-size: 20px; font-weight: bold; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .start { background: var(--s); }
        .stop { background: var(--r); }

        /* MODAL HÓA ĐƠN */
        #bill-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; padding: 30px; }
        .bill-card { background: #fff; color: #000; padding: 20px; border-radius: 10px; text-align: center; }
        .bill-card h2 { margin: 0; font-size: 18px; border-bottom: 2px dashed #ccc; padding-bottom: 10px; }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; }
        .close-bill { margin-top: 20px; background: var(--b); color: #fff; border: none; padding: 10px 20px; border-radius: 5px; }

        /* TAB GÓI CƯỚC */
        .pricing-tab { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 10px; background: #111; }
        .tab-item { font-size: 9px; text-align: center; color: #666; border: 1px solid #333; padding: 5px; border-radius: 5px; }
        .tab-item.active { color: var(--y); border-color: var(--y); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">TAXI PROMAX</div>
        <div class="badge">LIVE GPS</div>
    </div>

    <div id="map"></div>

    <div class="meter">
        <div class="money" id="display-money">0đ</div>
        <div class="stats-row">
            <div class="stat-box"><span>KHOẢNG CÁCH</span><b id="display-km">0.00</b> km</div>
            <div class="stat-box"><span>VẬN TỐC</span><b id="display-speed">0</b> km/h</div>
            <div class="stat-box"><span>THỜI GIAN</span><b id="display-time">00:00</b></div>
        </div>
    </div>

    <div class="controls">
        <button id="main-btn" class="btn-main start" onclick="App.toggle()">BẮT ĐẦU CHUYẾN</button>
    </div>

    <div class="pricing-tab">
        <div class="tab-item active">7 NGÀY THỬ</div>
        <div class="tab-item">49K/THÁNG</div>
        <div class="tab-item">129K/QUÝ</div>
        <div class="tab-item">VĨNH VIỄN</div>
    </div>

    <div id="bill-modal">
        <div class="bill-card">
            <h2>HÓA ĐƠN CHUYẾN ĐI</h2>
            <p id="bill-date"></p>
            <div style="display:flex; justify-content: space-between; margin: 10px 0;">
                <span>Tổng KM:</span><b id="bill-km"></b>
            </div>
            <div style="display:flex; justify-content: space-between; margin: 10px 0; font-size: 20px; color: var(--r);">
                <span>THÀNH TIỀN:</span><b id="bill-total"></b>
            </div>
            <div id="qrcode"></div>
            <p style="font-size: 10px;">Quét mã để thanh toán hoặc lưu ảnh</p>
            <button class="close-bill" onclick="location.reload()">ĐÓNG & TIẾP TỤC</button>
        </div>
    </div>

    <script>
        /**
         * TAXI PROMAX ENTERPRISE v4.0
         * Tích hợp: Map, Bill, Security, Persistence, Voice
         */
        const App = {
            active: false, km: 0, lastPos: null, startTime: null, timer: null,
            map: null, marker: null, rate: 15000,
            
            init() {
                // Khởi tạo bản đồ (Leaflet)
                this.map = L.map('map', { zoomControl: false }).setView([21.0285, 105.8542], 16);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(this.map);
                this.marker = L.marker([21.0285, 105.8542]).addTo(this.map);
                
                // Khôi phục dữ liệu cũ
                const saved = localStorage.getItem('PRO_SESS');
                if(saved) {
                    const d = JSON.parse(saved);
                    this.km = d.km; this.updateUI();
                }
                this.watchGPS();
            },

            watchGPS() {
                navigator.geolocation.watchPosition(p => {
                    const { latitude: lat, longitude: lon, speed, accuracy } = p.coords;
                    const pos = [lat, lon];
                    
                    // Cập nhật vị trí trên bản đồ
                    this.marker.setLatLng(pos);
                    this.map.panTo(pos);

                    const kmh = Math.round((speed || 0) * 3.6);
                    document.getElementById('display-speed').innerText = kmh;

                    // Chống Hack & Lọc nhiễu
                    if(accuracy > 50 || p.coords.mocked) return;

                    if(this.active && this.lastPos) {
                        const d = this.map.distance(this.lastPos, pos) / 1000;
                        if(d > 0.002 && d < 0.2) { // Từ 2m đến 200m/giây
                            this.km += d;
                            this.updateUI();
                            localStorage.setItem('PRO_SESS', JSON.stringify({km: this.km}));
                        }
                    }
                    this.lastPos = pos;
                }, null, { enableHighAccuracy: true });
            },

            toggle() {
                this.active = !this.active;
                const btn = document.getElementById('main-btn');
                if(this.active) {
                    this.startTime = Date.now();
                    this.timer = setInterval(() => this.updateTime(), 1000);
                    btn.innerText = "KẾT THÚC CHUYẾN"; btn.className = "btn-main stop";
                    this.speak("Hệ thống bắt đầu tính cước");
                } else {
                    clearInterval(this.timer);
                    this.showBill();
                }
            },

            updateTime() {
                const s = Math.floor((Date.now() - this.startTime) / 1000);
                const m = Math.floor(s / 60);
                document.getElementById('display-time').innerText = 
                    `${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
            },

            updateUI() {
                document.getElementById('display-km').innerText = this.km.toFixed(2);
                document.getElementById('display-money').innerText = 
                    Math.round(this.km * this.rate).toLocaleString() + "đ";
            },

            showBill() {
                const total = Math.round(this.km * this.rate);
                document.getElementById('bill-km').innerText = this.km.toFixed(2) + " km";
                document.getElementById('bill-total').innerText = total.toLocaleString() + "đ";
                document.getElementById('bill-date').innerText = new Date().toLocaleString();
                document.getElementById('bill-modal').style.display = 'block';
                
                // Tạo mã QR thanh toán (Ví dụ MoMo/Chuyển khoản)
                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById("qrcode"), {
                    text: `Thanh toan taxi: ${total}d`,
                    width: 150, height: 150
                });
                
                this.speak(`Chuyến đi kết thúc. Tổng cộng ${total} đồng. Cảm ơn quý khách.`);
                localStorage.removeItem('PRO_SESS');
            },

            speak(t) {
                const msg = new SpeechSynthesisUtterance(t);
                msg.lang = 'vi-VN';
                window.speechSynthesis.speak(msg);
            }
        };

        window.onload = () => App.init();
    </script>
</body>
</html>
