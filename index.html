<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - NGUYEN XUAN DAT</title>
    <style>
        /* Bố cục 3 hàng chuẩn thương mại */
        .fare-circle {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 320px; width: 320px; border: 12px solid #2ecc71; border-radius: 50%;
            margin: 40px auto; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        #display-fare { font-size: 65px !important; color: #27ae60; margin: 0; font-weight: 900; }
        #display-km { font-size: 45px !important; color: #2980b9; font-weight: 700; margin: 5px 0; }
        #trip-status { font-size: 20px !important; color: #e84393; font-weight: bold; }

        /* Hiệu ứng nút bấm theo yêu cầu của anh */
        .btn-group { display: flex; flex-direction: column; gap: 20px; padding: 0 25px; }
        
        /* Nút Bắt đầu: Xanh lá -> Xanh đậm khi chạy */
        .btn-start { 
            background: #27ae60; color: white; padding: 22px; border-radius: 18px; 
            font-size: 20px; font-weight: bold; border: none; transition: 0.3s;
        }
        .btn-start.active { background: #1b5e20 !important; box-shadow: inset 0 5px 10px rgba(0,0,0,0.3); }

        /* Nút Kết thúc: Trắng viền đỏ -> Đỏ đậm khi kết thúc */
        .btn-stop { 
            background: white; color: #e74c3c; padding: 22px; border-radius: 18px; 
            font-size: 20px; font-weight: bold; border: 3px solid #e74c3c; transition: 0.3s;
        }
        .btn-stop.active { background: #c62828 !important; color: white !important; }

        .hidden-active { display: none !important; }
    </style>
</head>
<body style="background: #f4f7f6; font-family: sans-serif;">

<div id="app">
    <div class="meter-section" style="position: relative;">
        <div id="price-btn-box" style="position: absolute; top: 10px; left: 10px;">
            <button onclick="showSlider()" style="padding: 10px; border-radius: 10px; border: none; background: #ddd;">⚙️ GIÁ</button>
        </div>

        <div class="fare-circle">
            <h1 id="display-fare">0 VNĐ</h1>
            <span id="display-km">0.00 Km</span>
            <div id="trip-status">CHỜ KHÁCH</div>
        </div>

        <div class="btn-group">
            <button id="btnStart" class="btn-start" onclick="handleStart()">▶ BẮT ĐẦU CHUYẾN</button>
            <button id="btnStop" class="btn-stop" onclick="handleStop()">■ KẾT THÚC</button>
        </div>
    </div>
</div>

<script>
    let pricePerKm = 15000;
    let totalKm = 0;
    let lastPos = null;
    let watchId = null;

    function handleStart() {
        if (!navigator.geolocation) return alert("Cần bật GPS!");

        // 1. Đổi màu nút Bắt đầu sang Xanh đậm
        document.getElementById('btnStart').classList.add('active');
        document.getElementById('btnStop').classList.remove('active');
        document.getElementById('price-btn-box').classList.add('hidden-active');
        document.getElementById('trip-status').innerText = "ĐANG CHUYỂN BÁNH";

        // 2. Kích hoạt GPS nhạy cao nhất
        watchId = navigator.geolocation.watchPosition((pos) => {
            const { latitude, longitude, accuracy } = pos.coords;
            if (accuracy < 40) { // Lọc nhiễu GPS
                if (lastPos) {
                    const d = calcDist(lastPos.lat, lastPos.lon, latitude, longitude);
                    if (d > 0.002) { // Nhảy ngay khi đi được 2 mét
                        totalKm += d;
                        document.getElementById('display-km').innerText = totalKm.toFixed(2) + " Km";
                        document.getElementById('display-fare').innerText = Math.round(totalKm * pricePerKm).toLocaleString('vi-VN') + " VNĐ";
                    }
                }
                lastPos = { lat: latitude, lon: longitude };
            }
        }, null, { enableHighAccuracy: true, maximumAge: 0 });
    }

    function handleStop() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        
        // Đổi màu nút Kết thúc sang Đỏ đậm
        document.getElementById('btnStop').classList.add('active');
        document.getElementById('btnStart').classList.remove('active');
        document.getElementById('price-btn-box').classList.remove('hidden-active');
        document.getElementById('trip-status').innerText = "HOÀN THÀNH";
        lastPos = null;
    }

    function calcDist(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2-lat1)*Math.PI/180;
        const dLon = (lon2-lon1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
</script>
</body>
</html>
