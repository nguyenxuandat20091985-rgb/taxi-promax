<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TAXI PROMAX - VẬN HÀNH SIÊU CẤP</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root { --primary: #f1c40f; --dark: #1a1a1a; --danger: #ff3b30; --success: #4cd964; --blue: #007aff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; margin: 0; overflow-x: hidden; }

        /* Banner Đếm Ngược */
        #trial-banner { background: var(--danger); text-align: center; padding: 10px; font-weight: bold; font-size: 14px; position: sticky; top: 0; z-index: 100; }

        /* Đồng hồ LED siêu lớn */
        .meter-screen { height: 40vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(180deg, #222, #000); border-bottom: 2px solid var(--primary); }
        .money-led { font-size: 80px; font-family: 'Courier New', monospace; color: var(--primary); text-shadow: 0 0 20px rgba(241, 196, 15, 0.5); }
        .sub-stats { display: flex; width: 100%; justify-content: space-around; margin-top: 20px; font-size: 18px; }

        /* Bảng giá 4 cột Scannable */
        .price-section { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; background: #111; }
        .p-card { background: #222; border-radius: 12px; padding: 15px; border: 1px solid #333; position: relative; }
        .p-card.active { border-color: var(--primary); background: #2c2c2e; }
        .p-card h4 { margin: 0; font-size: 13px; color: var(--primary); }
        .p-card .price { font-size: 22px; font-weight: bold; margin: 5px 0; }
        .p-card ul { padding: 0; list-style: none; font-size: 11px; color: #aaa; margin-bottom: 10px; }
        .btn-buy { width: 100%; border: none; padding: 8px; border-radius: 6px; font-weight: bold; background: #444; color: white; }

        /* Nút Start/Stop Chuyên nghiệp */
        .control-area { padding: 20px; }
        #main-btn { width: 100%; height: 70px; border-radius: 35px; border: none; font-size: 20px; font-weight: bold; transition: 0.3s; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .btn-ready { background: var(--success); color: #fff; }
        .btn-running { background: var(--danger); color: #fff; animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="trial-banner">🎁 VIP TRẢI NGHIỆM: Còn <span id="days">7</span> Ngày</div>

<div class="meter-screen">
    <div id="trip-label" style="font-size: 14px; letter-spacing: 2px;">ĐANG CHỜ KHÁCH</div>
    <div class="money-led" id="money">0đ</div>
    <div class="sub-stats">
        <div>KM: <b id="km">0.00</b></div>
        <div>VẬN TỐC: <b id="speed">0</b> <small>km/h</small></div>
    </div>
</div>

<div class="control-area">
    <button id="main-btn" class="btn-ready" onclick="toggleTrip()">BẮT ĐẦU CHUYẾN</button>
</div>

<div class="price-section">
    <div class="p-card">
        <h4>TRẢI NGHIỆM</h4>
        <div class="price">0đ</div>
        <ul><li>7 ngày dùng thử</li><li>Full tính năng</li></ul>
        <button class="btn-buy" style="background: var(--success)">ĐANG DÙNG</button>
    </div>
    <div class="p-card">
        <h4>CHUYẾN LẺ</h4>
        <div class="price">5.000đ</div>
        <ul><li>Dùng trong 24h</li><li>Tiện lợi</li></ul>
        <button class="btn-buy" onclick="alert('Nạp 5k')">MUA</button>
    </div>
    <div class="p-card active">
        <h4>TÀI XẾ PRO</h4>
        <div class="price">49.000đ</div>
        <ul><li>Hóa đơn Zalo</li><li>Nhắc bảo dưỡng</li></ul>
        <button class="btn-buy" style="background: var(--blue)" onclick="alert('Nạp 49k')">CHỌN</button>
    </div>
    <div class="p-card">
        <h4>DOANH NHÂN</h4>
        <div class="price">129.000đ</div>
        <ul><li>Bản đồ nhiệt</li><li>SOS cứu hộ</li></ul>
        <button class="btn-buy" style="background: var(--primary); color: #000" onclick="alert('Nạp 129k')">MUA</button>
    </div>
</div>

<script>
    let isRunning = false;
    let totalDistance = 0;
    let lastCoord = null;
    let wakeLock = null;

    // THUẬT TOÁN TÍNH KHOẢNG CÁCH CHÍNH XÁC (HAVERSINE) - BÙ SÓI KHI VÀO HẦM
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // Bán kính Trái Đất (km)
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    // CHỐNG TẮT MÀN HÌNH (WAKE LOCK)
    async function requestWakeLock() {
        if ('wakeLock' in navigator) {
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }
    }

    function toggleTrip() {
        const btn = document.getElementById('main-btn');
        const label = document.getElementById('trip-label');
        isRunning = !isRunning;

        if (isRunning) {
            btn.innerText = "KẾT THÚC"; btn.className = "btn-running";
            label.innerText = "ĐANG DI CHUYỂN";
            requestWakeLock();
        } else {
            btn.innerText = "BẮT ĐẦU CHUYẾN"; btn.className = "btn-ready";
            label.innerText = "CHUYẾN ĐÃ DỪNG";
            if(wakeLock) wakeLock.release();
            // Voice AI kết thúc
            const speak = new SpeechSynthesisUtterance("Cuốc xe hoàn thành. Vui lòng kiểm tra lại hành lý.");
            window.speechSynthesis.speak(speak);
        }
    }

    // THEO DÕI GPS VỚI CHẾ ĐỘ GIÁP BẢO VỆ
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(pos => {
            // 1. Chống Hack GPS (Mock Location)
            if (pos.coords.mocked) { 
                alert("Cảnh báo: Phát hiện thiết bị hack GPS!"); 
                location.reload(); 
            }

            const { latitude, longitude, speed } = pos.coords;
            const currentSpeed = Math.round((speed || 0) * 3.6);
            document.getElementById('speed').innerText = currentSpeed;

            // 2. Tự động nhảy đồng hồ khi vẫy khách (>5km/h)
            if (currentSpeed > 5 && !isRunning) { toggleTrip(); }

            if (isRunning) {
                if (lastCoord) {
                    const dist = calculateDistance(lastCoord.lat, lastCoord.lon, latitude, longitude);
                    // Lọc nhiễu GPS (nếu nhảy quá xa trong 1s thì bỏ qua)
                    if (dist < 0.5) { 
                        totalDistance += dist;
                        document.getElementById('km').innerText = totalDistance.toFixed(2);
                        document.getElementById('money').innerText = Math.round(totalDistance * 15000).toLocaleString() + "đ";
                    }
                }
                lastCoord = { lat: latitude, lon: longitude };
            }
        }, err => console.log(err), {
            enableHighAccuracy: true, // Ép dùng GPS thật, không dùng Wifi
            timeout: 5000,
            maximumAge: 0
        });
    }

    // LOGIC DÙNG THỬ 7 NGÀY
    function checkTrial() {
        let install = localStorage.getItem('install_date') || Date.now();
        localStorage.setItem('install_date', install);
        let left = 7 - Math.floor((Date.now() - install) / 86400000);
        document.getElementById('days').innerText = left > 0 ? left : 0;
    }
    
    window.onload = checkTrial;
</script>

</body>
</html>
