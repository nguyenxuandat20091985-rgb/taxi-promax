<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TAXI PROMAX - ĐẶT XE & NẠP TIỀN</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #00bfa5; --dark: #0a1110; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; background: var(--dark); overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .top-ui { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 1000; }
        .status-card { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); border: 2px solid var(--primary); }
        .package-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .pkg-btn { padding: 10px; border-radius: 10px; border: 1px solid #ddd; background: #f9f9f9; font-size: 11px; font-weight: bold; text-align: center; cursor: pointer; }
        #ai-btn { position: fixed; bottom: 30px; right: 20px; width: 60px; height: 60px; background: linear-gradient(135deg, #00f2ff, #00bfa5); border-radius: 50%; z-index: 2000; display: flex; align-items: center; justify-content: center; font-size: 25px; border: 2px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #payment-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; display: none; justify-content: center; align-items: center; flex-direction: column; color: white; padding: 20px; }
        .qr-card { background: white; padding: 20px; border-radius: 25px; text-align: center; color: #333; width: 100%; max-width: 320px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="top-ui">
        <div class="status-card">
            <div style="display:flex; justify-content:space-between;">
                <b>GÓI CỦA BẠN: <span id="current-pkg" style="color:var(--primary)">FREE</span></b>
                <span id="sync-status" style="font-size:10px; color:#888;">ĐANG KẾT NỐI...</span>
            </div>
            <div class="package-grid">
                <div class="pkg-btn" onclick="openPayment('7_DAYS', 0)">7 NGÀY (FREE)</div>
                <div class="pkg-btn" onclick="openPayment('1_MONTH', 50000)">1 THÁNG (50K)</div>
                <div class="pkg-btn" onclick="openPayment('1_YEAR', 500000)">1 NĂM (500K)</div>
                <div class="pkg-btn" onclick="openPayment('LIFE', 2000000)">TRỌN ĐỜI (2M)</div>
            </div>
        </div>
    </div>

    <div id="ai-btn" onclick="askGemini()">🤖</div>

    <div id="payment-modal">
        <div class="qr-card">
            <h3 style="margin:0">THANH TOÁN TỰ ĐỘNG</h3>
            <p style="font-size:12px">Chủ TK: NGUYỄN XUÂN ĐẠT - BIDV: 4430269669</p>
            <img id="qr-img" src="" style="width:100%; margin: 10px 0;">
            <div style="background:#eee; padding:10px; border-radius:10px; font-weight:bold; color:red;">NỘI DUNG: <span id="p-code"></span></div>
            <button onclick="document.getElementById('payment-modal').style.display='none'" style="margin-top:15px; width:100%; padding:10px; border:none; border-radius:10px;">HỦY</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // CẤU HÌNH CỦA ANH ĐẠT
        const CONFIG = {
            BANK: "4430269669",
            NAME: "NGUYEN XUAN DAT",
            GEMINI: "AIzaSyBYIpmslXFTkETW7cfiPeLJ0oPcgMJUn2g"
        };

        // 1. KHỞI TẠO BẢN ĐỒ
        let map = L.map('map', {zoomControl: false}).setView([21.0285, 105.8542], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        map.locate({setView: true, watch: true, enableHighAccuracy: true});
        map.on('locationfound', e => L.marker(e.latlng).addTo(map));

        // 2. MỞ THANH TOÁN
        function openPayment(pkg, amount) {
            const code = "TX" + Math.floor(1000 + Math.random()*9000) + pkg;
            document.getElementById('p-code').innerText = code;
            document.getElementById('qr-img').src = `https://img.vietqr.io/image/bidv-${CONFIG.BANK}-compact2.png?amount=${amount}&addInfo=${code}&accountName=${encodeURIComponent(CONFIG.NAME)}`;
            document.getElementById('payment-modal').style.display = 'flex';
        }

        // 3. AI GEMINI
        async function askGemini() {
            const q = prompt("Hỏi AI Taxi Promax:");
            if(!q) return;
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${CONFIG.GEMINI}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({contents: [{parts: [{text: q}]}]})
                });
                const d = await res.json();
                alert("🤖 AI: " + d.candidates[0].content.parts[0].text);
            } catch(e) { alert("Lỗi kết nối AI."); }
        }
    </script>
</body>
</html>
