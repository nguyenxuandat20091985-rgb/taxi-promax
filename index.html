<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax Map - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* Lớp phủ HUD chứa thông tin tiền (Giữ chất của anh) */
        .hud-overlay {
            position: absolute; inset: 0; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; align-items: center;
        }

        .top-id { 
            width: 100%; background: rgba(28, 31, 35, 0.9); color: white; 
            padding: 8px 15px; display: flex; justify-content: space-between; 
            font-size: 11px; pointer-events: auto;
        }

        /* Vòng tròn tính tiền nổi trên bản đồ */
        .fare-circle-map {
            margin-top: 50px; width: 280px; height: 280px;
            background: rgba(255, 255, 255, 0.85);
            border: 10px solid #2ecc71; border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        #display-fare { font-size: 50px; color: #2ecc71; font-weight: 900; margin: 0; }
        .vnd-unit { font-size: 25px; color: #2ecc71; font-weight: 900; }
        #display-km { font-size: 30px; color: #3498db; font-weight: bold; }

        /* Nút điều khiển dưới cùng */
        .bottom-panel {
            position: absolute; bottom: 0; width: 100%; z-index: 20;
            background: white; border-top-left-radius: 25px; border-top-right-radius: 25px;
            padding: 15px 0; pointer-events: auto; text-align: center;
        }
        .btn-group { display: flex; flex-direction: column; gap: 10px; width: 90%; margin: 0 auto; }
        .btn-start { background: #2ecc71; color: white; padding: 15px; border-radius: 20px; border: none; font-size: 18px; font-weight: bold; }
        .btn-stop { background: white; color: #e74c3c; padding: 15px; border-radius: 20px; border: 2px solid #e74c3c; font-size: 18px; font-weight: bold; }
        .btn-start.active { background: #1b5e20 !important; }
        .btn-stop.active { background: #e74c3c !important; color: white !important; }

        /* Nút hồng cài đặt */
        .btn-setting {
            position: absolute; top: 60px; left: 15px; width: 70px; height: 70px;
            background: #ffc0cb; border-radius: 15px; border: 2px solid white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 9px; font-weight: bold; color: #ff0000; pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="hud-overlay">
        <div class="top-id">
            <span>ID: TX-20091985-DAT</span>
            <span style="background:#f1c40f; color:black; padding:2px 8px; border-radius:10px;">FREE</span>
        </div>

        <div class="btn-setting" onclick="alert('Mở cài đặt giá...')">
            <span>⚙️ CÀI ĐẶT</span>
            <span>GIÁ CẢ</span>
            <span id="price-tag">15K/KM</span>
        </div>

        <div class="fare-circle-map">
            <div style="display: flex; align-items: baseline;">
                <h1 id="display-fare">0</h1>
                <span class="vnd-unit">VNĐ</span>
            </div>
            <span id="display-km">0.00 Km</span>
            <div id="status" style="font-size: 11px; color: #e84393; font-weight: bold;">ĐANG CHỜ...</div>
        </div>

        <div class="bottom-panel">
            <div class="btn-group">
                <button id="btnStart" class="btn-start" onclick="startTrip()">▶ BẮT ĐẦU CHUYẾN</button>
                <button id="btnStop" class="btn-stop" onclick="stopTrip()">■ KẾT THÚC</button>
            </div>
            <div style="font-size: 10px; color: #aaa; margin-top: 10px;">PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Khởi tạo bản đồ
        var map = L.map('map').setView([20.95, 107.07], 15); // Tọa độ mặc định (Hạ Long chẳng hạn)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        var marker = L.circleMarker([0, 0], { color: '#3498db', radius: 10, fillOpacity: 0.8 }).addTo(map);

        let kmPrice = 15000, totalKm = 0, watchId = null, lastPos = null;

        function startTrip() {
            document.getElementById('btnStart').classList.add('active');
            document.getElementById('status').innerText = "ĐANG CHUYỂN BÁNH";
            
            watchId = navigator.geolocation.watchPosition(pos => {
                const { latitude, longitude } = pos.coords;
                const currentPos = [latitude, longitude];
                
                map.setView(currentPos, 17);
                marker.setLatLng(currentPos);

                if (lastPos) {
                    const d = map.distance(lastPos, currentPos) / 1000;
                    if (d > 0.002) {
                        totalKm += d;
                        updateUI();
                    }
                }
                lastPos = currentPos;
            }, null, { enableHighAccuracy: true });
        }

        function updateUI() {
            document.getElementById('display-km').innerText = totalKm.toFixed(2) + " Km";
            let money = Math.round(totalKm * kmPrice);
            let sMoney = money.toLocaleString('vi-VN');
            
            // Chống tràn số
            let fareEl = document.getElementById('display-fare');
            if (sMoney.length > 7) fareEl.style.fontSize = "35px";
            else fareEl.style.fontSize = "50px";
            
            fareEl.innerText = sMoney;
        }

        function stopTrip() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            document.getElementById('btnStop').classList.add('active');
            document.getElementById('btnStart').classList.remove('active');
            document.getElementById('status').innerText = "HOÀN THÀNH";
        }
    </script>
</body>
</html>
