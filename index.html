<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TAXI PROMAX - ANH ĐẠT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --y: #f1c40f; --b: #000; --p: #1c1c1e; --g: #2ecc71; --r: #e74c3c; }
        body { margin: 0; background: var(--b); color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .meter { padding: 30px 15px; text-align: center; background: #000; border-bottom: 2px solid var(--y); }
        .money { font-size: 80px; font-weight: 900; color: var(--y); font-family: monospace; }
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .box { background: var(--p); padding: 10px; border-radius: 10px; border: 1px solid #333; }
        .box label { display: block; font-size: 10px; color: #888; }
        #map { flex: 1; width: 100%; }
        .btns { padding: 20px; display: flex; gap: 15px; background: var(--p); }
        .btn { flex: 1; height: 65px; border-radius: 15px; border: none; font-size: 18px; font-weight: bold; color: #fff; }
        .btn-start { background: var(--g); } .btn-stop { background: var(--r); }
        .btn-tool { flex: 0 0 65px; background: #3a3a3c; font-size: 24px; }
        #warning { position: fixed; top: 0; width: 100%; background: var(--r); text-align: center; display: none; z-index: 9999; }
    </style>
</head>
<body>
    <div id="warning">⚠️ GPS YẾU - HỆ THỐNG ĐANG TỰ BÙ QUÃNG ĐƯỜNG</div>
    <div class="meter">
        <div class="money" id="ui-fare">0</div>
        <div class="stats">
            <div class="box"><label>KILOMET</label><b id="ui-km">0.00</b></div>
            <div class="box"><label>TỐC ĐỘ</label><b id="ui-speed">0</b></div>
            <div class="box"><label>THỜI GIAN</label><b id="ui-time">00:00</b></div>
        </div>
    </div>
    <div id="map"></div>
    <div class="btns">
        <button class="btn btn-tool" onclick="App.showHistory()">📜</button>
        <button id="main-btn" class="btn btn-start" onclick="App.toggle()">BẮT ĐẦU</button>
        <button class="btn btn-tool" onclick="App.shareInvoice()">📤</button>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="app-logic.js"></script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
