<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax Infinity - FIXED</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --green: #2ecc71; --red: #e74c3c; --blue: #3498db; --bg: #f4f7f6; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: sans-serif; }

        /* FIX LỖI TỈ LỆ: CHIA CỨNG 73% VÀ 27% */
        #map-container { height: 73vh; width: 100%; position: relative; }
        #map { height: 100%; width: 100%; }

        #control-container { height: 27vh; background: white; position: relative; z-index: 100; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); border-top-left-radius: 25px; border-top-right-radius: 25px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }

        /* HUD - Chỉ số tiền & KM */
        .hud { display: flex; justify-content: space-around; background: #f8f9fa; border-radius: 15px; padding: 10px; }
        .hud-item { text-align: center; }
        .hud-item b { font-size: 1.8rem; display: block; color: var(--green); }
        .hud-item span { font-size: 10px; color: #888; text-transform: uppercase; }

        /* NÚT BẤM VÀ ĐỔI MÀU (LỖI 1) */
        .action-row { display: flex; gap: 10px; margin-top: 5px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 15px; font-weight: bold; color: white; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn-go { background: var(--green); box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3); }
        
        /* Trạng thái khi đang chạy (Màu xám/mờ và đổi chữ) */
        .btn-go.running { background: #bdc3c7 !important; color: #7f8c8d; cursor: not-allowed; box-shadow: none; }
        
        .btn-stop { background: white; color: var(--red); border: 2px solid var(--red); }

        /* Menu 5 mục tiện ích (Kinh doanh) */
        .nav-bar { display: flex; justify-content: space-around; border-top: 1px solid #eee; padding-top: 8px; }
        .nav-item { text-align: center; text-decoration: none; color: #95a5a6; font-size: 10px; font-weight: bold; }
        .nav-item span { display: block; font-size: 20px; }
        .nav-item.active { color: var(--green); }

        /* Badge thông tin nổi */
        .top-badge { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.7); color: white; padding: 5px 12px; border-radius: 20px; font-size: 10px; }
    </style>
</head>
<body>

<div id="map-container">
    <div class="top-badge">🆔 TX-DAT-2026 | ⭐ VIP PRO</div>
    <div id="map"></div>
</div>

<div id="control-container">
    <div class="hud">
        <div class="hud-item"><b id="fare">0</b><span>VNĐ Cước phí</span></div>
        <div class="hud-item"><b id="km" style="color:var(--blue)">0.00</b><span>Quãng đường (KM)</span></div>
    </div>

    <div class="action-row">
        <button id="startBtn" class="btn btn-go" onclick="startTrip()">▶ BẮT ĐẦU</button>
        <button class="btn btn-stop" onclick="stopTrip()">KẾT THÚC</button>
    </div>

    <nav class="nav-bar">
        <a href="#" class="nav-item active"><span>🏠</span>Trang chủ</a>
        <a href="#" class="nav-item"><span>💰</span>Nạp tiền</a>
        <a href="#" class="nav-item"><span>📊</span>Lịch sử</a>
        <a href="#" class="nav-item"><span>👑</span>Gói VIP</a>
        <a href="#" class="nav-item"><span>⚙️</span>Quản lý</a>
    </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', { zoomControl: false }).setView([20.95, 107.07], 16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
    var carIcon = L.circleMarker([0,0], { radius: 8, color: '#fff', weight: 2, fill: true, fillColor: '#2ecc71', fillOpacity: 1 }).addTo(map);

    let isRunning = false;
    let totalKm = 0;
    let kmPrice = 15000; // Giá mặc định
    let lastPos = null;
    let watchId = null;

    function startTrip() {
        if (isRunning) return;
        isRunning = true;

        // FIX LỖI 1: Đổi màu nút báo đang chạy
        const btn = document.getElementById('startBtn');
        btn.classList.add('running');
        btn.innerText = "● ĐANG TÍNH TIỀN...";

        watchId = navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            const current = L.latLng(latitude, longitude);

            // FIX LỖI 4: Lọc nhiễu GPS để đồng hồ không tự nhảy
            // Chỉ tính tiền nếu: Độ chính xác tốt (< 30m) VÀ di chuyển thực tế > 15 mét
            if (lastPos && accuracy < 30) {
                let d = map.distance(lastPos, current); 
                if (d > 15) { 
                    totalKm += (d / 1000);
                    updateUI();
                }
            }
            lastPos = current;
            map.flyTo(current, 17);
            carIcon.setLatLng(current);
        }, null, { enableHighAccuracy: true });
    }

    function updateUI() {
        document.getElementById('km').innerText = totalKm.toFixed(2);
        document.getElementById('fare').innerText = Math.round(totalKm * kmPrice).toLocaleString('vi-VN');
    }

    function stopTrip() {
        if (!isRunning) return;
        navigator.geolocation.clearWatch(watchId);
        
        // FIX LỖI 2 & 3: Tiền về túi tài xế
        let total = document.getElementById('fare').innerText;
        alert("CHUYẾN ĐI HOÀN THÀNH\nSố tiền khách phải trả tài xế: " + total + " VNĐ");
        
        location.reload(); // Reset app
    }
</script>
</body>
</html>
