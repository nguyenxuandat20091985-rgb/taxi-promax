<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi Pro - NGUYEN XUAN DAT</title>
    <style>
        body { background: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header đen */
        .top-id { background: #1c1f23; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        .tag-free { background: #f1c40f; color: black; padding: 2px 10px; border-radius: 12px; font-weight: bold; }

        .main-display { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }

        /* Nút Cài đặt hồng chuẩn gốc */
        .btn-setting { 
            position: absolute; top: 10px; left: 10px; width: 80px; height: 80px; 
            background: #ffc0cb; border-radius: 20px; border: 2px solid #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; color: #ff0000; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Vòng tròn xanh */
        .circle {
            width: 300px; height: 300px; border: 12px solid #2ecc71; border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        /* Bố cục chữ trong vòng tròn */
        #display-fare { font-size: 65px; color: #2ecc71; font-weight: 900; margin: 0; line-height: 0.9; transition: 0.3s; }
        .vnd-label { font-size: 45px; color: #2ecc71; font-weight: 900; margin-top: -5px; }
        #display-km { font-size: 35px; color: #3498db; font-weight: bold; margin-top: 10px; }
        .time-label { font-size: 14px; color: #bdc3c7; margin: 2px 0; }
        #status-text { font-size: 14px; color: #e84393; font-weight: bold; }

        /* Nút bấm */
        .controls { width: 90%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .btn { padding: 18px; border-radius: 25px; font-size: 20px; font-weight: bold; border: none; cursor: pointer; text-align: center; }
        .btn-start { background: #2ecc71; color: white; }
        .btn-start.active { background: #1b5e20; } 
        .btn-stop { background: white; color: #e74c3c; border: 2px solid #e74c3c; }
        .btn-stop.active { background: #e74c3c !important; color: white !important; }

        /* Menu dưới cùng */
        .nav { border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0; }
        .nav-item { text-decoration: none; color: #7f8c8d; font-size: 12px; text-align: center; font-weight: bold; }
        .nav-item.active { color: #2ecc71; }
        .nav-icon { font-size: 24px; display: block; margin-bottom: 5px; }

        /* Popup */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 20px; border-radius: 20px; width: 80%; text-align: center; }
    </style>
</head>
<body>

    <div class="top-id">
        <span>ID: TX-20091985-DAT</span>
        <span class="tag-free">GÓI: FREE</span>
    </div>

    <div class="main-display">
        <div class="btn-setting" onclick="openPrice()">
            <span style="font-size: 12px;">⚙️ CÀI ĐẶT</span>
            <span style="font-size: 12px;">GIÁ CẢ</span>
            <span id="price-tag" style="margin-top:2px;">15K/KM</span>
        </div>

        <div class="circle">
            <h1 id="display-fare">15.000</h1>
            <div class="vnd-label">VNĐ</div>
            <span id="display-km">0.00 Km</span>
            <span class="time-label">00:00</span>
            <div id="status-text">ĐÃ CHỐT GIÁ</div>
        </div>

        <div class="controls">
            <button id="btnStart" class="btn btn-start" onclick="startTrip()">➤ BẮT ĐẦU CHUYẾN</button>
            <button id="btnStop" class="btn btn-stop" onclick="stopTrip()">■ KẾT THÚC</button>
        </div>
    </div>

    <div style="font-size: 10px; color: #ccc; text-align: center;">PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
    <div class="nav">
        <a href="#" class="nav-item active"><span class="nav-icon">🏠</span>Trang chủ</a>
        <a href="#" class="nav-item"><span class="nav-icon">💰</span>Nạp tiền</a>
        <a href="#" class="nav-item"><span class="nav-icon">📊</span>Lịch sử</a>
        <a href="#" class="nav-item"><span class="nav-icon">⚙️</span>Quản lý</a>
    </div>

    <div id="priceModal" class="modal">
        <div class="modal-box">
            <h3>Chọn giá (VNĐ/Km)</h3>
            <h2 id="preview" style="color:#e84393">15.000 VNĐ</h2>
            <input type="range" min="5" max="100" value="15" id="range" style="width:100%" oninput="document.getElementById('preview').innerText = (this.value*1000).toLocaleString() + ' VNĐ'">
            <button class="btn btn-start" style="width:100%; margin-top:10px;" onclick="savePrice()">XÁC NHẬN</button>
            <p onclick="document.getElementById('priceModal').style.display='none'" style="color:red; cursor:pointer;">Hủy</p>
        </div>
    </div>

<script>
    let price = 15000, km = 0, watchId = null, lastPos = null;

    function openPrice() { document.getElementById('priceModal').style.display='flex'; }
    function savePrice() {
        let v = document.getElementById('range').value;
        price = v * 1000;
        document.getElementById('price-tag').innerText = v + "K/KM";
        document.getElementById('priceModal').style.display='none';
    }

    function startTrip() {
        document.getElementById('btnStart').classList.add('active');
        document.getElementById('btnStop').classList.remove('active');
        document.getElementById('status-text').innerText = "ĐANG CHUYỂN BÁNH";
        watchId = navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            if (accuracy < 50) {
                if (lastPos) {
                    const d = calcD(lastPos.lat, lastPos.lon, latitude, longitude);
                    if (d > 0.002) { km += d; update(); }
                }
                lastPos = { lat: latitude, lon: longitude };
            }
        }, null, { enableHighAccuracy: true });
    }

    function update() {
        document.getElementById('display-km').innerText = km.toFixed(2) + " Km";
        let fare = Math.round(km * price);
        let el = document.getElementById('display-fare');
        
        // CHỐNG TRÀN
        let s = fare.toLocaleString();
        if (s.length > 7) el.style.fontSize = "40px";
        else if (s.length > 5) el.style.fontSize = "50px";
        else el.style.fontSize = "65px";
        
        el.innerText = s;
    }

    function stopTrip() {
        if(watchId) navigator.geolocation.clearWatch(watchId);
        document.getElementById('btnStop').classList.add('active');
        document.getElementById('btnStart').classList.remove('active');
        document.getElementById('status-text').innerText = "HOÀN THÀNH";
    }

    function calcD(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2-lat1)*Math.PI/180;
        const dLon = (lon2-lon1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
</script>
</body>
</html>
