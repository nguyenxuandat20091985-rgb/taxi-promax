<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax Infinity - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main-green: #2ecc71; --main-blue: #3498db; --glass: rgba(255, 255, 255, 0.9); }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #f4f7f6; overflow: hidden; }
        
        /* 1. Bản đồ rõ nét */
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; filter: contrast(1.1); } 

        /* 2. Header trong suốt */
        .top-bar {
            position: absolute; top: 15px; width: 92%; left: 4%; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
        }
        .info-pill { 
            background: rgba(0,0,0,0.75); color: white; padding: 6px 14px; 
            border-radius: 20px; font-size: 11px; backdrop-filter: blur(5px); font-weight: bold;
        } 

        /* 3. Nút cài đặt hồng (Đã tích hợp chức năng) */
        .btn-config {
            position: absolute; top: 65px; left: 15px; z-index: 10;
            width: 65px; height: 65px; background: linear-gradient(135deg, #ffc0cb 0%, #ff9a9e 100%); 
            border: 2px solid white; border-radius: 20px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 8px; font-weight: bold; color: #d63031; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            cursor: pointer; transition: 0.2s;
        }
        .btn-config:active { transform: scale(0.9); }

        /* 4. Smart HUD tích hợp */
        .smart-hud {
            position: absolute; bottom: 185px; width: 92%; left: 4%; z-index: 10;
            background: var(--glass); border-radius: 25px; backdrop-filter: blur(10px);
            display: flex; padding: 15px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .hud-col { flex: 1; text-align: center; }
        .hud-col:first-child { border-right: 1px solid rgba(0,0,0,0.05); }
        .money { font-size: 35px; color: var(--main-green); font-weight: 900; line-height: 1; }
        .km { font-size: 26px; color: var(--main-blue); font-weight: bold; line-height: 1; }
        .label { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; font-weight: 800; } 

        /* 5. Cụm điều khiển & Icon tiện ích */
        .bottom-panel {
            position: absolute; bottom: 0; width: 100%; z-index: 20;
            background: white; border-top-left-radius: 30px; border-top-right-radius: 30px;
            padding: 20px 0 10px 0; box-shadow: 0 -8px 30px rgba(0,0,0,0.1);
        }
        .main-btns { width: 90%; margin: 0 auto 15px auto; display: flex; gap: 10px; }
        .btn-go { flex: 2; background: var(--main-green); color: white; border: none; padding: 16px; border-radius: 18px; font-weight: 900; font-size: 16px; box-shadow: 0 4px 12px rgba(46,204,113,0.3); }
        .btn-stop { flex: 1; background: #fff; color: #e74c3c; border: 2px solid #e74c3c; border-radius: 18px; font-weight: bold; } 

        /* Fix Menu Icon hoạt động 100% */
        .nav-icons { display: flex; justify-content: space-around; width: 95%; margin: 0 auto; border-top: 1px solid #f5f5f5; padding-top: 12px; }
        .nav-item { text-align: center; color: #bdc3c7; text-decoration: none; font-size: 10px; font-weight: bold; width: 25%; cursor: pointer; }
        .nav-item span { display: block; font-size: 24px; margin-bottom: 4px; transition: 0.2s; }
        .nav-item.active { color: var(--main-green); }
        .nav-item:active span { transform: translateY(-5px); }

        /* Overlay cài đặt giá & Thông báo */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal { background: white; padding: 30px; border-radius: 30px; width: 80%; text-align: center; }
        .modal input { width: 100%; margin: 20px 0; accent-color: var(--main-green); }
        .modal-btn { background: var(--main-green); color: white; border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body> 

<div id="map"></div> 

<div class="top-bar">
    <div class="info-pill">🆔 TX-DAT-2026</div>
    <div class="info-pill" style="background: #f1c40f; color: #000;">⚡ GÓI: VIP PRO</div>
</div> 

<div class="btn-config" onclick="openPriceModal()">
    <span>⚙️ CÀI ĐẶT</span>
    <span style="font-size: 11px; margin-top: 2px;" id="price-label">15K/KM</span>
</div> 

<div class="smart-hud">
    <div class="hud-col">
        <div class="money" id="fare-txt">0</div>
        <div class="label">VNĐ ĐANG NHÀY</div>
    </div>
    <div class="hud-col">
        <div class="km" id="km-txt">0.00</div>
        <div class="label">KILÔMÉT ĐÃ ĐI</div>
    </div>
</div> 

<div class="bottom-panel">
    <div style="text-align: center; font-size: 12px; color: var(--main-green); font-weight: bold; margin-bottom: 12px;">● ĐANG TRỰC TUYẾN</div>
    <div class="main-btns">
        <button class="btn-go" id="startBtn" onclick="startTrip()">▶ BẮT ĐẦU CHUYẾN</button>
        <button class="btn-stop" onclick="stopTrip()">KẾT THÚC</button>
    </div> 

    <div class="nav-icons">
        <div class="nav-item active" onclick="location.reload()"><span>🏠</span>Trang chủ</div>
        <div class="nav-item" onclick="showMsg('Ví của anh đang có: 500.000đ','NẠP TIỀN')"><span>💰</span>Nạp tiền</div>
        <div class="nav-item" onclick="showMsg('Hôm nay anh đã đi 0 chuyến.','LỊCH SỬ')"><span>📊</span>Lịch sử</div>
        <div class="nav-item" onclick="showMsg('Đang mở cài đặt hệ thống...','QUẢN LÝ')"><span>⚙️</span>Quản lý</div>
    </div>
    <div style="text-align: center; font-size: 9px; color: #bdc3c7; margin-top: 10px; letter-spacing: 1px;">THIẾT KẾ CAO CẤP BỞI: NGUYEN XUAN DAT</div>
</div> 

<div id="priceOverlay" class="overlay">
    <div class="modal">
        <h3 style="margin: 0;">Giá thỏa thuận (1Km)</h3>
        <div style="font-size: 35px; font-weight: 900; color: #e84393; margin: 15px 0;" id="preview-val">15,000đ</div>
        <input type="range" min="10" max="100" value="15" oninput="updatePricePreview(this.value)">
        <button class="modal-btn" onclick="savePrice()">XÁC NHẬN GIÁ</button>
        <p style="color: #999; margin-top: 15px; font-size: 13px;" onclick="closeOverlay()">Hủy bỏ</p>
    </div>
</div>

<div id="msgOverlay" class="overlay">
    <div class="modal">
        <h3 id="msg-title" style="margin: 0;">THÔNG BÁO</h3>
        <p id="msg-body" style="color: #666; margin: 20px 0;"></p>
        <button class="modal-btn" onclick="closeOverlay()">ĐÓNG</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Bản đồ Voyager rõ nét & sang trọng
    var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([20.95, 107.07], 16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
    
    var carIcon = L.circleMarker([0,0], { radius: 10, color: '#fff', weight: 3, fill: true, fillColor: '#2ecc71', fillOpacity: 1 }).addTo(map); 

    let kmPrice = 15000, totalKm = 0, watchId = null, lastLoc = null, tempP = 15; 

    // 2. Chức năng Cài đặt giá
    function openPriceModal() { document.getElementById('priceOverlay').style.display = 'flex'; }
    function updatePricePreview(v) { tempP = v; document.getElementById('preview-val').innerText = (v*1000).toLocaleString() + "đ"; }
    function savePrice() {
        kmPrice = tempP * 1000;
        document.getElementById('price-label').innerText = tempP + "K/KM";
        closeOverlay();
    }

    // 3. Chức năng Thông báo (Thay cho alert lỗi)
    function showMsg(msg, title) {
        document.getElementById('msg-title').innerText = title;
        document.getElementById('msg-body').innerText = msg;
        document.getElementById('msgOverlay').style.display = 'flex';
    }
    function closeOverlay() { 
        document.getElementById('priceOverlay').style.display = 'none'; 
        document.getElementById('msgOverlay').style.display = 'none'; 
    }

    // 4. Logic chuyến đi chuẩn xác
    function startTrip() {
        if(watchId) return;
        document.getElementById('startBtn').style.background = '#1b5e20';
        document.getElementById('startBtn').innerText = "⚡ ĐANG DI CHUYỂN";
        
        watchId = navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            const current = [latitude, longitude];
            map.flyTo(current, 17, { animate: true, duration: 1.5 });
            carIcon.setLatLng(current); 

            if (lastLoc && accuracy < 35) {
                const d = map.distance(lastLoc, current) / 1000;
                if (d > 0.003) { 
                    totalKm += d; 
                    document.getElementById('km-txt').innerText = totalKm.toFixed(2);
                    document.getElementById('fare-txt').innerText = Math.round(totalKm * kmPrice).toLocaleString('vi-VN');
                }
            }
            lastLoc = current;
        }, null, { enableHighAccuracy: true });
    } 

    function stopTrip() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        watchId = null; lastLoc = null;
        document.getElementById('startBtn').style.background = '#2ecc71';
        document.getElementById('startBtn').innerText = "▶ BẮT ĐẦU CHUYẾN";
        
        showMsg("Chuyến đi hoàn tất!\nQuãng đường: " + totalKm.toFixed(2) + " Km\nTổng tiền: " + document.getElementById('fare-txt').innerText + " VNĐ", "HÓA ĐƠN");
    }
</script>
</body>
</html>
