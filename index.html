<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAXI PROMAX v7.0 - ULTIMATE</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root { --y: #f1c40f; --b: #000; --g: #1c1c1e; --r: #ff3b30; --s: #4cd964; --bl: #007aff; }
        body { background: var(--b); color: #fff; margin: 0; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { background: var(--g); padding: 12px 15px; border-bottom: 2px solid var(--y); display: flex; justify-content: space-between; align-items: center; }
        .logo-group b { color: var(--y); font-size: 18px; }
        
        #map { flex: 1; width: 100%; filter: grayscale(0.5); }

        /* BẢNG GIÁ ĐỂ THU PHÍ TÀI XẾ */
        .subscription-box { padding: 10px; background: #0a0a0a; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-bottom: 1px solid #333; }
        .tier-card { background: #1c1c1e; padding: 6px; border-radius: 6px; border: 1px solid #444; text-align: center; font-size: 10px; }
        .tier-card.active { border-color: var(--y); background: #2c2c00; }
        .tier-card b { display: block; color: var(--y); font-size: 12px; }

        /* MÀN HÌNH TÍNH TIỀN */
        .meter-box { background: #000; padding: 20px; border-top: 2px solid #333; text-align: center; }
        .money-main { font-size: 65px; font-weight: 900; color: var(--y); font-family: monospace; }
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; border-top: 1px solid #222; padding-top: 15px; }
        .stat-item label { font-size: 10px; color: #777; display: block; }
        .stat-item b { font-size: 20px; }

        .controls { padding: 15px; background: #000; }
        .btn-main { width: 100%; height: 60px; border-radius: 12px; border: none; font-size: 20px; font-weight: bold; color: #fff; text-transform: uppercase; }
        .start { background: var(--s); }
        .stop { background: var(--r); }
        .lock { background: #333; color: #666; }

        /* MODAL HÓA ĐƠN */
        #bill-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center; }
        .bill { background: #fff; color: #000; width: 85%; padding: 25px; border-radius: 15px; text-align: center; }
        #qrcode { margin: 15px auto; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-group"><b>TAXI PROMAX v7.0</b><br><small id="trial-msg" style="font-size: 9px;"></small></div>
        <div id="user-tag" style="background:var(--bl); padding:3px 8px; border-radius:10px; font-size:10px;">FREE</div>
    </div>

    <div class="subscription-box" id="sub-area">
        <div class="tier-card active" id="tier-free"><b>FREE</b>7 Ngày</div>
        <div class="tier-card" onclick="App.upgrade('PRO')" id="tier-pro"><b>PRO</b>49k/tháng</div>
        <div class="tier-card"><b>VIP</b>129k</div>
    </div>

    <div id="map"></div>

    <div class="meter-box">
        <div class="money-main" id="ui-fare">0đ</div>
        <div class="grid-stats">
            <div class="stat-item"><label>QUÃNG ĐƯỜNG</label><b id="ui-km">0.00</b> km</div>
            <div class="stat-item"><label>TỐC ĐỘ</label><b id="ui-speed">0</b> km/h</div>
        </div>
    </div>

    <div class="controls">
        <button id="btn-run" class="btn-main start" onclick="App.toggle()">BẮT ĐẦU</button>
    </div>

    <div id="bill-overlay">
        <div class="bill">
            <h3 style="margin:0">HÓA ĐƠN TAXI</h3>
            <p id="b-date" style="font-size: 11px; color: #666;"></p>
            <div style="font-size: 35px; font-weight: 900; margin: 15px 0; color: var(--r);" id="b-money">0đ</div>
            <p style="border-top: 1px dashed #ccc; padding-top: 10px;">Quãng đường: <b id="b-km"></b></p>
            <div id="qrcode"></div>
            <button class="btn-main stop" style="height: 45px;" onclick="location.reload()">HOÀN TẤT</button>
        </div>
    </div>

    <script>
        const App = {
            conf: { rate: 15000, trialDays: 7, minAcc: 35 },
            st: { active: false, km: 0, last: null, tier: 'FREE', joinDate: null },
            map: null, marker: null,

            init() {
                this.loadData();
                this.initMap();
                this.checkLicense();
                this.watchGPS();
                this.speak("Hệ thống quản lý taxi v7.0 đã sẵn sàng.");
            },

            loadData() {
                const saved = JSON.parse(localStorage.getItem('TAXI_DATA_V7') || '{}');
                this.st.tier = saved.tier || 'FREE';
                this.st.joinDate = saved.joinDate || Date.now();
                if (!saved.joinDate) this.save();
            },

            save() {
                localStorage.setItem('TAXI_DATA_V7', JSON.stringify({ tier: this.st.tier, joinDate: this.st.joinDate }));
            },

            checkLicense() {
                const used = Math.floor((Date.now() - this.st.joinDate) / 86400000);
                const msg = document.getElementById('trial-msg');
                const btn = document.getElementById('btn-run');

                if (this.st.tier === 'FREE') {
                    if (used >= this.conf.trialDays) {
                        btn.disabled = true; btn.className = "btn-main lock"; btn.innerText = "HẾT HẠN - NẠP TIỀN";
                        msg.innerText = "HẾT HẠN DÙNG THỬ";
                    } else {
                        msg.innerText = `CÒN ${this.conf.trialDays - used} NGÀY DÙNG THỬ`;
                    }
                } else {
                    document.getElementById('user-tag').innerText = "PRO ACCOUNT";
                    document.getElementById('user-tag').style.background = "var(--s)";
                    document.getElementById('tier-pro').className = "tier-card active";
                    document.getElementById('tier-free').className = "tier-card";
                    msg.innerText = "ĐÃ KÍCH HOẠT VĨNH VIỄN";
                }
            },

            initMap() {
                this.map = L.map('map', { zoomControl: false }).setView([21.02, 105.83], 15);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(this.map);
                this.marker = L.circleMarker([21.02, 105.83], { color: '#007aff', radius: 8, fillOpacity: 1 }).addTo(this.map);
            },

            watchGPS() {
                navigator.geolocation.watchPosition(p => {
                    const { latitude: lat, longitude: lon, speed, accuracy } = p.coords;
                    const pos = [lat, lon];
                    this.marker.setLatLng(pos);
                    this.map.panTo(pos);
                    document.getElementById('ui-speed').innerText = Math.round((speed || 0) * 3.6);

                    if (this.st.active && accuracy < this.conf.minAcc) {
                        if (this.st.last) {
                            const d = this.map.distance(this.st.last, pos) / 1000;
                            if (d > 0.003 && d < 0.2) { 
                                this.st.km += d;
                                this.updateUI();
                            }
                        }
                        this.st.last = pos;
                    }
                }, null, { enableHighAccuracy: true });
            },

            updateUI() {
                const total = Math.round(this.st.km * this.conf.rate);
                document.getElementById('ui-fare').innerText = total.toLocaleString() + "đ";
                document.getElementById('ui-km').innerText = this.st.km.toFixed(2);
            },

            toggle() {
                this.st.active = !this.st.active;
                const btn = document.getElementById('btn-run');
                if (this.st.active) {
                    this.st.km = 0; this.st.last = null;
                    btn.innerText = "KẾT THÚC & IN BILL"; btn.className = "btn-main stop";
                    this.speak("Bắt đầu hành trình.");
                } else {
                    this.finish();
                }
            },

            finish() {
                const total = Math.round(this.st.km * this.conf.rate);
                if (this.st.tier === 'FREE') {
                    alert(`Tổng: ${total.toLocaleString()}đ. Nâng cấp PRO để in QR và lưu lịch sử!`);
                    location.reload();
                } else {
                    document.getElementById('b-money').innerText = total.toLocaleString() + "đ";
                    document.getElementById('b-km').innerText = this.st.km.toFixed(2) + " km";
                    document.getElementById('b-date').innerText = new Date().toLocaleString();
                    document.getElementById('bill-overlay').style.display = 'flex';
                    document.getElementById('qrcode').innerHTML = "";
                    new QRCode(document.getElementById("qrcode"), { text: `PAY:${total}`, width: 150, height: 150 });
                    this.speak(`Chuyến đi kết thúc. Tổng cộng ${total} đồng.`);
                }
            },

            upgrade(plan) {
                if (confirm(`Xác nhận nạp tiền nâng cấp gói ${plan}?`)) {
                    this.st.tier = plan;
                    this.save();
                    location.reload();
                }
            },

            speak(t) {
                const m = new SpeechSynthesisUtterance(t); m.lang = 'vi-VN';
                window.speechSynthesis.speak(m);
            }
        };
        window.onload = () => App.init();
    </script>
</body>
</html>
