<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi Tool Pro - 2026</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-color: #2ecc71;
            --danger-color: #e74c3c;
            --dark-bg: #1a1a1a;
        }

        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100%; overflow: hidden; }

        /* Bản đồ chiếm 85% diện tích */
        #map { height: 85vh; width: 100%; z-index: 1; }

        /* Thanh Cài Đặt Giá Thông Minh */
        .price-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        #priceBtn {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--primary-color);
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        #sliderContainer {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none; /* Mặc định ẩn */
        }

        #sliderContainer.active { display: block; animation: slideDown 0.3s ease; }

        input[type="range"] { width: 150px; cursor: pointer; accent-color: var(--primary-color); }

        /* Panel điều khiển dưới (15%) */
        .bottom-panel {
            height: 15vh;
            background: white;
            display: flex;
            flex-direction: column;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1001;
            padding: 10px;
        }

        .stats { display: flex; justify-content: space-around; margin-bottom: 10px; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.2rem; font-weight: 800; color: #333; }
        .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; }

        .actions { display: flex; gap: 10px; padding: 0 10px; }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-start { background: var(--primary-color); }
        .btn-end { background: var(--danger-color); }

        /* Bottom Menu */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            padding-top: 10px;
            border-top: 1px solid #eee;
            margin-top: 5px;
        }
        .nav-item { font-size: 0.65rem; color: #666; text-decoration: none; text-align: center; }
        .nav-item i { display: block; font-size: 1.2rem; margin-bottom: 2px; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="price-overlay">
        <button id="priceBtn">⚙️ CÀI GIÁ: <span id="currentPrice">15</span>K/KM</button>
        <div id="sliderContainer">
            <input type="range" id="priceSlider" min="10" max="50" step="1" value="15">
            <div style="text-align: center; margin-top: 5px; font-weight: bold; color: var(--primary-color);">
                <span id="sliderVal">15</span>K
            </div>
        </div>
    </div>

    <div id="map"></div>

    <div class="bottom-panel">
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="moneyCount">0</div>
                <div class="stat-label">VND Cước Phí</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="kmCount">0.00</div>
                <div class="stat-label">Kilômét đã đi</div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-start" onclick="startTrip()">▶ BẮT ĐẦU CHUYẾN</button>
            <button class="btn btn-end" onclick="endTrip()">■ KẾT THÚC</button>
        </div>

        <div class="nav-bar">
            <a href="#" class="nav-item">🏠<br>Trang chủ</a>
            <a href="#" class="nav-item" onclick="openPayOS()">💰<br>Nạp tiền</a>
            <a href="#" class="nav-item">📊<br>Lịch sử</a>
            <a href="#" class="nav-item">⚙️<br>Quản lý</a>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Khởi tạo bản đồ (Lấy tọa độ mặc định Hạ Long như trong ảnh của anh)
        const map = L.map('map').setView([20.9509, 107.0733], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // 2. Biến điều khiển
        let isRunning = false;
        let pricePerKm = 15;
        let distance = 0;
        let timer = null;

        // 3. Xử lý thanh gạt giá ẩn/hiện
        const pBtn = document.getElementById('priceBtn');
        const sContainer = document.getElementById('sliderContainer');
        const slider = document.getElementById('priceSlider');

        pBtn.onclick = () => sContainer.classList.toggle('active');

        slider.oninput = (e) => {
            document.getElementById('sliderVal').innerText = e.target.value;
            document.getElementById('currentPrice').innerText = e.target.value;
            pricePerKm = parseInt(e.target.value);
        };

        slider.onchange = () => {
            setTimeout(() => { sContainer.classList.remove('active'); }, 600);
        };

        // 4. Logic chạy Tool tự động
        function startTrip() {
            if(isRunning) return;
            isRunning = true;
            console.log("Đã bắt đầu chuyến với giá: " + pricePerKm + "k");
            
            // Giả lập nhảy số KM và Tiền (Thực tế sẽ lấy từ GPS)
            timer = setInterval(() => {
                distance += 0.01;
                document.getElementById('kmCount').innerText = distance.toFixed(2);
                document.getElementById('moneyCount').innerText = Math.floor(distance * pricePerKm * 1000).toLocaleString();
            }, 1000);
        }

        function endTrip() {
            clearInterval(timer);
            isRunning = false;
            alert("Kết thúc chuyến. Tổng tiền: " + document.getElementById('moneyCount').innerText + " VND");
        }

        // 5. Kết nối PayOS (Tự động mở cổng thanh toán)
        function openPayOS() {
            // Thay link này bằng link thanh toán thực tế từ API PayOS của anh
            window.location.href = "https://payos.vn/"; 
        }
    </script>
</body>
</html>
