<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi Pro - NGUYEN XUAN DAT</title>
    <style>
        :root { --green-main: #2ecc71; --blue-km: #3498db; --red-stop: #e74c3c; }
        body { background: white; font-family: 'Arial', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Header đen chuẩn bản gốc */
        .top-bar { background: #1c1f23; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        .tag-free { background: #f1c40f; color: black; padding: 2px 10px; border-radius: 12px; font-weight: bold; }

        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        /* Nút cài đặt màu hồng bản gốc */
        .btn-setting-pink { 
            position: absolute; top: 15px; left: 15px; width: 75px; height: 75px; 
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); 
            border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; color: #d63031; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* Vòng tròn hiển thị */
        .fare-circle {
            height: 310px; width: 310px; border: 12px solid var(--green-main); border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: white; position: relative; padding: 10px; box-sizing: border-box;
        }

        /* Khắc phục lỗi tràn chữ */
        .fare-row { display: flex; align-items: baseline; justify-content: center; width: 100%; overflow: hidden; }
        #display-fare { font-size: 55px; color: var(--green-main); font-weight: 900; margin: 0; white-space: nowrap; }
        .unit-vnd { font-size: 28px; color: var(--green-main); font-weight: bold; margin-left: 5px; }

        #display-km { font-size: 42px; color: var(--blue-km); font-weight: 700; margin: 2px 0; }
        #status-text { font-size: 16px; color: #e84393; font-weight: bold; text-transform: uppercase; }

        /* Nhóm nút bấm điều khiển */
        .btn-container { width: 85%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .btn-action { padding: 18px; border-radius: 20px; font-size: 20px; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; text-align: center; display: flex; align-items: center; justify-content: center; }
        
        .btn-start { background: var(--green-main); color: white; box-shadow: 0 4px 10px rgba(46, 204, 113, 0.2); }
        .btn-start.active { background: #1b5e20; } /* Đậm khi đang chạy */

        .btn-stop { background: white; color: var(--red-stop); border: 3px solid var(--red-stop); }
        .btn-stop.active { background: var(--red-stop) !important; color: white !important; } /* Đỏ đậm khi kết thúc */

        /* Menu điều hướng chuẩn bản gốc */
        .bottom-nav { border-top: 1px solid #f0f0f0; display: flex; justify-content: space-around; padding: 12px 0; background: #fff; }
        .nav-item { text-decoration: none; color: #7f8c8d; font-size: 11px; text-align: center; font-weight: bold; }
        .nav-item.active { color: var(--green-main); }
        .nav-icon { font-size: 22px; display: block; margin-bottom: 4px; }
        .credits { font-size: 10px; color: #bdc3c7; text-align: center; padding-bottom: 5px; letter-spacing: 1px; }

        /* Popup cài đặt giá */
        .modal-price { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 25px; width: 85%; text-align: center; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>ID: TX-20091985-DAT</span>
        <span class="tag-free">GÓI: FREE</span>
    </div>

    <div class="main-content">
        <button class="btn-setting-pink" id="btn-set" onclick="toggleModal(true)">
            <span style="font-size: 16px;">⚙️</span>
            <span>CÀI ĐẶT</span>
            <span id="price-label" style="font-size: 11px;">15K/KM</span>
        </button>

        <div class="fare-circle">
            <div class="fare-row">
                <h1 id="display-fare">0</h1>
                <span class="unit-vnd">VNĐ</span>
            </div>
            <span id="display-km">0.00 Km</span>
            <div id="status-text">CHỜ THỎA THUẬN</div>
        </div>

        <div class="btn-container">
            <button id="btnStart" class="btn-action btn-start" onclick="handleStart()">▶ BẮT ĐẦU CHUYẾN</button>
            <button id="btnStop" class="btn-action btn-stop" onclick="handleStop()">■ KẾT THÚC</button>
        </div>
    </div>

    <div class="credits">PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
    <div class="bottom-nav">
        <a href="#" class="nav-item active"><span class="nav-icon">🏠</span>Trang chủ</a>
        <a href="#" class="nav-item"><span class="nav-icon">💰</span>Nạp tiền</a>
        <a href="#" class="nav-item"><span class="nav-icon">📊</span>Lịch sử</a>
        <a href="#" class="nav-item"><span class="nav-icon">⚙️</span>Quản lý</a>
    </div>

    <div id="priceModal" class="modal-price">
        <div class="modal-content">
            <h3 style="margin-top:0">Cài đặt giá (VNĐ/Km)</h3>
            <div id="price-preview" style="font-size: 32px; font-weight: bold; color: #e84393;">15.000 VNĐ</div>
            <input type="range" min="5" max="100" value="15" style="width:100%; margin:25px 0;" id="input-price" oninput="updatePreview(this.value)">
            <button class="btn-action btn-start" style="width:100%" onclick="applyPrice()">XÁC NHẬN GIÁ</button>
            <p style="color:red; margin-top:15px; cursor:pointer; font-weight:bold;" onclick="toggleModal(false)">Hủy bỏ</p>
        </div>
    </div>

<script>
    let currentPrice = 15000, distance = 0, lastPos = null, watcher = null;

    function toggleModal(show) { document.getElementById('priceModal').style.display = show ? 'flex' : 'none'; }
    function updatePreview(v) { document.getElementById('price-preview').innerText = (v*1000).toLocaleString() + " VNĐ"; }
    function applyPrice() {
        let v = document.getElementById('input-price').value;
        currentPrice = v * 1000;
        document.getElementById('price-label').innerText = v + "K/KM";
        toggleModal(false);
    }

    function handleStart() {
        if (!navigator.geolocation) return alert("Vui lòng bật GPS!");
        document.getElementById('btnStart').classList.add('active');
        document.getElementById('btnStop').classList.remove('active');
        document.getElementById('btn-set').style.visibility = 'hidden';
        document.getElementById('status-text').innerText = "ĐANG CHUYỂN BÁNH";

        watcher = navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            if (accuracy < 60) {
                if (lastPos) {
                    const d = calculateDist(lastPos.lat, lastPos.lon, latitude, longitude);
                    if (d > 0.002) { distance += d; refreshUI(); }
                }
                lastPos = { lat: latitude, lon: longitude };
            }
        }, null, { enableHighAccuracy: true });
    }

    function refreshUI() {
        document.getElementById('display-km').innerText = distance.toFixed(2) + " Km";
        let totalMoney = Math.round(distance * currentPrice);
        let fareEl = document.getElementById('display-fare');
        
        // CHỐNG TRÀN CHỮ: Tự động giảm size khi tiền quá lớn
        let sMoney = totalMoney.toLocaleString('vi-VN');
        if (sMoney.length > 7) fareEl.style.fontSize = "38px";
        else if (sMoney.length > 5) fareEl.style.fontSize = "48px";
        else fareEl.style.fontSize = "55px";
        
        fareEl.innerText = sMoney;
    }

    function handleStop() {
        if (watcher) navigator.geolocation.clearWatch(watcher);
        document.getElementById('btnStop').classList.add('active');
        document.getElementById('btnStart').classList.remove('active');
        document.getElementById('btn-set').style.visibility = 'visible';
        document.getElementById('status-text').innerText = "HOÀN THÀNH";
        lastPos = null;
    }

    function calculateDist(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2-lat1)*Math.PI/180;
        const dLon = (lon2-lon1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
</script>
</body>
</html>
