<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Bố cục hàng lối chuyên nghiệp, dễ nhìn */
        .fare-circle {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #display-fare {
            font-size: 56px !important; /* Tiền to nhất, dễ nhìn */
            font-weight: 900;
            color: #27ae60;
            margin: 0;
            line-height: 1.2;
        }

        #display-km {
            font-size: 38px !important; /* Km to rõ dưới tiền */
            font-weight: 700;
            color: #2980b9;
            margin: 5px 0;
        }

        #trip-status {
            font-size: 16px !important; /* Trạng thái hàng cuối cùng */
            color: #e84393;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Ẩn nút cài đặt khi đang chạy để tránh bấm nhầm */
        .hidden-active { display: none !important; }

        .btn-price-setting {
            width: 80px; height: 80px; border-radius: 20px;
            background: linear-gradient(135deg, #FF9a9e 0%, #fecfef 100%);
            border: 2px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="user-header">
        <div id="device-id-display">ID: Đang tải...</div>
        <div id="license-badge" class="badge-vip">GÓI: FREE</div>
    </div>

    <div class="meter-section" style="position: relative;">
        <div class="price-setting-container" id="price-btn-box">
            <div class="btn-price-setting" onclick="showPriceSlider()">
                <span style="font-size: 10px; font-weight: bold;">⚙️ CÀI ĐẶT</span>
                <span style="font-size: 11px; font-weight: 900;">GIÁ CẢ</span>
            </div>
        </div>

        <div class="fare-circle">
            <h1 id="display-fare">0 VNĐ</h1> <span id="display-km">0.00 Km</span> <div id="trip-status">CHỜ KHÁCH</div> </div>

        <div class="btn-group">
            <button class="btn-start" onclick="handleStart()">▶ BẮT ĐẦU CHUYẾN</button>
            <button class="btn-stop" onclick="handleStop()">■ KẾT THÚC</button>
        </div>
    </div>

    <div id="slider-overlay" style="display:none;" class="slider-overlay">
        <div class="slider-card">
            <h3>Chọn giá (VNĐ/Km)</h3>
            <div class="current-val" id="slider-val">15.000 VNĐ</div>
            <input type="range" min="10" max="50" step="1" value="15" class="price-slider" id="price-range" oninput="updateSliderText(this.value)">
            <button class="btn-confirm" onclick="confirmPrice()">XÁC NHẬN GIÁ</button>
            <p style="margin-top:15px; color:red;" onclick="hidePriceSlider()">Hủy bỏ</p>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
<script>
    let pricePerKm = 15000;
    let watchId = null;

    function updateSliderText(val) {
        document.getElementById('slider-val').innerText = (val * 1000).toLocaleString('vi-VN') + " VNĐ";
    }

    function confirmPrice() {
        pricePerKm = document.getElementById('price-range').value * 1000;
        document.getElementById('trip-status').innerText = "GIÁ: " + (pricePerKm/1000) + "K/KM";
        document.getElementById('slider-overlay').style.display = 'none';
    }

    function handleStart() {
        // 1. Bố cục lại giao diện
        document.getElementById('price-btn-box').classList.add('hidden-active');
        document.getElementById('trip-status').innerText = "ĐANG CHUYỂN BÁNH";
        
        // 2. Kích hoạt GPS nhạy cao để nhảy tiền ngay lập tức
        if ("geolocation" in navigator) {
            watchId = navigator.geolocation.watchPosition((pos) => {
                // Giả lập lấy Km từ TaxiApp của anh
                let km = TaxiApp.updatePosition(pos.coords.latitude, pos.coords.longitude); 
                document.getElementById('display-km').innerText = km.toFixed(2) + " Km";
                
                // Tiền nhảy theo Km thực tế
                let currentFare = km * pricePerKm;
                document.getElementById('display-fare').innerText = Math.round(currentFare).toLocaleString('vi-VN') + " VNĐ";
            }, (err) => console.error(err), { enableHighAccuracy: true });
        }
        TaxiApp.start();
    }

    function handleStop() {
        document.getElementById('price-btn-box').classList.remove('hidden-active');
        document.getElementById('trip-status').innerText = "CHUYẾN HOÀN THÀNH";
        if(watchId) navigator.geolocation.clearWatch(watchId);
        TaxiApp.stop();
    }
</script>
</body>
</html>
