<div class="container py-3">
    <div class="header-container mb-4">
        <div class="brand-name">🚖 Taxi Promax</div>
        <div class="action-cluster text-end">
            <div class="btn-group-top">
                <button class="btn-main btn-start" id="btn-start"><i class="fas fa-play"></i> Bắt đầu</button>
                <button class="btn-main btn-stop" id="btn-stop" disabled><i class="fas fa-square"></i> Kết thúc</button>
            </div>
            <button class="btn-pos" id="btn-location"><i class="fas fa-map-marker-alt"></i> Vị trí hiện tại</button>
        </div>
    </div>

    <div class="stat-grid">
        <div class="stat-box box-blue">
            <div class="box-label">Quãng đường</div>
            <div class="box-value"><span id="distance-value">0.00</span> km</div>
        </div>
        <div class="stat-box box-green">
            <div class="box-label">Thời gian</div>
            <div class="box-value" id="time-value">00:00:00</div>
        </div>
        <div class="stat-box box-yellow">
            <div class="box-label">Tạm tính</div>
            <div class="box-value"><span id="price-value">0</span> đ</div>
        </div>
        <div class="stat-box box-cyan">
            <div class="box-label">Trạng thái</div>
            <div class="box-value" id="status-value" style="font-size: 18px;">Đang chờ</div>
        </div>
    </div>
    
    <div id="map" style="height: 280px; border-radius: 15px; border: 1px solid #ddd; background: #fff; margin-bottom: 20px;"></div>

    <div class="text-center mb-3 small text-muted">
        Thiết bị: <span id="device-id-display" class="fw-bold">ĐANG QUÉT...</span> | 
        Phiên bản: <span class="text-primary">v5.1 Pro</span>
    </div>

    <hr style="opacity: 0.1;">
    <footer class="text-center py-3">
        <p class="mb-1" style="letter-spacing: 1px; color: #666;">HỆ THỐNG TAXI THÔNG MINH</p>
        <p class="fw-bold mb-0" style="font-size: 1.1rem; color: #333;">
            Bản quyền thuộc về <span style="color: #d93025;">NGUYỄN XUÂN ĐẠT</span>
        </p>
    </footer>
</div>
