<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAXI PROMAX TÀI XẾ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #0054a3; --accent: #00bfa5; --bg: #f4f7f6; --danger: #d32f2f; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; background: var(--bg); }
        
        #map { height: 100vh; width: 100vw; position: absolute; z-index: 1; } 
        
        /* HEADER & STATS */
        .header { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 1000; }
        .badge { background: rgba(255,255,255,0.9); padding: 8px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stats-bar { position: fixed; top: 50px; left: 10px; right: 10px; background: white; border-radius: 15px; display: flex; padding: 10px; z-index: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .stat-item { flex: 1; text-align: center; }
        .stat-value { font-size: 18px; font-weight: 900; color: var(--primary); }

        /* FOOTER & CONTROLS */
        .footer-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; z-index: 2000; border-radius: 20px 20px 0 0; padding: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); }
        .btn-main { width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--accent); color: white; font-weight: 900; margin-bottom: 10px; }
        .btn-manual { background: var(--primary); } /* Nút chuyến vẫy */
        
        .nav-grid { display: flex; justify-content: space-around; padding-top: 10px; border-top: 1px solid #eee; }
        .nav-item { border: none; background: none; font-size: 10px; color: #999; }
        .nav-item.active { color: var(--primary); }

        .tab-content { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1500; display: none; overflow-y: auto; padding: 20px; }
        .custom-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3000; display: none; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge" id="idShow">🆔 ĐANG QUÉT...</div>
        <div class="badge" id="planShow">⭐ GÓI: ĐANG TẢI...</div>
    </div> 

    <div class="stats-bar">
        <div class="stat-item"><div class="stat-value" id="cost">0</div></div>
        <div class="stat-item"><div class="stat-value" id="km">0.00</div></div>
    </div> 

    <div id="map"></div> 

    <div id="tab-vi" class="tab-content"><h2>VÍ TIỀN</h2>...</div>
    <div id="tab-lichsu" class="tab-content"><h2>LỊCH SỬ</h2><div id="historyList"></div></div>
    <div id="tab-toi" class="tab-content"><h2>THIẾT LẬP</h2><button onclick="localStorage.clear(); location.reload();">RESET APP</button></div>

    <div class="footer-panel">
        <div id="homeControls">
            <button class="btn-main btn-manual" onclick="startManualTrip()">🚖 CHUYẾN VẪY (NHẬP ĐIỂM)</button>
            <button id="mainBtn" class="btn-main" onclick="handleTrip()">BẮT ĐẦU CHUYẾN ĐI</button>
        </div> 

        <div class="nav-grid">
            <button class="nav-item active" onclick="showTab('home', this)">🏠 Trang chủ</button>
            <button class="nav-item" onclick="showTab('vi', this)">💰 Ví</button>
            <button class="nav-item" onclick="showTab('lichsu', this)">📊 Lịch sử</button>
            <button class="nav-item" onclick="showTab('toi', this)">👤 Tôi</button>
        </div>
    </div> 

    <div id="orderModal" class="custom-modal">...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- LOGIC GỌN GÀNG ---
        const TX_ID = localStorage.getItem('tx_id') || 'PRO-' + Math.random().toString(36).substr(2, 5).toUpperCase();
        localStorage.setItem('tx_id', TX_ID);
        document.getElementById('idShow').innerText = "🆔 " + TX_ID;

        // Map Init
        var map = L.map('map', { zoomControl: false }).setView([21.02, 105.83], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Hàm Chuyến Vẫy
        function startManualTrip() {
            let pickup = prompt("Nhập điểm đón:");
            if(pickup) {
                alert("Đã ghi nhận chuyến vẫy tại: " + pickup);
                // Code xử lý đẩy lên Firebase tại đây
            }
        }

        // Chuyển tab
        function showTab(tab, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            if(tab !== 'home') document.getElementById('tab-' + tab).style.display = 'block';
        }

        // Chạy các hàm khởi tạo
        window.onload = () => { 
            // Gọi các hàm tracking, history ở đây
        };
    </script>
</body>
</html>
