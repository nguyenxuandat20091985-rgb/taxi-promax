<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAXI TRỌNG TÀI v6.0</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root { --y: #f1c40f; --b: #000; --g: #1a1a1a; --r: #e74c3c; --s: #2ecc71; }
        body { background: var(--b); color: #fff; margin: 0; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER tối giản */
        .header { padding: 15px; background: var(--g); border-bottom: 2px solid var(--y); display: flex; justify-content: space-between; align-items: center; }
        .header b { color: var(--y); font-size: 20px; }
        
        #map { flex: 1; width: 100%; }

        /* KHU VỰC HIỂN THỊ TIỀN - To, rõ cho khách ngồi sau cũng thấy */
        .display-area { background: #000; padding: 25px 15px; text-align: center; border-top: 2px solid #333; }
        .money-main { font-size: 80px; font-weight: 900; color: var(--y); font-family: monospace; line-height: 1; }
        .sub-info { display: flex; justify-content: space-around; margin-top: 20px; border-top: 1px solid #222; padding-top: 15px; }
        .sub-info div { display: flex; flex-direction: column; }
        .sub-info label { font-size: 11px; color: #777; margin-bottom: 5px; }
        .sub-info b { font-size: 22px; color: #fff; }

        /* NÚT BẤM TO */
        .action-bar { padding: 15px; background: #000; }
        .btn-action { width: 100%; height: 70px; border-radius: 15px; border: none; font-size: 22px; font-weight: 900; color: #fff; text-transform: uppercase; }
        .run { background: var(--s); box-shadow: 0 0 20px rgba(46, 204, 113, 0.4); }
        .stop { background: var(--r); }

        /* HÓA ĐƠN */
        #bill { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
        .bill-box { background: #fff; color: #000; width: 85%; padding: 25px; border-radius: 20px; text-align: center; }
        #qr-code { margin: 15px 0; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div class="header">
        <b>TAXI PRO v6.0</b>
        <div id="ver-status" style="font-size: 10px; color: var(--s);">● GPS LIVE</div>
    </div>

    <div id="map"></div>

    <div class="display-area">
        <div class="money-main" id="m-total">0đ</div>
        <div class="sub-info">
            <div><label>QUÃNG ĐƯỜNG</label><b id="m-km">0.00</b></div>
            <div><label>VẬN TỐC</label><b id="m-speed">0</b></div>
            <div><label>GÓI CƯỚC</label><b id="m-rate">15k/km</b></div>
        </div>
    </div>

    <div class="action-bar">
        <button id="btn-run" class="btn-action run" onclick="App.toggle()">Bắt đầu tính</button>
    </div>

    <div id="bill">
        <div class="bill-box">
            <h2 style="margin:0">THANH TOÁN</h2>
            <p id="b-time" style="font-size: 12px; color: #666;"></p>
            <div style="font-size: 40px; font-weight: 900; margin: 20px 0;" id="b-money">0đ</div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span>Số KM đã đi:</span><b id="b-km">0 km</b>
            </div>
            <div id="qr-code"></div>
            <button class="btn-action stop" style="height: 50px; margin-top: 10px;" onclick="location.reload()">XONG</button>
        </div>
    </div>

    <script>
        const App = {
            rate: 15000, // Cứ 1km là 15k, anh muốn đổi thì sửa số này
            active: false, km: 0, lastPos: null,
            map: null, marker: null,

            init() {
                this.map = L.map('map', { zoomControl: false }).setView([21.02, 105.83], 15);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(this.map);
                this.marker = L.circleMarker([21.02, 105.83], { color: '#2ecc71', radius: 8, fillOpacity: 1 }).addTo(this.map);
                
                this.watch();
            },

            watch() {
                navigator.geolocation.watchPosition(p => {
                    const { latitude: lat, longitude: lon, speed, accuracy } = p.coords;
                    const pos = [lat, lon];
                    
                    this.marker.setLatLng(pos);
                    this.map.panTo(pos);
                    document.getElementById('m-speed').innerText = Math.round((speed || 0) * 3.6);

                    // Lọc nhiễu: Chỉ tính khi độ chính xác GPS dưới 35m
                    if (this.active && accuracy < 35) {
                        if (this.lastPos) {
                            const d = this.map.distance(this.lastPos, pos) / 1000;
                            if (d > 0.003) { // Chỉ cộng khi di chuyển trên 3 mét để tránh nhảy ảo khi đứng yên
                                this.km += d;
                                this.update();
                            }
                        }
                        this.lastPos = pos;
                    }
                }, null, { enableHighAccuracy: true });
            },

            update() {
                const total = Math.round(this.km * this.rate);
                document.getElementById('m-total').innerText = total.toLocaleString() + "đ";
                document.getElementById('m-km').innerText = this.km.toFixed(2);
            },

            toggle() {
                this.active = !this.active;
                const btn = document.getElementById('btn-run');
                if (this.active) {
                    this.km = 0; this.lastPos = null;
                    btn.innerText = "Dừng & Tính tiền";
                    btn.className = "btn-action stop";
                    this.speak("Bắt đầu đo quãng đường.");
                } else {
                    this.finish();
                }
            },

            finish() {
                const total = Math.round(this.km * this.rate);
                document.getElementById('b-money').innerText = total.toLocaleString() + "đ";
                document.getElementById('b-km').innerText = this.km.toFixed(2) + " km";
                document.getElementById('b-time').innerText = new Date().toLocaleString();
                document.getElementById('bill').style.display = 'flex';
                
                document.getElementById('qr-code').innerHTML = "";
                new QRCode(document.getElementById("qr-code"), { text: `Tien xe: ${total}d`, width: 140, height: 140 });
                this.speak(`Chuyến đi hết ${total} đồng.`);
            },

            speak(t) {
                const m = new SpeechSynthesisUtterance(t);
                m.lang = 'vi-VN';
                window.speechSynthesis.speak(m);
            }
        };
        window.onload = () => App.init();
    </script>
</body>
</html>
