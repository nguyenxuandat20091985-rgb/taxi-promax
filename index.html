<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* GIỮ NGUYÊN STYLE BẢN GỐC CỦA ANH */
        .price-setting-container { position: absolute; top: 20px; left: 15px; z-index: 100; text-align: center; }
        .btn-price-setting {
            width: 75px; height: 75px; border-radius: 18px;
            background: linear-gradient(135deg, #FF9a9e 0%, #fecfef 100%);
            border: 2px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer;
        }
        .btn-text-top { font-size: 10px; color: #d63031; font-weight: bold; margin-bottom: 2px; }
        .btn-text-bottom { font-size: 11px; color: #d63031; font-weight: 900; }
        
        /* Chống tràn tiền: Tự động co chữ khi tiền triệu */
        #display-fare { 
            font-size: 55px; color: #2ecc71; font-weight: 900; margin: 0; 
            transition: font-size 0.3s ease; white-space: nowrap; 
        }

        /* Đổi màu nút bấm linh hoạt theo yêu cầu */
        .btn-start.running { background: #1b5e20 !important; box-shadow: inset 0 4px 8px rgba(0,0,0,0.3); }
        .btn-stop.finished { background: #c62828 !important; color: white !important; }

        .slider-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;
        }
        .slider-card { background: white; padding: 25px; border-radius: 25px; width: 85%; text-align: center; }
        .price-slider { width: 100%; margin: 25px 0; height: 10px; border-radius: 5px; background: #dfe6e9; outline: none; }
        .current-val { font-size: 24px; font-weight: bold; color: #e84393; }
        .btn-confirm { background: #27ae60; color: white; border: none; padding: 10px 30px; border-radius: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="app">
    <div class="user-header">
        <div id="device-id-display">ID: Đang tải...</div>
        <div id="license-badge" class="badge-vip">GÓI: FREE</div>
    </div>

    <div class="meter-section" style="position: relative;">
        <div class="price-setting-container" id="config-box">
            <div class="btn-price-setting" onclick="showPriceSlider()">
                <span class="btn-text-top">⚙️ CÀI ĐẶT</span>
                <span class="btn-text-bottom" id="price-tag">GIÁ CẢ</span>
            </div>
        </div>

        <div class="fare-circle">
            <h1 id="display-fare">0 VNĐ</h1>
            <span id="display-km">0.00 Km</span>
            <span id="display-time" style="font-size: 14px; color: #bdc3c7;">00:00</span>
            <div id="trip-status" style="font-size: 11px; color: #7f8c8d; margin-top: 5px; font-weight: bold;">CHỜ THỎA THUẬN</div>
        </div>

        <div class="btn-group">
            <button id="mainStartBtn" class="btn-start" onclick="onStartTrip()">▶ BẮT ĐẦU CHUYẾN</button>
            <button id="mainStopBtn" class="btn-stop" onclick="onStopTrip()">■ KẾT THÚC</button>
        </div>
    </div>

    <div id="slider-overlay" class="slider-overlay">
        <div class="slider-card">
            <h3>Chọn giá thỏa thuận</h3>
            <div class="current-val" id="slider-val">15.000 VNĐ</div>
            <input type="range" min="10" max="100" step="1" value="15" class="price-slider" id="price-range" oninput="updateSliderText(this.value)">
            <div style="display: flex; justify-content: space-between; font-size: 12px; color: #95a5a6; margin-bottom: 20px;">
                <span>10k</span><span>50k</span><span>100k</span>
            </div>
            <button class="btn-confirm" onclick="confirmPrice()">XÁC NHẬN GIÁ</button>
            <p style="font-size: 11px; color: #e74c3c; margin-top: 10px; cursor:pointer;" onclick="hidePriceSlider()">Hủy bỏ</p>
        </div>
    </div>

    <div class="bottom-menu">
        <div class="menu-item" style="color: var(--primary)"><span>🏠</span> Trang chủ</div>
        <div class="menu-item" onclick="window.location.href='payment.html'"><span>💰</span> Nạp tiền</div>
        <div class="menu-item"><span>📊</span> Lịch sử</div>
        <div class="menu-item" onclick="window.location.href='admin.html'"><span>⚙️</span> Quản lý</div>
    </div>
    <div class="copyright">PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
</div>

<script src="js/config.js"></script>
<script src="js/security.js"></script>
<script src="js/app.js"></script>

<script>
    let customPrice = 15000;
    let totalKm = 0;
    let gpsWatcher = null;
    let lastPoint = null;

    // 1. XỬ LÝ CHỌN GIÁ
    function showPriceSlider() { document.getElementById('slider-overlay').style.display = 'flex'; }
    function hidePriceSlider() { document.getElementById('slider-overlay').style.display = 'none'; }
    function updateSliderText(val) { document.getElementById('slider-val').innerText = (val * 1000).toLocaleString() + " VNĐ"; }

    function confirmPrice() {
        customPrice = document.getElementById('price-range').value * 1000;
        document.getElementById('price-tag').innerText = (customPrice/1000) + "K/KM";
        document.getElementById('display-fare').innerText = customPrice.toLocaleString('vi-VN') + " VNĐ";
        document.getElementById('trip-status').innerText = "ĐÃ CHỐT GIÁ";
        document.getElementById('trip-status').style.color = "#e84393";
        hidePriceSlider();
    }

    // 2. XỬ LÝ CHUYẾN ĐI (BẮT ĐẦU)
    function onStartTrip() {
        if (!navigator.geolocation) return alert("Cần bật GPS!");

        // Đổi màu nút Bắt đầu & ẩn cài đặt
        document.getElementById('mainStartBtn').classList.add('running');
        document.getElementById('mainStopBtn').classList.remove('finished');
        document.getElementById('config-box').style.visibility = 'hidden';
        document.getElementById('trip-status').innerText = "ĐANG CHUYỂN BÁNH";

        gpsWatcher = navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            if (accuracy < 60) {
                if (lastPoint) {
                    const d = calculateStep(lastPoint.lat, lastPoint.lon, latitude, longitude);
                    if (d > 0.002) { // Nhảy tiền khi đi được 2 mét
                        totalKm += d;
                        updateDisplayUI();
                    }
                }
                lastPoint = { lat: latitude, lon: longitude };
            }
        }, null, { enableHighAccuracy: true });
    }

    // 3. CẬP NHẬT HIỂN THỊ & CHỐNG TRÀN CHỮ
    function updateDisplayUI() {
        document.getElementById('display-km').innerText = totalKm.toFixed(2) + " Km";
        let money = Math.round(totalKm * customPrice);
        let fareEl = document.getElementById('display-fare');
        
        let sMoney = money.toLocaleString('vi-VN') + " VNĐ";
        // Logic co chữ khi tiền lên hàng triệu
        if (sMoney.length > 12) fareEl.style.fontSize = "35px";
        else if (sMoney.length > 10) fareEl.style.fontSize = "45px";
        else fareEl.style.fontSize = "55px";
        
        fareEl.innerText = sMoney;
    }

    // 4. KẾT THÚC CHUYẾN
    function onStopTrip() {
        if (gpsWatcher) navigator.geolocation.clearWatch(gpsWatcher);
        // Đổi màu nút Kết thúc sang Đỏ đậm
        document.getElementById('mainStopBtn').classList.add('finished');
        document.getElementById('mainStartBtn').classList.remove('running');
        document.getElementById('config-box').style.visibility = 'visible';
        document.getElementById('trip-status').innerText = "HOÀN THÀNH";
        lastPoint = null;
    }

    // Công thức tính khoảng cách chuẩn
    function calculateStep(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2-lat1)*Math.PI/180;
        const dLon = (lon2-lon1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    window.onload = () => {
        if (typeof Security !== 'undefined') {
            document.getElementById('device-id-display').innerText = "ID: " + Security.getDeviceID();
            const license = Security.getLicense();
            document.getElementById('license-badge').innerText = "GÓI: " + (license.type || "FREE");
        }
    };
</script>
</body>
</html>
