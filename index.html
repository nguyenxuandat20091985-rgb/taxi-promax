<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - Nguyễn Xuân Đạt</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #00bfa5; --danger: #ff5252; --gold: #ffc107; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }

        /* MÀN HÌNH KHÓA & NHẮC NẠP TIỀN */
        #lockScreen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; z-index: 9999; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; padding: 20px; text-align: center;
        }
        .qr-frame { width: 250px; height: 250px; border: 5px solid var(--primary); border-radius: 15px; overflow: hidden; margin-bottom: 20px; }
        .qr-frame img { width: 100%; }

        /* GIAO DIỆN CHÍNH */
        .header { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 1000; display: flex; justify-content: space-between; }
        .badge { background: white; padding: 8px 15px; border-radius: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1); font-size: 12px; }
        .vip-badge { background: var(--gold); color: black; }

        .stats { position: fixed; top: 60px; left: 10px; right: 10px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); padding: 15px; border-radius: 15px; display: flex; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .stat-item { flex: 1; text-align: center; border-right: 1px solid #ddd; }
        .stat-item:last-child { border: none; }
        .stat-val { font-size: 24px; font-weight: bold; color: #00796b; }
        .stat-label { font-size: 11px; color: #666; font-weight: bold; }

        .controls { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 20px; border-radius: 25px 25px 0 0; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); }
        .btn-main { width: 100%; padding: 16px; border-radius: 15px; border: none; background: var(--primary); color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-main.active { background: var(--danger); }
        
        .price-slider { margin: 15px 0; text-align: center; }
        input[type=range] { width: 100%; accent-color: var(--primary); }

        /* MÀN HÌNH CẢM ƠN */
        #thanksScreen {
            position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9);
            z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center;
        }
    </style>
</head>
<body>

    <div id="lockScreen">
        <h2 style="color: var(--danger);">YÊU CẦU KÍCH HOẠT</h2>
        <p id="lockMsg">Hệ thống đang chờ lệnh nạp tiền để phục vụ bạn.</p>
        <div class="qr-frame">
            <img id="qrImg" src="" alt="QR BIDV">
        </div>
        <p>Vui lòng chuyển khoản <b>19.000đ</b> vào BIDV</p>
        <p style="background: #eee; padding: 10px; border-radius: 8px;">Nội dung: <b id="qrContent"></b></p>
        <button onclick="checkPaymentStatus()" style="padding: 12px 25px; border-radius: 20px; border: none; background: var(--primary); color: white; font-weight: bold;">TÔI ĐÃ THANH TOÁN</button>
    </div>

    <div id="thanksScreen">
        <h1 style="color: var(--gold);">🎉 CẢM ƠN QUÝ KHÁCH! 🎉</h1>
        <p id="thanksMsg"></p>
        <button onclick="closeThanks()" style="padding: 10px 30px; border-radius: 20px; border: none; background: white; font-weight: bold;">BẮT ĐẦU NGAY</button>
    </div>

    <div class="header">
        <div class="badge" id="devID">🆔 ID: ...</div>
        <div class="badge vip-badge" id="planType">⭐ GÓI: ...</div>
    </div>

    <div class="stats">
        <div class="stat-item">
            <div class="stat-label">CƯỚC PHÍ (VNĐ)</div>
            <div id="cost" class="stat-val">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">QUÃNG ĐƯỜNG (KM)</div>
            <div id="km" class="stat-val">0.00</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="controls">
        <div class="price-slider">
            <span style="font-size: 14px;">Giá áp dụng: <b id="priceVal">15,000</b>đ/KM</span>
            <input type="range" min="10000" max="50000" step="1000" value="15000" oninput="changeRate(this.value)">
        </div>
        <button id="mainBtn" class="btn-main" onclick="handleTrip()">BẮT ĐẦU CHUYẾN ĐI</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 1. CẤU HÌNH & BẢO MẬT ĐA TẦNG ---
        const DEVICE_ID = localStorage.getItem('tx_id') || 'TX-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        localStorage.setItem('tx_id', DEVICE_ID);
        document.getElementById('devID').innerText = "🆔 ID: " + DEVICE_ID;
        document.getElementById('qrContent').innerText = DEVICE_ID;
        document.getElementById('qrImg').src = `https://img.vietqr.io/image/bidv-4430269669-compact2.png?amount=19000&addInfo=${DEVICE_ID}&accountName=NGUYEN%20XUAN%20DAT`;

        // CHỐNG HACK CONSOLE (F12)
        setInterval(() => {
            const before = new Date().getTime();
            debugger;
            const after = new Date().getTime();
            if (after - before > 100) {
                document.body.innerHTML = "<h1>PHÁT HIỆN CAN THIỆP TRÁI PHÉP!</h1>";
                localStorage.clear();
            }
        }, 2000);

        // --- 2. KIỂM TRA TRẠNG THÁI GÓI CƯỚC ---
        let userPlan = localStorage.getItem('tx_plan') || 'LOCKED';
        let expiry = localStorage.getItem('tx_expiry');

        function validateAccess() {
            if (userPlan === 'LOCKED') {
                document.getElementById('lockScreen').style.display = 'flex';
            } else {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('planType').innerText = "⭐ GÓI: " + userPlan;
            }
        }
        validateAccess();

        // GIẢ LẬP CHECK WEBHOOK (Khi anh dán link PayOS vào Vercel, hàm này sẽ gọi API thật)
        function checkPaymentStatus() {
            alert("Đang kiểm tra giao dịch với ngân hàng Anh Đạt...");
            // Gửi yêu cầu lên Vercel Webhook của anh
            // Nếu thành công (Ví dụ test):
            showThanks();
        }

        function showThanks() {
            userPlan = 'BASIC';
            localStorage.setItem('tx_plan', 'BASIC');
            document.getElementById('thanksMsg').innerText = `Anh Đạt đã nhận được tiền từ thiết bị ${DEVICE_ID}.\nBạn đã được nâng cấp lên VIP PRO!`;
            document.getElementById('thanksScreen').style.display = 'flex';
        }

        function closeThanks() {
            document.getElementById('thanksScreen').style.display = 'none';
            validateAccess();
        }

        // --- 3. LOGIC TÍNH CƯỚC 5M & HAVERSINE ---
        var map = L.map('map').setView([20.95, 107.05], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let isRunning = false;
        let totalKm = 0;
        let lastLatLng = null;
        let currentRate = 15000;

        function changeRate(v) {
            currentRate = v;
            document.getElementById('priceVal').innerText = parseInt(v).toLocaleString();
        }

        function handleTrip() {
            const btn = document.getElementById('mainBtn');
            if (!isRunning) {
                isRunning = true;
                btn.innerText = "DỪNG CHUYẾN ĐI";
                btn.classList.add('active');
                map.locate({ watch: true, enableHighAccuracy: true });
            } else {
                isRunning = false;
                btn.innerText = "BẮT ĐẦU CHUYẾN ĐI";
                btn.classList.remove('active');
                map.stopLocate();
                alert(`Kết thúc chuyến đi!\nQuãng đường: ${totalKm.toFixed(2)} KM\nTổng cước: ${Math.floor(totalKm * currentRate).toLocaleString()} VNĐ`);
                totalKm = 0;
                lastLatLng = null;
                updateDisplay();
            }
        }

        map.on('locationfound', (e) => {
            if (isRunning) {
                if (lastLatLng) {
                    let dist = e.latlng.distanceTo(lastLatLng);
                    if (dist >= 5) { // Chỉ tính khi di chuyển trên 5m
                        totalKm += dist / 1000;
                        lastLatLng = e.latlng;
                        updateDisplay();
                    }
                } else {
                    lastLatLng = e.latlng;
                }
            }
            L.circle(e.latlng, {radius: 5, color: 'blue'}).addTo(map);
            map.panTo(e.latlng);
        });

        function updateDisplay() {
            document.getElementById('km').innerText = totalKm.toFixed(2);
            document.getElementById('cost').innerText = Math.floor(totalKm * currentRate).toLocaleString();
        }
    </script>
</body>
</html>
