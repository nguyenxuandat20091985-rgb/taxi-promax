<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main-green: #2ecc71; --main-blue: #3498db; --glass: rgba(255, 255, 255, 0.98); }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Lexend', sans-serif; overflow: hidden; background: #000; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; filter: grayscale(0.2); }

        /* 🎡 Animation */
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spinning { display: inline-block; animation: spin 2s linear infinite; }

        /* 🟢 ĐÈN TRỰC TUYẾN - To & Rõ */
        .network-status {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            z-index: 1000; padding: 8px 20px; border-radius: 25px;
            font-size: 12px; font-weight: 900; background: var(--main-green); color: white;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.6); letter-spacing: 1px;
        }

        /* 🏗️ CỘT ICON TRÁI - Đồng bộ dài & đẹp */
        .left-stack {
            position: absolute; top: 60px; left: 15px; z-index: 100;
            display: flex; flex-direction: column; gap: 12px;
        }
        .luxury-pill {
            width: 100px; height: 35px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .p-gold { background: linear-gradient(135deg, #f1c40f, #f39c12); color: #000; }
        .p-dark { background: rgba(0, 0, 0, 0.8); color: white; }
        .p-white { background: white; color: var(--main-green); border: 2px solid var(--main-green); }

        /* 📟 HUD MỎNG & SANG */
        .smart-hud {
            position: absolute; bottom: 125px; width: 94%; left: 3%; z-index: 100;
            background: var(--glass); border-radius: 20px; display: flex; padding: 12px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .hud-col { flex: 1; text-align: center; }
        .money { font-size: 26px; color: var(--main-green); font-weight: 900; }
        .km { font-size: 26px; color: var(--main-blue); font-weight: 900; }
        .label { font-size: 9px; color: #95a5a6; font-weight: bold; }

        /* 📱 BOTTOM PANEL MỎNG */
        .bottom-panel {
            position: absolute; bottom: 0; width: 100%; z-index: 200;
            background: white; border-top-left-radius: 30px; border-top-right-radius: 30px;
            padding: 15px 0 10px 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
        }
        .main-btns { width: 92%; margin: 0 auto 12px auto; display: flex; gap: 10px; }
        .btn-go { flex: 2.5; background: var(--main-green); color: white; border: none; padding: 14px; border-radius: 16px; font-weight: 900; font-size: 15px; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3); }
        .btn-stop { flex: 1; background: #fff; color: #e74c3c; border: 2px solid #e74c3c; border-radius: 16px; font-weight: 900; }

        .bottom-menu { display: flex; justify-content: space-around; }
        .menu-item { text-align: center; color: #bdc3c7; font-size: 11px; font-weight: bold; flex: 1; transition: 0.2s; }
        .menu-item span { display: block; font-size: 22px; margin-bottom: 3px; }
        .menu-item:active { transform: scale(0.9); }
        .active { color: var(--main-green); }
    </style>
</head>
<body>

<div class="network-status">● ĐANG TRỰC TUYẾN</div>
<div id="map"></div>

<div class="left-stack">
    <div class="luxury-pill p-gold">GÓI: FREE</div>
    <div class="luxury-pill p-dark">ID: TX-7269</div>
    <div class="luxury-pill p-white" onclick="changePrice()">⚙️ GIÁ: 15K</div>
</div>

<div class="smart-hud">
    <div class="hud-col"><div class="money" id="display-fare">0</div><div class="label">VNĐ</div></div>
    <div class="hud-col"><div class="km" id="display-km">0.00</div><div class="label">KILÔMÉT</div></div>
</div>

<div class="bottom-panel">
    <div class="main-btns">
        <button class="btn-go" id="btnStart" onclick="startTrip()">▶ BẮT ĐẦU CHUYẾN</button>
        <button class="btn-stop" onclick="stopTrip()">KẾT THÚC</button>
    </div>
    <div class="bottom-menu">
        <div class="menu-item active" onclick="location.reload()"><span id="home-icon">🏠</span>Trang chủ</div>
        <div class="menu-item" onclick="window.location.href='payment.html'"><span>💰</span>Nạp tiền</div>
        <div class="menu-item" onclick="alert('Đang tổng hợp lịch sử chuyến đi...')"><span>📊</span>Lịch sử</div>
        <div class="menu-item" onclick="window.location.href='admin.html'"><span>⚙️</span>Quản lý</div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([20.95, 107.07], 16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

    var carMarker = L.marker([20.95, 107.07], {
        icon: L.divIcon({
            className: 'car-pulse',
            html: '<div style="background:#2ecc71; width:14px; height:14px; border-radius:50%; border:3px solid white;"></div>',
            iconSize: [20, 20]
        })
    }).addTo(map);

    function startTrip() {
        document.getElementById('home-icon').innerText = "🎡";
        document.getElementById('home-icon').classList.add('spinning');
        document.getElementById('btnStart').innerText = "⚡ ĐANG CHẠY...";
    }

    function stopTrip() {
        document.getElementById('home-icon').innerText = "🏠";
       document.getElementById('home-icon').classList.remove('spinning');
        alert("Kết thúc chuyến đi an toàn!");
        location.reload();
    }

    function changePrice() {
        let newPrice = prompt("Nhập giá mới mỗi KM (VNĐ):", "15000");
        if(newPrice) alert("Đã cập nhật giá mới: " + parseInt(newPrice).toLocaleString() + " VNĐ/KM");
    }
</script>
</body>
</html>
