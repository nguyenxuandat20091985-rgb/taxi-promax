<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TAXI PROMAX - NGUYỄN XUÂN ĐẠT</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { 
            --primary: #00bfa5; 
            --dark: #002d26; 
            --gold: #ffc107; 
            --danger: #ff5252; 
            --bg: #f8faf9; 
            --glass: rgba(255, 255, 255, 0.96); 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; background: var(--bg); }
        
        #map { height: 100vh; width: 100vw; z-index: 1; } 

        .header { position: fixed; top: 12px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 1000; pointer-events: none; }
        .badge { pointer-events: auto; background: var(--glass); padding: 8px 14px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 11px; font-weight: 800; color: var(--dark); border: 1px solid white; backdrop-filter: blur(5px); } 

        .stats-bar { position: fixed; top: 60px; left: 10px; right: 10px; background: var(--glass); border-radius: 18px; display: flex; padding: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.12); z-index: 1000; border: 1px solid white; }
        .stat-item { flex: 1; text-align: center; }
        .stat-label { font-size: 10px; color: #7f8c8d; font-weight: 800; text-transform: uppercase; }
        .stat-value { font-size: 24px; font-weight: 900; color: var(--dark); margin-top: 4px; } 

        .tab-content { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 135px); background: #fdfdfd; z-index: 1500; display: none; flex-direction: column; overflow-y: auto; }
        .p-header { background: var(--primary); color: white; padding: 30px 20px; text-align: center; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }

        .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px 15px; }
        .p-card { background: white; border: 2px solid #ecf0f1; border-radius: 20px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .p-btn { margin-top: 12px; background: var(--primary); color: white; border: none; border-radius: 12px; padding: 8px; font-size: 11px; font-weight: bold; text-align: center; }

        .footer-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; z-index: 2000; border-radius: 25px 25px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); padding: 15px 15px calc(env(safe-area-inset-bottom, 10px) + 5px); }
        .nav-grid { display: flex; justify-content: space-around; margin-top: 15px; padding-top: 10px; border-top: 1px solid #f0f0f0; }
        .nav-item { border: none; background: none; color: #bdc3c7; font-size: 11px; font-weight: 700; flex: 1; text-align: center; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 20px; display: block; font-style: normal; }

        .btn-main { width: 100%; padding: 16px; border-radius: 16px; border: none; background: var(--primary); color: white; font-size: 18px; font-weight: 900; box-shadow: 0 6px 20px rgba(0,191,165,0.3); }
        .custom-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: white; width: 85%; padding: 25px; border-radius: 25px; text-align: center; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header">
        <div class="badge" id="idShow">🆔 ĐANG QUÉT...</div>
        <div class="badge" style="color:var(--gold)" id="planShow">⭐ GÓI: MIỄN PHÍ</div>
    </div> 

    <div class="stats-bar">
        <div class="stat-item" style="border-right: 1px solid #eee;">
            <div class="stat-label">CƯỚC (VNĐ)</div>
            <div id="cost" class="stat-value">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">KHOẢNG CÁCH (KM)</div>
            <div id="km" class="stat-value">0.00</div>
        </div>
    </div> 

    <div id="map"></div> 

    <div id="tab-vi" class="tab-content">
        <div class="p-header">VÍ TAXI PROMAX</div>
        <div class="p-grid">
            <div class="p-card"><b>DÙNG THỬ</b><span>0đ</span><div class="p-btn" onclick="alert('Đã kích hoạt dùng thử')">KÍCH HOẠT</div></div>
            <div class="p-card"><b>GÓI PRO</b><span>49.000đ</span><div class="p-btn" onclick="processPayment(49000)">NẠP NGAY</div></div>
        </div>
    </div>

    <div id="tab-lichsu" class="tab-content">
        <div class="p-header">LỊCH SỬ CHUYẾN ĐI</div>
        <div id="historyList" style="padding: 20px; text-align: center; color: #999;">Chưa có dữ liệu chuyến đi.</div>
    </div>

    <div id="tab-toi" class="tab-content">
        <div class="p-header">THIẾT LẬP</div>
        <div style="padding: 20px;">
            <p>SĐT: <b id="profilePhone">---</b></p>
            <button class="btn-main" style="background:#eee; color:#333;" onclick="logout()">ĐĂNG XUẤT</button>
        </div>
    </div>

    <div class="footer-panel">
        <div id="homeControls">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span style="font-size: 12px; font-weight: bold;">GIÁ CƯỚC:</span>
                <span id="rateLabel" style="color: var(--danger); font-weight: 900;">15,000đ/KM</span>
            </div>
            <input type="range" min="10000" max="30000" step="1000" value="15000" style="width:100%; margin-bottom:15px;" oninput="updateRate(this.value)">
            <button id="mainBtn" class="btn-main" onclick="toggleTrip()">BẮT ĐẦU CHUYẾN ĐI</button>
        </div> 

        <div class="nav-grid">
            <button class="nav-item active" onclick="showTab('home', this)"><i>🏠</i>Trang chủ</button>
            <button class="nav-item" onclick="showTab('vi', this)"><i>💰</i>Ví tiền</button>
            <button class="nav-item" onclick="showTab('lichsu', this)"><i>📊</i>Lịch sử</button>
            <button class="nav-item" onclick="showTab('toi', this)"><i>👤</i>Tôi</button>
        </div>
    </div>

    <div id="regModal" class="custom-modal">
        <div class="modal-content">
            <h3>ĐĂNG KÝ TÀI XẾ</h3>
            <input type="tel" id="regPhone" placeholder="Nhập số điện thoại" style="width:100%; padding:15px; border-radius:12px; border:1px solid #ddd; font-size:18px; margin-bottom:15px;">
            <button class="btn-main" onclick="register()">VÀO ỨNG DỤNG</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, marker, watchID;
        let isDriving = false;
        let totalKm = 0;
        let currentRate = 15000;
        let lastPos = null;

        // 1. Khởi tạo Map
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([21.0285, 105.8542], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker([21.0285, 105.8542]).addTo(map);
        }

        // 2. Xử lý Chuyến đi
        function toggleTrip() {
            const btn = document.getElementById('mainBtn');
            if (!isDriving) {
                isDriving = true;
                totalKm = 0;
                lastPos = null;
                btn.innerText = "KẾT THÚC CHUYẾN";
                btn.style.background = "var(--danger)";
                startTracking();
            } else {
                isDriving = false;
                btn.innerText = "BẮT ĐẦU CHUYẾN ĐI";
                btn.style.background = "var(--primary)";
                stopTracking();
                alert(`Chuyến đi kết thúc! Tổng: ${totalKm.toFixed(2)} km - Tiền: ${Math.round(totalKm * currentRate).toLocaleString()}đ`);
            }
        }

        function startTracking() {
            if (navigator.geolocation) {
                watchID = navigator.geolocation.watchPosition(pos => {
                    const { latitude, longitude } = pos.coords;
                    const newPos = L.latLng(latitude, longitude);
                    
                    if (lastPos) {
                        let dist = map.distance(lastPos, newPos) / 1000; // Đổi sang KM
                        if (dist > 0.02) { // Chỉ tính nếu di chuyển trên 20m để tránh nhảy GPS
                            totalKm += dist;
                            lastPos = newPos;
                        }
                    } else {
                        lastPos = newPos;
                    }

                    marker.setLatLng(newPos);
                    map.panTo(newPos);
                    document.getElementById('km').innerText = totalKm.toFixed(2);
                    document.getElementById('cost').innerText = Math.round(totalKm * currentRate).toLocaleString();
                }, err => console.error(err), { enableHighAccuracy: true });
            }
        }

        function stopTracking() {
            navigator.geolocation.clearWatch(watchID);
        }

        // 3. Chuyển Tab
        function showTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            if (tabId !== 'home') {
                document.getElementById('tab-' + tabId).style.display = 'flex';
            }
            el.classList.add('active');
        }

        function updateRate(val) {
            currentRate = val;
            document.getElementById('rateLabel').innerText = parseInt(val).toLocaleString() + "đ/KM";
        }

        // 4. Đăng ký & Tài khoản
        function register() {
            const phone = document.getElementById('regPhone').value;
            if (phone.length < 10) return alert("SĐT không hợp lệ");
            localStorage.setItem('driver_phone', phone);
            document.getElementById('regModal').style.display = 'none';
            loadProfile();
        }

        function loadProfile() {
            const phone = localStorage.getItem('driver_phone');
            if (phone) {
                document.getElementById('profilePhone').innerText = phone;
                document.getElementById('idShow').innerText = "🆔 " + phone.substring(phone.length - 4);
            } else {
                document.getElementById('regModal').style.display = 'flex';
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        window.onload = () => {
            initMap();
            loadProfile();
        };
    </script>
</body>
</html>
