<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax Map - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #2ecc71; --secondary: #3498db; --danger: #e74c3c; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* HUD Header: ID và Gói */
        .user-header {
            position: absolute; top: 0; width: 100%; z-index: 10;
            background: rgba(0, 0, 0, 0.8); color: white;
            padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 12px;
        }
        .badge-free { background: #f1c40f; color: black; padding: 2px 8px; border-radius: 5px; font-weight: bold; }

        /* Nút Cài đặt hồng đặc trưng */
        .btn-price-config {
            position: absolute; top: 60px; left: 15px; z-index: 10;
            width: 65px; height: 65px; background: #ffc0cb; border: 2px solid white;
            border-radius: 15px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 9px; font-weight: bold; color: #d63031; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Smart HUD: Bảng tiền & Km nằm ngang để không che xe */
        .smart-hud {
            position: absolute; bottom: 170px; width: 92%; left: 4%; z-index: 10;
            background: rgba(255, 255, 255, 0.95); border-radius: 20px;
            border-bottom: 5px solid var(--primary); display: flex; padding: 15px 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); pointer-events: auto;
        }
        .hud-item { flex: 1; text-align: center; }
        .hud-item:first-child { border-right: 1px solid #eee; flex: 1.2; }
        
        #display-fare { font-size: 35px; color: var(--primary); font-weight: 900; margin: 0; line-height: 1; }
        .unit { font-size: 16px; color: var(--primary); font-weight: bold; }
        #display-km { font-size: 26px; color: var(--secondary); font-weight: bold; display: block; }
        .label { font-size: 11px; color: #7f8c8d; text-transform: uppercase; font-weight: bold; }

        /* Cụm nút bấm điều khiển */
        .control-panel {
            position: absolute; bottom: 0; width: 100%; z-index: 20;
            background: white; padding: 15px 0 25px 0; border-top-left-radius: 25px; border-top-right-radius: 25px;
        }
        .btn-group { width: 90%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        button { border: none; padding: 15px; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-start { background: var(--primary); color: white; }
        .btn-start.active { background: #1b5e20; box-shadow: inset 0 4px 8px rgba(0,0,0,0.3); }
        .btn-stop { background: white; color: var(--danger); border: 2px solid var(--danger); }
        .btn-stop.active { background: var(--danger); color: white; }

        /* Overlay chọn giá */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 25px; border-radius: 25px; width: 80%; text-align: center; }
        input[type=range] { width: 100%; margin: 20px 0; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="user-header">
        <div id="device-id">ID: TX-DAT-2026</div>
        <div class="badge-free">GÓI: FREE</div>
    </div>

    <div class="btn-price-config" onclick="showModal()">
        <span>⚙️ CÀI ĐẶT</span>
        <span id="price-label">15K/KM</span>
    </div>

    <div class="smart-hud">
        <div class="hud-item">
            <div style="display: flex; align-items: baseline; justify-content: center;">
                <span id="display-fare">0</span><span class="unit">&nbsp;VNĐ</span>
            </div>
            <div id="status" style="font-size: 10px; color: #e84393; font-weight: bold; margin-top: 5px;">CHỜ THỎA THUẬN</div>
        </div>
        <div class="hud-item">
            <span id="display-km">0.00</span>
            <span class="label">Kilômét</span>
        </div>
    </div>

    <div class="control-panel">
        <div class="btn-group">
            <button id="startBtn" class="btn-start" onclick="onStart()">▶ BẮT ĐẦU CHUYẾN</button>
            <button id="stopBtn" class="btn-stop" onclick="onStop()">■ KẾT THÚC</button>
        </div>
        <div style="text-align: center; font-size: 10px; color: #bdc3c7; margin-top: 10px;">PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
    </div>

    <div id="priceModal" class="modal">
        <div class="modal-content">
            <h3>Chọn giá (VNĐ/Km)</h3>
            <h2 id="preview-val" style="color: var(--primary);">15.000</h2>
            <input type="range" min="10" max="100" value="15" id="rangeInput" oninput="updatePreview(this.value)">
            <button onclick="savePrice()" style="background: var(--primary); color: white; width: 100%;">XÁC NHẬN</button>
            <p onclick="hideModal()" style="color: var(--danger); margin-top: 15px; font-size: 14px;">Hủy bỏ</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Khởi tạo Map
        var map = L.map('map', { zoomControl: false }).setView([20.95, 107.07], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        // Icon xe taxi (Dấu chấm xanh có viền)
        var carMarker = L.circleMarker([0,0], { radius: 10, color: '#fff', weight: 3, fill: true, fillColor: '#2ecc71', fillOpacity: 1 }).addTo(map);

        let farePerKm = 15000, totalDistance = 0, watchId = null, lastPoint = null;

        // 2. Xử lý giá
        function showModal() { document.getElementById('priceModal').style.display = 'flex'; }
        function hideModal() { document.getElementById('priceModal').style.display = 'none'; }
        function updatePreview(v) { document.getElementById('preview-val').innerText = (v*1000).toLocaleString(); }
        function savePrice() {
            farePerKm = document.getElementById('rangeInput').value * 1000;
            document.getElementById('price-label').innerText = (farePerKm/1000) + "K/KM";
            hideModal();
        }

        // 3. Chạy chuyến
        function onStart() {
            if (!navigator.geolocation) return alert("Hãy bật GPS!");
            document.getElementById('startBtn').classList.add('active');
            document.getElementById('stopBtn').classList.remove('active');
            document.getElementById('status').innerText = "ĐANG CHUYỂN BÁNH";

            watchId = navigator.geolocation.watchPosition(pos => {
                const { latitude, longitude, accuracy } = pos.coords;
                const currentPos = [latitude, longitude];
                
                // Cập nhật vị trí xe trên Map
                map.panTo(currentPos);
                carMarker.setLatLng(currentPos);

                if (lastPoint && accuracy < 50) {
                    const d = map.distance(lastPoint, currentPos) / 1000; // km
                    if (d > 0.003) { // Di chuyển trên 3 mét mới tính
                        totalDistance += d;
                        updateUI();
                    }
                }
                lastPoint = currentPos;
            }, null, { enableHighAccuracy: true });
        }

        function updateUI() {
            document.getElementById('display-km').innerText = totalDistance.toFixed(2);
            let money = Math.round(totalDistance * farePerKm);
            let sMoney = money.toLocaleString('vi-VN');
            
            // Chống tràn số tiền
            let fareEl = document.getElementById('display-fare');
            fareEl.style.fontSize = sMoney.length > 8 ? "28px" : "35px";
            fareEl.innerText = sMoney;
        }

        function onStop() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            document.getElementById('stopBtn').classList.add('active');
            document.getElementById('startBtn').classList.remove('active');
            document.getElementById('status').innerText = "HOÀN THÀNH";
            lastPoint = null;
        }
    </script>
</body>
</html>
