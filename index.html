<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DAT TAXI ULTIMATE SYSTEM v10.0</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* --- HỆ THỐNG MÀU SẮC CHUẨN KINH DOANH --- */
        :root {
            --primary: #f1c40f;    /* Vàng Taxi */
            --bg-dark: #000000;    /* Nền đen */
            --panel: #1c1c1e;      /* Nền panel */
            --text-main: #ffffff;
            --text-dim: #8e8e93;
            --danger: #ff3b30;     /* Đỏ dừng */
            --success: #4cd964;    /* Xanh chạy */
            --info: #007aff;       /* Xanh biển */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER CHI TIẾT --- */
        .app-header {
            background: var(--panel);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .driver-info b { color: var(--primary); font-size: 18px; text-transform: uppercase; }
        .system-status { font-size: 10px; color: var(--text-dim); }

        .license-badge {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .lic-free { background: #444; color: #fff; }
        .lic-pro { background: var(--info); color: #fff; }

        /* --- BẢN ĐỒ CHIẾM DIỆN TÍCH LỚN --- */
        #map-container {
            flex: 1;
            position: relative;
            width: 100%;
            z-index: 1;
        }
        #map { height: 100%; width: 100%; }

        .map-tools {
            position: absolute;
            right: 15px;
            top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }
        .tool-btn {
            background: rgba(28, 28, 30, 0.9);
            border: 1px solid #444;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* --- BẢNG ĐIỀU KHIỂN ĐỒNG HỒ --- */
        .meter-panel {
            background: linear-gradient(180deg, #1c1c1e 0%, #000000 100%);
            padding: 20px;
            border-top: 1px solid #333;
            z-index: 1000;
        }

        .fare-display {
            text-align: center;
            padding-bottom: 15px;
        }
        .main-money {
            font-size: 75px;
            font-weight: 900;
            color: var(--primary);
            font-family: 'Courier New', monospace;
            line-height: 1;
        }
        .currency { font-size: 24px; margin-left: 5px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-item {
            background: rgba(255,255,255,0.05);
            padding: 12px 5px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #222;
        }
        .stat-item label {
            display: block;
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .stat-item span { font-size: 18px; font-weight: bold; }
        .stat-item small { font-size: 10px; color: var(--text-dim); margin-left: 2px; }

        /* --- HỆ THỐNG NÚT BẤM --- */
        .action-bars {
            display: flex;
            gap: 15px;
        }
        .main-btn {
            flex: 2;
            height: 70px;
            border-radius: 18px;
            border: none;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .btn-start { background: var(--success); }
        .btn-stop { background: var(--danger); }
        .btn-side {
            flex: 1;
            background: #333;
            border-radius: 18px;
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
        }

        /* --- CÁC LAYER MODAL --- */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            padding: 20px;
            overflow-y: auto;
            align-items: center;
            justify-content: center;
        }
        
        /* Layout Hóa Đơn */
        .bill-paper {
            background: #fff;
            color: #000;
            width: 100%;
            max-width: 380px;
            padding: 30px;
            border-radius: 2px; /* Dạng giấy in nhiệt */
            position: relative;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        .bill-paper::after {
            content: "";
            position: absolute;
            bottom: -10px; left: 0; right: 0;
            height: 10px;
            background: linear-gradient(-45deg, transparent 5px, #fff 5px) 0 5px,
                        linear-gradient(45deg, transparent 5px, #fff 5px) 0 5px;
            background-size: 10px 10px;
        }

        .bill-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
        .bill-title { font-size: 24px; font-weight: 900; margin: 0; }
        .bill-info { margin: 15px 0; border-bottom: 1px dashed #ccc; padding-bottom: 15px; }
        .bill-line { display: flex; justify-content: space-between; margin: 8px 0; font-size: 16px; }
        .bill-total { font-size: 32px; font-weight: 900; text-align: center; margin: 20px 0; color: #d63031; }

        /* Danh sách lịch sử */
        .history-card {
            background: #1c1c1e;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 20px;
        }
        .history-item {
            padding: 15px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #qrcode { display: flex; justify-content: center; padding: 10px; }

        /* Cảnh báo tốc độ */
        .speed-warning {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--danger);
            color: white;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: bold;
            display: none;
            z-index: 5000;
            animation: blink 0.5s infinite;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

    </style>
</head>
<body>

    <header class="app-header">
        <div class="driver-info">
            <b>ĐẠT TAXI PRO</b>
            <div class="system-status" id="sys-time">Kết nối GPS...</div>
        </div>
        <div id="license-pill" class="license-badge lic-free">Dùng thử</div>
    </header>

    <div id="map-container">
        <div id="map"></div>
        <div class="map-tools">
            <button class="tool-btn" onclick="UI.toggleHistory()">📜</button>
            <button class="tool-btn" onclick="UI.toggleStats()">📊</button>
            <button class="tool-btn" onclick="UI.resetLocation()">🎯</button>
        </div>
        <div id="speed-alert" class="speed-warning">QUÁ TỐC ĐỘ!</div>
    </div>

    <section class="meter-panel">
        <div class="fare-display">
            <div class="main-money" id="ui-fare">0<span class="currency">đ</span></div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <label>Quãng đường</label>
                <span id="ui-km">0.00</span><small>km</small>
            </div>
            <div class="stat-item">
                <label>Vận tốc</label>
                <span id="ui-speed">0</span><small>km/h</small>
            </div>
            <div class="stat-item">
                <label>Thời gian</label>
                <span id="ui-timer">00:00</span>
            </div>
        </div>

        <div class="action-bars">
            <button class="btn-side" onclick="UI.showSettings()">CÀI ĐẶT</button>
            <button id="btn-engine" class="main-btn btn-start" onclick="Engine.toggle()">Bắt đầu hành trình</button>
            <button class="btn-side" onclick="UI.printLastBill()">IN LẠI</button>
        </div>
    </section>

    <div id="modal-bill" class="modal-overlay">
        <div class="bill-paper">
            <div class="bill-header">
                <p style="margin:0; font-size:12px; letter-spacing:2px;">BIÊN LAI THANH TOÁN</p>
                <h1 class="bill-title">DAT TAXI SERVICE</h1>
            </div>
            <div class="bill-info">
                <div class="bill-line"><span>Mã chuyến:</span><b id="b-id">#TX888</b></div>
                <div class="bill-line"><span>Ngày giờ:</span><b id="b-date">--/--/--</b></div>
            </div>
            <div class="bill-info">
                <div class="bill-line"><span>Quãng đường:</span><b id="b-km">0.00 km</b></div>
                <div class="bill-line"><span>Thời gian đi:</span><b id="b-duration">0 phút</b></div>
                <div class="bill-line"><span>Đơn giá áp dụng:</span><b>15.000đ/km</b></div>
            </div>
            <div class="bill-total" id="b-total">0đ</div>
            <div id="qrcode"></div>
            <p style="text-align:center; font-size:11px; color:#666;">Cảm ơn quý khách đã sử dụng dịch vụ!<br>Hẹn gặp lại quý khách.</p>
            <button class="main-btn btn-stop" style="width:100%; height:50px; margin-top:20px;" onclick="UI.closeModals()">HOÀN TẤT & ĐÓNG</button>
        </div>
    </div>

    <div id="modal-history" class="modal-overlay">
        <div class="history-card">
            <h2 style="margin-top:0; color:var(--primary);">NHẬT KÝ CHUYẾN ĐI</h2>
            <div id="history-list" style="max-height:400px; overflow-y:auto; margin-bottom:20px;">
                </div>
            <button class="main-btn btn-stop" style="width:100%; height:50px;" onclick="UI.closeModals()">ĐÓNG BẢNG TIN</button>
        </div>
    </div>

    <script>
        const Engine = {
            // CẤU HÌNH DOANH NGHIỆP
            config: {
                ratePerKm: 15000,
                trialDays: 7,
                speedLimit: 80, // Cảnh báo khi vượt 80km/h
                minMoveDist: 0.004, // Lọc nhiễu GPS dưới 4 mét
                rounding: 1000 // Làm tròn đến nghìn đồng
            },

            // BỘ NHỚ TẠM THỜI
            state: {
                isRunning: false,
                totalKm: 0,
                startTime: null,
                lastPosition: null,
                path: [], // Lưu tọa độ để vẽ đường đi
                timer: null,
                db: {
                    tier: 'FREE',
                    installDate: null,
                    history: [],
                    totalRevenue: 0
                }
            },

            // KHỞI CHẠY HỆ THỐNG
            init() {
                this.loadDatabase();
                UI.setupMap();
                this.checkLicense();
                this.startGpsTracking();
                this.keepScreenOn();
                
                // Cập nhật đồng hồ hệ thống mỗi giây
                setInterval(() => {
                    document.getElementById('sys-time').innerText = new Date().toLocaleTimeString();
                }, 1000);

                UI.speak("Hệ thống Đạt Taxi phiên bản mười chấm không đã sẵn sàng.");
            },

            loadDatabase() {
                const saved = localStorage.getItem('DAT_TAXI_MASTER_DB');
                if (saved) {
                    this.state.db = JSON.parse(saved);
                } else {
                    this.state.db.installDate = Date.now();
                    this.saveDatabase();
                }
            },

            saveDatabase() {
                localStorage.setItem('DAT_TAXI_MASTER_DB', JSON.stringify(this.state.db));
            },

            checkLicense() {
                const usedDays = Math.floor((Date.now() - this.state.db.installDate) / 86400000);
                const pill = document.getElementById('license-pill');
                
                if (this.state.db.tier === 'FREE') {
                    if (usedDays >= this.config.trialDays) {
                        UI.lockSystem("HẾT HẠN DÙNG THỬ");
                    } else {
                        pill.innerText = `FREE (${this.config.trialDays - usedDays} ngày)`;
                    }
                } else {
                    pill.innerText = "PRO MEMBER";
                    pill.className = "license-badge lic-pro";
                }
            },

            startGpsTracking() {
                if (!navigator.geolocation) return alert("Điện thoại không hỗ trợ GPS!");

                navigator.geolocation.watchPosition(
                    (pos) => {
                        const { latitude, longitude, speed, accuracy } = pos.coords;
                        const currentPos = [latitude, longitude];
                        const currentSpeed = Math.round((speed || 0) * 3.6);

                        UI.updateLiveMap(currentPos, currentSpeed);

                        // Cảnh báo quá tốc độ
                        document.getElementById('speed-alert').style.display = currentSpeed > this.config.speedLimit ? 'block' : 'none';

                        // Logic tính quãng đường khi đang chạy
                        if (this.state.isRunning && accuracy < 50) {
                            if (this.state.lastPosition) {
                                const d = UI.calculateDistance(this.state.lastPosition, currentPos);
                                // Chỉ tính nếu di chuyển trên 4m và dưới 300m (loại bỏ nhảy GPS ảo)
                                if (d > this.config.minMoveDist && d < 0.3) {
                                    this.state.totalKm += d;
                                    this.state.path.push(currentPos);
                                    this.refreshMeter();
                                }
                            }
                            this.state.lastPosition = currentPos;
                        }
                    },
                    (err) => console.error("GPS Error:", err),
                    { enableHighAccuracy: true, maximumAge: 1000 }
                );
            },

            toggle() {
                const btn = document.getElementById('btn-engine');
                if (!this.state.isRunning) {
                    // Lệnh BẮT ĐẦU
                    this.state.isRunning = true;
                    this.state.totalKm = 0;
                    this.state.startTime = Date.now();
                    this.state.lastPosition = null;
                    this.state.path = [];
                    
                    btn.innerText = "KẾT THÚC CHUYẾN";
                    btn.className = "main-btn btn-stop";
                    
                    this.state.timer = setInterval(() => this.updateTimerUI(), 1000);
                    UI.speak("Bắt đầu chuyến đi.");
                } else {
                    // Lệnh DỪNG
                    this.stopJourney();
                }
            },

            refreshMeter() {
                let rawFare = this.state.totalKm * this.config.ratePerKm;
                // Làm tròn tiền theo cấu hình
                let roundedFare = Math.ceil(rawFare / this.config.rounding) * this.config.rounding;
                
                document.getElementById('ui-fare').innerHTML = roundedFare.toLocaleString() + '<span class="currency">đ</span>';
                document.getElementById('ui-km').innerText = this.state.totalKm.toFixed(2);
            },

            updateTimerUI() {
                const seconds = Math.floor((Date.now() - this.state.startTime) / 1000);
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('ui-timer').innerText = `${m}:${s}`;
            },

            stopJourney() {
                this.state.isRunning = false;
                clearInterval(this.state.timer);
                
                let finalFare = Math.ceil((this.state.totalKm * this.config.ratePerKm) / this.config.rounding) * this.config.rounding;
                const duration = Math.floor((Date.now() - this.state.startTime) / 60000);

                const tripRecord = {
                    id: "TX" + Math.floor(1000 + Math.random() * 9000),
                    date: new Date().toLocaleString('vi-VN'),
                    km: this.state.totalKm.toFixed(2),
                    money: finalFare,
                    duration: duration
                };

                // Lưu vào lịch sử
                this.state.db.history.unshift(tripRecord);
                if (this.state.db.history.length > 50) this.state.db.history.pop();
                this.state.db.totalRevenue += finalFare;
                this.saveDatabase();

                UI.showBill(tripRecord);
            },

            keepScreenOn() {
                if ('wakeLock' in navigator) {
                    navigator.wakeLock.request('screen').catch(() => {});
                }
            }
        };

        const UI = {
            map: null,
            marker: null,
            routeLine: null,

            setupMap() {
                this.map = L.map('map', { zoomControl: false, attributionControl: false }).setView([21.0285, 105.8542], 16);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(this.map);
                this.marker = L.circleMarker([21.0285, 105.8542], {
                    color: '#f1c40f', fillColor: '#f1c40f', fillOpacity: 0.8, radius: 10
                }).addTo(this.map);
                this.routeLine = L.polyline([], {color: '#f1c40f', weight: 5}).addTo(this.map);
            },

            updateLiveMap(pos, speed) {
                if (!this.map) return;
                this.marker.setLatLng(pos);
                this.map.panTo(pos);
                document.getElementById('ui-speed').innerText = speed;
                if (Engine.state.isRunning) {
                    this.routeLine.addLatLng(pos);
                }
            },

            calculateDistance(p1, p2) {
                return this.map.distance(p1, p2) / 1000;
            },

            showBill(trip) {
                document.getElementById('b-id').innerText = "#" + trip.id;
                document.getElementById('b-date').innerText = trip.date;
                document.getElementById('b-km').innerText = trip.km + " km";
                document.getElementById('b-duration').innerText = trip.duration + " phút";
                document.getElementById('b-total').innerText = trip.money.toLocaleString() + "đ";

                // Tạo QR Code thanh toán
                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = "";
                new QRCode(qrContainer, {
                    text: `THANH TOAN CHUYEN XE ${trip.id}: ${trip.money}VND`,
                    width: 150, height: 150
                });

                document.getElementById('modal-bill').style.display = 'flex';
                this.speak(`Hành trình kết thúc. Tổng cộng ${trip.money} đồng.`);
            },

            toggleHistory() {
                const list = document.getElementById('history-list');
                list.innerHTML = Engine.state.db.history.map(t => `
                    <div class="history-item">
                        <div>
                            <b style="color:var(--primary)">${t.id}</b> | <small>${t.date}</small><br>
                            <span>${t.km} km - ${t.duration} phút</span>
                        </div>
                        <b style="font-size:18px;">${t.money.toLocaleString()}đ</b>
                    </div>
                `).join('') || '<p style="text-align:center">Chưa có dữ liệu chuyến đi.</p>';
                
                document.getElementById('modal-history').style.display = 'flex';
            },

            toggleStats() {
                const total = Engine.state.db.totalRevenue;
                const count = Engine.state.db.history.length;
                alert(`--- BÁO CÁO DOANH THU ---\n\nTổng chuyến: ${count}\nTổng thu nhập: ${total.toLocaleString()}đ\n\nChúc đại ca vạn dặm bình an!`);
            },

            closeModals() {
                const overlays = document.querySelectorAll('.modal-overlay');
                overlays.forEach(o => o.style.display = 'none');
                
                // Reset UI chính
                if (!Engine.state.isRunning) {
                    document.getElementById('ui-fare').innerHTML = '0<span class="currency">đ</span>';
                    document.getElementById('ui-km').innerText = '0.00';
                    document.getElementById('ui-timer').innerText = '00:00';
                    const btn = document.getElementById('btn-engine');
                    btn.innerText = "Bắt đầu hành trình";
                    btn.className = "main-btn btn-start";
                    this.routeLine.setLatLngs([]);
                }
            },

            lockSystem(msg) {
                const btn = document.getElementById('btn-engine');
                btn.disabled = true;
                btn.innerText = msg;
                btn.style.background = "#333";
            },

            speak(text) {
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'vi-VN';
                msg.rate = 1.1;
                window.speechSynthesis.speak(msg);
            }
        };

        // Khởi động khi tải xong trang
        window.onload = () => Engine.init();
    </script>
</body>
</html>
