<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Taxi ProMax Business</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div style="background:#eee; padding:10px; font-size:12px;">
            ID Máy: <span id="dev-id" style="font-weight:bold; color:red;">Đang tải...</span>
        </div>
        <div class="meter-center" style="text-align:center; padding:50px 0;">
            <h1 id="display-fare" style="font-size:3rem; color:#2ecc71;">0 VNĐ</h1>
            <p><span id="display-km">0.00</span> Km</p>
            <button onclick="TaxiApp.start()" style="padding:20px 40px; background:#2ecc71; color:white; border:none; border-radius:10px; font-size:1.2rem;">BẮT ĐẦU CHUYẾN</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/security.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Lệnh hiện ID máy để anh thu tiền
        window.onload = () => {
            if(window.DEVICE_ID) {
                document.getElementById('dev-id').innerText = window.DEVICE_ID;
            }
        };
    </script>
</body>
</html>
