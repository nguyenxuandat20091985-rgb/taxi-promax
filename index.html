<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đồng Hồ Tính Tiền - Xanh SM Style</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --xanh-sm: #00bfa5; --bg-gray: #f4f7f6; --danger: #ff5252; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Lexend', sans-serif; }
        body { height: 100vh; background: var(--bg-gray); overflow: hidden; display: flex; flex-direction: column; }

        /* BẢN ĐỒ 80% */
        #map { height: 80vh; width: 100%; z-index: 1; }

        /* Nút Cài giá ẩn/hiện */
        .price-config { position: absolute; top: 15px; left: 15px; z-index: 1000; }
        #priceBtn { background: white; border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        #sliderBox { background: white; padding: 15px; border-radius: 20px; margin-top: 10px; display: none; box-shadow: 0 8px 25px rgba(0,0,0,0.2); width: 220px; }
        #sliderBox.active { display: block; }

        /* CARD ĐIỀU KHIỂN 20% DƯỚI */
        .control-card {
            height: 20vh; background: white; border-top-left-radius: 30px; border-top-right-radius: 30px;
            position: relative; z-index: 1001; padding: 15px; box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
        }

        /* Nút Bắt đầu / Kết thúc */
        .btn-group { display: flex; gap: 10px; position: absolute; top: -25px; left: 5%; width: 90%; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 15px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn-start { background: var(--xanh-sm); }
        .btn-start.running { background: #b2dfdb; color: #004d40; cursor: not-allowed; }
        .btn-end { background: var(--danger); }

        /* Chỉ số đồng hồ */
        .meter-display { display: flex; justify-content: space-around; margin-top: 35px; background: #f9f9f9; padding: 12px; border-radius: 20px; }
        .meter-item { text-align: center; }
        .meter-item b { font-size: 1.4rem; color: #333; display: block; }
        .meter-item span { font-size: 0.7rem; color: #999; text-transform: uppercase; }

        /* Bottom Tab */
        .bottom-nav { display: flex; justify-content: space-around; padding-top: 10px; margin-top: 10px; border-top: 1px solid #eee; }
        .nav-item { text-align: center; color: #aaa; font-size: 0.6rem; text-decoration: none; }
        .nav-item.active { color: var(--xanh-sm); }
    </style>
</head>
<body>

    <div class="price-config">
        <button id="priceBtn" onclick="togglePrice()">⚙️ CÀI GIÁ: <span id="curP">15</span>K/KM</button>
        <div id="sliderBox">
            <input type="range" id="priceSlider" min="10" max="50" value="15" oninput="updateRate(this.value)">
            <div style="text-align:center; color:var(--xanh-sm); font-weight:bold; margin-top:5px;"><span id="tipP">15</span>K</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="control-card">
        <div class="btn-group">
            <button id="startBtn" class="btn btn-start" onclick="startTrip()">BẮT ĐẦU CHUYẾN</button>
            <button id="endBtn" class="btn btn-end" onclick="endTrip()">KẾT THÚC</button>
        </div>

        <div class="meter-display">
            <div class="meter-item"><b id="moneyDisplay">0</b><span>Cước phí (VNĐ)</span></div>
            <div class="meter-item"><b id="kmDisplay">0.00</b><span>Quãng đường (KM)</span></div>
        </div>

        <nav class="bottom-nav">
            <a href="#" class="nav-item active">🚕<br>Tạo cuốc</a>
            <a href="#" class="nav-item">💰<br>Thu nhập</a>
            <a href="#" class="nav-item">📋<br>Lịch sử</a>
            <a href="#" class="nav-item">⚙️<br>Cài đặt</a>
        </nav>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([20.95, 107.07], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let rate = 15;
        let isRunning = false;
        let distance = 0;
        let lastPos = null;

        function togglePrice() { document.getElementById('sliderBox').classList.toggle('active'); }
        function updateRate(v) { 
            rate = v; 
            document.getElementById('curP').innerText = v; 
            document.getElementById('tipP').innerText = v; 
        }

        // Tự động ẩn thanh gạt sau khi chọn
        document.getElementById('priceSlider').onchange = () => { setTimeout(togglePrice, 500); };

        function startTrip() {
            if(isRunning) return;
            isRunning = true;
            
            // Lỗi 1: Đổi màu nút khi chạy
            const sBtn = document.getElementById('startBtn');
            sBtn.classList.add('running');
            sBtn.innerText = "• ĐANG CHẠY...";

            // Lỗi 4: Xử lý GPS thực tế để tránh đồng hồ tự nhảy
            navigator.geolocation.watchPosition((pos) => {
                if(!isRunning) return;
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                
                if (lastPos) {
                    let d = map.distance([lastPos.lat, lastPos.lng], [lat, lng]) / 1000;
                    if (d > 0.005) { // Chỉ tính nếu xe di chuyển trên 5 mét
                        distance += d;
                        document.getElementById('kmDisplay').innerText = distance.toFixed(2);
                        document.getElementById('moneyDisplay').innerText = Math.floor(distance * rate * 1000).toLocaleString();
                    }
                }
                lastPos = {lat, lng};
                map.panTo([lat, lng]);
            }, (err) => console.log(err), { enableHighAccuracy: true });
        }

        function endTrip() {
            isRunning = false;
            // Thu tiền khách, không trả qua App (Lỗi 2, 3)
            alert("Kết thúc chuyến!\nTổng tiền khách trả: " + document.getElementById('moneyDisplay').innerText + " VNĐ");
            location.reload(); // Reset lại app cho cuốc mới
        }
    </script>
</body>
</html>
