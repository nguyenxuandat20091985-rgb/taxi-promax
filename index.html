<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAXI PROMAX TÀI XẾ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #0054a3; --accent: #00bfa5; --bg: #f4f7f6; --danger: #d32f2f; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; padding: 0; overflow: hidden; background: var(--bg); }
        #map { height: 100vh; width: 100vw; position: absolute; z-index: 1; }
        
        /* UI Panel */
        .controls-container { position: fixed; bottom: 0; width: 100%; background: white; padding: 20px; border-radius: 25px 25px 0 0; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn-main { padding: 15px; border-radius: 12px; border: none; color: white; font-weight: 900; cursor: pointer; }
        .btn-vẫy { background: var(--primary); }
        .btn-start { background: var(--accent); }
    </style>
</head>
<body>

    <div style="position:fixed; top:10px; z-index:1000; left:10px; right:10px; display:flex; justify-content:space-between;">
        <div id="idShow" style="background:rgba(255,255,255,0.9); padding:5px 10px; border-radius:20px; font-weight:bold;">Đang kết nối...</div>
    </div>

    <div id="map"></div>

    <div class="controls-container">
        <div style="text-align:center; margin-bottom:10px;">
            <div id="km" style="font-size:30px; font-weight:900;">0.00 KM</div>
            <div id="cost" style="color:var(--primary); font-size:18px;">0 VNĐ</div>
        </div>

        <div class="btn-row">
            <button class="btn-main btn-vẫy" onclick="startStreetTrip()">CHUYẾN VẪY</button>
            <button class="btn-main btn-start" id="mainBtn" onclick="handleTrip()">BẮT ĐẦU</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // LOGIC GỐC CỦA ANH
        let isRunning = false;
        let totalKm = 0;
        
        function startStreetTrip() {
            // Chế độ vẫy: Không chờ lệnh server, chỉ tính tiền theo đồng hồ ảo
            isRunning = true;
            document.getElementById('mainBtn').innerText = "KẾT THÚC VẪY";
            alert("Đang bắt đầu chuyến vẫy khách (Offline Mode)");
        }

        function handleTrip() {
            isRunning = !isRunning;
            document.getElementById('mainBtn').innerText = isRunning ? "KẾT THÚC" : "BẮT ĐẦU";
            // ... (Giữ nguyên các hàm xử lý GPS và Firebase của anh ở đây)
        }

        // Khởi tạo bản đồ
        var map = L.map('map').setView([21.02, 105.83], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    </script>
</body>
</html>
