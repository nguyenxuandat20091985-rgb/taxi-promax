<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- PHẦN 1: META & CONFIG (GIỮ NGUYÊN) -->
    <!-- PHẦN 2: CSS STYLES (THÊM STYLE MỚI) -->
    
    <!-- THÊM CÁC LINK CSS/JS MỚI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body oncontextmenu="return false;">
    
    <!-- PHẦN 3: HEADER (GIỮ NGUYÊN) -->
    
    <!-- PHẦN 4: THÊM NOTIFICATION BAR -->
    <div id="notificationBar" class="notification-bar">
        <span id="notificationText"></span>
        <button onclick="closeNotification()">×</button>
    </div>
    
    <!-- PHẦN 5: STATS BAR (GIỮ NGUYÊN) -->
    
    <!-- PHẦN 6: MAP (GIỮ NGUYÊN) -->
    
    <!-- PHẦN 7: THÊM AI AVATAR ẨN -->
    <div id="aiAvatar" class="ai-avatar" onclick="toggleAIPanel()">
        <img id="aiAvatarImg" src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="AI Assistant">
    </div>
    
    <!-- PHẦN 8: TAB CONTENT (NÂNG CẤP) -->
    
    <!-- PHẦN 9: THÊM AI MODAL -->
    <div id="aiModal" class="ai-modal">
        <!-- AI Interface sẽ load từ ai-ui.html -->
    </div>
    
    <!-- PHẦN 10: FOOTER PANEL (GIỮ NGUYÊN) -->
    
    <!-- PHẦN 11: MODALS (THÊM MODAL MỚI) -->
    
    <!-- PHẦN 12: SCRIPT (QUAN TRỌNG NHẤT - NÂNG CẤP TOÀN BỘ) -->
    <script>
        // === 1. HỆ THỐNG MÃ HÓA ===
        const ENCRYPTION_KEY = "TAXI_PROMAX_SECRET_2024_NXD";
        
        function encryptData(data) {
            return CryptoJS.AES.encrypt(JSON.stringify(data), ENCRYPTION_KEY).toString();
        }
        
        function decryptData(encrypted) {
            try {
                const bytes = CryptoJS.AES.decrypt(encrypted, ENCRYPTION_KEY);
                return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
            } catch { return null; }
        }
        
        // === 2. HỆ THỐNG GÓI CƯỚC 4 CẤP ===
        const PACKAGE_TYPES = {
            FREE_TRIAL: { name: "FREE TRIAL", days: 7, price: 0 },
            BASIC: { name: "BASIC", price: 19000, features: ["Km + Thời gian", "Offline Mode"] },
            PRO: { name: "PRO", price: 29000, features: ["Real-time Map", "PDF Export"] },
            VIP_MONTHLY: { name: "VIP 1TH", price: 49000, features: ["AI Voice Assistant", "Cloud Backup"] },
            LIFETIME: { name: "VIP TRỌN ĐỜI", price: 999000, features: ["Vĩnh viễn", "24/7 Support"] }
        };
        
        // === 3. QUẢN LÝ TRIAL 7 NGÀY ===
        function checkTrialStatus() {
            const userData = getUserData();
            if (!userData.trial_start) {
                userData.trial_start = new Date().toISOString();
                userData.package = "FREE_TRIAL";
                saveUserData(userData);
                showNotification("🎉 Bạn có 7 ngày dùng thử miễn phí!");
            } else {
                const start = new Date(userData.trial_start);
                const now = new Date();
                const diffDays = Math.floor((now - start) / (1000 * 60 * 60 * 24));
                
                if (diffDays >= 7 && userData.package === "FREE_TRIAL") {
                    lockFeatures();
                    showNotification("⏰ Trial đã hết! Vui lòng nâng cấp gói.");
                    // AI nhắc nhở
                    if (diffDays === 6) {
                        showNotification("⚠️ Trial còn 1 ngày! Sắp hết thời gian dùng thử.");
                    }
                }
            }
        }
        
        // === 4. WEBHOOK THẬT ===
        const WEBHOOK_URL = "https://taxi-promax.vercel.app/api/webhook";
        const CHECKSUM_KEY = "309f930afb5691846cd5abbbd3624d507fa8fb5d715d9da03474a711cf262fb2";
        
        async function verifyPayment(transactionId) {
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tx_id: TX_ID,
                        transaction_id: transactionId,
                        checksum: CryptoJS.SHA256(TX_ID + transactionId + CHECKSUM_KEY).toString()
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    activatePackage(result.package_type);
                    showNotification("✅ Thanh toán thành công! Gói đã được kích hoạt.");
                }
            } catch (error) {
                console.error("Webhook error:", error);
                // Fallback to local verification
                setTimeout(() => {
                    if (confirm("Hệ thống đang kiểm tra thanh toán...\nNếu đã chuyển tiền, gói sẽ tự động kích hoạt trong 1-3 phút.")) {
                        simulateWebhook();
                    }
                }, 1000);
            }
        }
        
        // === 5. GPS FIX - TỐI ƯU HƠN ===
        let gpsHistory = [];
        let lastValidPos = null;
        
        function startTracking() {
            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const { latitude, longitude, speed, accuracy } = pos.coords;
                        
                        // Chỉ chấp nhận vị trí có độ chính xác cao
                        if (accuracy > 50) return;
                        
                        const newPos = L.latLng(latitude, longitude);
                        marker.setLatLng(newPos);
                        
                        if(isRunning) {
                            map.panTo(newPos);
                            
                            // Filter GPS noise
                            if(lastValidPos && isValidMovement(lastValidPos, newPos, speed)) {
                                let d = newPos.distanceTo(lastValidPos) / 1000;
                                if(d > 0.003) { // 3 meters minimum
                                    totalKm += d;
                                    updateStats();
                                    gpsHistory.push({pos: newPos, time: Date.now()});
                                    
                                    // Giữ history 10 điểm
                                    if(gpsHistory.length > 10) gpsHistory.shift();
                                }
                            }
                            lastValidPos = newPos;
                        }
                    },
                    (err) => { 
                        console.error("GPS Error:", err);
                        showNotification("⚠️ GPS không ổn định. Vui lòng kiểm tra cài đặt vị trí.");
                    },
                    { 
                        enableHighAccuracy: true, 
                        maximumAge: 1000, 
                        timeout: 10000 
                    }
                );
            }
        }
        
        function isValidMovement(oldPos, newPos, speed) {
            // Chỉ tính khi có chuyển động thật
            const distance = oldPos.distanceTo(newPos);
            const timeDiff = 1000; // 1 second
            const calculatedSpeed = (distance / timeDiff) * 3.6; // km/h
            
            // Loại bỏ nhiễu và nhảy số
            return calculatedSpeed < 200 && (speed === null || speed < 200);
        }
        
        // === 6. AI INTEGRATION ===
        let aiEnabled = false;
        
        function initAI() {
            // Load AI module
            const aiModule = document.createElement('script');
            aiModule.src = 'ai-client.js';
            aiModule.onload = () => {
                console.log("AI Module loaded");
                // Check if user has VIP package
                const userData = getUserData();
                aiEnabled = userData.package === "VIP_MONTHLY" || userData.package === "LIFETIME";
                
                if (aiEnabled) {
                    document.getElementById('aiAvatar').style.display = 'block';
                }
            };
            document.head.appendChild(aiModule);
        }
        
        // === 7. AVATAR AI THAY ĐỔI ===
        function changeAIAvatar() {
            if (confirm("Chỉ Admin mới có thể thay đổi avatar AI. Tiếp tục?")) {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            localStorage.setItem('ai_avatar', event.target.result);
                            document.getElementById('aiAvatarImg').src = event.target.result;
                            showNotification("✅ Avatar AI đã được cập nhật!");
                        };
                        reader.readAsDataURL(file);
                    }
                };
                input.click();
            }
        }
        
        // === 8. HỆ THỐNG ADMIN ẨN ===
        // Double tap on header to show admin panel
        let tapCount = 0;
        document.querySelector('.header').addEventListener('click', () => {
            tapCount++;
            setTimeout(() => { tapCount = 0; }, 500);
            
            if (tapCount === 3) {
                showAdminPanel();
            }
        });
        
        function showAdminPanel() {
            const password = prompt("Nhập mật khẩu Admin:");
            if (password === "TAXI_ADMIN_2024") {
                // Show hidden admin controls
                alert("Chế độ Admin đã kích hoạt!");
                document.getElementById('aiAvatar').style.display = 'block';
                document.getElementById('aiAvatar').style.cursor = 'pointer';
                document.getElementById('aiAvatar').title = "Double click để đổi avatar";
                
                // Double click to change avatar
                document.getElementById('aiAvatar').addEventListener('dblclick', changeAIAvatar);
            }
        }
        
        // === 9. CẢI THIỆN UI/UX ===
        function updateUIForMobile() {
            // Auto-adjust for different screens
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
            
            // Prevent zoom on input
            document.addEventListener('touchstart', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                    document.documentElement.style.zoom = "1";
                }
            });
        }
        
        // === 10. INITIALIZATION ===
        window.onload = () => {
            // Load existing data
            loadHistory();
            checkTrialStatus();
            updateUIForMobile();
            initAI();
            
            // Auto-check payment every 5 minutes
            setInterval(() => {
                const userData = getUserData();
                if (userData.pending_payment) {
                    verifyPayment(userData.pending_payment);
                }
            }, 300000);
            
            // Show welcome modal
            setTimeout(() => {
                document.getElementById('wishModal').style.display = 'flex';
            }, 1000);
        };
        
        // === 11. UTILITY FUNCTIONS ===
        function getUserData() {
            const encrypted = localStorage.getItem('user_data');
            return encrypted ? decryptData(encrypted) : {
                tx_id: TX_ID,
                trial_start: null,
                package: null,
                payment_history: [],
                ai_avatar: null,
                pending_payment: null
            };
        }
        
        function saveUserData(data) {
            localStorage.setItem('user_data', encryptData(data));
        }
        
        function showNotification(message, duration = 5000) {
            const bar = document.getElementById('notificationBar');
            const text = document.getElementById('notificationText');
            text.textContent = message;
            bar.style.display = 'flex';
            bar.style.animation = 'slideDown 0.3s ease';
            
            if (duration > 0) {
                setTimeout(() => {
                    bar.style.animation = 'slideUp 0.3s ease';
                    setTimeout(() => bar.style.display = 'none', 300);
                }, duration);
            }
        }
        
        // Các hàm khác giữ nguyên nhưng được tối ưu...
    </script>
</body>
</html>
