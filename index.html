<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
    <div class="user-header">
        <div id="device-id-display">ID: Đang tải...</div>
        <div id="license-badge" class="badge-vip">GÓI: FREE</div>
    </div>

    <div class="meter-section">
        <div style="position: absolute; top: 80px; left: 20px; z-index: 100;">
            <button onclick="TaxiApp.setCustomPrice()" style="width: 80px; height: 80px; border-radius: 20px; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: #d63031; font-size: 11px; font-weight: bold; border: 2px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.2); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <span style="font-size: 20px;">⚙️</span>
                CÀI ĐẶT<br>GIÁ CẢ
            </button>
        </div>

        <div class="fare-circle">
            <h1 id="display-fare">0 VNĐ</h1>
            <span id="display-km">0.00 Km</span>
            <span id="display-time" style="font-size: 14px; color: #bdc3c7;">00:00</span>
            <div id="trip-status" style="font-size: 11px; color: #7f8c8d; margin-top: 5px; font-weight: bold;">SẴN SÀNG</div>
        </div>

        <div class="btn-group">
            <button class="btn-start" onclick="TaxiApp.start()">
                <span>▶</span> BẮT ĐẦU CHUYẾN
            </button>
            <button class="btn-stop" onclick="TaxiApp.stop()">
                <span>■</span> KẾT THÚC
            </button>
        </div>
    </div>

    <div class="bottom-menu">
        <div class="menu-item" style="color: var(--primary)">
            <span>🏠</span> Trang chủ
        </div>
        <div class="menu-item" onclick="window.location.href='payment.html'">
            <span>💰</span> Nạp tiền
        </div>
        <div class="menu-item" onclick="alert('Lịch sử sẽ sớm cập nhật!')">
            <span>📊</span> Lịch sử
        </div>
        <div class="menu-item" onclick="window.location.href='admin.html'">
            <span>⚙️</span> Quản lý
        </div>
    </div>

    <div class="copyright">PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
</div>

<script src="js/config.js"></script>
<script src="js/security.js"></script>
<script src="js/app.js"></script>
<script>
    // Tự động hiển thị ID máy khi mở App
    window.onload = () => {
        const id = Security.getDeviceID();
        document.getElementById('device-id-display').innerText = "ID: " + id;
        
        const license = Security.getLicense();
        const badge = document.getElementById('license-badge');
        badge.innerText = "GÓI: " + license.type;
        if(license.type !== 'FREE') badge.style.background = '#f1c40f';
    };
</script>

</body>
</html>
