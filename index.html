<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TAXI PROMAX - SUPER ADMIN</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #00bfa5; --dark: #002d26; --gold: #ffc107; --danger: #ff5252; --bg: #f8faf9; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: var(--bg); overflow: hidden; position: fixed; width: 100%; }
        
        /* Fix lỗi bản đồ bị lấp */
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; } 

        /* Header gọn gàng hơn */
        .header { position: fixed; top: env(safe-area-inset-top, 10px); left: 10px; right: 10px; display: flex; gap: 5px; z-index: 1000; }
        .badge { flex: 1; background: rgba(0, 45, 38, 0.9); color: var(--gold); padding: 6px 10px; border-radius: 12px; font-size: 10px; font-weight: 800; border: 1px solid var(--gold); text-align: center; backdrop-filter: blur(5px); } 

        /* Stats Bar tách biệt */
        .stats-bar { position: fixed; top: calc(env(safe-area-inset-top, 10px) + 40px); left: 15px; right: 15px; background: white; border-radius: 15px; display: flex; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 1000; }
        .stat-item { flex: 1; text-align: center; border-right: 1px solid #eee; }
        .stat-label { font-size: 8px; color: #7f8c8d; font-weight: 800; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: 900; color: var(--dark); } 

        /* Footer Panel chống tràn */
        .footer-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; z-index: 2000; border-radius: 20px 20px 0 0; padding: 15px 15px calc(env(safe-area-inset-bottom, 5px) + 10px); box-shadow: 0 -5px 20px rgba(0,0,0,0.1); }
        .btn-main { width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--primary); color: white; font-size: 16px; font-weight: 900; margin-top: 10px; }
        
        .nav-grid { display: flex; justify-content: space-around; margin-top: 15px; }
        .nav-item { border: none; background: none; color: #bdc3c7; font-size: 9px; font-weight: 700; flex: 1; text-align: center; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { display: block; font-size: 18px; margin-bottom: 3px; }

        /* Sửa lỗi các Tab nội dung */
        .tab-content { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1500; display: none; flex-direction: column; padding-top: 60px; overflow-y: auto; }
        
        /* Nút chỉnh giá gọn hơn */
        .price-control { display: flex; justify-content: space-between; align-items: center; background: #f0fbfc; padding: 8px 12px; border-radius: 10px; margin-bottom: 5px; }
    </style>
</head>
<body oncontextmenu="return false;"> 

    <div class="header">
        <div class="badge" id="idShow">🆔 ADMIN: ĐẠT PRO</div>
        <div class="badge" id="planShow">⭐ QUYỀN HẠN TỐI CAO</div>
    </div> 

    <div class="stats-bar">
        <div class="stat-item"><div class="stat-label">DOANH THU</div><div id="cost" class="stat-value">0</div></div>
        <div class="stat-item" style="border:none"><div class="stat-label">TỔNG KM</div><div id="km" class="stat-value">0.00</div></div>
    </div> 

    <div id="map"></div> 

    <div id="tab-vi" class="tab-content"><h2 style="text-align:center">VÍ KHÁCH HÀNG</h2></div>
    <div id="tab-lichsu" class="tab-content"><h2 style="text-align:center">LỊCH SỬ HỆ THỐNG</h2><div id="historyList"></div></div> 
    <div id="tab-toi" class="tab-content">
        <h2 style="text-align:center">ADMIN CONTROL</h2>
        <div style="padding:20px;">
            <button class="btn-main" style="background:var(--dark); color:var(--gold)" onclick="alert('Mở cấu hình...')">CẤU HÌNH HỆ THỐNG</button>
        </div>
    </div>

    <div class="footer-panel">
        <div id="homeControls">
            <div class="price-control">
                <span style="font-size:11px; font-weight:bold">GIÁ/KM</span>
                <span style="color:var(--danger); font-weight:900"><span id="rateLabel">15,000</span>đ</span>
            </div>
            <input type="range" min="10000" max="50000" step="1000" value="15000" style="width:100%" oninput="updateRate(this.value)">
            <button id="mainBtn" class="btn-main" onclick="handleTrip()">BẮT ĐẦU GIÁM SÁT</button>
        </div> 
        <div class="nav-grid">
            <button class="nav-item active" onclick="showTab('home', this)"><i>🏠</i>Bản đồ</button>
            <button class="nav-item" onclick="showTab('vi', this)"><i>💰</i>Ví khách</button>
            <button class="nav-item" onclick="showTab('lichsu', this)"><i>📊</i>Lịch sử</button>
            <button class="nav-item" onclick="showTab('toi', this)"><i>👤</i>Admin</button>
        </div>
    </div> 

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="map-engine.js"></script>
    <script src="ui-control.js"></script>
    <script src="tracking.js"></script>
    
    <script>
        // Đặc quyền vĩnh viễn
        localStorage.setItem('install_date', Date.now() + 1000000000); 
    </script>
</body>
</html>
