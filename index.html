<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/744/744465.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/744/744465.png"> 

    <title>TAXI PROMAX</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        :root { --primary: #00bfa5; --dark: #002d26; --gold: #ffc107; --danger: #ff5252; --bg: #f8faf9; --glass: rgba(255, 255, 255, 0.95); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            overflow: hidden; background: var(--bg);
            position: fixed; width: 100%;
        }

        #map { height: 100vh; width: 100vw; z-index: 1; filter: contrast(1.05) saturate(1.1); } 

        .header { 
            position: fixed; 
            top: env(safe-area-inset-top, 10px); 
            left: 10px; right: 10px; 
            display: flex; justify-content: space-between; 
            z-index: 1000; pointer-events: none; 
        }
        .badge { pointer-events: auto; background: var(--glass); padding: 8px 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 11px; font-weight: 800; color: var(--dark); border: 1px solid white; } 

        .stats-bar { 
            position: fixed; 
            top: calc(env(safe-area-inset-top, 10px) + 45px); 
            left: 10px; right: 10px; 
            background: var(--glass); border-radius: 15px; 
            display: flex; padding: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            z-index: 1000; border: 1px solid white; 
        }
        .stat-item { flex: 1; text-align: center; }
        .stat-label { font-size: 9px; color: #7f8c8d; font-weight: 800; text-transform: uppercase; }
        .stat-value { font-size: 22px; font-weight: 900; color: var(--dark); margin-top: 2px; } 

        /* CSS CHO KHUNG CHAT AI VOICE MỚI */
        .ai-chat-panel {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid #eee;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #chat-content {
            height: 80px;
            overflow-y: auto;
            padding: 10px;
            font-size: 12px;
            color: var(--dark);
            border-bottom: 1px solid #f0f0f0;
        }
        .ai-input-group {
            display: flex;
            align-items: center;
            padding: 5px 10px;
        }
        #ai-input {
            flex: 1;
            border: none;
            background: none;
            font-size: 13px;
            padding: 8px;
        }
        #mic-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 18px;
            padding: 5px 10px;
            cursor: pointer;
        }
        .mic-active { color: var(--danger) !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .footer-panel { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: white; z-index: 2000; 
            border-radius: 25px 25px 0 0; 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.08); 
            padding: 15px 15px calc(env(safe-area-inset-bottom, 5px) + 5px); 
        }

        .nav-grid { display: flex; justify-content: space-around; margin-top: 10px; padding-top: 8px; border-top: 1px solid #eee; }
        .nav-item { border: none; background: none; color: #bdc3c7; font-size: 10px; font-weight: 700; text-align: center; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 2px; } 
        
        .tab-content { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 115px); background: #fdfdfd; z-index: 1500; display: none; flex-direction: column; overflow-y: auto; padding-bottom: 30px; }
        .p-header { background: var(--primary); color: white; padding: 25px 20px; text-align: center; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; } 
        
        .btn-main { width: 100%; padding: 15px; border-radius: 15px; border: none; background: var(--primary); color: white; font-size: 18px; font-weight: 900; box-shadow: 0 6px 20px rgba(0,191,165,0.3); }
        input[type="range"] { width: 100%; margin-bottom: 12px; accent-color: var(--primary); }
        .custom-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; width: 85%; max-width: 320px; padding: 25px; border-radius: 25px; text-align: center; }
        .brand-footer { font-size: 9px; text-align: center; color: #bdc3c7; padding-top: 5px; font-weight: bold; }
    </style>
</head>
<body oncontextmenu="return false;"> 

    <div class="header">
        <div class="badge" id="idShow">🆔 ĐANG QUÉT...</div>
        <div class="badge" style="color:var(--gold)" id="planShow">⭐ GÓI: FREE (7D)</div>
    </div> 

    <div class="stats-bar" id="statsUI">
        <div class="stat-item" style="border-right: 1px solid #eee;">
            <div class="stat-label">CƯỚC (VNĐ)</div>
            <div id="cost" class="stat-value">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">KHOẢNG CÁCH (KM)</div>
            <div id="km" class="stat-value">0.00</div>
        </div>
    </div> 

    <div id="map"></div> 

    <div id="tab-vi" class="tab-content">
        <div class="p-header"><div style="font-size: 20px; font-weight: 800;">HỆ THỐNG GÓI CƯỚC</div></div>
        <div style="padding: 15px;" id="packageList">
            </div>
    </div> 

    <div id="tab-lichsu" class="tab-content">
        <div class="p-header">LỊCH SỬ CHUYẾN ĐI</div>
        <div id="historyList"></div>
    </div> 

    <div class="footer-panel">
        <div id="homeControls">
            <div class="ai-chat-panel">
                <div id="chat-content">
                    <div style="color: var(--primary); font-weight: 800;">AI: Chào anh Đạt! Nhấn Mic để ra lệnh.</div>
                </div>
                <div class="ai-input-group">
                    <button id="mic-btn" onclick="startVoice()"><i class="fas fa-microphone"></i></button>
                    <input type="text" id="ai-input" placeholder="Hỏi về giá, lộ trình..." onkeypress="if(event.key==='Enter') chatWithAI()">
                    <button onclick="chatWithAI()" style="border:none; background:none; color:var(--primary); font-weight:800;">GỬI</button>
                </div>
            </div>

            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:12px; font-weight:800;">
                <span>GIÁ/KM</span>
                <span style="color:var(--danger)"><span id="rateLabel">15,000</span>đ</span>
            </div>
            <input type="range" min="10000" max="50000" step="1000" value="15000" oninput="updateRate(this.value)">
            <button id="mainBtn" class="btn-main" onclick="handleTrip()">BẮT ĐẦU CHUYẾN ĐI</button>
        </div> 

        <div class="nav-grid">
            <button class="nav-item active" onclick="showTab('home', this)"><i>🏠</i>Trang chủ</button>
            <button class="nav-item" onclick="showTab('vi', this)"><i>💰</i>Ví tiền</button>
            <button class="nav-item" onclick="showTab('lichsu', this)"><i>📊</i>Lịch sử</button>
            <button class="nav-item" onclick="showTab('toi', this)"><i>👤</i>Tôi</button>
        </div>
        <div class="brand-footer">PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
    </div> 

    <div id="wishModal" class="custom-modal"><div class="modal-content"><h3>THƯỢNG LỘ BÌNH AN!</h3><button class="btn-main" onclick="closeModal('wishModal')">ĐỒNG Ý</button></div></div>
    <div id="endModal" class="custom-modal"><div class="modal-content"><h3>HOÀN THÀNH!</h3><div id="endSummary"></div><button class="btn-main" onclick="closeModal('endModal')">XÁC NHẬN</button></div></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="map-engine.js"></script>
    <script src="ui-control.js"></script>
    <script src="ai-module/ai-client.js"></script>
    
    <script>
        document.addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }, { once: true });
        
        function showTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            if(tabId !== 'home') document.getElementById('tab-' + tabId).style.display = 'flex';
            btn.classList.add('active');
        }
    </script>
</body>
</html>
