<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Cấu trúc nút cài đặt hồng của anh */
        .price-setting-container { position: absolute; top: 20px; left: 15px; z-index: 100; text-align: center; }
        .btn-price-setting {
            width: 75px; height: 75px; border-radius: 18px;
            background: linear-gradient(135deg, #FF9a9e 0%, #fecfef 100%);
            border: 2px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer;
        }
        
        /* Hiển thị tiền chống tràn (Fix lỗi ảnh 18:04) */
        .fare-row { display: flex; align-items: baseline; justify-content: center; width: 100%; }
        #display-fare { 
            font-size: 55px; color: #2ecc71; font-weight: 900; margin: 0; 
            transition: all 0.2s ease; white-space: nowrap; 
        }
        .vnd-unit { font-size: 28px; color: #2ecc71; font-weight: 900; margin-left: 5px; }

        /* Nút bấm theo trạng thái */
        .btn-start.active { background: #1b5e20 !important; }
        .btn-stop.active { background: #e74c3c !important; color: white !important; }

        /* Overlay thanh trượt giá */
        .slider-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .slider-card { background: white; padding: 25px; border-radius: 25px; width: 85%; text-align: center; }
    </style>
</head>
<body>

<div id="app">
    <div class="user-header">
        <div id="device-id-display">ID: Đang tải...</div>
        <div id="license-badge" class="badge-vip">GÓI: FREE</div>
    </div>

    <div class="meter-section" style="position: relative;">
        <div class="price-setting-container" id="config-box">
            <div class="btn-price-setting" onclick="showSlider()">
                <span style="font-size: 10px; color: #d63031; font-weight: bold;">⚙️ CÀI ĐẶT</span>
                <span style="font-size: 11px; color: #d63031; font-weight: 900;" id="current-price-label">15K/KM</span>
            </div>
        </div>

        <div class="fare-circle">
            <div class="fare-row">
                <h1 id="display-fare">0</h1>
                <span class="vnd-unit">VNĐ</span>
            </div>
            <span id="display-km">0.00 Km</span>
            <span id="display-time" style="font-size: 14px; color: #bdc3c7;">00:00</span>
            <div id="trip-status" style="font-size: 11px; color: #e84393; margin-top: 5px; font-weight: bold;">CHỜ THỎA THUẬN</div>
        </div>

        <div class="btn-group">
            <button id="btnStart" class="btn-start" onclick="handleStart()">▶ BẮT ĐẦU CHUYẾN</button>
            <button id="btnStop" class="btn-stop" onclick="handleStop()">■ KẾT THÚC</button>
        </div>
    </div>

    <div id="slider-overlay" class="slider-overlay">
        <div class="slider-card">
            <h3>Giá thỏa thuận (VNĐ/Km)</h3>
            <div style="font-size: 24px; font-weight: bold; color: #e84393;" id="val-preview">15.000 VNĐ</div>
            <input type="range" min="10" max="100" value="15" id="price-range" style="width:100%; margin:20px 0;" oninput="updatePreview(this.value)">
            <button class="btn-confirm" onclick="applyPrice()" style="background:#27ae60; color:white; border:none; padding:12px 25px; border-radius:15px; font-weight:bold;">XÁC NHẬN</button>
            <p style="color:#e74c3c; margin-top:15px; cursor:pointer;" onclick="hideSlider()">Hủy bỏ</p>
        </div>
    </div>

    <div class="bottom-menu">
        <div class="menu-item" style="color: #2ecc71" onclick="location.reload()"><span>🏠</span> Trang chủ</div>
        <div class="menu-item" onclick="window.location.href='payment.html'"><span>💰</span> Nạp tiền</div>
        <div class="menu-item" onclick="window.location.href='history.html'"><span>📊</span> Lịch sử</div>
        <div class="menu-item" onclick="window.location.href='admin.html'"><span>⚙️</span> Quản lý</div>
    </div>
    <div class="copyright">PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
</div>

<script src="js/config.js"></script>
<script src="js/security.js"></script>
<script src="js/app.js"></script>
<script>
    let kmPrice = 15000, totalDistance = 0, watchId = null, lastLocation = null;

    function showSlider() { document.getElementById('slider-overlay').style.display = 'flex'; }
    function hideSlider() { document.getElementById('slider-overlay').style.display = 'none'; }
    function updatePreview(v) { document.getElementById('val-preview').innerText = (v*1000).toLocaleString() + " VNĐ"; }
    
    function applyPrice() {
        let v = document.getElementById('price-range').value;
        kmPrice = v * 1000;
        document.getElementById('current-price-label').innerText = v + "K/KM";
        document.getElementById('display-fare').innerText = "0";
        document.getElementById('trip-status').innerText = "ĐÃ CHỐT GIÁ";
        hideSlider();
    }

    function handleStart() {
        if (!navigator.geolocation) return alert("Vui lòng bật GPS!");
        document.getElementById('btnStart').classList.add('active');
        document.getElementById('btnStop').classList.remove('active');
        document.getElementById('config-box').style.visibility = 'hidden';
        document.getElementById('trip-status').innerText = "ĐANG CHUYỂN BÁNH";

        watchId = navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            if (accuracy < 60) {
                if (lastLocation) {
                    const d = calcDist(lastLocation.lat, lastLocation.lon, latitude, longitude);
                    if (d > 0.002) { totalDistance += d; updateUI(); }
                }
                lastLocation = { lat: latitude, lon: longitude };
            }
        }, null, { enableHighAccuracy: true });
    }

    function updateUI() {
        document.getElementById('display-km').innerText = totalDistance.toFixed(2) + " Km";
        let money = Math.round(totalDistance * kmPrice);
        let fareEl = document.getElementById('display-fare');
        let sMoney = money.toLocaleString('vi-VN');
        
        // CHỐNG TRÀN CHỮ
        if (sMoney.length > 7) fareEl.style.fontSize = "38px";
        else if (sMoney.length > 5) fareEl.style.fontSize = "48px";
        else fareEl.style.fontSize = "55px";
        
        fareEl.innerText = sMoney;
    }

    function handleStop() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        document.getElementById('btnStop').classList.add('active');
        document.getElementById('btnStart').classList.remove('active');
        document.getElementById('config-box').style.visibility = 'visible';
        document.getElementById('trip-status').innerText = "HOÀN THÀNH";
        lastLocation = null;
    }

    function calcDist(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2-lat1)*Math.PI/180;
        const dLon = (lon2-lon1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    window.onload = () => {
        if (typeof Security !== 'undefined') {
            document.getElementById('device-id-display').innerText = "ID: " + Security.getDeviceID();
            document.getElementById('license-badge').innerText = "GÓI: " + (Security.getLicense().type || "FREE");
        }
    };
</script>
</body>
</html>
