<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TAXI PROMAX TÀI XẾ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/main.css">
</head>
<body oncontextmenu="return false;"> 

    <div class="header">
        <div class="badge" id="idShow">🆔 ĐANG QUÉT...</div>
        <div class="badge" style="color:var(--gold)" id="planShow">⭐ ĐANG ĐỒNG BỘ GÓI...</div>
    </div> 

    <div class="stats-bar" id="statsUI">
        <div class="stat-item" style="border-right: 1px solid #eee;">
            <div class="stat-label">CƯỚC (VNĐ)</div>
            <div id="cost" class="stat-value">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">KHOẢNG CÁCH (KM)</div>
            <div id="km" class="stat-value">0.00</div>
        </div>
    </div> 

    <div id="map"></div> 

    <div id="tab-vi" class="tab-content" style="display:none;">
        <div class="p-header">
            <div style="font-size: 20px; font-weight: 800;">HỆ THỐNG GÓI CƯỚC</div>
        </div>
        <div class="p-grid">
            <div class="p-card" onclick="tpHandlePayment(0, 'TRIAL 7D')"><b>TRẢI NGHIỆM</b><span>0đ</span><div class="p-btn">KÍCH HOẠT</div></div>
            <div class="p-card" onclick="tpHandlePayment(5000, 'LẺ')"><b>CHUYẾN LẺ</b><span>5.000đ</span><div class="p-btn">NẠP NGAY</div></div>
        </div>
    </div> 

    <div id="tab-lichsu" class="tab-content" style="display:none;">
        <div class="p-header">LỊCH SỬ CHUYẾN ĐI</div>
        <div id="historyList"></div>
    </div> 

    <div id="tab-toi" class="tab-content" style="display:none;">
        <div class="p-header">THIẾT LẬP</div>
        <div style="padding:20px;">
            <p>Mã tài xế: <b id="profileID">...</b></p>
            <button class="btn-main" onclick="localStorage.removeItem('trip_history'); location.reload();">XÓA LỊCH SỬ</button>
        </div>
    </div> 

    <div class="footer-panel">
        <div id="homeControls">
            <button id="mainBtn" class="btn-main" onclick="handleTrip()">BẮT ĐẦU CHUYẾN ĐI</button>
        </div> 
        <div class="nav-grid">
            <button class="nav-item active" onclick="showTab('home', this)">Trang chủ</button>
            <button class="nav-item" onclick="showTab('vi', this)">Ví tiền</button>
            <button class="nav-item" onclick="showTab('lichsu', this)">Lịch sử</button>
            <button class="nav-item" onclick="showTab('toi', this)">Tôi</button>
        </div>
    </div> 

    <div id="orderModal" class="custom-modal" style="display:none;">...</div>
    <div id="wishModal" class="custom-modal" style="display:none;">...</div>
    <div id="endModal" class="custom-modal" style="display:none;">...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/payment.js"></script>
    <script src="js/map.js"></script>
    
    <script>
        const FIREBASE_BASE_URL = "https://taxipromax-new-default-rtdb.asia-southeast1.firebasedatabase.app";
        const TX_ID = localStorage.getItem('tx_id') || 'PRO-' + Math.random().toString(36).substr(2, 5).toUpperCase();
        localStorage.setItem('tx_id', TX_ID);
        document.getElementById('idShow').innerText = "🆔 " + TX_ID;
        document.getElementById('profileID').innerText = TX_ID;

        // Code khởi tạo bắt buộc
        window.onload = () => { 
            if(typeof startTracking === 'function') startTracking();
            if(typeof renderHistory === 'function') renderHistory();
            if(typeof tpInitCountdown === 'function') tpInitCountdown();
        };
    </script>
</body>
</html>
