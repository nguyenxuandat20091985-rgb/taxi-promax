<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi ProMax v5.1 - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <h2>TAXI PROMAX</h2>
            <p>Hệ thống quản lý taxi</p>
        </div>
        <div class="menu">
            <div class="menu-item active" onclick="switchTab('dashboard')">
                <i class="fas fa-tachometer-alt"></i><span> Dashboard</span>
            </div>
            <div class="menu-item" onclick="switchTab('booking')">
                <i class="fas fa-car"></i><span> Đặt xe</span>
            </div>
            <div class="menu-item" onclick="switchTab('payment')">
                <i class="fas fa-credit-card"></i><span> Thanh toán</span>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div id="tab-dashboard" class="tab-content">
            <div class="header">
                <h1>Dashboard Tổng Quan</h1>
                <p id="date-display">Đang tải...</p>
            </div>
            <div class="dashboard-stats">
                <div class="stat-card blue">
                    <div class="stat-value">1,247 Km</div>
                    <div class="stat-label">Quãng đường</div>
                </div>
                <div class="stat-card yellow">
                    <div class="stat-value">24.5 Triệu</div>
                    <div class="stat-label">Doanh thu</div>
                </div>
            </div>
        </div>

        <div id="tab-booking" class="tab-content" style="display:none;">
            <h1>Đặt xe Demo</h1>
            <p>Chức năng đang khởi tạo GPS...</p>
        </div>

        <div id="tab-payment" class="tab-content" style="display:none;">
            <h1>Thanh toán</h1>
            <p>BIDV: 000123456789 (Demo)</p>
        </div>
    </div>

    <script>
        // Hàm này giúp anh bấm menu là nó chuyển trang ngay
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');
            document.getElementById('tab-' + tabId).style.display = 'block';
            
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
        
        // Hiện giờ thực tế
        setInterval(() => {
            document.getElementById('date-display').innerText = "Hôm nay: " + new Date().toLocaleString('vi-VN');
        }, 1000);
    </script>
</body>
</html>
