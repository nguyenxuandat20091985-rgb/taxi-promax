<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - NGUYEN XUAN DAT</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
    <div class="user-header">
        <span>ID: <b id="dev-id" style="color: #f1c40f;">Đang tải...</b></span>
        <span class="badge-vip" id="user-tier">Gói: VIP</span>
    </div>

    <div class="meter-section">
        <div class="fare-circle">
            <h1 id="display-fare">0 VNĐ</h1>
            <span id="display-km">0.00 Km</span>
            <div id="display-time" style="font-size: 14px; color: #95a5a6; margin-top: 5px;">00:00</div>
        </div>
        
        <div class="btn-group">
            <button class="btn-start" onclick="TaxiApp.start()">
                <span>▶</span> BẮT ĐẦU CHUYẾN
            </button>
            <button class="btn-stop" onclick="TaxiApp.stop()">
                <span>■</span> KẾT THÚC
            </button>
        </div>
    </div>

    <div class="bottom-menu">
        <div class="menu-item" onclick="location.reload()">🏠<br>Trang chủ</div>
        <div class="menu-item" onclick="location.href='payment.html'">💰<br>Nạp tiền</div>
        <div class="menu-item" onclick="alert('Tính năng đang phát triển cho gói VIP')">📊<br>Lịch sử</div>
        <div class="menu-item" onclick="location.href='admin.html'">⚙️<br>Quản lý</div>
    </div>

    <div class="copyright">PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
</div>

<script src="js/config.js"></script>
<script src="js/security.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>

<script>
    // Khởi tạo thông tin khi App vừa mở
    window.onload = () => {
        // Hiển thị Device ID từ file security.js
        if (window.DEVICE_ID) {
            document.getElementById('dev-id').innerText = window.DEVICE_ID;
        }
        
        // Kiểm tra và hiển thị gói cước hiện tại
        const license = Security.getLicense();
        document.getElementById('user-tier').innerText = 'Gói: ' + license.name;
        
        // Đăng ký Service Worker để chạy Offline (nếu đã có file sw.js)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
            .then(() => console.log("Taxi ProMax đã sẵn sàng chạy Offline!"));
        }
    };
</script>

</body>
</html>
