<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TAXI PROMAX - SUPER ADMIN</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #00bfa5; --dark: #002d26; --gold: #ffc107; --danger: #ff5252; --bg: #f8faf9; --glass: rgba(255, 255, 255, 0.95); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; background: var(--bg); position: fixed; width: 100%; }
        #map { height: 100vh; width: 100vw; z-index: 1; filter: contrast(1.05) saturate(1.1); } 

        /* HEADER ADMIN */
        .header { position: fixed; top: env(safe-area-inset-top, 10px); left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 1000; pointer-events: none; }
        .badge { pointer-events: auto; background: var(--dark); color: var(--gold); padding: 8px 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 11px; font-weight: 800; border: 1px solid var(--gold); } 

        .stats-bar { position: fixed; top: calc(env(safe-area-inset-top, 10px) + 45px); left: 10px; right: 10px; background: var(--glass); border-radius: 15px; display: flex; padding: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); z-index: 1000; border: 1px solid white; }
        .stat-item { flex: 1; text-align: center; }
        .stat-label { font-size: 9px; color: #7f8c8d; font-weight: 800; text-transform: uppercase; }
        .stat-value { font-size: 22px; font-weight: 900; color: var(--dark); margin-top: 2px; } 

        .footer-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; z-index: 2000; border-radius: 25px 25px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.08); padding: 15px 15px calc(env(safe-area-inset-bottom, 5px) + 5px); }
        .nav-grid { display: flex; justify-content: space-around; margin-top: 10px; padding-top: 8px; border-top: 1px solid #eee; }
        .nav-item { border: none; background: none; color: #bdc3c7; font-size: 10px; font-weight: 700; text-align: center; flex: 1; }
        .nav-item.active { color: var(--primary); }
        
        .tab-content { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 115px); background: #fdfdfd; z-index: 1500; display: none; flex-direction: column; overflow-y: auto; padding-bottom: 30px; }
        .p-header { background: var(--dark); color: var(--gold); padding: 25px 20px; text-align: center; border-bottom: 3px solid var(--gold); } 
        
        .btn-main { width: 100%; padding: 15px; border-radius: 15px; border: none; background: var(--primary); color: white; font-size: 18px; font-weight: 900; box-shadow: 0 6px 20px rgba(0,191,165,0.3); }
        .btn-admin-special { background: var(--dark); color: var(--gold); border: 1px solid var(--gold); margin-top: 15px; }

        /* AI CHAT BOX */
        #ai-wrapper { position: fixed; bottom: 120px; right: 15px; z-index: 999999; display: flex; flex-direction: column; align-items: flex-end; }
        #ai-root { width: 80px; height: 80px; border-radius: 50%; background: url('https://raw.githubusercontent.com/nguyenxuandat20091985-rgb/taxi-promax/main/CC_20260130_193050.png') no-repeat center; background-size: cover; border: 3px solid var(--gold); box-shadow: 0 0 15px var(--gold); cursor: pointer; }
        #ai-chat-box { width: 300px; max-width: 80vw; background: #fff; border-radius: 20px; margin-bottom: 12px; display: none; flex-direction: column; border: 1px solid var(--gold); overflow: hidden; }
        .ai-header { background: var(--dark); color: var(--gold); padding: 12px; text-align: center; font-weight: 800; }
        #ai-content { max-height: 250px; min-height: 100px; overflow-y: auto; padding: 15px; background: #f9f9f9; }
        .ai-input-area { display: flex; padding: 10px; background: #fff; border-top: 1px solid #eee; }
        #ai-txt { flex: 1; border: 1px solid #ddd; outline: none; padding: 8px 15px; border-radius: 20px; }
    </style>
</head>
<body oncontextmenu="return false;"> 

    <div class="header">
        <div class="badge" id="idShow">🆔 ADMIN: NGUYỄN XUÂN ĐẠT</div>
        <div class="badge" id="planShow">⭐ QUYỀN HẠN TỐI CAO</div>
    </div> 

    <div class="stats-bar" id="statsUI">
        <div class="stat-item" style="border-right: 1px solid #eee;"><div class="stat-label">DOANH THU</div><div id="cost" class="stat-value">0</div></div>
        <div class="stat-item"><div class="stat-label">TỔNG KM</div><div id="km" class="stat-value">0.00</div></div>
    </div> 

    <div id="map"></div> 

    <div id="tab-vi" class="tab-content">
        <div class="p-header">HỆ THỐNG GÓI CƯỚC (XEM TRƯỚC)</div>
        <div style="padding: 20px; text-align: center;">
            <p>Đây là giao diện khách hàng sẽ thấy.</p>
            <div style="border: 1px dashed #ccc; padding: 10px; border-radius: 10px;">
                <img id="qrImg" style="width:150px;" src="">
                <p id="qrContent" style="font-weight:bold; color:red;"></p>
            </div>
        </div>
    </div> 

    <div id="tab-lichsu" class="tab-content"><div class="p-header">LỊCH SỬ HỆ THỐNG</div><div id="historyList"></div></div> 

    <div id="tab-toi" class="tab-content">
        <div class="p-header">QUẢN TRỊ VIÊN</div>
        <div style="padding:20px;">
            <div style="background:white; padding:20px; border-radius:20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
                <p>ID Quản trị: <b id="profileID">...</b></p>
                <p>Phiên bản: <b>Platinum v2.0</b></p>
                <hr>
                <button class="btn-main" onclick="alert('Quét tài xế xung quanh...')">QUÉT TÀI XẾ LIVE</button>
                <button class="btn-main btn-admin-special" onclick="alert('Mở Terminal...')">CẤU HÌNH SÂU</button>
            </div>
        </div>
    </div> 

    <div class="footer-panel">
        <div id="homeControls">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:12px; font-weight:800;">
                <span>GIÁ ĐIỀU TIẾT/KM</span><span style="color:var(--danger)"><span id="rateLabel">15,000</span>đ</span>
            </div>
            <input type="range" min="10000" max="50000" step="1000" value="15000" oninput="updateRate(this.value)">
            <button id="mainBtn" class="btn-main" onclick="handleTrip()">BẮT ĐẦU GIÁM SÁT</button>
        </div> 
        <div class="nav-grid">
            <button class="nav-item active" onclick="showTab('home', this)"><i>🏠</i>Bản đồ</button>
            <button class="nav-item" onclick="showTab('vi', this)"><i>💰</i>Ví khách</button>
            <button class="nav-item" onclick="showTab('lichsu', this)"><i>📊</i>Lịch sử</button>
            <button class="nav-item" onclick="showTab('toi', this)"><i>👤</i>Admin</button>
        </div>
        <div class="brand-footer">HỆ THỐNG QUẢN TRỊ - ĐỘC QUYỀN ĐẠT PRO</div>
    </div> 

    <div id="ai-wrapper">
        <div id="ai-chat-box">
            <div class="ai-header">🌿 TRỢ LÝ CHỦ TỊCH ĐẠT</div>
            <div id="ai-content"></div>
            <div class="ai-input-area"><input type="text" id="ai-txt" placeholder="Lệnh của anh là gì?"><button id="ai-send">🚀</button></div>
        </div>
        <div id="ai-root"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="map-engine.js"></script>
    <script src="ui-control.js"></script>
    <script src="tracking.js"></script>
    
    <script>
        // ĐẶC QUYỀN ADMIN: Luôn reset ngày cài đặt để không bao giờ bị khóa 7 ngày
        localStorage.setItem('install_date', Date.now() + 1000000000); 
        
        // Logic AI chào Chủ tịch
        const root = document.getElementById('ai-root'), chat = document.getElementById('ai-chat-box'), content = document.getElementById('ai-content');
        root.onclick = () => { 
            chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
            if(content.innerHTML === "") {
                const d = document.createElement('div');
                d.style.cssText = "background:#eee; padding:10px; border-radius:10px; font-size:13px;";
                d.innerText = "Chào Chủ tịch Đạt! Hệ thống đang vận hành ổn định. Anh có lệnh gì không?";
                content.appendChild(d);
            }
        };
    </script>
</body>
</html>
