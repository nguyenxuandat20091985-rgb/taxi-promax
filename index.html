<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Sửa lỗi lệch nút và tạo thanh trượt */
        .price-setting-container {
            position: absolute;
            top: 20px;
            left: 15px;
            z-index: 100;
            text-align: center;
        }
        .btn-price-setting {
            width: 75px;
            height: 75px;
            border-radius: 18px;
            background: linear-gradient(135deg, #FF9a9e 0%, #fecfef 100%);
            border: 2px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .btn-text-top { font-size: 10px; color: #d63031; font-weight: bold; margin-bottom: 2px; }
        .btn-text-bottom { font-size: 11px; color: #d63031; font-weight: 900; }
        
        /* Giao diện thanh trượt (Range Slider) */
        .slider-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .slider-card {
            background: white;
            padding: 25px;
            border-radius: 25px;
            width: 85%;
            text-align: center;
        }
        .price-slider {
            width: 100%;
            margin: 25px 0;
            height: 10px;
            border-radius: 5px;
            background: #dfe6e9;
            outline: none;
        }
        .current-val { font-size: 24px; font-weight: bold; color: #e84393; }
        .btn-confirm {
            background: #27ae60; color: white; border: none;
            padding: 10px 30px; border-radius: 15px; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="user-header">
        <div id="device-id-display">ID: Đang tải...</div>
        <div id="license-badge" class="badge-vip">GÓI: FREE</div>
    </div>

    <div class="meter-section" style="position: relative;">
        <div class="price-setting-container">
            <div class="btn-price-setting" onclick="showPriceSlider()">
                <span class="btn-text-top">⚙️ CÀI ĐẶT</span>
                <span class="btn-text-bottom">GIÁ CẢ</span>
            </div>
        </div>

        <div class="fare-circle">
            <h1 id="display-fare">0 VNĐ</h1>
            <span id="display-km">0.00 Km</span>
            <span id="display-time" style="font-size: 14px; color: #bdc3c7;">00:00</span>
            <div id="trip-status" style="font-size: 11px; color: #7f8c8d; margin-top: 5px; font-weight: bold;">CHỜ THỎA THUẬN</div>
        </div>

        <div class="btn-group">
            <button class="btn-start" onclick="TaxiApp.start()">▶ BẮT ĐẦU CHUYẾN</button>
            <button class="btn-stop" onclick="TaxiApp.stop()">■ KẾT THÚC</button>
        </div>
    </div>

    <div id="slider-overlay" class="slider-overlay">
        <div class="slider-card">
            <h3>Chọn giá thỏa thuận</h3>
            <div class="current-val" id="slider-val">20.000 VNĐ</div>
            <input type="range" min="10" max="50" step="5" value="15" class="price-slider" id="price-range" oninput="updateSliderText(this.value)">
            <div style="display: flex; justify-content: space-between; font-size: 12px; color: #95a5a6; margin-bottom: 20px;">
                <span>10k</span><span>25k</span><span>50k</span>
            </div>
            <button class="btn-confirm" onclick="confirmPrice()">XÁC NHẬN GIÁ</button>
            <p style="font-size: 11px; color: #e74c3c; margin-top: 10px;" onclick="hidePriceSlider()">Hủy bỏ</p>
        </div>
    </div>

    <div class="bottom-menu">
        <div class="menu-item" style="color: var(--primary)"><span>🏠</span> Trang chủ</div>
        <div class="menu-item" onclick="window.location.href='payment.html'"><span>💰</span> Nạp tiền</div>
        <div class="menu-item"><span>📊</span> Lịch sử</div>
        <div class="menu-item" onclick="window.location.href='admin.html'"><span>⚙️</span> Quản lý</div>
    </div>
    <div class="copyright">PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
</div>

<script src="js/config.js"></script>
<script src="js/security.js"></script>
<script src="js/app.js"></script>
<script>
    // Xử lý thanh trượt giá
    function showPriceSlider() { document.getElementById('slider-overlay').style.display = 'flex'; }
    function hidePriceSlider() { document.getElementById('slider-overlay').style.display = 'none'; }
    
    function updateSliderText(val) {
        document.getElementById('slider-val').innerText = (val * 1000).toLocaleString() + " VNĐ";
    }

    function confirmPrice() {
        const val = document.getElementById('price-range').value * 1000;
        TaxiApp.customBaseFare = val;
        document.getElementById('display-fare').innerText = val.toLocaleString('vi-VN') + " VNĐ";
        document.getElementById('trip-status').innerText = "ĐÃ CHỐT GIÁ";
        document.getElementById('trip-status').style.color = "#e84393";
        hidePriceSlider();
    }

    window.onload = () => {
        document.getElementById('device-id-display').innerText = "ID: " + Security.getDeviceID();
        const license = Security.getLicense();
        document.getElementById('license-badge').innerText = "GÓI: " + (license.type || "FREE");
    };
</script>
</body>
</html>
