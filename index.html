<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - Đồng Hồ Tính Tiền GPS</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* CSS bổ sung để đảm bảo layout hoạt động */
        .tab-content { display: none; flex-direction: column; height: 100%; }
        .tab-content.active { display: flex; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
                 background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); 
                   border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="tab-home" class="tab-content active">
        <header>
            <div class="status-bar">
                <span id="gpsStatus">📡 Đang tìm GPS...</span>
                <span id="currentTime">00:00</span>
            </div>
            <div class="main-display">
                <h1 id="totalCostDisplay">0</h1>
                <p>VNĐ</p>
                <div class="sub-info">
                    <span>KM: <b id="kmDisplay">0.0</b></span>
                    <span>GIÁ/KM: <b id="currentRateDisplay">0</b></span>
                </div>
            </div>
        </header>

        <div id="homeControls" class="controls">
            <div class="rate-adjuster">
                <label>Giá cước: <span id="rateLabel">12,000</span>đ/km</label>
                <input type="range" id="rateSlider" min="5000" max="30000" step="500" value="12000">
            </div>
            <button id="mainBtn" class="btn-main">🚕 BẮT ĐẦU CHUYẾN ĐI</button>
        </div>
        
        <div id="map" style="flex: 1; width: 100%; min-height: 200px;"></div>
    </div>

    <div id="tab-lichsu" class="tab-content">
        <div class="header-tab">
            <h2>Lịch sử chuyến đi</h2>
            <button id="clearHistoryBtn" class="btn-text">Xóa hết</button>
        </div>
        <div id="historyList" class="scroll-list">
            </div>
    </div>

    <div id="tab-goi" class="tab-content">
        <h2>Gói cước hội viên</h2>
        <div class="package-list">
            <div class="p-card" data-id="1day" data-price="10000" data-name="Gói 1 Ngày">
                <h3>1 NGÀY</h3>
                <p>10.000đ</p>
            </div>
            <div class="p-card highlighted" data-id="1month" data-price="150000" data-name="Gói 1 Tháng">
                <h3>1 THÁNG</h3>
                <p>150.000đ</p>
            </div>
        </div>
        <div id="paymentArea" class="payment-box">
            <p>Mã GD: <input type="text" id="transactionCode" placeholder="Nhập mã ngân hàng..."></p>
            <button id="verifyPaymentBtn" class="btn-verify">XÁC THỰC THANH TOÁN</button>
        </div>
    </div>

    <div id="tab-toi" class="tab-content">
        <div class="profile-header">
            <div class="avatar">👤</div>
            <h3 id="userStatus">Tài khoản miễn phí</h3>
        </div>
        <div class="stats-grid">
            <div class="stat-item">Tổng KM: <b id="statTotalKm">0</b></div>
            <div class="stat-item">Tổng Tiền: <b id="statTotalMoney">0</b></div>
        </div>
        <button id="exportDataBtn">Xuất báo cáo Excel</button>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" data-tab="home">🏠 Home</div>
        <div class="nav-item" data-tab="lichsu">📜 Lịch sử</div>
        <div class="nav-item" data-tab="goi">💎 Gói</div>
        <div class="nav-item" data-tab="toi">👤 Tôi</div>
    </nav>

    <div id="wishModal" class="modal">
        <div class="modal-content">
            <h2>🚕 Khởi hành!</h2>
            <p>Chúc bạn vạn dặm bình an.</p>
        </div>
    </div>

    <div id="endModal" class="modal">
        <div class="modal-content">
            <h2>🏁 Kết thúc chuyến</h2>
            <div id="summaryContent"></div>
            <button id="closeEndModal">Xác nhận</button>
        </div>
    </div>

    <div id="successModal" class="modal">
        <div class="modal-content">
            <div id="successMessage"></div>
            <button id="closeSuccessModal" class="btn-close">Đóng</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/GPSTracker.js"></script>
    <script src="js/PaymentManager.js"></script>
    <script src="js/TaxiSystem.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
