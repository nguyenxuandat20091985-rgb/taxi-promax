<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAXI PROMAX DRIVER</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main: #00bfa5; --bg: #f5f5f5; --danger: #d32f2f; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); overflow: hidden; }
        
        /* Bản đồ & Marker */
        #map { height: 100vh; width: 100%; position: absolute; z-index: 1; }
        .glowing-marker { width: 40px; height: 40px; background: var(--main); border-radius: 50%; box-shadow: 0 0 15px var(--main); border: 3px solid white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.7; } 100% { transform: scale(0.9); opacity: 1; } }

        /* Giao diện Overlay */
        .ui-layer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 1000; pointer-events: none; }
        .nav-bottom { position: absolute; bottom: 0; width: 100%; background: white; padding: 20px; border-radius: 20px 20px 0 0; pointer-events: auto; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); }
        .tab-btn { flex: 1; text-align: center; cursor: pointer; font-size: 12px; }
        
        /* Modal đơn hàng */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 90%; border-radius: 20px; padding: 20px; text-align: center; }
        
        /* Chế độ nhận chuyến */
        .trip-active { background: white; padding: 15px; border-radius: 15px; margin: 10px; pointer-events: auto; }
        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 10px; background: var(--main); color: white; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

<!-- Bản đồ -->
<div id="map"></div>

<!-- UI Lớp phủ -->
<div class="ui-layer">
    <!-- Header: Trạng thái & Ví tiền -->
    <div style="padding: 20px; display: flex; justify-content: space-between;">
        <div id="statusIndicator" style="background: var(--main); color: white; padding: 5px 15px; border-radius: 20px;">Trực tuyến</div>
        <div style="background: white; padding: 5px 15px; border-radius: 20px;">Ví: 610.300đ</div>
    </div>

    <!-- Khu vực hiển thị đơn đang nhận (không tự chuyển màn hình) -->
    <div id="activeTrip" class="trip-active" style="display:none;">
        <h3 id="tripStatus">Đang di chuyển đón khách</h3>
        <p>📍 Đón: <span id="fromLoc">...</span></p>
        <p>🏁 Trả: <span id="toLoc">...</span></p>
        <div style="display:flex; gap:10px;">
            <button class="btn-action" style="background:#3498db;">Gọi</button>
            <button class="btn-action" style="background:#2ecc71;">Nhắn tin</button>
        </div>
        <button class="btn-action" style="background:var(--danger);" onclick="completeTrip()">Hoàn thành chuyến</button>
    </div>

    <!-- Thanh Menu đáy -->
    <div class="nav-bottom">
        <div style="display: flex; justify-content: space-around;">
            <div class="tab-btn" onclick="showTab('home')">🏠 Trang chủ</div>
            <div class="tab-btn" onclick="showTab('wallet')">💰 Ví tiền</div>
            <div class="tab-btn" onclick="showTab('history')">📊 Lịch sử</div>
            <div class="tab-btn" onclick="showTab('profile')">👤 Tôi</div>
        </div>
    </div>
</div>

<!-- Modal Đăng nhập (Bắt buộc) -->
<div id="loginModal" class="modal" style="display: flex;">
    <div class="modal-content">
        <h2>Đăng nhập Tài xế</h2>
        <input type="text" id="phone" placeholder="Số điện thoại" style="width:80%; padding:10px; margin-bottom:10px;"><br>
        <select id="vehicleType" style="width:85%; padding:10px;">
            <option value="electric">Xe điện (VF e34/VF8/VF9)</option>
            <option value="gas">Xe xăng</option>
        </select>
        <button class="btn-action" onclick="login()">Bắt đầu làm việc</button>
    </div>
</div>

<!-- Modal Nhận đơn -->
<div id="orderModal" class="modal">
    <div class="modal-content">
        <h2>🚨 ĐƠN HÀNG MỚI</h2>
        <p>Khách: Nguyễn Văn A</p>
        <button class="btn-action" onclick="acceptOrder()">Nhận chuyến</button>
        <button class="btn-action" style="background:gray;" onclick="ignoreOrder()">Bỏ qua</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Logic quản lý trạng thái
    let state = {
        isLoggedIn: false,
        ignoredCount: 0,
        currentTrip: null
    };

    function login() {
        state.isLoggedIn = true;
        document.getElementById('loginModal').style.display = 'none';
        alert("Đăng nhập thành công!");
    }

    function acceptOrder() {
        state.currentTrip = { from: "Hùng Thắng", to: "Bãi Cháy" };
        document.getElementById('orderModal').style.display = 'none';
        document.getElementById('activeTrip').style.display = 'block';
        document.getElementById('fromLoc').innerText = state.currentTrip.from;
        document.getElementById('toLoc').innerText = state.currentTrip.to;
    }

    function ignoreOrder() {
        state.ignoredCount++;
        document.getElementById('orderModal').style.display = 'none';
        console.log("Tổng đơn đã bỏ qua hôm nay: " + state.ignoredCount);
    }

    function completeTrip() {
        // Mở modal đánh giá
        alert("Chuyến đi hoàn tất! Mời khách hàng đánh giá.");
        document.getElementById('activeTrip').style.display = 'none';
        state.currentTrip = null;
    }

    // Khởi tạo bản đồ
    var map = L.map('map').setView([20.95, 107.03], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    
    // Icon phát quang (đơn giản hóa bằng divIcon)
    L.marker([20.95, 107.03], {
        icon: L.divIcon({ className: 'glowing-marker', html: '' })
    }).addTo(map);
</script>
</body>
</html>
