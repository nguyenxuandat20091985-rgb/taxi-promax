<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/744/744465.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/744/744465.png">

    <title>TAXI PROMAX - XANH SM EDITION</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #008080; --dark: #002d26; --gold: #ffc107; --danger: #ff5252; --bg: #f8faf9; --glass: rgba(255, 255, 255, 0.95); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; background: var(--bg); }
        
        /* BẢN ĐỒ FULL VIỀN */
        #map { height: 100vh; width: 100vw; z-index: 1; filter: contrast(1.1) brightness(1); }

        /* HEADER & STATS (GIỮ NGUYÊN CẤU TRÚC) */
        .header { position: fixed; top: 15px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 1000; pointer-events: none; }
        .badge { pointer-events: auto; background: var(--glass); padding: 8px 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 11px; font-weight: 800; color: var(--dark); border: 1px solid white; }
        .stats-bar { position: fixed; top: 60px; left: 10px; right: 10px; background: var(--glass); border-radius: 15px; display: flex; padding: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); z-index: 1000; border: 1px solid white; }
        .stat-item { flex: 1; text-align: center; }
        .stat-label { font-size: 9px; color: #7f8c8d; font-weight: 800; text-transform: uppercase; }
        .stat-value { font-size: 22px; font-weight: 900; color: var(--dark); margin-top: 2px; }

        /* FOOTER CHUẨN XANH SM */
        .footer-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; z-index: 2000; border-radius: 25px 25px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); padding: 15px 15px 10px; padding-bottom: env(safe-area-inset-bottom); }
        .nav-grid { display: flex; justify-content: space-around; margin-top: 10px; padding-top: 8px; border-top: 1px solid #eee; }
        .nav-item { border: none; background: none; color: #bdc3c7; font-size: 10px; font-weight: 700; text-align: center; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .brand-footer { font-size: 9px; text-align: center; color: #bdc3c7; padding-top: 5px; font-weight: bold; }

        /* MARKER XE CHUẨN XANH SM */
        .sm-marker { width: 30px; height: 30px; background: var(--primary); border: 3px solid white; border-radius: 50%; box-shadow: 0 0 20px rgba(0,128,128,0.6); position: relative; transition: all 0.5s ease-out; }
        .sm-marker::after { content: ''; position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid var(--primary); }

        /* CÁC THÀNH PHẦN KHÁC GIỮ NGUYÊN */
        .tab-content { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 130px); background: #fdfdfd; z-index: 1500; display: none; flex-direction: column; overflow-y: auto; padding-bottom: 30px; }
        .p-header { background: var(--primary); color: white; padding: 25px 20px; text-align: center; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; }
        .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .p-card { background: white; border: 2px solid #ecf0f1; border-radius: 18px; padding: 12px; transition: 0.3s; }
        .p-card.active { border-color: var(--primary); background: #f0fffb; }
        .btn-main { width: 100%; padding: 16px; border-radius: 18px; border: none; background: var(--primary); color: white; font-size: 18px; font-weight: 900; box-shadow: 0 6px 20px rgba(0,128,128,0.3); }
        .custom-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; width: 85%; max-width: 320px; padding: 25px; border-radius: 25px; text-align: center; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header">
        <div class="badge" id="idShow">🆔 ID: ...</div>
        <div class="badge" style="color:var(--gold)" id="planShow">⭐ GÓI: PROMAX</div>
    </div>

    <div class="stats-bar">
        <div class="stat-item" style="border-right: 1px solid #eee;">
            <div class="stat-label">CƯỚC (VNĐ)</div>
            <div id="cost" class="stat-value">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">KHOẢNG CÁCH (KM)</div>
            <div id="km" class="stat-value">0.00</div>
        </div>
    </div>

    <div id="map"></div>

    <div id="tab-vi" class="tab-content">
        <div class="p-header">HỆ THỐNG GÓI CƯỚC</div>
        <div class="p-grid" id="packGrid"></div>
        <div style="text-align:center; padding: 20px;">
            <img id="qrImg" style="width:180px; border-radius:10px;" src="">
            <b id="qrContent" style="color:var(--danger); display:block; margin-top:10px;">...</b>
        </div>
    </div>

    <div id="tab-lichsu" class="tab-content">
        <div class="p-header">LỊCH SỬ CHUYẾN ĐI</div>
        <div id="historyList"></div>
    </div>

    <div class="footer-panel">
        <div id="homeControls">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:12px; font-weight:800;">
                <span>GIÁ CƯỚC/KM</span>
                <span id="rateLabel" style="color:var(--primary)">15,000đ</span>
            </div>
            <input type="range" min="5000" max="50000" step="1000" value="15000" style="width:100%; accent-color:var(--primary); margin-bottom:12px;" oninput="updateRate(this.value)">
            <button id="mainBtn" class="btn-main" onclick="handleTrip()">BẮT ĐẦU CHUYẾN ĐI</button>
        </div>

        <div class="nav-grid">
            <button class="nav-item active" onclick="showTab('home', this)">Trang chủ</button>
            <button class="nav-item" onclick="showTab('vi', this)">Ví tiền</button>
            <button class="nav-item" onclick="showTab('lichsu', this)">Lịch sử</button>
        </div>
        <div class="brand-footer">DESIGNED BY NGUYEN XUAN DAT</div>
    </div>

    <div id="wishModal" class="custom-modal"><div class="modal-content"><h3>XANH SM PROMAX</h3><p>Hệ thống định vị & Chống tắt màn hình đã kích hoạt.</p><button class="btn-main" onclick="closeModal('wishModal')">BẮT ĐẦU</button></div></div>
    <div id="endModal" class="custom-modal"><div class="modal-content"><h3>HOÀN THÀNH!</h3><div id="endSummary"></div><button class="btn-main" onclick="closeModal('endModal')">XÁC NHẬN</button></div></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const TX_ID = localStorage.getItem('tx_id') || 'DAT-' + Math.random().toString(36).substr(2, 5).toUpperCase();
        localStorage.setItem('tx_id', TX_ID);
        document.getElementById('idShow').innerText = "🆔 " + TX_ID;

        // 1. NÂNG CẤP BẢN ĐỒ XANH SM (DARK THEME)
        var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([21.02, 105.83], 17);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

        var smIcon = L.divIcon({ className: 'sm-div-icon', html: "<div class='sm-marker'></div>", iconSize: [30, 30], iconAnchor: [15, 15] });
        var marker = L.marker([21.02, 105.83], { icon: smIcon }).addTo(map);

        // 2. CHỐNG TẮT MÀN HÌNH (WAKE LOCK)
        let wakeLock = null;
        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } catch (err) {}
        }
        requestWakeLock();

        // 3. THUẬT TOÁN ĐỊNH VỊ 24/24 & LỌC NHIỄU NHẢY TIỀN
        let isRunning = false, totalKm = 0, lastPos = null, currentRate = 15000;
        const MIN_MOVE = 0.03; // XE PHẢI ĐI TRÊN 30M MỚI TÍNH KM (CHỐNG NHẢY TIỀN ẢO)

        // ĐỊNH VỊ LIÊN TỤC KHÔNG DỪNG
        navigator.geolocation.watchPosition((p) => {
            const pos = L.latLng(p.coords.latitude, p.coords.longitude);
            marker.setLatLng(pos);
            map.panTo(pos);

            if (isRunning) {
                if (lastPos) {
                    let d = pos.distanceTo(lastPos) / 1000;
                    // THUẬT TOÁN XANH SM/GRAB: Bỏ qua sai số nhỏ dưới 30m
                    if (d > MIN_MOVE) { 
                        totalKm += d;
                        lastPos = pos;
                        document.getElementById('km').innerText = totalKm.toFixed(2);
                        document.getElementById('cost').innerText = Math.round(totalKm * currentRate).toLocaleString();
                    }
                } else { lastPos = pos; }
            }
        }, null, { enableHighAccuracy: true });

        function handleTrip() {
            const btn = document.getElementById('mainBtn');
            if(!isRunning) {
                isRunning = true;
                totalKm = 0; lastPos = null;
                document.getElementById('km').innerText = "0.00";
                document.getElementById('cost').innerText = "0";
                btn.innerText = "KẾT THÚC CHUYẾN ĐI";
                btn.style.background = "var(--danger)";
                document.getElementById('wishModal').style.display = 'flex';
            } else {
                isRunning = false;
                btn.innerText = "BẮT ĐẦU CHUYẾN ĐI";
                btn.style.background = "var(--primary)";
                let finalCost = Math.round(totalKm * currentRate);
                document.getElementById('endSummary').innerHTML = `Đoạn đường: ${totalKm.toFixed(2)} KM<br><b>${finalCost.toLocaleString()} VNĐ</b>`;
                document.getElementById('endModal').style.display = 'flex';
            }
        }

        function updateRate(v) { 
            currentRate = v; 
            document.getElementById('rateLabel').innerText = parseInt(v).toLocaleString() + "đ"; 
        }

        function showTab(tab, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(tab === 'home') document.getElementById('homeControls').style.display = 'block';
            else {
                document.getElementById('homeControls').style.display = 'none';
                document.getElementById('tab-' + tab).style.display = 'flex';
            }
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        // GIỮ NGUYÊN CẤU TRÚC VÍ & NẠP TIỀN CỦA ANH
        const packs = [
            {n:'BASIC', p:19000, desc:'Km + Offline'},
            {n:'PRO', p:29000, desc:'Real-time Map'},
            {n:'VIP 1TH', p:49000, desc:'AI Voice Help'}
        ];
        const packGrid = document.getElementById('packGrid');
        packs.forEach(pkg => {
            const div = document.createElement('div');
            div.className = 'p-card';
            div.innerHTML = `<b>GÓI ${pkg.n}</b><span>${pkg.p.toLocaleString()}đ</span><ul><li>✅ ${pkg.desc}</li></ul>`;
            div.onclick = () => {
                document.querySelectorAll('.p-card').forEach(c => c.classList.remove('active'));
                div.classList.add('active');
                const content = `${TX_ID} NAP ${pkg.n}`;
                document.getElementById('qrContent').innerText = content;
                document.getElementById('qrImg').src = `https://img.vietqr.io/image/bidv-4430269669-compact2.png?amount=${pkg.p}&addInfo=${encodeURIComponent(content)}`;
            };
            packGrid.appendChild(div);
        });
    </script>
    <script src="ai-module/ai-config.js"></script>
    <script src="ai-module/ai-client.js"></script>
</body>
</html>
