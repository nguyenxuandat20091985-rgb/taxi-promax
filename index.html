<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TAXI PROMAX - SUPER ADMIN v4.0 AI</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #00bfa5; --dark: #002d26; --gold: #ffc107; --danger: #ff5252; --bg: #0f1716; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: var(--bg); overflow: hidden; position: fixed; width: 100%; }
        
        /* Map Admin */
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; filter: contrast(1.1) brightness(0.8) invert(100%) hue-rotate(180deg); opacity: 0.9; } 

        /* AI AVATAR FLOATING - ROBOT QUẢN LÝ */
        #ai-assistant {
            position: fixed; width: 80px; height: 80px; z-index: 9999;
            cursor: move; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 15px var(--primary));
        }
        #ai-avatar { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; background: #000; }
        .ai-status { position: absolute; bottom: 5px; right: 5px; width: 15px; height: 15px; background: #00ff00; border-radius: 50%; border: 2px solid white; animation: pulse 1.5s infinite; }
        
        /* Bubble Chat */
        .ai-bubble {
            position: absolute; bottom: 90px; right: 0; width: 200px; background: rgba(0,0,0,0.85);
            color: white; padding: 10px; border-radius: 15px; font-size: 12px;
            display: none; border: 1px solid var(--primary); backdrop-filter: blur(5px);
        }

        /* Holiday Theme Container */
        #holiday-banner {
            position: fixed; top: 0; width: 100%; z-index: 3000; pointer-events: none;
            text-align: center; color: var(--gold); font-weight: bold; font-size: 14px; padding: 5px;
        }

        /* UI Gốc (Giữ nguyên) */
        .header { position: fixed; top: env(safe-area-inset-top, 10px); left: 10px; right: 10px; display: flex; gap: 8px; z-index: 1000; }
        .badge { flex: 1; background: rgba(0, 45, 38, 0.95); color: var(--gold); padding: 10px; border-radius: 15px; font-size: 11px; font-weight: 800; border: 1px solid var(--gold); text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); } 
        .admin-dashboard { position: fixed; top: calc(env(safe-area-inset-top, 10px) + 55px); left: 15px; right: 15px; background: rgba(255,255,255,0.95); border-radius: 20px; display: flex; padding: 15px; z-index: 1000; border: 1px solid var(--primary); backdrop-filter: blur(10px); }
        .dash-item { flex: 1; text-align: center; border-right: 1px solid #eee; }
        .dash-label { font-size: 9px; color: #7f8c8d; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
        .dash-value { font-size: 20px; font-weight: 900; color: var(--dark); } 
        .footer-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; z-index: 2000; border-radius: 25px 25px 0 0; padding: 20px 20px calc(env(safe-area-inset-bottom, 5px) + 10px); }
        .btn-main { width: 100%; padding: 15px; border-radius: 15px; border: none; background: var(--dark); color: var(--gold); font-size: 16px; font-weight: 900; border: 2px solid var(--gold); }
        .nav-grid { display: flex; justify-content: space-around; margin-top: 20px; }
        .nav-item { border: none; background: none; color: #bdc3c7; font-size: 10px; font-weight: 700; flex: 1; text-align: center; }
        .nav-item.active { color: var(--primary); }
        .tab-content { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f4f7f6; z-index: 1500; display: none; flex-direction: column; padding-top: 70px; overflow-y: auto; padding-bottom: 120px; }
        .p-section { background: white; margin: 10px 15px; padding: 20px; border-radius: 20px; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="holiday-banner"></div>

    <div id="ai-assistant">
        <div class="ai-bubble" id="ai-msg">Chào Chủ tịch Đạt! Hệ thống ổn định.</div>
        <img id="ai-avatar" src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="AI" onclick="toggleMic()">
        <div class="ai-status"></div>
        <input type="file" id="avatar-upload" hidden accept="image/*" onchange="changeAvatar(event)">
        <button onclick="document.getElementById('avatar-upload').click()" style="position:absolute; top:-20px; left:20px; font-size:10px; background:var(--dark); color:white; border:none; border-radius:5px;">Sửa Avatar</button>
    </div>

    <div class="header">
        <div class="badge">👑 CHỦ TỊCH: ĐẠT PRO</div>
        <div class="badge">🌐 REAL-TIME: <span id="live-users">1</span> USERS</div>
    </div> 

    <div class="admin-dashboard">
        <div class="dash-item"><div class="dash-label">DOANH THU</div><div id="cost" class="dash-value">0</div></div>
        <div class="dash-item" style="border:none"><div class="dash-label">TÀI XẾ THỰC</div><div class="dash-value" id="driver-count">0</div></div>
    </div> 

    <div id="map"></div> 

    <div id="tab-vi" class="tab-content">
        <div class="p-section">
            <div class="p-title">Hệ Thống Gói Cước Webhook</div>
            <div id="webhook-status" style="font-size:11px; color:green;">● Kết nối PayOS: Hoạt động</div>
        </div>
    </div>

    <div class="footer-panel">
        <div id="homeControls">
            <button id="mainBtn" class="btn-main" onclick="handleTrip()">BẮT ĐẦU GIÁM SÁT</button>
        </div> 
        <div class="nav-grid">
            <button class="nav-item active" onclick="showTab('home', this)"><span>📍</span>Bản đồ</button>
            <button class="nav-item" onclick="showTab('vi', this)"><span>💹</span>Tài chính</button>
            <button class="nav-item" onclick="showTab('toi', this)"><span>👑</span>Hệ thống</button>
        </div>
    </div> 

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 1. AI & AVATAR MANAGEMENT ---
        const ai = document.getElementById('ai-assistant');
        let isListening = false;

        // Kéo thả AI quanh màn hình
        let isDragging = false;
        ai.onmousedown = (e) => { isDragging = true; };
        document.onmousemove = (e) => {
            if (!isDragging) return;
            let x = e.clientX - 40;
            let y = e.clientY - 40;
            // Giới hạn trong màn hình
            x = Math.max(0, Math.min(window.innerWidth - 80, x));
            y = Math.max(0, Math.min(window.innerHeight - 80, y));
            ai.style.left = x + 'px';
            ai.style.top = y + 'px';
        };
        document.onmouseup = () => { isDragging = false; };

        // Thay đổi Avatar từ ảnh điện thoại
        function changeAvatar(event) {
            const reader = new FileReader();
            reader.onload = function() {
                document.getElementById('ai-avatar').src = reader.result;
                localStorage.setItem('admin_avatar', reader.result);
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        // Chào hỏi thông minh & Micro (Demo logic)
        function toggleMic() {
            isListening = !isListening;
            const bubble = document.getElementById('ai-msg');
            bubble.style.display = 'block';
            if(isListening) {
                bubble.innerText = "Đang nghe Chủ tịch nói...";
                // Tích hợp Voice Recognition API ở đây
            } else {
                bubble.innerText = "Đã nhận lệnh! Đang kết nối Gemini/GPT-4...";
                setTimeout(() => { bubble.style.display = 'none'; }, 3000);
            }
        }

        // --- 2. HỆ THỐNG LỄ TẾT TỰ ĐỘNG ---
        const holidays = {
            "01-01": "Chúc mừng Năm Mới 2026! 🎉",
            "14-02": "Happy Valentine! ❤️",
            "30-04": "Giải phóng miền Nam! 🇻🇳",
            "01-05": "Quốc tế lao động! 🛠️",
            "02-09": "Quốc Khánh Việt Nam! 🇻🇳",
            "25-12": "Giáng Sinh An Lành! 🎄"
        };
        function checkHoliday() {
            const today = new Date();
            const dayMonth = `${String(today.getDate()).padStart(2, '0')}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            if (holidays[dayMonth]) {
                document.getElementById('holiday-banner').innerText = holidays[dayMonth];
                document.body.style.border = "2px solid gold"; // Hiệu ứng viền vàng ngày lễ
            }
        }

        // --- 3. QUẢN LÝ NGƯỜI DÙNG THẬT (REAL-TIME DEMO) ---
        // Trong thực tế sẽ dùng Firebase hoặc Socket.io
        function trackLiveUsers() {
            const mockUsers = Math.floor(Math.random() * 50) + 10;
            document.getElementById('live-users').innerText = mockUsers;
            document.getElementById('driver-count').innerText = Math.floor(mockUsers / 3);
        }
        setInterval(trackLiveUsers, 5000);

        // Khởi tạo
        window.onload = () => {
            checkHoliday();
            if(localStorage.getItem('admin_avatar')) {
                document.getElementById('ai-avatar').src = localStorage.getItem('admin_avatar');
            }
            // Map init
            var map = L.map('map').setView([21.0285, 105.8542], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        };

        function showTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(tabId !== 'home') document.getElementById('tab-'+tabId).style.display = 'flex';
            el.classList.add('active');
        }
    </script>
</body>
</html>
