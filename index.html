<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 1. Phóng to đồng hồ Km cho tài xế dễ nhìn */
        #display-km {
            font-size: 32px !important; /* Tăng kích thước số Km */
            font-weight: 800;
            color: #2980b9;
            display: block;
            margin: 10px 0;
        }

        /* 2. Style cho nút Cài đặt */
        .price-setting-container {
            position: absolute;
            top: 20px;
            left: 15px;
            z-index: 100;
            text-align: center;
            transition: 0.3s;
        }

        /* 3. Hiệu ứng ẩn nút khi đang chạy */
        .hidden-active {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }

        .btn-price-setting {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(135deg, #FF9a9e 0%, #fecfef 100%);
            border: 2px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .btn-text-top { font-size: 10px; color: #d63031; font-weight: bold; }
        .btn-text-bottom { font-size: 11px; color: #d63031; font-weight: 900; }
        
        .slider-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .slider-card {
            background: white;
            padding: 25px;
            border-radius: 25px;
            width: 85%;
            text-align: center;
        }
        .price-slider {
            width: 100%; margin: 25px 0; height: 12px;
            border-radius: 5px; background: #dfe6e9; outline: none;
        }
        .current-val { font-size: 28px; font-weight: bold; color: #e84393; }
        .btn-confirm {
            background: #27ae60; color: white; border: none;
            padding: 12px 40px; border-radius: 15px; font-weight: bold; width: 100%;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="user-header">
        <div id="device-id-display">ID: Đang tải...</div>
        <div id="license-badge" class="badge-vip">GÓI: FREE</div>
    </div>

    <div class="meter-section" style="position: relative;">
        <div class="price-setting-container" id="price-btn-box">
            <div class="btn-price-setting" onclick="showPriceSlider()">
                <span class="btn-text-top">⚙️ CÀI ĐẶT</span>
                <span class="btn-text-bottom">GIÁ CẢ</span>
            </div>
        </div>

        <div class="fare-circle">
            <h1 id="display-fare">0 VNĐ</h1>
            <span id="display-km">0.00 Km</span>
            <span id="display-time" style="font-size: 14px; color: #bdc3c7;">00:00</span>
            <div id="trip-status" style="font-size: 13px; color: #7f8c8d; margin-top: 5px; font-weight: bold;">CHỜ THỎA THUẬN</div>
        </div>

        <div class="btn-group">
            <button class="btn-start" onclick="handleStart()">▶ BẮT ĐẦU CHUYẾN</button>
            <button class="btn-stop" onclick="handleStop()">■ KẾT THÚC</button>
        </div>
    </div>

    <div id="slider-overlay" class="slider-overlay">
        <div class="slider-card">
            <h3>Chọn giá cước (VNĐ/Km)</h3>
            <div class="current-val" id="slider-val">15.000 VNĐ</div>
            <input type="range" min="10" max="50" step="1" value="15" class="price-slider" id="price-range" oninput="updateSliderText(this.value)">
            <div style="display: flex; justify-content: space-between; font-size: 12px; color: #95a5a6; margin-bottom: 20px;">
                <span>10k</span><span>25k</span><span>50k</span>
            </div>
            <button class="btn-confirm" onclick="confirmPrice()">XÁC NHẬN GIÁ</button>
            <p style="font-size: 13px; color: #e74c3c; margin-top: 15px; cursor: pointer;" onclick="hidePriceSlider()">Hủy bỏ</p>
        </div>
    </div>

    <div class="bottom-menu">
        <div class="menu-item" style="color: #27ae60"><span>🏠</span> Trang chủ</div>
        <div class="menu-item" onclick="window.location.href='payment.html'"><span>💰</span> Nạp tiền</div>
        <div class="menu-item"><span>📊</span> Lịch sử</div>
        <div class="menu-item" onclick="window.location.href='admin.html'"><span>⚙️</span> Quản lý</div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/security.js"></script>
<script src="js/app.js"></script>
<script>
    let currentPricePerKm = 15000; // Mặc định 15k/km

    function showPriceSlider() { document.getElementById('slider-overlay').style.display = 'flex'; }
    function hidePriceSlider() { document.getElementById('slider-overlay').style.display = 'none'; }
    
    function updateSliderText(val) {
        document.getElementById('slider-val').innerText = (val * 1000).toLocaleString('vi-VN') + " VNĐ";
    }

    function confirmPrice() {
        currentPricePerKm = document.getElementById('price-range').value * 1000;
        document.getElementById('trip-status').innerText = "GIÁ CHỐT: " + currentPricePerKm.toLocaleString() + "/Km";
        hidePriceSlider();
    }

    // Xử lý khi bắt đầu chạy
    function handleStart() {
        // 1. Ẩn nút cài đặt
        document.getElementById('price-btn-box').classList.add('hidden-active');
        document.getElementById('trip-status').innerText = "ĐANG CHUYỂN BÁNH";
        document.getElementById('trip-status').style.color = "#e84393";
        
        // 2. Gọi hàm chạy GPS trong app.js của anh
        TaxiApp.start(); 

        // 3. Chạy vòng lặp cập nhật tiền tự động
        window.priceTracker = setInterval(() => {
            let km = parseFloat(document.getElementById('display-km').innerText.replace(' Km', '')) || 0;
            let totalFare = km * currentPricePerKm;
            document.getElementById('display-fare').innerText = Math.round(totalFare).toLocaleString('vi-VN') + " VNĐ";
        }, 1000);
    }

    // Xử lý khi kết thúc
    function handleStop() {
        // 1. Hiện lại nút cài đặt
        document.getElementById('price-btn-box').classList.remove('hidden-active');
        document.getElementById('trip-status').innerText = "CHUYẾN ĐÃ XONG";
        document.getElementById('trip-status').style.color = "#7f8c8d";
        
        // 2. Dừng cập nhật tiền
        clearInterval(window.priceTracker);
        TaxiApp.stop();
    }

    window.onload = () => {
        if(typeof Security !== 'undefined') {
            document.getElementById('device-id-display').innerText = "ID: " + Security.getDeviceID();
            const license = Security.getLicense();
            document.getElementById('license-badge').innerText = "GÓI: " + (license.type || "FREE");
        }
    };
</script>
</body>
</html>
