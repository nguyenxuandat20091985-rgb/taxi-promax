<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax Infinity - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main-green: #2ecc71; --main-blue: #3498db; --glass: rgba(255, 255, 255, 0.85); }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #f4f7f6; }
        
        /* 1. Bản đồ rộng tối đa */
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* 2. Widget Header trong suốt */
        .top-bar {
            position: absolute; top: 15px; width: 92%; left: 4%; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
        }
        .info-pill { 
            background: rgba(0,0,0,0.7); color: white; padding: 6px 12px; 
            border-radius: 20px; font-size: 11px; backdrop-filter: blur(5px);
        }

        /* 3. Nút cài đặt hồng tinh tế */
        .btn-config {
            position: absolute; top: 65px; left: 15px; z-index: 10;
            width: 55px; height: 55px; background: #ffc0cb; border: 2px solid white;
            border-radius: 50%; display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 8px; font-weight: bold; color: #d63031;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* 4. Smart HUD tích hợp */
        .smart-hud {
            position: absolute; bottom: 185px; width: 92%; left: 4%; z-index: 10;
            background: var(--glass); border-radius: 25px; backdrop-filter: blur(10px);
            display: flex; padding: 12px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .hud-col { flex: 1; text-align: center; }
        .hud-col:first-child { border-right: 1px solid rgba(0,0,0,0.05); }
        .money { font-size: 32px; color: var(--main-green); font-weight: 900; }
        .km { font-size: 24px; color: var(--main-blue); font-weight: bold; }
        .label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; }

        /* 5. Cụm điều khiển & Icon tiện ích */
        .bottom-panel {
            position: absolute; bottom: 0; width: 100%; z-index: 20;
            background: white; border-top-left-radius: 30px; border-top-right-radius: 30px;
            padding: 20px 0 10px 0; box-shadow: 0 -5px 25px rgba(0,0,0,0.1);
        }
        .main-btns { width: 90%; margin: 0 auto 15px auto; display: flex; gap: 10px; }
        .btn-go { flex: 2; background: var(--main-green); color: white; border: none; padding: 15px; border-radius: 18px; font-weight: bold; font-size: 16px; }
        .btn-stop { flex: 1; background: #fff; color: #e74c3c; border: 2px solid #e74c3c; border-radius: 18px; font-weight: bold; }

        /* Thanh Menu icon từ bản cũ */
        .nav-icons { display: flex; justify-content: space-around; width: 95%; margin: 0 auto; border-top: 1px solid #f0f0f0; padding-top: 10px; }
        .nav-item { text-align: center; color: #95a5a6; text-decoration: none; font-size: 10px; }
        .nav-item span { display: block; font-size: 20px; margin-bottom: 2px; }
        .nav-item.active { color: var(--main-green); font-weight: bold; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="top-bar">
    <div class="info-pill">🆔 TX-DAT-2026</div>
    <div class="info-pill" style="background: #f1c40f; color: #000;">⚡ GÓI: FREE</div>
</div>

<div class="btn-config" onclick="alert('Cài đặt giá...')">
    <span>⚙️ GIÁ</span>
    <span style="font-size: 10px;">15K/KM</span>
</div>

<div class="smart-hud">
    <div class="hud-col">
        <div class="money" id="fare-txt">0</div>
        <div class="label">VNĐ ĐANG NHẢY</div>
    </div>
    <div class="hud-col">
        <div class="km" id="km-txt">0.00</div>
        <div class="label">KILÔMÉT ĐÃ ĐI</div>
    </div>
</div>

<div class="bottom-panel">
    <div class="main-btns">
        <button class="btn-go" id="startBtn" onclick="startTrip()">▶ BẮT ĐẦU CHUYẾN</button>
        <button class="btn-stop" id="stopBtn" onclick="stopTrip()">KẾT THÚC</button>
    </div>

    <div class="nav-icons">
        <a href="#" class="nav-item active"><span>🏠</span>Trang chủ</a>
        <a href="payment.html" class="nav-item"><span>💰</span>Nạp tiền</a>
        <a href="history.html" class="nav-item"><span>📊</span>Lịch sử</a>
        <a href="admin.html" class="nav-item"><span>⚙️</span>Quản lý</a>
    </div>
    <div style="text-align: center; font-size: 9px; color: #bdc3c7; margin-top: 8px;">PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([20.95, 107.07], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    
    // Icon xe hiện đại
    var carIcon = L.circleMarker([0,0], { radius: 9, color: '#fff', weight: 3, fill: true, fillColor: '#2ecc71', fillOpacity: 1 }).addTo(map);

    let kmPrice = 15000, totalKm = 0, watchId = null, lastLoc = null;

    function startTrip() {
        document.getElementById('startBtn').style.background = '#1b5e20';
        document.getElementById('startBtn').innerText = "⚡ ĐANG DI CHUYỂN";
        
        watchId = navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            const current = [latitude, longitude];
            map.flyTo(current, 17, { animate: true, duration: 1 });
            carIcon.setLatLng(current);

            if (lastLoc && accuracy < 40) {
                const d = map.distance(lastLoc, current) / 1000;
                if (d > 0.002) { totalKm += d; updateUI(); }
            }
            lastLoc = current;
        }, null, { enableHighAccuracy: true });
    }

    function updateUI() {
        document.getElementById('km-txt').innerText = totalKm.toFixed(2);
        let money = Math.round(totalKm * kmPrice);
        document.getElementById('fare-txt').innerText = money.toLocaleString('vi-VN');
    }

    function stopTrip() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        document.getElementById('startBtn').style.background = '#2ecc71';
        document.getElementById('startBtn').innerText = "▶ BẮT ĐẦU CHUYẾN";
        alert("Chuyến đi kết thúc: " + totalKm.toFixed(2) + " Km");
    }
</script>
</body>
</html>
