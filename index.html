<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Auto VIP Payment</title>
</head>
<body style="font-family:Arial;text-align:center">

<h2>💳 Thanh toán kích hoạt VIP</h2>

<img id="qr" width="250"><br>
<b id="code"></b><br>
<div id="status">⏳ Đang chờ thanh toán...</div>

<script>
const API = "https://taxi-promax.vercel.app";

async function initUser() {
  let code = localStorage.getItem("USER_CODE");

  if (!code) {
    const res = await fetch(API + "/api/create");
    const user = await res.json();
    code = user.code;
    localStorage.setItem("USER_CODE", code);
  }

  createQR(code);
  checkVIP(code);
}

function createQR(code) {
  const amount = 49000;
  const plan = "VIP";

  const BANK = "BIDV";
  const ACC = "1234567890";
  const NAME = "NGUYEN XUAN DAT";

  const content = code + " " + plan;

  const qr = `https://img.vietqr.io/image/${BANK}-${ACC}-qr_only.png?amount=${amount}&addInfo=${encodeURIComponent(content)}&accountName=${encodeURIComponent(NAME)}`;

  document.getElementById("qr").src = qr;
  document.getElementById("code").innerText = "Nội dung: " + content;
}

async function checkVIP(code) {
  setInterval(async () => {
    const res = await fetch(API + "/api/check?code=" + code);
    const data = await res.json();

    if (data.vip) {
      document.getElementById("status").innerHTML = "✅ VIP ĐÃ KÍCH HOẠT!";
    }
  }, 3000);
}

initUser();
</script>

</body>
</html>
