<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TAXI PROMAX TÀI XẾ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* GIỮ NGUYÊN GIAO DIỆN CỦA ANH */
        :root { --primary: #0054a3; --accent: #00bfa5; --dark: #1c1e21; --gold: #f1c40f; --danger: #d32f2f; --bg: #f4f7f6; --glass: rgba(255, 255, 255, 0.95); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; background: var(--bg); }
        #map { height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; z-index: 1; } 
        .header { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 1000; pointer-events: none; }
        .badge { pointer-events: auto; background: var(--glass); padding: 8px 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 11px; font-weight: 800; color: var(--dark); border-left: 4px solid var(--primary); } 
        .stats-bar { position: fixed; top: 55px; left: 10px; right: 10px; background: var(--glass); border-radius: 15px; display: flex; padding: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); z-index: 1000; }
        .stat-item { flex: 1; text-align: center; }
        .stat-label { font-size: 9px; color: #7f8c8d; font-weight: 800; text-transform: uppercase; }
        .stat-value { font-size: 22px; font-weight: 900; color: var(--primary); margin-top: 2px; } 
        .footer-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; z-index: 2000; border-radius: 25px 25px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.08); padding: 15px; }
        .nav-grid { display: flex; justify-content: space-around; margin-top: 10px; padding-top: 8px; border-top: 1px solid #eee; }
        .nav-item { border: none; background: none; color: #bdc3c7; font-size: 10px; font-weight: 700; text-align: center; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .tab-content { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 140px); background: #fdfdfd; z-index: 1500; display: none; flex-direction: column; overflow-y: auto; padding-bottom: 30px; }
        .p-header { background: linear-gradient(135deg, var(--primary), #003d7a); color: white; padding: 25px 20px; text-align: center; } 
        .btn-main { width: 100%; padding: 15px; border-radius: 15px; border: none; background: var(--accent); color: white; font-size: 18px; font-weight: 900; }
        .custom-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: white; width: 88%; max-width: 340px; padding: 25px; border-radius: 25px; text-align: center; } 
        /* CÁC CSS MARKER CŨ */
        .sm-marker-container { position: relative; width: 40px; height: 40px; }
        .sm-pulse-ring { position: absolute; width: 42px; height: 42px; border-radius: 50%; background-color: rgba(0, 191, 165, 0.4); animation: smSpread 2s infinite ease-out; }
        @keyframes smSpread { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
        .customer-marker { width: 26px; height: 26px; background: var(--danger); border: 3px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge" id="idShow">🆔 ĐANG QUÉT...</div>
        <div class="badge" id="planShow">⭐ ĐANG TẢI...</div>
    </div> 

    <div class="stats-bar">
        <div class="stat-item"><div class="stat-label">CƯỚC (VNĐ)</div><div id="cost" class="stat-value">0</div></div>
        <div class="stat-item"><div class="stat-label">KHOẢNG CÁCH (KM)</div><div id="km" class="stat-value">0.00</div></div>
    </div> 

    <div id="map"></div> 

    <div id="tab-vi" class="tab-content"><div class="p-header">VÍ TIỀN</div></div>
    <div id="tab-lichsu" class="tab-content"><div class="p-header">LỊCH SỬ</div><div id="historyList"></div></div>
    <div id="tab-toi" class="tab-content"><div class="p-header">CÁ NHÂN</div><div id="profileID" style="text-align:center; padding:20px;"></div></div>

    <div class="footer-panel">
        <div id="homeControls">
            <input type="range" min="10000" max="50000" step="1000" value="15000" oninput="updateRate(this.value)" style="width:100%">
            <button id="mainBtn" class="btn-main" onclick="handleTrip()">BẮT ĐẦU CHUYẾN ĐI</button>
        </div>
        <div class="nav-grid">
            <button class="nav-item active" onclick="showTab('home', this)">🏠 Trang chủ</button>
            <button class="nav-item" onclick="showTab('vi', this)">💰 Ví</button>
            <button class="nav-item" onclick="showTab('lichsu', this)">📊 Lịch sử</button>
            <button class="nav-item" onclick="showTab('toi', this)">👤 Tôi</button>
        </div>
    </div>

    <div id="orderModal" class="custom-modal">
        <div class="modal-content">
            <h2 style="color:var(--danger)">🚨 ĐƠN MỚI!</h2>
            <p>Khách: <span id="modalClientName"></span></p>
            <button class="btn-main" onclick="acceptCustomer()">ĐÓN KHÁCH</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // CẤU HÌNH BIẾN TOÀN CỤC
        const FIREBASE_BASE_URL = "https://taxipromax-new-default-rtdb.asia-southeast1.firebasedatabase.app";
        const TX_ID = localStorage.getItem('tx_id') || 'PRO-' + Math.random().toString(36).substr(2, 5).toUpperCase();
        localStorage.setItem('tx_id', TX_ID);
        
        let map, marker, isRunning = false, totalKm = 0, lastPos = null;

        // HÀM KHỞI TẠO
        function initApp() {
            map = L.map('map', { zoomControl: false }).setView([21.02, 105.83], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            
            // Khởi động các luồng
            startTracking();
            startBookingScanner();
        }

        // TÍCH HỢP LẠI LOGIC CHUYẾN VẪY VÀO ĐÂY
        function startBookingScanner() {
            setInterval(() => {
                if(isRunning) return; // Nếu đang chạy chuyến thì không quét
                fetch(`${FIREBASE_BASE_URL}/datxe.json`)
                .then(res => res.json())
                .then(data => {
                    // Logic kiểm tra đơn hàng mới ở đây
                    console.log("Đang quét đơn...");
                });
            }, 5000);
        }

        function handleTrip() {
            isRunning = !isRunning;
            document.getElementById('mainBtn').innerText = isRunning ? "KẾT THÚC CHUYẾN" : "BẮT ĐẦU CHUYẾN";
            document.getElementById('mainBtn').style.background = isRunning ? "var(--danger)" : "var(--accent)";
        }

        function showTab(tab, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            if(tab !== 'home') document.getElementById('tab-' + tab).style.display = 'flex';
            document.getElementById('homeControls').style.display = (tab === 'home') ? 'block' : 'none';
        }

        function startTracking() {
             if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    // Cập nhật vị trí lên Map...
                }, null, { enableHighAccuracy: true });
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
