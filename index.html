<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax Minimal - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #26ae90; --bg: #f5f6f7; --text: #2c3e50; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: var(--bg); }
        
        /* Bản đồ tông sáng tối giản */
        #map { position: absolute; inset: 0; z-index: 1; filter: grayscale(0.5) contrast(0.9) brightness(1.1); }

        /* HUD hiển thị tiền gọn gàng phía trên */
        .top-display {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: white; padding: 10px 25px; border-radius: 30px;
            display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .money-top { font-size: 20px; font-weight: 800; color: var(--text); }

        /* Bảng điều khiển dưới */
        .bottom-card {
            position: absolute; bottom: 0; width: 100%; z-index: 20;
            background: white; border-radius: 25px 25px 0 0; padding: 20px 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
        }
        .status-bar { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: var(--primary); font-weight: bold; font-size: 14px; }
        .status-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; margin-right: 8px; box-shadow: 0 0 10px var(--primary); }

        .nav-grid { display: flex; justify-content: space-around; padding: 0 10px; }
        .nav-item { text-align: center; color: #7f8c8d; text-decoration: none; font-size: 11px; font-weight: 600; width: 20%; cursor: pointer; }
        .nav-item span { display: block; font-size: 24px; margin-bottom: 8px; color: var(--primary); opacity: 0.8; }
        .nav-item:active span { transform: scale(0.9); }

        /* Nút bắt đầu nổi bật */
        .btn-main {
            width: 90%; margin: 15px auto; display: block; background: var(--primary);
            color: white; border: none; padding: 16px; border-radius: 15px;
            font-weight: 900; font-size: 16px; box-shadow: 0 4px 15px rgba(38, 174, 144, 0.3);
        }

        /* Popup thông báo chuyên nghiệp */
        #alertBox {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(3px);
        }
        .alert-content { background: white; padding: 30px; border-radius: 25px; width: 80%; text-align: center; }
        .alert-btn { background: #66cc88; color: white; border: none; padding: 14px; width: 100%; border-radius: 15px; font-weight: 700; margin-top: 20px; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="top-display">
    <span style="font-size: 20px;">💵</span>
    <div class="money-top" id="top-fare">0đ</div>
</div>

<div class="bottom-card">
    <div class="status-bar">
        <div class="status-dot"></div>
        <span id="stt-text">Đang trực tuyến</span>
    </div>

    <button class="btn-main" id="startBtn" onclick="toggleTrip()">▶ BẮT ĐẦU CHUYẾN</button>

    <div class="nav-grid">
        <a class="nav-item" onclick="customAlert('Đang làm mới vị trí...')"><span>🔄</span>Tạo cuốc</a>
        <a class="nav-item" onclick="customAlert('Nạp tiền sắp ra mắt!')"><span>💰</span>Nạp tiền</a>
        <a class="nav-item" onclick="customAlert('Lịch sử di chuyển trống')"><span>📊</span>Lịch sử</a>
        <a class="nav-item" onclick="customAlert('Chế độ cài đặt nâng cao')"><span>⚙️</span>Cài đặt</a>
    </div>
</div>

<div id="alertBox">
    <div class="alert-content">
        <h3 style="margin-top:0">THÔNG BÁO</h3>
        <p id="alertMsg" style="color:#666;"></p>
        <button class="alert-btn" onclick="document.getElementById('alertBox').style.display='none'">XÁC NHẬN</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Khởi tạo map tông sáng, ít chi tiết
    var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([20.95, 107.07], 16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
    
    // Marker xe kiểu Xanh SM
    var carIcon = L.circleMarker([0,0], { radius: 9, color: '#fff', weight: 3, fillColor: '#26ae90', fillOpacity: 1 }).addTo(map);

    let isRunning = false, watchId = null, totalKm = 0, lastPos = null;

    function customAlert(msg) {
        document.getElementById('alertMsg').innerText = msg;
        document.getElementById('alertBox').style.display = 'flex';
    }

    function toggleTrip() {
        const btn = document.getElementById('startBtn');
        if (!isRunning) {
            isRunning = true;
            btn.innerText = "⏹ KẾT THÚC CHUYẾN";
            btn.style.background = "#e74c3c";
            document.getElementById('stt-text').innerText = "Đang di chuyển...";
            startTracking();
        } else {
            isRunning = false;
            btn.innerText = "▶ BẮT ĐẦU CHUYẾN";
            btn.style.background = "#26ae90";
            document.getElementById('stt-text').innerText = "Đang trực tuyến";
            stopTracking();
        }
    }

    function startTracking() {
        watchId = navigator.geolocation.watchPosition(pos => {
            const cur = [pos.coords.latitude, pos.coords.longitude];
            map.flyTo(cur, 17, { animate: true, duration: 1.5 });
            carIcon.setLatLng(cur);

            if (lastPos && pos.coords.accuracy < 30) {
                const d = map.distance(lastPos, cur) / 1000;
                if (d > 0.002) {
                    totalKm += d;
                    document.getElementById('top-fare').innerText = Math.round(totalKm * 15000).toLocaleString() + "đ";
                }
            }
            lastPos = cur;
        }, null, { enableHighAccuracy: true });
    }

    function stopTracking() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        customAlert("Hoàn tất! Tổng tiền: " + document.getElementById('top-fare').innerText);
        totalKm = 0;
        document.getElementById('top-fare').innerText = "0đ";
    }
</script>
</body>
</html>
