<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi Pro - Business Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --xanh-sm: #00bfa5; --bg-card: #ffffff; --text-main: #2c3e50; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Lexend', sans-serif; }
        body { height: 100vh; background: #f0f2f5; overflow: hidden; display: flex; flex-direction: column; }

        /* BẢN ĐỒ 73% THEO YÊU CẦU */
        #map-area { height: 73vh; width: 100%; position: relative; }
        #map { height: 100%; width: 100%; z-index: 1; }

        /* Widget nổi: ID Tài xế & Gói Cước */
        .top-widgets { position: absolute; top: 12px; width: 100%; display: flex; justify-content: space-between; padding: 0 12px; z-index: 1000; }
        .driver-id { background: rgba(0,0,0,0.7); color: white; padding: 5px 12px; border-radius: 15px; font-size: 0.7rem; font-weight: bold; }
        .vip-status { background: linear-gradient(45deg, #f1c40f, #f39c12); color: white; padding: 5px 12px; border-radius: 15px; font-size: 0.7rem; font-weight: bold; box-shadow: 0 3px 8px rgba(0,0,0,0.2); }

        /* Nút Cài giá gọn gàng góc phải */
        .price-set { position: absolute; top: 50px; right: 12px; z-index: 1000; background: white; padding: 8px 12px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); font-weight: bold; font-size: 0.8rem; border: 1px solid #eee; }

        /* CARD ĐIỀU KHIỂN 27% DƯỚI */
        .control-panel { height: 27vh; background: var(--bg-card); border-top-left-radius: 30px; border-top-right-radius: 30px; z-index: 1001; position: relative; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); display: flex; flex-direction: column; padding: 15px; }

        /* Thanh trạng thái Online như Xanh SM */
        .status-online { background: #f8f9fa; border-radius: 15px; padding: 8px 15px; display: flex; align-items: center; margin-bottom: 12px; border: 1px solid #edf2f7; }
        .dot { height: 10px; width: 10px; background: #ccc; border-radius: 50%; margin-right: 10px; }
        .dot.active { background: var(--xanh-sm); box-shadow: 0 0 8px var(--xanh-sm); }
        .status-text { font-size: 0.85rem; font-weight: bold; color: #666; }

        /* Chỉ số VND và KM (Lấy cảm hứng từ ảnh 13) */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { background: #fdfdfd; padding: 10px; border-radius: 15px; text-align: center; border: 1px solid #f1f1f1; }
        .stat-box b { font-size: 1.5rem; color: var(--xanh-sm); display: block; }
        .stat-box span { font-size: 0.65rem; color: #999; text-transform: uppercase; }

        /* Hệ thống Menu 5 mục chuẩn Business */
        .nav-menu { display: flex; justify-content: space-between; border-top: 1px solid #eee; padding-top: 10px; }
        .nav-btn { flex: 1; text-align: center; text-decoration: none; color: #bdc3c7; font-size: 0.6rem; font-weight: bold; }
        .nav-btn.active { color: var(--xanh-sm); }
        .nav-btn i { font-size: 1.4rem; display: block; margin-bottom: 2px; }

        /* Nút Start/Stop nổi bật */
        .main-actions { display: flex; gap: 10px; position: absolute; top: -25px; left: 50%; transform: translateX(-50%); width: 90%; }
        .btn-sm { flex: 1; padding: 15px; border-radius: 15px; border: none; font-weight: bold; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div id="map-area">
        <div class="top-widgets">
            <div class="driver-id">ID: TX-7269</div>
            <div class="vip-status">⭐ GÓI: PRO</div>
        </div>
        <div class="price-set" onclick="changePrice()">⚙️ GIÁ: <span id="p-val">15</span>K/KM</div>
        <div id="map"></div>
    </div>

    <div class="control-panel">
        <div class="main-actions">
            <button id="goBtn" class="btn-sm" style="background:var(--xanh-sm)" onclick="toggleTrip(true)">▶ BẮT ĐẦU CHUYẾN</button>
            <button id="stopBtn" class="btn-sm" style="background:#ff5252" onclick="toggleTrip(false)">■ KẾT THÚC</button>
        </div>

        <div class="status-online" style="margin-top: 20px;">
            <div id="statusDot" class="dot"></div>
            <div id="statusTxt" class="status-text">Đang ngoại tuyến</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box"><b id="money">0</b><span>Cước phí (VND)</span></div>
            <div class="stat-box"><b id="km">0.00</b><span>Số KM đã đi</span></div>
        </div>

        <nav class="nav-menu">
            <a href="#" class="nav-btn active">🏠<br>Trang chủ</a>
            <a href="https://payos.vn" class="nav-btn">💰<br>Nạp tiền</a>
            <a href="#" class="nav-btn">📋<br>Lịch sử</a>
            <a href="#" class="nav-btn">👑<br>Gói VIP</a>
            <a href="#" class="nav-btn">⚙️<br>Quản lý</a>
        </nav>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', {zoomControl: false}).setView([20.95, 107.07], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let isRunning = false;
        let distance = 0;
        let price = 15;

        function toggleTrip(start) {
            isRunning = start;
            const dot = document.getElementById('statusDot');
            const txt = document.getElementById('statusTxt');
            
            if(start) {
                dot.classList.add('active');
                txt.innerText = "Đang trong chuyến bay...";
                txt.style.color = "var(--xanh-sm)";
                // Logic tính tiền GPS thực tế ở đây
            } else {
                alert("Kết thúc! Vui lòng thu tiền khách.");
                location.reload();
            }
        }

        function changePrice() {
            let p = prompt("Nhập giá cước mới (K/KM):", price);
            if(p) { price = p; document.getElementById('p-val').innerText = p; }
        }
    </script>
</body>
</html>
