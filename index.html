<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax Elite - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --pro-green: #27ae60; --pro-blue: #2980b9; --pro-orange: #f39c12; --bg-glass: rgba(255, 255, 255, 0.98); }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', 'Segoe UI', sans-serif; overflow: hidden; background: #eceff1; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* 🟢 Đèn Trạng Thái - Sang Trọng */
        .online-badge {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: var(--pro-green); color: white;
            padding: 6px 18px; border-radius: 30px; font-size: 11px; font-weight: 800;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); letter-spacing: 0.5px;
        }

        /* 🏗️ Cột Icon Trái - Mỏng & Tinh Tế */
        .side-stack {
            position: absolute; top: 50px; left: 12px; z-index: 100;
            display: flex; flex-direction: column; gap: 8px;
        }
        .info-pill {
            width: 100px; height: 28px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 900; box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }
        .p-gold { background: #f1c40f; color: #333; }
        .p-dark { background: #2c3e50; color: #fff; }
        .p-btn { background: #fff; color: var(--pro-green); border: 2px solid var(--pro-green); cursor: pointer; }

        /* 📟 HUD Premium - Nét Căng */
        .hud-display {
            position: absolute; bottom: 175px; width: 92%; left: 4%; z-index: 100;
            background: var(--bg-glass); border-radius: 20px; display: flex; padding: 18px 0;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12); border: 1px solid #fff;
        }
        .hud-unit { flex: 1; text-align: center; }
        .hud-unit:first-child { border-right: 1px solid #f0f0f0; }
        .main-num { font-size: 40px; font-weight: 900; line-height: 1; margin-bottom: 5px; }
        .sub-txt { font-size: 10px; color: #95a5a6; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .time-badge { 
            display: inline-block; background: #fff3e0; color: #e67e22; 
            padding: 3px 10px; border-radius: 6px; font-size: 14px; font-weight: 900; margin-top: 8px;
            border: 1px solid #ffcc80;
        }

        /* 📱 Footer Area - Chống Ấn Nhầm */
        .footer-nav {
            position: absolute; bottom: 0; width: 100%; z-index: 200;
            background: #fff; border-top-left-radius: 28px; border-top-right-radius: 28px;
            padding-top: 20px; box-shadow: 0 -10px 40px rgba(0,0,0,0.08);
        }
        .action-row { width: 90%; margin: 0 auto 18px auto; display: flex; gap: 12px; }
        .btn-ui { padding: 16px; border-radius: 16px; font-weight: 900; font-size: 16px; border: none; transition: 0.3s; }
        .btn-ui:active { transform: scale(0.96); opacity: 0.9; }
        .btn-go { flex: 2; background: var(--pro-green); color: white; box-shadow: 0 6px 20px rgba(39,174,96,0.3); }
        .btn-stop { flex: 1; background: #fff; color: #e74c3c; border: 2.5px solid #e74c3c; }

        .nav-links { display: flex; justify-content: space-around; padding-bottom: 10px; }
        .nav-link { text-align: center; color: #bdc3c7; font-size: 11px; font-weight: 800; flex: 1; cursor: pointer; }
        .nav-link span { display: block; font-size: 26px; margin-bottom: 5px; transition: 0.2s; }
        .nav-link.active { color: var(--pro-green); }
        .nav-link:active span { transform: translateY(-3px); }

        .dev-sign {
            background: #fdfdfd; text-align: center; padding: 8px 0;
            font-size: 10px; color: #cbd5e0; font-weight: bold; letter-spacing: 1.5px;
            border-top: 1px solid #f7fafc;
        }
    </style>
</head>
<body>

<div class="online-badge">● ĐANG TRỰC TUYẾN</div>
<div id="map"></div>

<div class="side-stack">
    <div class="info-pill p-gold">GÓI: VIP FREE</div>
    <div class="info-pill p-dark">ID: TX-7269</div>
    <div class="info-pill p-btn" onclick="updatePrice()">⚙️ GIÁ: <span id="lbl-price">15.000</span></div>
</div>

<div class="hud-display">
    <div class="hud-unit">
        <div class="main-num" style="color: var(--pro-green);" id="cur-money">0</div>
        <div class="sub-txt">VNĐ CƯỚC PHÍ</div>
    </div>
    <div class="hud-unit">
        <div class="main-num" style="color: var(--pro-blue);" id="cur-km">0.00</div>
        <div class="sub-txt">KM ĐÃ CHẠY</div>
        <div class="time-badge" id="cur-time">⏱ 00:00</div>
    </div>
</div>

<div class="footer-nav">
    <div class="action-row">
        <button class="btn-ui btn-go" onclick="launch()">▶ BẮT ĐẦU CHUYẾN</button>
        <button class="btn-ui btn-stop" onclick="location.reload()">KẾT THÚC</button>
    </div>
    <div class="nav-links">
        <div class="nav-link active" onclick="location.reload()"><span>🏠</span>Trang chủ</div>
        <div class="nav-link" onclick="window.open('https://payos.vn', '_blank')"><span>💰</span>Nạp tiền</div>
        <div class="nav-link" onclick="alert('Lịch sử di chuyển đang tải...')"><span>📊</span>Lịch sử</div>
        <div class="nav-link" onclick="alert('Cấu hình hệ thống...')"><span>⚙️</span>Quản lý</div>
    </div>
    <div class="dev-sign">HỆ THỐNG PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([20.95, 107.07], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

    let count = 0;
    let drive;

    function launch() {
        if(drive) return;
        alert("GPS ĐÃ SẴN SÀNG - CHÚC ANH ĐẠT LÁI XE AN TOÀN!");
        drive = setInterval(() => {
            count++;
            let mm = Math.floor(count/60);
            let ss = count%60;
            document.getElementById('cur-time').innerText = "⏱ " + (mm<10?"0"+mm:mm) + ":" + (ss<10?"0"+ss:ss);
            let k = parseFloat(document.getElementById('cur-km').innerText);
            document.getElementById('cur-km').innerText = (k + 0.01).toFixed(2);
        }, 1000);
    }

    function updatePrice() {
        let p = prompt("Cài đặt giá mới (VNĐ/KM):", "15000");
        if(p) document.getElementById('lbl-price').innerText = parseInt(p).toLocaleString();
    }
</script>
</body>
</html>
