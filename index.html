<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAXI PROMAX - NGUYỄN XUÂN ĐẠT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #00bfa5; --dark: #1a1d21; --gold: #ffc107; --danger: #ff5252; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background: #f4f7f6; }
        
        #map { height: 100vh; width: 100vw; z-index: 1; }

        /* Giao diện Header */
        .header { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 1000; }
        .badge { background: white; padding: 8px 15px; border-radius: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); font-size: 12px; font-weight: bold; border: 1px solid #eee; }

        /* Chỉ số cuốc xe */
        .stats-bar { position: fixed; top: 60px; left: 10px; right: 10px; background: rgba(255,255,255,0.96); backdrop-filter: blur(10px); border-radius: 15px; display: flex; padding: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); z-index: 1000; }
        .stat-item { flex: 1; text-align: center; }
        .stat-value { font-size: 24px; font-weight: 900; color: #00796b; }

        /* Bảng thông báo lời chúc tinh tế */
        #customAlert { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); z-index: 11000; text-align: center; display: none; width: 80%; max-width: 300px; }
        #customAlert b { color: var(--primary); font-size: 18px; }
        #customAlert button { margin-top: 15px; padding: 10px 30px; border-radius: 15px; border: none; background: var(--primary); color: white; font-weight: bold; }

        /* Dưới chân App - Bản quyền anh Đạt */
        .footer-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px 20px 5px; z-index: 1000; border-radius: 25px 25px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); }
        .copyright { text-align: center; font-size: 10px; color: #aaa; margin-top: 10px; font-style: italic; }
        
        /* Nút bấm và thanh trượt */
        .price-info { text-align: center; margin-bottom: 10px; font-size: 13px; }
        .btn-action { width: 100%; padding: 16px; border-radius: 15px; border: none; background: var(--primary); color: white; font-size: 18px; font-weight: bold; transition: 0.3s; }
        .btn-action.stop { background: var(--danger); }

        /* Icon xe hơi rực rỡ */
        .car-icon { filter: drop-shadow(0 0 5px rgba(255,0,0,0.5)); }

        /* Status Offline */
        #offlineMode { position: fixed; top: 120px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 5px 15px; border-radius: 10px; font-size: 10px; z-index: 2000; display: none; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="offlineMode">📡 Đang chạy chế độ Offline (Mất sóng)</div>

    <div id="customAlert">
        <div style="font-size: 40px;">🌸</div>
        <b id="alertMsg">Thượng lộ bình an!</b>
        <br><button onclick="closeAlert()">ĐỒNG Ý</button>
    </div>

    <div class="header">
        <div class="badge" id="idShow">🆔 TX-PRO</div>
        <div class="badge" style="background:var(--gold)">⭐ GÓI: MIỄN PHÍ</div>
    </div>

    <div class="stats-bar">
        <div class="stat-item" style="border-right: 1px solid #eee;">
            <div style="font-size: 10px; color: #888;">CƯỚC PHÍ (VNĐ)</div>
            <div id="cost" class="stat-value">0</div>
        </div>
        <div class="stat-item">
            <div style="font-size: 10px; color: #888;">QUÃNG ĐƯỜNG (KM)</div>
            <div id="km" class="stat-value">0.00</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="footer-panel">
        <div class="price-info">Đơn giá: <b id="rateLabel" style="color:var(--danger)">15,000</b> đ/KM</div>
        <input type="range" min="10000" max="50000" step="1000" value="15000" style="width:100%; margin-bottom:15px;" oninput="updateRate(this.value)">
        
        <button id="mainBtn" class="btn-action" onclick="handleTrip()">BẮT ĐẦU CHUYẾN ĐI</button>
        
        <div class="copyright">Phát triển bởi Nguyễn Xuân Đạt • Version 3.0 Platinum</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Quản lý ID và Offline
        const TX_ID = localStorage.getItem('tx_id') || 'TX-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        localStorage.setItem('tx_id', TX_ID);
        document.getElementById('idShow').innerText = "🆔 " + TX_ID;

        window.addEventListener('offline', () => document.getElementById('offlineMode').style.display = 'block');
        window.addEventListener('online', () => document.getElementById('offlineMode').style.display = 'none');

        // 2. Cấu hình Bản đồ & Điểm xe rõ ràng
        var map = L.map('map', {zoomControl: false}).setView([20.95, 107.05], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var carIcon = L.divIcon({
            className: 'car-icon',
            html: `<div style="background:red; width:15px; height:15px; border-radius:50%; border:3px solid white; box-shadow:0 0 10px rgba(0,0,0,0.5);"></div>`,
            iconSize: [20, 20]
        });

        var marker = L.marker([20.95, 107.05], {icon: carIcon}).addTo(map);

        // 3. Logic Tính tiền Chuẩn 100% (Chống nhảy ảo)
        let isRunning = false, totalKm = 0, lastPos = null, currentRate = 15000;

        function updateRate(v) { 
            currentRate = v; 
            document.getElementById('rateLabel').innerText = parseInt(v).toLocaleString(); 
        }

        function myAlert(msg) {
            document.getElementById('alertMsg').innerHTML = msg;
            document.getElementById('customAlert').style.display = 'block';
        }
        function closeAlert() { document.getElementById('customAlert').style.display = 'none'; }

        function handleTrip() {
            isRunning = !isRunning;
            const btn = document.getElementById('mainBtn');
            if(isRunning) {
                btn.innerText = "DỪNG CHUYẾN ĐI (KẾT THÚC)";
                btn.classList.add('stop');
                myAlert("Chúc Anh/Chị lên đường<br><b>THƯỢNG LỘ BÌNH AN!</b>");
                totalKm = 0; lastPos = null; // Reset khi bắt đầu
                map.locate({watch: true, enableHighAccuracy: true});
            } else {
                btn.innerText = "BẮT ĐẦU CHUYẾN ĐI";
                btn.classList.remove('stop');
                map.stopLocate();
                myAlert("Hành trình kết thúc.<br>Cảm ơn quý khách!");
            }
        }

        map.on('locationfound', (e) => {
            const currentPos = e.latlng;
            marker.setLatLng(currentPos);
            map.panTo(currentPos);

            if(isRunning) {
                if(lastPos) {
                    let d = currentPos.distanceTo(lastPos) / 1000;
                    // CHỈ TÍNH NẾU DI CHUYỂN TRÊN 10 MÉT ĐỂ CHỐNG NHIỄU GPS
                    if(d > 0.01) { 
                        totalKm += d;
                        lastPos = currentPos;
                        updateUI();
                    }
                } else {
                    lastPos = currentPos; // Gán vị trí xuất phát thực tế
                }
            }
        });

        function updateUI() {
            document.getElementById('km').innerText = totalKm.toFixed(2);
            document.getElementById('cost').innerText = Math.floor(totalKm * currentRate).toLocaleString();
        }

        // Chống xem code cơ bản
        setInterval(() => { if(window.outerHeight - window.innerHeight > 200) location.reload(); }, 1000);
    </script>
</body>
</html>
