<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax Infinity - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main-green: #2ecc71; --main-blue: #3498db; --glass: rgba(255, 255, 255, 0.9); }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #f4f7f6; overflow: hidden; }
        
        /* 1. Bản đồ tông xám trắng siêu sang */
        #map { position: absolute; inset: 0; z-index: 1; } 

        /* 2. Header tinh tế */
        .top-bar {
            position: absolute; top: 12px; width: 92%; left: 4%; z-index: 10;
            display: flex; justify-content: space-between;
        }
        .info-pill { 
            background: rgba(0,0,0,0.75); color: white; padding: 6px 14px; 
            border-radius: 20px; font-size: 11px; backdrop-filter: blur(5px); font-weight: bold;
        } 

        /* 3. Smart HUD */
        .smart-hud {
            position: absolute; bottom: 190px; width: 92%; left: 4%; z-index: 10;
            background: var(--glass); border-radius: 25px; backdrop-filter: blur(10px);
            display: flex; padding: 15px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .hud-col { flex: 1; text-align: center; }
        .hud-col:first-child { border-right: 1px solid rgba(0,0,0,0.05); }
        .money { font-size: 32px; color: var(--main-green); font-weight: 900; line-height: 1; }
        .km { font-size: 28px; color: var(--main-blue); font-weight: 900; line-height: 1; }
        .label { font-size: 10px; color: #888; text-transform: uppercase; margin-top: 8px; font-weight: bold; } 

        /* 4. Bottom Control Panel */
        .bottom-panel {
            position: absolute; bottom: 0; width: 100%; z-index: 20;
            background: white; border-radius: 30px 30px 0 0;
            padding: 20px 0 10px 0; box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
        }
        .main-btns { width: 90%; margin: 0 auto 15px auto; display: flex; gap: 10px; }
        .btn-go { flex: 2; background: var(--main-green); color: white; border: none; padding: 16px; border-radius: 18px; font-weight: 900; font-size: 16px; transition: 0.3s; }
        .btn-stop { flex: 1; background: #fff; color: #e74c3c; border: 2px solid #e74c3c; border-radius: 18px; font-weight: bold; } 

        /* Fix lỗi Icon không hoạt động */
        .nav-icons { display: flex; justify-content: space-around; width: 95%; margin: 0 auto; border-top: 1px solid #f8f8f8; padding-top: 12px; }
        .nav-item { text-align: center; color: #bdc3c7; text-decoration: none; font-size: 10px; font-weight: bold; width: 25%; cursor: pointer; }
        .nav-item span { display: block; font-size: 24px; margin-bottom: 4px; }
        .nav-item.active { color: var(--main-green); }

        /* Popup Thông báo (Xanh SM style) */
        #customPopup {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px);
        }
        .popup-box { background: white; padding: 30px; border-radius: 25px; width: 80%; text-align: center; }
        .popup-btn { background: #66cc88; color: white; border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: 900; margin-top: 20px; }
    </style>
</head>
<body> 

<div id="map"></div> 

<div class="top-bar">
    <div class="info-pill">🆔 TX-DAT-2026</div>
    <div class="info-pill" style="background: #f1c40f; color: #000;">⚡ GÓI: FREE</div>
</div> 

<div class="bottom-panel">
    <div style="text-align: center; color: var(--main-green); font-size: 13px; font-weight: bold; margin-bottom: 15px;">● Đang trực tuyến</div>
    <div class="main-btns">
        <button class="btn-go" id="startBtn" onclick="startTrip()">⚡ BẮT ĐẦU CHUYẾN</button>
        <button class="btn-stop" onclick="stopTrip()">KẾT THÚC</button>
    </div> 

    <div class="nav-icons">
        <a class="nav-item active"><span>🏠</span>Trang chủ</a>
        <a onclick="showPopup('Tính năng Nạp tiền đang được bảo trì!')" class="nav-item"><span>💰</span>Nạp tiền</a>
        <a onclick="showPopup('Lịch sử di chuyển của anh đang trống.')" class="nav-item"><span>📊</span>Lịch sử</a>
        <a onclick="showPopup('Đang mở cài đặt quản lý...')" class="nav-item"><span>⚙️</span>Quản lý</a>
    </div>
    <div style="text-align: center; font-size: 9px; color: #eee; margin-top: 10px;">PHÁT TRIỂN BỞI: NGUYEN XUAN DAT</div>
</div> 

<div class="smart-hud">
    <div class="hud-col">
        <div class="money" id="fare-txt">0</div>
        <div class="label">VNĐ</div>
    </div>
    <div class="hud-col">
        <div class="km" id="km-txt">0.00</div>
        <div class="label">KILÔMÉT</div>
    </div>
</div>

<div id="customPopup">
    <div class="popup-box">
        <h3 style="margin: 0; color: #333;">THÔNG BÁO</h3>
        <p id="popup-msg" style="color: #666; margin-top: 15px;"></p>
        <button class="popup-btn" onclick="closePopup()">XÁC NHẬN</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Bản đồ tông xám trắng cực sang
    var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([20.95, 107.07], 16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
    
    var carIcon = L.circleMarker([0,0], { radius: 9, color: '#fff', weight: 3, fillColor: '#2ecc71', fillOpacity: 1 }).addTo(map); 

    let kmPrice = 15000, totalKm = 0, watchId = null, lastLoc = null; 

    function showPopup(msg) {
        document.getElementById('popup-msg').innerText = msg;
        document.getElementById('customPopup').style.display = 'flex';
    }
    function closePopup() { document.getElementById('customPopup').style.display = 'none'; }

    function startTrip() {
        if(watchId) return;
        document.getElementById('startBtn').style.background = '#1b5e20';
        document.getElementById('startBtn').innerText = "● ĐANG CHUYỂN BÁNH";
        
        watchId = navigator.geolocation.watchPosition(pos => {
            const current = [pos.coords.latitude, pos.coords.longitude];
            map.flyTo(current, 17, { animate: true, duration: 1.5 });
            carIcon.setLatLng(current); 

            if (lastLoc && pos.coords.accuracy < 35) {
                const d = map.distance(lastLoc, current) / 1000;
                if (d > 0.003) { 
                    totalKm += d; 
                    document.getElementById('km-txt').innerText = totalKm.toFixed(2);
                    document.getElementById('fare-txt').innerText = Math.round(totalKm * kmPrice).toLocaleString('vi-VN');
                }
            }
            lastLoc = current;
        }, null, { enableHighAccuracy: true });
    } 

    function stopTrip() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        watchId = null; lastLoc = null;
        document.getElementById('startBtn').style.background = '#2ecc71';
        document.getElementById('startBtn').innerText = "⚡ BẮT ĐẦU CHUYẾN";
        showPopup("Kết thúc chuyến đi thành công!\nTổng tiền: " + document.getElementById('fare-txt').innerText + " VNĐ");
    }
</script>
</body>
</html>
