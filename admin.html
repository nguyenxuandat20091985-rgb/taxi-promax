<!DOCTYPE html>
<html>
<head>
    <title>QUẢN TRỊ TAXI PROMAX</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body style="background:#1a1a1a; color:white; font-family:sans-serif; padding:20px;">
    <h2>🎛️ BẢNG ĐIỀU KHIỂN</h2>
    <div style="background:#333; padding:15px; border-radius:10px;">
        <p>Trạng thái hệ thống: <b id="status">Đang tải...</b></p>
        <button onclick="toggleMaintenance()" style="padding:10px; background:red; color:white; border:none; border-radius:5px;">BẬT/TẮT BẢO TRÌ</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDWX-YyE_1-F0yNqW9Kk8-G-Y4fG-Z-Y4f",
            authDomain: "taxi-promax-9f79b.firebaseapp.com",
            databaseURL: "https://taxi-promax-9f79b-default-rtdb.firebaseio.com",
            projectId: "taxi-promax-9f79b",
            storageBucket: "taxi-promax-9f79b.appspot.com",
            messagingSenderId: "338804599298",
            appId: "1:338804599298:web:12704381270438"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Lắng nghe trạng thái
        db.ref('systemStatus').on('value', (s) => {
            document.getElementById('status').innerText = s.val() === 'off' ? 'ĐANG BẢO TRÌ' : 'HOẠT ĐỘNG';
        });

        function toggleMaintenance() {
            db.ref('systemStatus').once('value').then(s => {
                db.ref('systemStatus').set(s.val() === 'on' ? 'off' : 'on');
            });
        }
    </script>
</body>
</html>
