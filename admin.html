<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - HỆ THỐNG TAXI</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #00bfa5; --dark: #002d26; }
        body { font-family: sans-serif; margin: 0; background: #f4f7f6; }
        .nav-header { background: var(--dark); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        #map { height: 350px; width: 100%; }
        .p-section { background: white; margin: 15px; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .status-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .link-tet { color: #d32f2f; text-decoration: none; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="nav-header">
        <span>📍 QUẢN LÝ VẬN HÀNH</span>
        <a href="letet.html" class="link-tet">🧧 CÀI ĐẶT LỄ TẾT</a>
    </div>

    <div id="map"></div>

    <div class="p-section">
        <h3>QUẢN LÝ APP</h3>
        <button class="status-btn" style="background: #e74c3c; color: white;" onclick="confirmAction('Bảo trì')">⛔ BẬT CHẾ ĐỘ BẢO TRÌ</button>
        <button class="status-btn" style="background: var(--primary); color: white;" onclick="confirmAction('Cập nhật')">🔄 GỬI THÔNG BÁO CẬP NHẬT</button>
        <p style="font-size: 12px; color: #666;">* Trạng thái Webhook: <b id="st">ONLINE</b></p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([21.0285, 105.8542], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        function confirmAction(act) { alert("Hệ thống: Đã kích hoạt lệnh " + act); }
    </script>
</body>
</html>
