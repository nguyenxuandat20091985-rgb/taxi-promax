<div id="ai-root" style="position: fixed; top: 75%; left: 80%; z-index: 10000; touch-action: none;">
    <div id="ai-btn" style="width: 75px; height: 75px; background: linear-gradient(135deg, #00bfa5, #004d40); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 25px rgba(0,191,165,0.6); cursor: move; border: 2px solid #fff; position: relative; transition: transform 0.2s;">
        <img src="https://cdn-icons-png.flaticon.com/512/2593/2593635.png" style="width: 80%; height: 80%; pointer-events: none;">
        <span class="ai-pulse"></span>
    </div>

    <div id="ai-box" style="display: none; width: 320px; height: 480px; background: rgba(255,255,255,0.98); border-radius: 25px; position: absolute; bottom: 85px; right: 0; box-shadow: 0 20px 60px rgba(0,0,0,0.3); flex-direction: column; overflow: hidden; border: 1px solid rgba(0,191,165,0.3); backdrop-filter: blur(15px); pointer-events: auto;">
        <div style="background: linear-gradient(90deg, #00bfa5, #004d40); color: white; padding: 18px; font-weight: 800; display: flex; justify-content: space-between; align-items: center;">
            <span>🚀 TAXI AI PROMAX</span>
            <span onclick="toggleAI()" style="cursor:pointer; font-size: 22px; padding: 0 10px;">×</span>
        </div>
        
        <div id="ai-msg-list" style="flex: 1; padding: 15px; overflow-y: auto; background: #f0f4f3; display: flex; flex-direction: column; gap: 12px; font-family: sans-serif;"></div>
        
        <div style="padding: 15px; background: white; border-top: 1px solid #eee; display: flex; gap: 8px; align-items: center;">
            <button id="ai-voice-btn" onclick="startVoice()" style="border: none; background: #00bfa5; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">🎙️</button>
            <input id="ai-query" type="text" placeholder="Hỏi gì đi đại ca..." style="flex: 1; border: 2px solid #f0f0f0; border-radius: 30px; padding: 10px 15px; outline: none; font-size: 14px;">
            <button onclick="callAI()" style="border: none; background: #00bfa5; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">➤</button>
        </div>
    </div>
</div>

<style>
.ai-pulse { position: absolute; width: 100%; height: 100%; background: #00bfa5; border-radius: 50%; z-index: -1; animation: pulse-ring 2s infinite; }
@keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.8; } 100% { transform: scale(1.8); opacity: 0; } }
#ai-msg-list div { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4; }
.msg-ai { background: white; align-self: flex-start; box-shadow: 0 3px 10px rgba(0,0,0,0.05); border-bottom-left-radius: 4px !important; color: #333; }
.msg-user { background: #00bfa5; color: white; align-self: flex-end; border-bottom-right-radius: 4px !important; box-shadow: 0 4px 12px rgba(0,191,165,0.2); }
</style>
