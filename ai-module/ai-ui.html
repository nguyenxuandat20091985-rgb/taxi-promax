<div id="ai-root" style="position: fixed; top: 75%; left: 80%; z-index: 10000; touch-action: none;">
    <div id="ai-btn" style="width: 75px; height: 75px; background: radial-gradient(circle at 30% 30%, #ffffff, #d1d1d1); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: move; position: relative; border: 2px solid #00bfa5; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <div style="width: 42px; height: 32px; background: #f0f0f0; border-radius: 10px; position: relative; display: flex; align-items: center; justify-content: space-around; padding: 0 5px; border: 1.5px solid #00bfa5; box-shadow: inset -2px -2px 5px rgba(0,0,0,0.1);">
            <div style="width: 8px; height: 8px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 8px #00ffcc; animation: blink 2s infinite;"></div>
            <div style="width: 8px; height: 8px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 8px #00ffcc; animation: blink 2s infinite;"></div>
            <div style="position: absolute; top: -8px; width: 2px; height: 8px; background: #00bfa5;">
                <div style="position: absolute; top: -4px; left: -2px; width: 6px; height: 6px; background: #ff5252; border-radius: 50%; box-shadow: 0 0 5px #ff5252;"></div>
            </div>
        </div>
        <span class="ai-pulse"></span>
    </div>

    <div id="ai-box" style="display: none; width: 330px; height: 500px; background: #ffffff; border-radius: 30px; position: absolute; bottom: 90px; right: 0; box-shadow: 0 20px 50px rgba(0,0,0,0.15); flex-direction: column; overflow: hidden; border: 1px solid #e0f2f1; pointer-events: auto; animation: slideUp 0.3s ease-out;">
        
        <div style="background: linear-gradient(135deg, #00bfa5, #26a69a); color: white; padding: 20px; font-weight: 800; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 20px;">🤖</span>
                <span style="letter-spacing: 0.5px; font-family: sans-serif;">TAXI AI PROMAX</span>
            </div>
            <span onclick="toggleAI()" style="cursor:pointer; font-size: 28px; line-height: 1;">×</span>
        </div>
        
        <div id="ai-msg-list" style="flex: 1; padding: 20px; overflow-y: auto; background: #f8fffe; display: flex; flex-direction: column; gap: 15px; font-family: 'Segoe UI', Arial, sans-serif;"></div>
        
        <div style="padding: 15px; background: white; border-top: 1px solid #f0f0f0; display: flex; gap: 10px; align-items: center;">
            <button id="ai-voice-btn" onclick="startVoice()" style="border: none; background: #ff5252; color: white; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(255,82,82,0.3);">🎙️</button>
            <input id="ai-query" type="text" placeholder="Hỏi đường, giá cước..." style="flex: 1; border: 2px solid #00bfa5; border-radius: 30px; padding: 12px 18px; outline: none; font-size: 15px; color: #333;">
            <button onclick="callAI()" style="border: none; background: #00bfa5; color: white; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,191,165,0.3);">➤</button>
        </div>
    </div>
</div>

<style>
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.ai-pulse { position: absolute; width: 100%; height: 100%; background: rgba(0,191,165,0.25); border-radius: 50%; z-index: -1; animation: pulse-ring 2s infinite; }
@keyframes pulse-ring { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }
#ai-msg-list div { max-width: 85%; padding: 14px 18px; border-radius: 20px; font-size: 15px; line-height: 1.5; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
.msg-ai { background: #ffffff; align-self: flex-start; border: 1px solid #e0f2f1; color: #2c3e50; border-bottom-left-radius: 5px !important; }
.msg-user { background: #00bfa5; color: white; align-self: flex-end; border-bottom-right-radius: 5px !important; }
</style>
