<div id="ai-root" style="position: fixed; bottom: 85px; right: 20px; z-index: 10000; font-family: 'Segoe UI', sans-serif;">
    <div id="ai-btn" onclick="toggleAI()" style="width: 65px; height: 65px; background: linear-gradient(135deg, #00bfa5, #004d40); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 0 20px rgba(0,191,165,0.6); cursor: pointer; font-size: 30px; border: 2px solid #fff; transition: 0.3s; position: relative;">
        🤖
        <span class="ai-pulse"></span>
    </div>

    <div id="ai-box" style="display: none; width: 330px; height: 480px; background: rgba(255,255,255,0.98); border-radius: 25px; position: absolute; bottom: 80px; right: 0; box-shadow: 0 20px 60px rgba(0,0,0,0.3); flex-direction: column; overflow: hidden; border: 1px solid rgba(0,191,165,0.3); backdrop-filter: blur(15px);">
        <div style="background: #00bfa5; color: white; padding: 18px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; letter-spacing: 1px;">
            <span>✨ TAXI AI ASSISTANT</span>
            <span onclick="toggleAI()" style="cursor:pointer; font-size: 20px;">×</span>
        </div>
        
        <div id="ai-msg-list" style="flex: 1; padding: 15px; overflow-y: auto; font-size: 14px; background: #f0f4f3; display: flex; flex-direction: column; gap: 12px;"></div>
        
        <div style="padding: 15px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px;">
            <input id="ai-query" type="text" placeholder="Hỏi gì đi đại ca..." style="flex: 1; border: 2px solid #f0f0f0; border-radius: 30px; padding: 10px 18px; outline: none; transition: 0.3s;">
            <button onclick="callAI()" style="border: none; background: #00bfa5; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0,191,165,0.4);">
                ➤
            </button>
        </div>
    </div>
</div>

<style>
.ai-pulse { position: absolute; width: 100%; height: 100%; background: #00bfa5; border-radius: 50%; z-index: -1; animation: pulse-ring 2s infinite; }
@keyframes pulse-ring {
    0% { transform: scale(0.8); opacity: 0.8; }
    100% { transform: scale(1.6); opacity: 0; }
}
#ai-msg-list div { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; font-weight: 500; }
.msg-ai { background: white; align-self: flex-start; color: #1a1a1a; box-shadow: 0 3px 10px rgba(0,0,0,0.05); border-bottom-left-radius: 4px !important; }
.msg-user { background: #00bfa5; color: white; align-self: flex-end; border-bottom-right-radius: 4px !important; box-shadow: 0 4px 12px rgba(0,191,165,0.2); }
#ai-query:focus { border-color: #00bfa5; }
</style>
