<div id="ai-root" style="position: fixed; top: 75%; left: 80%; z-index: 10000; touch-action: none;">
    <div id="ai-btn" style="width: 70px; height: 70px; background: linear-gradient(135deg, #00bfa5, #ffffff); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: move; position: relative; border: 3px solid #00bfa5; box-shadow: 0 8px 20px rgba(0,191,165,0.4);">
        <div style="width: 38px; height: 28px; background: #333; border-radius: 6px; position: relative; display: flex; align-items: center; justify-content: space-around; padding: 0 4px; border: 2px solid #fff;">
            <div style="width: 7px; height: 7px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 5px #00ffcc; animation: blink 1.5s infinite;"></div>
            <div style="width: 7px; height: 7px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 5px #00ffcc; animation: blink 1.5s infinite;"></div>
            <div style="position: absolute; width: 4px; height: 10px; background: #333; left: -5px; border-radius: 2px 0 0 2px; border-left: 2px solid #fff;"></div>
            <div style="position: absolute; width: 4px; height: 10px; background: #333; right: -5px; border-radius: 0 2px 2px 0; border-right: 2px solid #fff;"></div>
        </div>
        <span class="ai-pulse"></span>
    </div>

    <div id="ai-box" style="display: none; width: 330px; height: 480px; background: #ffffff; border-radius: 25px; position: absolute; bottom: 85px; right: 0; box-shadow: 0 15px 40px rgba(0,0,0,0.15); flex-direction: column; overflow: hidden; border: 1px solid #e0f2f1; pointer-events: auto;">
        
        <div style="background: linear-gradient(135deg, #00bfa5, #26a69a); color: white; padding: 18px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 10px rgba(0,191,165,0.2);">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span>🤖</span>
                <span style="letter-spacing: 0.5px;">TAXI AI PROMAX</span>
            </div>
            <span onclick="toggleAI()" style="cursor:pointer; font-size: 26px; padding: 0 5px; line-height: 1;">×</span>
        </div>
        
        <div id="ai-msg-list" style="flex: 1; padding: 15px; overflow-y: auto; background: #f4fdfb; display: flex; flex-direction: column; gap: 12px; font-family: 'Segoe UI', sans-serif;"></div>
        
        <div style="padding: 12px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px; align-items: center;">
            <button id="ai-voice-btn" onclick="startVoice()" style="border: none; background: #e0f2f1; color: #00bfa5; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 20px; transition: 0.3s;">🎙️</button>
            <input id="ai-query" type="text" placeholder="Hỏi đường, giá cước..." style="flex: 1; border: 1.5px solid #00bfa5; background: #fff; border-radius: 25px; padding: 10px 15px; outline: none; color: #333; font-size: 14px;">
            <button onclick="callAI()" style="border: none; background: #00bfa5; color: white; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; box-shadow: 0 4px 10px rgba(0,191,165,0.3);">➤</button>
        </div>
    </div>
</div>

<style>
@keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
.ai-pulse { position: absolute; width: 100%; height: 100%; background: rgba(0,191,165,0.2); border-radius: 50%; z-index: -1; animation: pulse-ring 2.5s infinite; }
@keyframes pulse-ring { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
#ai-msg-list div { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
.msg-ai { background: #ffffff; align-self: flex-start; color: #333; border: 1px solid #e0f2f1; border-bottom-left-radius: 4px !important; }
.msg-user { background: #00bfa5; color: white; align-self: flex-end; border-bottom-right-radius: 4px !important; }
</style>
