<div id="ai-root" style="position: fixed; top: 75%; left: 82%; z-index: 10000; touch-action: none;">
    <div id="ai-btn" style="width: 72px; height: 72px; background: radial-gradient(circle at 35% 35%, #00fbff 0%, #008080 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: move; position: relative; border: 2.5px solid #fff; box-shadow: 0 10px 25px rgba(0,128,128,0.4);">
        <div style="width: 40px; height: 30px; background: #fff; border-radius: 10px; position: relative; display: flex; align-items: center; justify-content: space-around; border: 2px solid #008080;">
            <div style="width: 7px; height: 7px; background: #00fbff; border-radius: 50%; box-shadow: 0 0 10px #00fbff; animation: blink 1.5s infinite;"></div>
            <div style="width: 7px; height: 7px; background: #00fbff; border-radius: 50%; box-shadow: 0 0 10px #00fbff; animation: blink 1.5s infinite;"></div>
        </div>
        <span class="ai-pulse"></span>
    </div>

    <div id="ai-box" style="display: none; width: 330px; height: 480px; background: #ffffff; border-radius: 28px; position: absolute; bottom: 85px; right: 0; box-shadow: 0 20px 50px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; border: 1px solid #008080; animation: slideUp 0.3s ease-out;">
        <div style="background: #008080; color: white; padding: 18px; font-weight: 700; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 10px; height: 10px; background: #00fbff; border-radius: 50%;"></div>
                <span style="font-size: 15px;">TAXI AI PROMAX</span>
            </div>
            <span onclick="toggleAI()" style="cursor:pointer; font-size: 24px;">&times;</span>
        </div>
        <div id="ai-msg-list" style="flex: 1; padding: 15px; overflow-y: auto; background: #f8ffff; display: flex; flex-direction: column; gap: 10px;"></div>
        <div style="padding: 12px; background: white; border-top: 1px solid #eee; display: flex; gap: 8px; align-items: center;">
            <button onclick="startVoice()" style="border: none; background: #e0f2f1; color: #008080; width: 42px; height: 42px; border-radius: 50%; cursor: pointer;">🎙️</button>
            <input id="ai-query" type="text" placeholder="Bạn muốn đi đâu ạ?" style="flex: 1; border: 1.5px solid #008080; border-radius: 20px; padding: 10px 15px; outline: none; font-size: 14px;">
            <button onclick="callAI()" style="border: none; background: #008080; color: white; width: 42px; height: 42px; border-radius: 50%;">➤</button>
        </div>
    </div>
</div>

<style>
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes slideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.ai-pulse { position: absolute; width: 100%; height: 100%; background: rgba(0,251,255,0.2); border-radius: 50%; z-index: -1; animation: pulse-ring 2s infinite; }
@keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.7); opacity: 0; } }
#ai-msg-list div { max-width: 85%; padding: 12px; border-radius: 18px; font-family: sans-serif; font-size: 14px; line-height: 1.4; }
.msg-ai { background: white; align-self: flex-start; border: 1px solid #e0f2f1; color: #333; }
.msg-user { background: #008080; color: white; align-self: flex-end; }
</style>
