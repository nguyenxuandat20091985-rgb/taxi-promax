<div id="ai-root" style="position: fixed; top: 70%; left: 85%; z-index: 10000; touch-action: none;">
    <div id="ai-btn" style="width: 65px; height: 65px; background: radial-gradient(circle at 35% 35%, #00fbff 0%, #008080 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: move; border: 2px solid #fff; box-shadow: 0 8px 20px rgba(0,128,128,0.4);">
        <div style="width: 38px; height: 28px; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: space-around; border: 2px solid #008080;">
            <div style="width: 6px; height: 6px; background: #00fbff; border-radius: 50%; animation: blink 1.5s infinite;"></div>
            <div style="width: 6px; height: 6px; background: #00fbff; border-radius: 50%; animation: blink 1.5s infinite;"></div>
        </div>
    </div>

    <div id="ai-box" style="display: none; width: 330px; height: 460px; background: #ffffff; border-radius: 25px; position: absolute; bottom: 80px; right: 0; box-shadow: 0 15px 50px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; border: 1px solid #008080; animation: slideUp 0.3s ease;">
        <div style="background: #008080; color: white; padding: 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 14px;">🚕 TAXI AI PROMAX</span>
            <span onclick="toggleAI()" style="cursor:pointer; font-size: 24px;">&times;</span>
        </div>
        <div id="ai-msg-list" style="flex: 1; padding: 15px; overflow-y: auto; background: #f9ffff; display: flex; flex-direction: column; gap: 10px;"></div>
        <div style="padding: 12px; background: white; border-top: 1px solid #eee; display: flex; gap: 8px;">
            <input id="ai-query" type="text" placeholder="Anh muốn đi đâu ạ?" style="flex: 1; border: 1.5px solid #008080; border-radius: 20px; padding: 8px 15px; outline: none; font-size: 14px;">
            <button onclick="callAI()" style="border: none; background: #008080; color: white; width: 38px; height: 38px; border-radius: 50%;">➤</button>
        </div>
    </div>
</div>
<style>
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
#ai-msg-list div { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-family: sans-serif; font-size: 14px; line-height: 1.4; }
.msg-ai { background: white; align-self: flex-start; border: 1px solid #e0f2f1; }
.msg-user { background: #008080; color: white; align-self: flex-end; }
</style>
