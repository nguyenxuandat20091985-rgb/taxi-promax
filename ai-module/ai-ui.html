<div id="ai-root" style="position: fixed; top: 75%; left: 80%; z-index: 10000; touch-action: none;">
    <div id="ai-btn" style="width: 80px; height: 80px; background: radial-gradient(circle at 30% 30%, #ffffff 0%, #e0e0e0 40%, #777 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: move; position: relative; border: 2px solid #fff; box-shadow: 0 15px 35px rgba(0,0,0,0.3), inset -3px -3px 10px rgba(0,0,0,0.2);">
        
        <div style="width: 48px; height: 38px; background: linear-gradient(145deg, #f0f0f0, #c0c0c0); border-radius: 12px; position: relative; display: flex; align-items: center; justify-content: space-around; border: 2px solid #444; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
            <div style="width: 10px; height: 10px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 12px #00ffcc, 0 0 20px #00ffcc; animation: eye-glow 1.2s infinite;"></div>
            <div style="width: 10px; height: 10px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 12px #00ffcc, 0 0 20px #00ffcc; animation: eye-glow 1.2s infinite;"></div>
            
            <div style="position: absolute; top: -12px; width: 3px; height: 15px; background: #444; border-radius: 2px;">
                <div style="position: absolute; top: -6px; left: -2.5px; width: 8px; height: 8px; background: #ff3d00; border-radius: 50%; box-shadow: 0 0 10px #ff3d00; animation: blink 0.8s infinite;"></div>
            </div>
        </div>
        <span class="ai-pulse"></span>
    </div>

    <div id="ai-box" style="display: none; width: 340px; height: 530px; background: #ffffff; border-radius: 35px; position: absolute; bottom: 95px; right: 0; box-shadow: 0 25px 60px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; border: 1px solid rgba(0,191,165,0.2); pointer-events: auto;">
        
        <div style="background: linear-gradient(135deg, #00bfa5, #00796b); color: white; padding: 22px; font-weight: 800; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 12px; height: 12px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 10px #00ffcc;"></div>
                <span style="font-size: 19px; letter-spacing: 1px; font-family: 'Segoe UI', sans-serif; text-transform: uppercase;">TAXI AI PROMAX </span>
            </div>
            <span onclick="toggleAI()" style="cursor:pointer; font-size: 32px; line-height: 0.8;">&times;</span>
        </div>
        
        <div id="ai-msg-list" style="flex: 1; padding: 20px; overflow-y: auto; background: #f9fbfb; display: flex; flex-direction: column; gap: 16px;"></div>
        
        <div style="padding: 18px; background: white; border-top: 1px solid #eee; display: flex; gap: 12px; align-items: center;">
            <button onclick="startVoice()" style="border: none; background: #ff5252; color: white; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; box-shadow: 0 5px 15px rgba(255,82,82,0.3); font-size: 22px;">🎙️</button>
            <input id="ai-query" type="text" placeholder="Ra lệnh cho Robot..." style="flex: 1; border: 2px solid #e0f2f1; background: #f5f5f5; border-radius: 30px; padding: 12px 20px; outline: none; font-size: 15px;">
            <button onclick="callAI()" style="border: none; background: #00bfa5; color: white; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; box-shadow: 0 5px 15px rgba(0,191,165,0.3); font-size: 22px;">➤</button>
        </div>
    </div>
</div>

<style>
@keyframes eye-glow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.6; } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.ai-pulse { position: absolute; width: 100%; height: 100%; background: rgba(0,191,165,0.2); border-radius: 50%; z-index: -1; animation: pulse-ring 2.5s infinite; }
@keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.9); opacity: 0; } }
#ai-msg-list div { max-width: 85%; padding: 15px 20px; border-radius: 22px; font-family: sans-serif; font-size: 15px; line-height: 1.6; }
.msg-ai { background: white; align-self: flex-start; color: #2c3e50; border: 1px solid #eef2f2; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border-bottom-left-radius: 5px !important; }
.msg-user { background: #00bfa5; color: white; align-self: flex-end; box-shadow: 0 5px 15px rgba(0,191,165,0.2); border-bottom-right-radius: 5px !important; }
</style>
