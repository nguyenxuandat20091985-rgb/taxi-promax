<div id="ai-root" style="position: fixed; top: 75%; left: 80%; z-index: 10000; touch-action: none;">
    <div id="ai-btn" style="width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; cursor: move; position: relative; filter: drop-shadow(0 0 10px rgba(0,191,165,0.8));">
        <img src="https://fonts.gstatic.com/s/i/googlematerialicons/smart_toy/v12/gm_blue-48dp/1x/gm_smart_toy_gm_blue_48dp.png" style="width: 100%; height: 100%; background: white; border-radius: 50%; border: 2px solid #00bfa5; pointer-events: none;">
        <span class="ai-pulse"></span>
    </div>

    <div id="ai-box" style="display: none; width: 320px; height: 480px; background: rgba(10, 25, 20, 0.95); border-radius: 30px; position: absolute; bottom: 90px; right: 0; box-shadow: 0 25px 50px rgba(0,0,0,0.5); flex-direction: column; overflow: hidden; border: 1px solid rgba(0,191,165,0.5); backdrop-filter: blur(20px); pointer-events: auto;">
        
        <div style="background: linear-gradient(90deg, #00bfa5, #015a4e); color: white; padding: 18px; font-weight: 900; display: flex; justify-content: space-between; align-items: center;">
            <span>🚀 TAXI AI PROMAX V.2</span>
            <span onclick="toggleAI()" style="cursor:pointer; font-size: 24px; padding: 0 10px;">×</span>
        </div>
        
        <div id="ai-msg-list" style="flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; font-family: sans-serif;"></div>
        
        <div style="padding: 15px; background: rgba(255,255,255,0.05); display: flex; gap: 10px; align-items: center;">
            <button onclick="startVoice()" style="border: none; background: #00bfa5; color: white; width: 42px; height: 42px; border-radius: 50%; font-size: 20px;">🎙️</button>
            <input id="ai-query" type="text" placeholder="Ra lệnh cho Robot..." style="flex: 1; border: 1px solid rgba(0,191,165,0.3); background: rgba(255,255,255,0.1); border-radius: 30px; padding: 12px 18px; outline: none; color: white; font-size: 14px;">
            <button onclick="callAI()" style="border: none; background: #00bfa5; color: white; width: 42px; height: 42px; border-radius: 50%;">➤</button>
        </div>
    </div>
</div>

<style>
.ai-pulse { position: absolute; width: 100%; height: 100%; background: rgba(0,191,165,0.4); border-radius: 50%; z-index: -1; animation: pulse-ring 2s infinite; }
@keyframes pulse-ring { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
#ai-msg-list div { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 14px; line-height: 1.5; }
.msg-ai { background: white; align-self: flex-start; color: #111; border-bottom-left-radius: 5px !important; }
.msg-user { background: #00bfa5; color: white; align-self: flex-end; border-bottom-right-radius: 5px !important; }
</style>
