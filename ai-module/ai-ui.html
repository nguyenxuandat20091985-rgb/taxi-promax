<div id="ai-root" style="position: fixed; top: 75%; left: 82%; z-index: 10000; touch-action: none;">
    <div id="ai-btn" style="width: 70px; height: 70px; background: radial-gradient(circle at 35% 35%, #00fbff 0%, #008080 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: move; border: 2.5px solid #fff; box-shadow: 0 10px 25px rgba(0,128,128,0.4);">
        <div style="width: 38px; height: 28px; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: space-around; border: 2px solid #008080;">
            <div style="width: 7px; height: 7px; background: #00fbff; border-radius: 50%; animation: blink 1.5s infinite;"></div>
            <div style="width: 7px; height: 7px; background: #00fbff; border-radius: 50%; animation: blink 1.5s infinite;"></div>
        </div>
    </div>
    <div id="ai-box" style="display: none; width: 335px; height: 485px; background: #ffffff; border-radius: 30px; position: absolute; bottom: 85px; right: 0; box-shadow: 0 20px 60px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; border: 1px solid rgba(0,128,128,0.15);">
        <div style="background: #008080; color: white; padding: 20px; font-weight: 700; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 15px;">🚕 TAXI AI PROMAX</span>
            <span onclick="toggleAI()" style="cursor:pointer; font-size: 26px;">&times;</span>
        </div>
        <div id="ai-msg-list" style="flex: 1; padding: 18px; overflow-y: auto; background: #f8ffff; display: flex; flex-direction: column; gap: 12px;"></div>
        <div style="padding: 15px; background: white; border-top: 1px solid #f0f0f0; display: flex; gap: 10px; align-items: center;">
            <input id="ai-query" type="text" placeholder="Anh muốn đi đâu?" style="flex: 1; border: 2px solid #008080; border-radius: 25px; padding: 10px 18px; outline: none; font-size: 14px;">
            <button onclick="callAI()" style="border: none; background: #008080; color: white; width: 45px; height: 45px; border-radius: 50%;">➤</button>
        </div>
    </div>
</div>
<style>
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
#ai-msg-list div { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-family: sans-serif; font-size: 14px; }
.msg-ai { background: white; align-self: flex-start; border: 1px solid #e0f2f1; }
.msg-user { background: #008080; color: white; align-self: flex-end; }
</style>
