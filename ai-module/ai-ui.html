<div id="ai-wrapper" style="position: fixed; top: 70%; left: 75%; z-index: 1000000; touch-action: none;">
    
    <div id="ai-chat-box" style="display: none; width: 335px; height: 485px; background: #ffffff; border-radius: 30px; position: absolute; bottom: 85px; right: 0; box-shadow: 0 20px 60px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; border: 1px solid rgba(0,128,128,0.15); pointer-events: auto;">
        
        <div style="background: #008080; color: white; padding: 20px; font-weight: 700; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 15px;">🚕 TAXI AI PROMAX</span>
            <span style="cursor:pointer; font-size: 26px; line-height: 1;" id="ai-close-btn">&times;</span>
        </div>

        <div id="ai-content" style="flex: 1; padding: 18px; overflow-y: auto; background: #f8ffff; display: flex; flex-direction: column; gap: 12px;">
            </div>

        <div style="padding: 15px; background: white; border-top: 1px solid #f0f0f0; display: flex; gap: 10px; align-items: center; pointer-events: auto;">
            <input id="ai-txt" type="text" placeholder="Anh muốn đi đâu?" style="flex: 1; border: 2px solid #008080; border-radius: 25px; padding: 10px 18px; outline: none; font-size: 14px;">
            <button id="ai-send" style="border: none; background: #008080; color: white; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">➤</button>
        </div>
    </div>

    <div id="ai-root" style="width: 75px; height: 75px; border-radius: 50%; background-color: #000; background-size: cover; background-position: center; border: 3px solid #fff; box-shadow: 0 10px 25px rgba(0,128,128,0.4); cursor: move; display: flex; align-items: center; justify-content: center; position: relative;">
        <div style="position: absolute; bottom: 5px; right: 5px; width: 15px; height: 15px; background: #00fbff; border: 2px solid #fff; border-radius: 50%; animation: blink 1.5s infinite;"></div>
    </div>
</div>

<style>
@keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
#ai-content div { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-family: 'Lexend', sans-serif; font-size: 14px; line-height: 1.4; }
.msg-a { background: white; align-self: flex-start; border: 1px solid #e0f2f1; color: #333; box-shadow: 2px 2px 5px rgba(0,0,0,0.02); }
.msg-u { background: #008080; color: white; align-self: flex-end; box-shadow: -2px 2px 5px rgba(0,128,128,0.2); }

/* Đảm bảo khung chat không bị trôi khi cuộn trang */
#ai-wrapper { transition: transform 0.1s ease-out; }
</style>
