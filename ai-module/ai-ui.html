<div id="ai-root" style="position: fixed; top: 75%; left: 80%; z-index: 10000; touch-action: none;">
    <div id="ai-btn" style="width: 75px; height: 75px; background: radial-gradient(circle at 35% 35%, #00fbff 0%, #008080 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: move; position: relative; border: 2px solid #fff; box-shadow: 0 10px 30px rgba(0,128,128,0.5);">
        <div style="width: 42px; height: 32px; background: #fff; border-radius: 10px; position: relative; display: flex; align-items: center; justify-content: space-around; border: 2px solid #008080;">
            <div style="width: 8px; height: 8px; background: #00fbff; border-radius: 50%; box-shadow: 0 0 10px #00fbff; animation: eye-glow 1.5s infinite;"></div>
            <div style="width: 8px; height: 8px; background: #00fbff; border-radius: 50%; box-shadow: 0 0 10px #00fbff; animation: eye-glow 1.5s infinite;"></div>
        </div>
        <span class="ai-pulse"></span>
    </div>

    <div id="ai-box" style="display: none; width: 340px; height: 500px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 28px; position: absolute; bottom: 85px; right: 0; box-shadow: 0 20px 60px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; border: 1px solid rgba(0,128,128,0.2); animation: slideUp 0.3s ease-out;">
        
        <div style="background: #008080; color: white; padding: 18px 22px; font-weight: 700; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 10px; height: 10px; background: #00fbff; border-radius: 50%; box-shadow: 0 0 8px #00fbff;"></div>
                <span style="font-size: 16px; letter-spacing: 0.5px;">TAXI AI PROMAX</span>
            </div>
            <span onclick="toggleAI()" style="cursor:pointer; font-size: 26px;">&times;</span>
        </div>
        
        <div id="ai-msg-list" style="flex: 1; padding: 20px; overflow-y: auto; background: transparent; display: flex; flex-direction: column; gap: 12px; font-family: sans-serif;"></div>
        
        <div style="padding: 15px; background: white; border-top: 1px solid #f0f0f0; display: flex; gap: 10px; align-items: center;">
            <button onclick="startVoice()" style="border: none; background: #f0fdfa; color: #008080; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 18px;">🎙️</button>
            <input id="ai-query" type="text" placeholder="Bạn muốn đi đâu ạ?" style="flex: 1; border: 1.5px solid #008080; border-radius: 25px; padding: 10px 15px; outline: none; font-size: 14px; background: #fff;">
            <button onclick="callAI()" style="border: none; background: #008080; color: white; width: 42px; height: 42px; border-radius: 50%; cursor: pointer;">➤</button>
        </div>
    </div>
</div>

<style>
@keyframes eye-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.ai-pulse { position: absolute; width: 100%; height: 100%; background: rgba(0,251,255,0.2); border-radius: 50%; z-index: -1; animation: pulse-ring 2s infinite; }
@keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.8); opacity: 0; } }
#ai-msg-list div { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.msg-ai { background: white; align-self: flex-start; color: #333; border-bottom-left-radius: 4px !important; border: 1px solid #e0f2f1; }
.msg-user { background: #008080; color: white; align-self: flex-end; border-bottom-right-radius: 4px !important; }
</style>
