<div id="ai-root" style="position: fixed; top: 75%; left: 80%; z-index: 10000; touch-action: none;">
    <div id="ai-btn" style="width: 80px; height: 80px; background: radial-gradient(circle at 35% 35%, #ffffff 0%, #d1d1d1 50%, #888 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: move; position: relative; border: 2px solid #fff; box-shadow: 0 15px 35px rgba(0,0,0,0.3);">
        <div style="width: 45px; height: 35px; background: linear-gradient(135deg, #e0e0e0, #a0a0a0); border-radius: 12px; position: relative; display: flex; align-items: center; justify-content: space-around; border: 2px solid #444;">
            <div style="width: 9px; height: 9px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 10px #00ffcc; animation: eye-glow 1.5s infinite;"></div>
            <div style="width: 9px; height: 9px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 10px #00ffcc; animation: eye-glow 1.5s infinite;"></div>
            <div style="position: absolute; top: -10px; width: 3px; height: 12px; background: #444;">
                <div style="position: absolute; top: -5px; left: -2.5px; width: 8px; height: 8px; background: #ff3d00; border-radius: 50%; box-shadow: 0 0 8px #ff3d00;"></div>
            </div>
        </div>
        <span class="ai-pulse"></span>
    </div>

    <div id="ai-box" style="display: none; width: 340px; height: 520px; background: #ffffff; border-radius: 35px; position: absolute; bottom: 95px; right: 0; box-shadow: 0 25px 60px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; border: 1px solid rgba(0,191,165,0.2);">
        <div style="background: linear-gradient(135deg, #00bfa5, #00796b); color: white; padding: 22px; font-weight: 800; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 12px; height: 12px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 10px #00ffcc;"></div>
                <span style="font-size: 18px; letter-spacing: 1px; font-family: sans-serif;">TAXI AI PROMAX </span>
            </div>
            <span onclick="toggleAI()" style="cursor:pointer; font-size: 30px;">&times;</span>
        </div>
        <div id="ai-msg-list" style="flex: 1; padding: 20px; overflow-y: auto; background: #f9fbfb; display: flex; flex-direction: column; gap: 16px;"></div>
        <div style="padding: 18px; background: white; border-top: 1px solid #eee; display: flex; gap: 12px;">
            <button onclick="startVoice()" style="border: none; background: #ff5252; color: white; width: 48px; height: 48px; border-radius: 50%;">🎙️</button>
            <input id="ai-query" type="text" placeholder="Hỏi đường, giá cước..." style="flex: 1; border: 2px solid #e0f2f1; border-radius: 30px; padding: 12px 20px;">
            <button onclick="callAI()" style="border: none; background: #00bfa5; color: white; width: 48px; height: 48px; border-radius: 50%;">➤</button>
        </div>
    </div>
</div>

<style>
@keyframes eye-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.ai-pulse { position: absolute; width: 100%; height: 100%; background: rgba(0,191,165,0.2); border-radius: 50%; z-index: -1; animation: pulse-ring 2.5s infinite; }
@keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.8); opacity: 0; } }
#ai-msg-list div { max-width: 85%; padding: 14px 18px; border-radius: 22px; font-size: 15px; }
.msg-ai { background: white; align-self: flex-start; border: 1px solid #eef2f2; }
.msg-user { background: #00bfa5; color: white; align-self: flex-end; }
</style>
