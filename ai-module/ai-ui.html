<div id="ai-root" style="position: fixed; bottom: 85px; right: 20px; z-index: 10000;">
    <div id="ai-btn" onclick="toggleAI()" style="width: 50px; height: 50px; background: #00bfa5; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer; font-size: 24px;">🤖</div>
    <div id="ai-box" style="display: none; width: 280px; height: 380px; background: white; border-radius: 15px; position: absolute; bottom: 65px; right: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; border: 1px solid #eee; font-family: sans-serif;">
        <div style="background: #00bfa5; color: white; padding: 12px; font-weight: bold;">Trợ lý AI Taxi</div>
        <div id="ai-msg-list" style="flex: 1; padding: 15px; overflow-y: auto; font-size: 13px; background: #f9f9f9;"></div>
        <div style="padding: 10px; border-top: 1px solid #eee; display: flex;">
            <input id="ai-query" type="text" placeholder="Hỏi AI..." style="flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 8px 12px; outline: none;">
            <button onclick="callAI()" style="border: none; background: none; color: #00bfa5; font-weight: bold; margin-left: 5px; cursor: pointer;">Gửi</button>
        </div>
    </div>
</div>
