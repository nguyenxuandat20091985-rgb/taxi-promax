name: Taxi ProMax Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "config.xml"
      - "index.html"
      - "khachhang.html"
      - "xeghep.html"
      - "admin.html"
      - "js/**"
      - "css/**"
      - "package.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Install Cordova CLI
        run: npm install --global cordova@12

      - name: Verify project
        run: npm run check

      - name: Prepare Cordova web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html khachhang.html xeghep.html admin.html manifest.json sw.js autonomous-client.js www/
          cp -R css js assets www/

      - name: Add Android platform
        run: cordova platform add android@12.0.1 --no-interactive

      - name: Build debug APK
        run: cordova build android --debug --no-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taxi-promax-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
