name: Taxi ProMax Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "config.xml"
      - "index.html"
      - "khachhang.html"
      - "xeghep.html"
      - "admin.html"
      - "js/**"
      - "css/**"
      - "package.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "tools platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed | head -40 || true

      - name: Install dependencies
        run: npm install

      - name: Install Cordova CLI
        run: npm install --global cordova@12

      - name: Verify project
        run: npm run check

      - name: Prepare Cordova web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html khachhang.html xeghep.html admin.html manifest.json sw.js autonomous-client.js www/
          cp -R css js www/
          # Copy assets but skip broken filenames (e.g. logo.svg with newline)
          mkdir -p www/assets
          if [ -d assets ]; then
            find assets -type f -print0 | while IFS= read -r -d '' f; do
              base=$(basename "$f")
              case "$base" in
                *$'\n'*|*$'\r'*) echo "Skip bad asset name: $f" ;;
                *)
                  rel=${f#assets/}
                  mkdir -p "www/assets/$(dirname "$rel")"
                  cp "$f" "www/assets/$rel" || true
                  ;;
              esac
            done
          fi

      - name: Add Android platform
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          cordova platform add android@12.0.1 --no-interactive

      - name: Build debug APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          cordova build android --debug --no-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taxi-promax-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
