name: Taxi ProMax Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "config.xml"
      - "index.html"
      - "khachhang.html"
      - "xeghep.html"
      - "admin.html"
      - "js/**"
      - "css/**"
      - "package.json"
      - "res/icon/**"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Google removed the deprecated "tools" package (2026-09).
      # cordova-android@12 requires build-tools 33.0.2 specifically.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-33 platforms;android-34 build-tools;33.0.2 build-tools;34.0.0"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed | head -40 || true

      # cordova-android@12 is incompatible with Gradle 9 (XmlParser).
      - name: Install Gradle 8.7
        run: |
          curl -fsSL -o /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q /tmp/gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.7/bin/gradle -v

      - name: Install dependencies
        run: npm install

      - name: Install Cordova CLI
        run: npm install --global cordova@12

      - name: Verify project
        run: npm run check

      - name: Prepare Cordova web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html khachhang.html xeghep.html admin.html manifest.json sw.js autonomous-client.js version.json www/ 2>/dev/null || cp index.html khachhang.html xeghep.html admin.html manifest.json sw.js autonomous-client.js www/
          cp -R css js www/
          mkdir -p www/assets
          if [ -d assets ]; then
            find assets -type f -print0 | while IFS= read -r -d '' f; do
              base=$(basename "$f")
              case "$base" in
                *$'\n'*|*$'\r'*) echo "Skip bad asset name: $f" ;;
                *)
                  rel=${f#assets/}
                  mkdir -p "www/assets/$(dirname "$rel")"
                  cp "$f" "www/assets/$rel" || true
                  ;;
              esac
            done
          fi

      - name: Inject update-checker into index.html
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('www/index.html')
          if not p.is_file():
              p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          tag = '<script src="js/update-checker.js?v=20260928"></script>'
          if tag not in t and 'update-checker' not in t:
              t = t.replace('</body>', '    ' + tag + '\n</body>')
              p.write_text(t, encoding='utf-8')
              print('injected update-checker into', p)
          else:
              print('update-checker already present')
          PY

      - name: Ensure Android icons and splash exist
        run: |
          pip install --quiet pillow
          python3 scripts/generate-android-icons.py

      - name: Relax package.json for Cordova (CI only)
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); delete p.type; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"

      - name: Add Android platform
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="/opt/gradle-8.7/bin:$PATH"
          cordova platform add android@12.0.1 --no-interactive

      - name: Build debug APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="/opt/gradle-8.7/bin:$PATH"
          which gradle
          gradle -v | head -5
          cordova build android --debug --no-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taxi-promax-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
