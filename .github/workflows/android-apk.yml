name: Taxi ProMax Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "config.xml"
      - "index.html"
      - "khachhang.html"
      - "xeghep.html"
      - "admin.html"
      - "js/**"
      - "css/**"
      - "package.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Google removed the deprecated "tools" package (2026-09).
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed | head -40 || true

      # cordova-android@12 is incompatible with Gradle 9 (XmlParser).
      - name: Install Gradle 8.7
        run: |
          curl -fsSL -o /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q /tmp/gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.7/bin/gradle -v

      - name: Install dependencies
        run: npm install

      - name: Install Cordova CLI
        run: npm install --global cordova@12

      - name: Verify project
        run: npm run check

      - name: Prepare Cordova web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html khachhang.html xeghep.html admin.html manifest.json sw.js autonomous-client.js www/
          cp -R css js www/
          mkdir -p www/assets
          if [ -d assets ]; then
            find assets -type f -print0 | while IFS= read -r -d '' f; do
              base=$(basename "$f")
              case "$base" in
                *$'\n'*|*$'\r'*) echo "Skip bad asset name: $f" ;;
                *)
                  rel=${f#assets/}
                  mkdir -p "www/assets/$(dirname "$rel")"
                  cp "$f" "www/assets/$rel" || true
                  ;;
              esac
            done
          fi

      - name: Generate placeholder Android icons and splash
        run: |
          python3 << 'PY'
          import os, struct, zlib

          def write_png(path, w, h, rgb=(0, 84, 163)):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              r, g, b = rgb
              raw = b"".join(b"\x00" + bytes([r, g, b]) * w for _ in range(h))
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)
              data = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(data)

          icons = {
              "ldpi": 36, "mdpi": 48, "hdpi": 72,
              "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192,
          }
          for name, size in icons.items():
              write_png(f"res/icon/android/{name}.png", size, size)

          splashes = {
              "land-ldpi": (320, 200), "land-mdpi": (480, 320),
              "land-hdpi": (800, 480), "land-xhdpi": (1280, 720),
              "port-ldpi": (200, 320), "port-mdpi": (320, 480),
              "port-hdpi": (480, 800), "port-xhdpi": (720, 1280),
          }
          for name, (w, h) in splashes.items():
              write_png(f"res/screen/android/splash-{name}.png", w, h)

          bg = '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0054A3</color>
          </resources>
          '''
          fg = '''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M54,30c-13.2,0 -24,10.8 -24,24s10.8,24 24,24 24,-10.8 24,-24 -10.8,-24 -24,-24z"/>
          </vector>
          '''
          os.makedirs("res/icon/android", exist_ok=True)
          open("res/icon/android/ic_launcher_background.xml", "w").write(bg.strip() + "\n")
          open("res/icon/android/ic_launcher_foreground.xml", "w").write(fg.strip() + "\n")
          print("Placeholder icons/splash generated")
          PY

      - name: Relax package.json for Cordova (CI only)
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); delete p.type; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"

      - name: Add Android platform
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="/opt/gradle-8.7/bin:$PATH"
          cordova platform add android@12.0.1 --no-interactive

      - name: Build debug APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="/opt/gradle-8.7/bin:$PATH"
          which gradle
          gradle -v | head -5
          cordova build android --debug --no-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taxi-promax-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
