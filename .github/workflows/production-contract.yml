name: ProMax Production Contract

on:
  push:
    branches: [main, promax-production-hardening]
  pull_request:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/production-contract-test.mjs
      - run: npm test
      - run: npm run check
