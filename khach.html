<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TAXI PROMAX - HỆ THỐNG KHÁCH HÀNG</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #00bfa5; --gold: #ffc107; --dark: #0a1110; --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', Roboto, sans-serif; background: var(--dark); overflow: hidden; }
        
        /* Bản đồ Full màn hình */
        #map { height: 100vh; width: 100vw; z-index: 1; }

        /* Giao diện UI phía trên */
        .top-ui { position: fixed; top: env(safe-area-inset-top, 10px); left: 10px; right: 10px; z-index: 1000; }
        .status-card { 
            background: rgba(255,255,255,0.98); padding: 15px; border-radius: 20px; 
            border: 2px solid var(--primary); box-shadow: 0 8px 32px rgba(0,0,0,0.3); 
        }

        /* Gói cước 4 cấp */
        .package-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .pkg-btn { 
            padding: 12px 5px; border-radius: 12px; border: 1px solid #ddd; 
            background: white; font-size: 11px; font-weight: 800; text-align: center;
            transition: all 0.3s ease; cursor: pointer;
        }
        .pkg-btn:active { transform: scale(0.95); background: #f0f0f0; }
        .pkg-active { border: 2px solid var(--primary); background: #e0f2f1; color: var(--primary); }

        /* Nút AI Gemini */
        #ai-btn { 
            position: fixed; bottom: 40px; right: 20px; width: 65px; height: 65px; 
            background: linear-gradient(135deg, #00f2ff, #00bfa5); 
            border-radius: 50%; z-index: 2000; box-shadow: 0 5px 20px rgba(0,191,165,0.5);
            display: flex; align-items: center; justify-content: center; font-size: 30px;
            border: 3px solid white; cursor: pointer;
        }

        /* Modal Thanh toán Anti-Fraud */
        #payment-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); z-index: 3000; display: none; 
            justify-content: center; align-items: center; padding: 20px;
        }
        .qr-card { 
            background: white; padding: 25px; border-radius: 30px; text-align: center; 
            color: #333; width: 100%; max-width: 350px; position: relative;
        }
        .qr-img-container { background: #f9f9f9; padding: 15px; border-radius: 20px; margin: 15px 0; }
        #qr-img { width: 100%; border-radius: 10px; }
        
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; background: #eee; }
        .loading-dots:after { content: ' .'; animation: dots 1s steps(5, end) infinite;}
        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); } 40% { color: #333; text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); } 60% { text-shadow: .5em 0 0 #333, 1em 0 0 rgba(0,0,0,0); } 80%, 100% { text-shadow: .5em 0 0 #333, 1em 0 0 #333; } }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="top-ui">
        <div class="status-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <b style="color:var(--dark); font-size: 14px;">GÓI: <span id="current-pkg" style="color:var(--primary)">FREE_TRIAL</span></b>
                <span class="status-pill" id="sync-status">ĐANG ĐỒNG BỘ</span>
            </div>
            <div class="package-grid">
                <div class="pkg-btn" onclick="openPayment('7_DAYS_FREE', 0)">7 NGÀY (FREE)</div>
                <div class="pkg-btn" onclick="openPayment('MONTHLY', 50000)">1 THÁNG (50K)</div>
                <div class="pkg-btn" onclick="openPayment('YEARLY', 500000)">1 NĂM (500K)</div>
                <div class="pkg-btn" onclick="openPayment('LIFETIME', 2000000)">TRỌN ĐỜI (2M)</div>
            </div>
        </div>
    </div>

    <div id="ai-btn" onclick="askGemini()">🤖</div>

    <div id="payment-modal">
        <div class="qr-card">
            <h3 style="margin:0; color:#1a1a1a;">THANH TOÁN TỰ ĐỘNG</h3>
            <p style="font-size:12px; color:#666; margin: 10px 0;">Chủ TK: <b>NGUYỄN XUÂN ĐẠT</b><br>BIDV: <b>4430269669</b></p>
            
            <div class="qr-img-container">
                <img id="qr-img" src="" alt="QR Thanh toán">
            </div>

            <div style="background:#fff3e0; padding:10px; border-radius:10px; border:1px dashed #ff9800;">
                <div style="font-size:11px; color:#555;">NỘI DUNG CHUYỂN KHOẢN:</div>
                <div id="payment-code" style="font-size:16px; font-weight:bold; color:#e65100; letter-spacing:1px;"></div>
            </div>

            <p style="font-size:10px; color:#888; margin-top:15px;" class="loading-dots">Hệ thống đang chờ xác nhận từ ngân hàng</p>
            
            <button onclick="closePayment()" style="width:100%; padding:12px; border-radius:15px; border:none; background:#f5f5f5; color:#666; font-weight:bold; margin-top:10px;">HỦY GIAO DỊCH</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const CONFIG = {
            ADMIN_BANK: "4430269669",
            ADMIN_NAME: "NGUYEN XUAN DAT",
            WEBHOOK: "https://taxi-promax.vercel.app/api/webhook",
            CHECKSUM_KEY: "309f930afb5691846cd5abbbd3624d507fa8fb5d715d9da03474a711cf262fb2",
            GEMINI_KEY: "AIzaSyBYIpmslXFTkETW7cfiPeLJ0oPcgMJUn2g"
        };

        let userMap, userMarker;

        // 1. ĐỊNH VỊ THẬT (Chạy ngay khi mở App)
        function initApp() {
            userMap = L.map('map', { zoomControl: false, attributionControl: false }).setView([21.0285, 105.8542], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(userMap);

            userMap.locate({ setView: true, watch: true, enableHighAccuracy: true });

            userMap.on('locationfound', (e) => {
                if (!userMarker) {
                    userMarker = L.marker(e.latlng).addTo(userMap).bindPopup("Vị trí của bạn").openPopup();
                } else {
                    userMarker.setLatLng(e.latlng);
                }
            });

            userMap.on('locationerror', () => {
                alert("Vui lòng bật định vị để sử dụng App!");
            });
        }

        // 2. THANH TOÁN TỰ ĐỘNG - TIỀN VỀ ANH ĐẠT
        function openPayment(pkg, amount) {
            if(amount === 0) {
                activatePackage('7_DAYS_FREE');
                alert("Đã kích hoạt gói dùng thử 7 ngày!");
                return;
            }

            const userId = "TX" + Math.floor(1000 + Math.random() * 9000);
            const content = `${userId}${pkg}`;
            document.getElementById('payment-code').innerText = content;
            
            // Tạo link VietQR chuẩn
            const qrUrl = `https://img.vietqr.io/image/bidv-${CONFIG.ADMIN_BANK}-compact2.png?amount=${amount}&addInfo=${content}&accountName=${encodeURIComponent(CONFIG.ADMIN_NAME)}`;
            
            document.getElementById('qr-img').src = qrUrl;
            document.getElementById('payment-modal').style.display = 'flex';

            startWebhookPolling(content);
        }

        async function startWebhookPolling(code) {
            const statusLabel = document.getElementById('sync-status');
            statusLabel.innerText = "ĐANG CHỜ TIỀN...";
            statusLabel.style.background = "#fff3e0";
            statusLabel.style.color = "#ff9800";

            const checkInterval = setInterval(async () => {
                try {
                    const res = await fetch(`${CONFIG.WEBHOOK}?code=${code}&token=${CONFIG.CHECKSUM_KEY}`);
                    const data = await res.json();
                    
                    if(data.paid === true) {
                        clearInterval(checkInterval);
                        activatePackage(data.package);
                        alert("Giao dịch thành công! Gói " + data.package + " đã được kích hoạt.");
                        closePayment();
                    }
                } catch (e) { console.log("Đang kiểm tra giao dịch..."); }
            }, 5000); // Check mỗi 5 giây
        }

        function activatePackage(pkg) {
            localStorage.setItem('user_pkg', pkg);
            document.getElementById('current-pkg').innerText = pkg;
            document.getElementById('sync-status').innerText = "ĐÃ KÍCH HOẠT";
            document.getElementById('sync-status').style.background = "#e0f2f1";
            document.getElementById('sync-status').style.color = var(--primary);
        }

        function closePayment() { document.getElementById('payment-modal').style.display = 'none'; }

        // 3. AI GEMINI TÍCH HỢP THẬT
        async function askGemini() {
            const userMsg = prompt("Hỏi AI Taxi Promax (Gemini):");
            if(!userMsg) return;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${CONFIG.GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: userMsg }] }] })
                });
                const result = await response.json();
                const aiReply = result.candidates[0].content.parts[0].text;
                alert("🤖 Gemini trả lời:\n\n" + aiReply);
            } catch (error) {
                alert("Không thể kết nối với AI. Vui lòng kiểm tra lại mạng hoặc Key.");
            }
        }

        window.onload = () => {
            initApp();
            const saved = localStorage.getItem('user_pkg') || 'FREE_TRIAL';
            document.getElementById('current-pkg').innerText = saved;
        };
    </script>
</body>
</html>
