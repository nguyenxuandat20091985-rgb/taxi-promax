<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi Promax - Trợ Lý Tiên Tử</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap');
        body { margin: 0; padding: 0; background: #f0fbfc; font-family: 'Lexend', sans-serif; }

        /* Vùng chứa toàn bộ AI */
        #ai-wrapper { 
            position: fixed; bottom: 30px; right: 15px; z-index: 999999; 
            display: flex; flex-direction: column; align-items: flex-end; 
            touch-action: none; 
        }
        
        /* Avatar Tiên Tử - Đã thu nhỏ gọn và tinh tế */
        #ai-root { 
            width: 70px; height: 70px; border-radius: 50%; 
            background: #fff url('https://i.ibb.co/LzNfXFk/angel-secretary.jpg') no-repeat center;
            background-size: cover; border: 2px solid #00f2ff;
            box-shadow: 0 4px 20px rgba(0, 242, 255, 0.4);
            cursor: pointer; position: relative;
            animation: floating 3s infinite ease-in-out;
        }
        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        /* Khung Chat Phong Cách Xanh SM - Sang trọng, không dùng màu đen */
        #ai-chat-box { 
            width: 310px; max-width: 85vw; background: rgba(255, 255, 255, 0.98); 
            border-radius: 25px; margin-bottom: 15px; display: none; 
            flex-direction: column; box-shadow: 0 15px 45px rgba(0,0,0,0.15);
            border: 1px solid #00f2ff; overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .ai-header { background: #00d1d1; color: white; padding: 15px; text-align: center; font-weight: 600; font-size: 15px; letter-spacing: 0.5px; }
        
        #ai-content { max-height: 300px; min-height: 120px; overflow-y: auto; padding: 18px; background: #f0fbfc; }
        
        /* Tin nhắn khách và AI */
        .msg-u { background: #00d1d1; color: white; padding: 10px 15px; border-radius: 18px 18px 0 18px; margin: 8px 0 8px auto; width: fit-content; max-width: 82%; font-size: 14px; box-shadow: 2px 2px 5px rgba(0,0,0,0.05); }
        .msg-a { background: #fff; color: #333; padding: 10px 15px; border-radius: 18px 18px 18px 0; margin: 8px 0; border: 1px solid #e0f7f7; width: fit-content; max-width: 82%; font-size: 14px; line-height: 1.4; }

        /* Khu vực nhập liệu */
        .ai-input-area { display: flex; padding: 12px 15px; background: #fff; align-items: center; gap: 10px; border-top: 1px solid #eef2f2; }
        #ai-txt { flex: 1; border: 1px solid #e0e6e6; outline: none; padding: 10px 18px; border-radius: 25px; font-size: 14px; background: #f9ffff; }
        #ai-txt:focus { border-color: #00f2ff; }
        #ai-send { color: #00d1d1; font-size: 26px; cursor: pointer; border: none; background: none; transition: 0.2s; }
        #ai-send:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div id="ai-wrapper">
        <div id="ai-chat-box">
            <div class="ai-header">🌿 TRỢ LÝ XANH SM PROMAX</div>
            <div id="ai-content"></div>
            <div class="ai-input-area">
                <input type="text" id="ai-txt" placeholder="Nhắn gì đó với em đi... ✨">
                <button id="ai-send">🚀</button>
            </div>
        </div>
        <div id="ai-root"></div>
    </div>

    <script>
        // 1. Giữ màn hình luôn sáng khi đang dùng web
        if ('wakeLock' in navigator) {
            let wakeLock = null;
            const requestWakeLock = async () => {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            };
            requestWakeLock();
            document.addEventListener('visibilitychange', () => {
                if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock();
            });
        }

        const root = document.getElementById('ai-root'), 
              chat = document.getElementById('ai-chat-box'), 
              content = document.getElementById('ai-content'), 
              txtInput = document.getElementById('ai-txt'), 
              sendBtn = document.getElementById('ai-send'),
              wrapper = document.getElementById('ai-wrapper');

        // 2. Di chuyển mượt mà (Drag and Drop)
        let drag = false, curX = 0, curY = 0, startX, startY;
        wrapper.ontouchstart = (e) => { drag = false; startX = e.touches[0].clientX - curX; startY = e.touches[0].clientY - curY; };
        wrapper.ontouchmove = (e) => { drag = true; curX = e.touches[0].clientX - startX; curY = e.touches[0].clientY - startY; wrapper.style.transform = `translate(${curX}px, ${curY}px)`; e.preventDefault(); };

        // 3. Xử lý Chat
        root.onclick = () => {
            if (!drag) {
                const isOpen = chat.style.display === 'flex';
                chat.style.display = isOpen ? 'none' : 'flex';
                if(!isOpen && content.innerHTML === "") {
                    addMsg("Chào anh/chị! Em là trợ lý của Taxi Promax. Chúc mình một chuyến đi thật vui vẻ và an toàn ạ! ✨", 'ai');
                }
            }
        };

        function addMsg(t, s) {
            const d = document.createElement('div'); 
            d.className = s === 'user' ? 'msg-u' : 'msg-a';
            d.innerHTML = t.replace(/\n/g, '<br>');
            content.appendChild(d);
            content.scrollTop = 9999;
        }

        sendBtn.onclick = async () => {
            const m = txtInput.value.trim();
            if(!m) return;
            txtInput.value = '';
            addMsg(m, 'user');
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyBYIpmslXFTkETW7cfiPeLJ0oPcgMJUn2g`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Bạn là trợ lý ảo Xanh SM của hãng Taxi Promax. Tuyệt đối không gọi tên Đạt. Hãy gọi khách là 'anh/chị' xưng 'em' cực kỳ lịch sự và ngọt ngào. Trả lời ngắn gọn, dùng emoji. Câu hỏi: ${m}` }] }] })
                });
                const data = await res.json();
                addMsg(data.candidates[0].content.parts[0].text, 'ai');
            } catch { addMsg("Em nghe đây ạ! ✨", 'ai'); }
        };
    </script>
</body>
</html>
