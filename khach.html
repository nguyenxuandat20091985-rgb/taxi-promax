<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Promax - Trợ Lý Platinum</title>
    </head>
<body>
    <div id="ai-wrapper">
        <div id="ai-chat-box">
            <div class="ai-header">🌿 TRỢ LÝ TAXI PROMAX PLATINUM</div>
            <div id="ai-content"></div>
            <div class="ai-input-area"><input type="text" id="ai-txt" placeholder="Em giúp gì được anh/chị ạ? ✨"><button id="ai-send">🚀</button></div>
        </div>
        <div id="ai-root"></div>
    </div>
    <style>
        #ai-wrapper { position: fixed; bottom: 120px; right: 15px; z-index: 999999; display: flex; flex-direction: column; align-items: flex-end; font-family: 'Lexend', sans-serif; }
        #ai-root { width: 80px; height: 80px; border-radius: 50%; background: url('https://raw.githubusercontent.com/nguyenxuandat20091985-rgb/taxi-promax/main/CC_20260130_193050.png') no-repeat center; background-size: cover; border: 3px solid #00f2ff; box-shadow: 0 0 15px rgba(0, 242, 255, 0.7); cursor: pointer; animation: floating 3s infinite ease-in-out; }
        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        #ai-chat-box { width: 300px; max-width: 80vw; background: #fff; border-radius: 20px; margin-bottom: 12px; display: none; flex-direction: column; border: 1px solid #00f2ff; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .ai-header { background: #00d1d1; color: white; padding: 12px; text-align: center; font-weight: 600; }
        #ai-content { max-height: 250px; min-height: 100px; overflow-y: auto; padding: 15px; background: #f0fbfc; }
        .msg-a { background: #fff; padding: 8px 12px; border-radius: 15px 15px 15px 0; margin: 5px 0; border: 1px solid #e0f7f7; font-size: 13px; width: fit-content; max-width: 85%; }
        .msg-u { background: #00d1d1; color: white; padding: 8px 12px; border-radius: 15px 15px 0 15px; margin: 5px 0 5px auto; font-size: 13px; width: fit-content; max-width: 85%; }
        .ai-input-area { display: flex; padding: 10px; background: #fff; border-top: 1px solid #eee; }
        #ai-txt { flex: 1; border: 1px solid #ddd; outline: none; padding: 8px 15px; border-radius: 20px; font-size: 13px; }
        #ai-send { color: #00d1d1; font-size: 22px; border: none; background: none; cursor: pointer; }
    </style>
    <script>
        (function(){
            const root = document.getElementById('ai-root'), chat = document.getElementById('ai-chat-box'), content = document.getElementById('ai-content'), txtInput = document.getElementById('ai-txt'), sendBtn = document.getElementById('ai-send');
            root.onclick = () => { chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex'; if(chat.style.display === 'flex' && content.innerHTML === "") addMsg("Chào anh/chị! Em là trợ lý ảo Taxi Promax Platinum. Em sẵn sàng phục vụ ạ! ✨", 'ai'); };
            function addMsg(t, s) { const d = document.createElement('div'); d.className = s === 'user' ? 'msg-u' : 'msg-a'; d.innerHTML = t; content.appendChild(d); content.scrollTop = 9999; }
            sendBtn.onclick = async () => {
                const m = txtInput.value.trim(); if(!m) return;
                txtInput.value = ''; addMsg(m, 'user');
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyBYIpmslXFTkETW7cfiPeLJ0oPcgMJUn2g`, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `Bạn là trợ lý ảo Taxi Promax Platinum. Gọi khách là anh/chị xưng em. Trả lời ngọt ngào, ngắn gọn: ${m}` }] }] })
                    });
                    const data = await res.json(); addMsg(data.candidates[0].content.parts[0].text, 'ai');
                } catch { addMsg("Taxi Promax nghe đây ạ! ✨", 'ai'); }
            };
            txtInput.onkeypress = (e) => { if(e.key === 'Enter') sendBtn.click(); };
        })();
    </script>
</body>
</html>
