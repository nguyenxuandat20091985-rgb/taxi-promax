<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TAXI PROMAX PLATINUM</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #00bfa5; --dark: #002d26; --gold: #ffc107; --danger: #ff5252; --bg: #f8faf9; --glass: rgba(255, 255, 255, 0.95); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; background: var(--bg); position: fixed; width: 100%; }
        #map { height: 100vh; width: 100vw; z-index: 1; filter: contrast(1.05) saturate(1.1); transition: filter 0.5s; }
        .night-mode { filter: invert(90%) hue-rotate(180deg) brightness(95%) !important; }

        /* HEADER & STATS */
        .header { position: fixed; top: env(safe-area-inset-top, 10px); left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 1000; }
        .badge { background: var(--glass); padding: 8px 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 11px; font-weight: 800; border: 1px solid white; }
        .stats-bar { position: fixed; top: calc(env(safe-area-inset-top, 10px) + 45px); left: 10px; right: 10px; background: var(--glass); border-radius: 15px; display: flex; padding: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); z-index: 1000; border: 1px solid white; }
        .stat-item { flex: 1; text-align: center; }
        .stat-value { font-size: 22px; font-weight: 900; color: var(--dark); }

        /* FOOTER & NAV */
        .footer-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; z-index: 2000; border-radius: 25px 25px 0 0; padding: 15px 15px calc(env(safe-area-inset-bottom, 5px) + 5px); box-shadow: 0 -10px 30px rgba(0,0,0,0.08); }
        .nav-grid { display: flex; justify-content: space-around; margin-top: 10px; padding-top: 8px; border-top: 1px solid #eee; }
        .nav-item { border: none; background: none; color: #bdc3c7; font-size: 10px; font-weight: 700; flex: 1; text-align: center; }
        .nav-item.active { color: var(--primary); }
        .brand-footer { font-size: 9px; text-align: center; color: #bdc3c7; padding: 5px 0; font-weight: bold; }

        /* TABS */
        .tab-content { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 130px); background: #fdfdfd; z-index: 1500; display: none; flex-direction: column; overflow-y: auto; }
        .p-header { background: var(--primary); color: white; padding: 25px 20px; text-align: center; border-radius: 0 0 25px 25px; }
        .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .p-card { background: white; border: 2px solid #ecf0f1; border-radius: 15px; padding: 12px; }
        .p-card.active { border-color: var(--primary); background: #f0fffb; }

        /* AI AVATAR DRAGGABLE */
        #ai-root { 
            position: fixed; bottom: 180px; right: 15px; width: 70px; height: 70px; 
            border-radius: 50%; background: url('https://raw.githubusercontent.com/nguyenxuandat20091985-rgb/taxi-promax/main/CC_20260130_193050.png') no-repeat center; 
            background-size: cover; border: 3px solid var(--primary); z-index: 9999; 
            box-shadow: 0 0 20px rgba(0,191,165,0.6); cursor: move; touch-action: none;
        }
        #ai-chat-box { position: fixed; bottom: 260px; right: 15px; width: 280px; background: white; border-radius: 20px; display: none; z-index: 9998; border: 1px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge" id="idShow">🆔 ĐANG QUÉT...</div>
        <div class="badge" id="planShow" style="color:var(--gold)">⭐ GÓI: FREE (7D)</div>
    </div>

    <div class="stats-bar">
        <div class="stat-item" style="border-right: 1px solid #eee;">
            <div style="font-size:9px; font-weight:800;">CƯỚC (VNĐ)</div>
            <div id="cost" class="stat-value">0</div>
        </div>
        <div class="stat-item">
            <div style="font-size:9px; font-weight:800;">KHOẢNG CÁCH (KM)</div>
            <div id="km" class="stat-value">0.00</div>
        </div>
    </div>

    <div id="map"></div>

    <div id="ai-root"></div>
    <div id="ai-chat-box">
        <div style="background:var(--primary); color:white; padding:10px; border-radius:20px 20px 0 0; font-size:12px; text-align:center;">TRỢ LÝ AI PLATINUM</div>
        <div id="ai-content" style="height:200px; overflow-y:auto; padding:10px; font-size:13px; background:#f9f9f9;"></div>
        <div style="padding:10px; display:flex; gap:5px;">
            <input type="text" id="ai-input" style="flex:1; border-radius:15px; border:1px solid #ddd; padding:5px 10px;" placeholder="Hỏi AI...">
            <button onclick="askAI()" style="border:none; background:none; font-size:20px;">🚀</button>
        </div>
    </div>

    <div id="tab-vi" class="tab-content">
        <div class="p-header"><b>VÍ ĐIỆN TỬ & GÓI CƯỚC</b></div>
        <div class="p-grid">
            <div class="p-card" onclick="selectPack(19000,'BASIC')"><b>BASIC</b><span>19k</span></div>
            <div class="p-card" onclick="selectPack(29000,'PRO')"><b>PRO</b><span>29k</span></div>
            <div class="p-card active" onclick="selectPack(49000,'VIP')"><b>VIP</b><span>49k</span></div>
            <div class="p-card" onclick="selectPack(999000,'LIFETIME')"><b>TRỌN ĐỜI</b><span>999k</span></div>
        </div>
        <div style="text-align:center; padding:15px;">
            <img id="qrImg" style="width:160px; border:5px solid #eee; border-radius:15px;">
            <p id="qrContent" style="font-weight:bold; color:var(--danger); margin-top:10px;"></p>
        </div>
    </div>

    <div id="tab-lichsu" class="tab-content">
        <div class="p-header">LỊCH SỬ CHUYẾN ĐI</div>
        <div id="historyList"></div>
    </div>

    <div class="footer-panel">
        <div id="homeUI">
            <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold; margin-bottom:5px;">
                <span>GIÁ/KM</span><span style="color:var(--danger)"><span id="rateLabel">15,000</span>đ</span>
            </div>
            <input type="range" min="10000" max="50000" step="1000" value="15000" style="width:100%; margin-bottom:15px;" oninput="updateRate(this.value)">
            <button id="mainBtn" style="width:100%; padding:15px; border-radius:15px; border:none; background:var(--primary); color:white; font-size:18px; font-weight:900;" onclick="handleTrip()">BẮT ĐẦU</button>
        </div>
        <div class="nav-grid">
            <button class="nav-item active" onclick="showTab('home')">🏠<br>Trang chủ</button>
            <button class="nav-item" onclick="showTab('vi')">💰<br>Ví tiền</button>
            <button class="nav-item" onclick="showTab('lichsu')">📊<br>Lịch sử</button>
            <button class="nav-item" onclick="alert('Admin: Nguyễn Xuân Đạt')">👤<br>Tôi</button>
        </div>
        <div class="brand-footer">PHÁT TRIỂN BỞI: NGUYỄN XUÂN ĐẠT</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const TX_ID = "TX" + Math.floor(Math.random()*9000 + 1000);
        const CHECK_KEY = "309f930afb5691846cd5abbbd3624d507fa8fb5d715d9da03474a711cf262fb2";
        let isRunning = false, totalKm = 0, lastPos = null, currentRate = 15000, wl = null;

        document.getElementById('idShow').innerText = "🆔 " + TX_ID;

        // BẢN ĐỒ & GPS THUẬT TOÁN XANH SM
        const map = L.map('map', { zoomControl: false }).setView([21.0285, 105.8542], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // AUTO NGÀY ĐÊM
        if(new Date().getHours() > 18 || new Date().getHours() < 6) document.getElementById('map').classList.add('night-mode');

        function updateRate(v) { 
            currentRate = v; 
            document.getElementById('rateLabel').innerText = parseInt(v).toLocaleString(); 
        }

        async function handleTrip() {
            isRunning = !isRunning;
            const btn = document.getElementById('mainBtn');
            if(isRunning) {
                if('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen');
                btn.innerText = "KẾT THÚC"; btn.style.background = "var(--danger)";
                map.locate({watch: true, enableHighAccuracy: true});
                speakAI("Hành trình bắt đầu. Hệ thống bảo mật đã kích hoạt.");
            } else {
                saveHistory();
                if(wl) wl.release();
                btn.innerText = "BẮT ĐẦU"; btn.style.background = "var(--primary)";
                map.stopLocate();
                speakAI(`Hành trình hoàn tất. Tổng cước ${document.getElementById('cost').innerText} đồng.`);
                totalKm = 0; updateUI();
            }
        }

        map.on('locationfound', (e) => {
            if(!isRunning) return;
            if(lastPos) {
                let d = e.latlng.distanceTo(lastPos) / 1000;
                // Thuật toán: Chỉ tính KM khi tốc độ > 1km/h và di chuyển trên 7m
                if(d > 0.007 && d < 0.2) { 
                    totalKm += d;
                    lastPos = e.latlng;
                    updateUI();
                }
            } else { lastPos = e.latlng; }
            map.panTo(e.latlng);
        });

        function updateUI() {
            document.getElementById('km').innerText = totalKm.toFixed(2);
            document.getElementById('cost').innerText = Math.floor(totalKm * currentRate).toLocaleString();
        }

        // WEBHOOK & THANH TOÁN TỰ ĐỘNG
        function selectPack(price, name) {
            const qr = `https://img.vietqr.io/image/bidv-4430269669-compact2.png?amount=${price}&addInfo=${TX_ID}%20${name}&accountName=NGUYEN%20XUAN%20DAT`;
            document.getElementById('qrImg').src = qr;
            document.getElementById('qrContent').innerText = `${TX_ID} ${name}`;
            
            // Giả lập Webhook Check (Thực tế sẽ gọi API Vercel của anh)
            console.log("Checking Webhook via Checksum...");
        }

        // AI Giao Tiếp 2 Chiều (Gemini)
        async function askAI() {
            const input = document.getElementById('ai-input').value;
            if(!input) return;
            const box = document.getElementById('ai-content');
            box.innerHTML += `<div><b>Tôi:</b> ${input}</div>`;
            
            // Gọi API Gemini bằng Key của anh
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=AIzaSyBYIpmslXFTkETW7cfiPeLJ0oPcgMJUn2g`, {
                    method: 'POST',
                    body: JSON.stringify({ contents: [{ parts: [{ text: input }] }] })
                });
                const data = await res.json();
                const reply = data.candidates[0].content.parts[0].text;
                box.innerHTML += `<div style="color:var(--primary)"><b>AI:</b> ${reply}</div>`;
                speakAI(reply);
            } catch(e) { 
                box.innerHTML += `<div>AI đang bận, anh Đạt vui lòng chờ...</div>`;
            }
            document.getElementById('ai-input').value = "";
        }

        function speakAI(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'vi-VN'; window.speechSynthesis.speak(msg);
        }

        // Kéo thả AI
        const aiRoot = document.getElementById('ai-root');
        aiRoot.onpointermove = (e) => {
            if(e.pressure > 0) {
                aiRoot.style.left = (e.clientX - 35) + 'px';
                aiRoot.style.top = (e.clientY - 35) + 'px';
            }
        };
        aiRoot.onclick = () => {
            const box = document.getElementById('ai-chat-box');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        };

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            if(id !== 'home') document.getElementById('tab-'+id).style.display = 'flex';
        }

        function saveHistory() {
            const history = document.getElementById('historyList');
            const div = document.createElement('div');
            div.style = "background:white; margin:10px; padding:15px; border-radius:10px; border-left:5px solid var(--primary)";
            div.innerHTML = `<b>${new Date().toLocaleTimeString()}</b><br>Quãng đường: ${totalKm.toFixed(2)} KM<br>Thành tiền: ${document.getElementById('cost').innerText}đ`;
            history.prepend(div);
        }

        // BẢO MẬT CHỐNG HACK
        setInterval(() => {
            const t = performance.now(); debugger;
            if(performance.now() - t > 100) location.reload();
        }, 1000);
    </script>
</body>
</html>
