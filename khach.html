<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi Promax - Trợ Lý</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap');
        body { margin: 0; background: #f0fbfc; font-family: 'Lexend', sans-serif; overflow: hidden; }
        #ai-wrapper { position: fixed; bottom: 30px; right: 15px; z-index: 999999; display: flex; flex-direction: column; align-items: flex-end; }
        #ai-root { 
            width: 75px; height: 75px; border-radius: 50%; 
            background: #fff url('https://raw.githubusercontent.com/nguyenxuandat20091985-rgb/taxi-promax/main/angel.jpg') no-repeat center;
            background-size: cover; border: 3px solid #00f2ff;
            box-shadow: 0 4px 20px rgba(0, 242, 255, 0.6);
            cursor: pointer; animation: floating 3s infinite ease-in-out;
        }
        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        #ai-chat-box { width: 310px; max-width: 85vw; background: #fff; border-radius: 25px; margin-bottom: 15px; display: none; flex-direction: column; border: 1px solid #00f2ff; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .ai-header { background: #00d1d1; color: white; padding: 15px; text-align: center; font-weight: 600; }
        #ai-content { max-height: 300px; min-height: 150px; overflow-y: auto; padding: 18px; background: #f0fbfc; }
        .msg-a { background: #fff; color: #333; padding: 10px 15px; border-radius: 18px 18px 18px 0; margin: 8px 0; border: 1px solid #e0f7f7; width: fit-content; max-width: 82%; font-size: 14px; box-shadow: 2px 2px 5px rgba(0,0,0,0.02); }
        .msg-u { background: #00d1d1; color: white; padding: 10px 15px; border-radius: 18px 18px 0 18px; margin: 8px 0 8px auto; width: fit-content; max-width: 82%; font-size: 14px; }
        .ai-input-area { display: flex; padding: 12px 15px; background: #fff; border-top: 1px solid #eef2f2; gap: 8px; }
        #ai-txt { flex: 1; border: 1px solid #e0e6e6; outline: none; padding: 10px 18px; border-radius: 25px; font-size: 14px; }
        #ai-send { color: #00d1d1; font-size: 24px; border: none; background: none; cursor: pointer; }
    </style>
</head>
<body>
    <div id="ai-wrapper">
        <div id="ai-chat-box">
            <div class="ai-header">🌿 TRỢ LÝ XANH SM PROMAX</div>
            <div id="ai-content"></div>
            <div class="ai-input-area"><input type="text" id="ai-txt" placeholder="Nhắn gì đó với em đi... ✨"><button id="ai-send">🚀</button></div>
        </div>
        <div id="ai-root"></div>
    </div>
    <script>
        const root = document.getElementById('ai-root'), chat = document.getElementById('ai-chat-box'), content = document.getElementById('ai-content'), txtInput = document.getElementById('ai-txt'), sendBtn = document.getElementById('ai-send');
        root.onclick = () => { chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex'; if(chat.style.display === 'flex' && content.innerHTML === "") addMsg("Chào anh Đạt! Em là trợ lý Xanh SM của Taxi Promax đây ạ. ✨", 'ai'); };
        function addMsg(t, s) { const d = document.createElement('div'); d.className = s === 'user' ? 'msg-u' : 'msg-a'; d.innerHTML = t; content.appendChild(d); content.scrollTop = 9999; }
        sendBtn.onclick = async () => {
            const m = txtInput.value.trim(); if(!m) return;
            txtInput.value = ''; addMsg(m, 'user');
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyBYIpmslXFTkETW7cfiPeLJ0oPcgMJUn2g`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Bạn là trợ lý Xanh SM của hãng Taxi Promax. Hãy gọi khách là anh/chị xưng em. Trả lời cực kỳ ngọt ngào, chuyên nghiệp và ngắn gọn: ${m}` }] }] })
                });
                const data = await res.json(); addMsg(data.candidates[0].content.parts[0].text, 'ai');
            } catch { addMsg("Em nghe đây ạ! ✨", 'ai'); }
        };
        txtInput.onkeypress = (e) => { if(e.key === 'Enter') sendBtn.click(); };
    </script>
</body>
</html>
