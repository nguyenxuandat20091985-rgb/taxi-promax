<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TAXI PROMAX - NGUYEN XUAN DAT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #00bfa5; --dark: #002d26; --gold: #ffc107; --danger: #ff5252; --bg: #f8faf9; --glass: rgba(255, 255, 255, 0.95); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; background: var(--bg); position: fixed; width: 100%; }
        
        #map { height: 100vh; width: 100vw; z-index: 1; transition: filter 0.5s; }
        .night-mode { filter: invert(90%) hue-rotate(180deg) brightness(95%) contrast(90%); }

        .header { position: fixed; top: env(safe-area-inset-top, 10px); left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 1000; }
        .badge { background: var(--glass); padding: 8px 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 11px; font-weight: 800; color: var(--dark); border: 1px solid white; }

        .stats-bar { position: fixed; top: calc(env(safe-area-inset-top, 10px) + 45px); left: 10px; right: 10px; background: var(--glass); border-radius: 15px; display: flex; padding: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); z-index: 1000; border: 1px solid white; }
        .stat-item { flex: 1; text-align: center; }
        .stat-label { font-size: 9px; color: #7f8c8d; font-weight: 800; text-transform: uppercase; }
        .stat-value { font-size: 22px; font-weight: 900; color: var(--dark); }

        .footer-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; z-index: 2000; border-radius: 25px 25px 0 0; padding: 15px 15px calc(env(safe-area-inset-bottom, 5px) + 5px); box-shadow: 0 -10px 30px rgba(0,0,0,0.08); }
        .nav-grid { display: flex; justify-content: space-around; margin-top: 10px; padding-top: 8px; border-top: 1px solid #eee; }
        .nav-item { border: none; background: none; color: #bdc3c7; font-size: 10px; font-weight: 700; text-align: center; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .brand-footer { font-size: 9px; text-align: center; color: #bdc3c7; margin-top: 8px; font-weight: bold; }

        .tab-content { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 130px); background: #fdfdfd; z-index: 1500; display: none; flex-direction: column; overflow-y: auto; }
        .p-header { background: var(--primary); color: white; padding: 30px 20px; text-align: center; border-radius: 0 0 25px 25px; }
        .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .p-card { background: white; border: 2px solid #ecf0f1; border-radius: 18px; padding: 12px; position: relative; }
        .p-card.active { border-color: var(--primary); background: #f0fffb; }
        .p-card b { font-size: 12px; display: block; }
        .p-card span { color: var(--primary); font-weight: 800; }

        .btn-main { width: 100%; padding: 16px; border-radius: 15px; border: none; background: var(--primary); color: white; font-size: 16px; font-weight: 900; box-shadow: 0 6px 20px rgba(0,191,165,0.3); }
        
        /* AI STYLES */
        #ai-wrapper { position: fixed; bottom: 150px; right: 15px; z-index: 9999; }
        #ai-root { width: 65px; height: 65px; border-radius: 50%; background: url('https://raw.githubusercontent.com/nguyenxuandat20091985-rgb/taxi-promax/main/CC_20260130_193050.png') center/cover; border: 3px solid var(--primary); box-shadow: 0 0 15px rgba(0,191,165,0.5); cursor: move; touch-action: none; }
        #ai-chat { width: 280px; height: 350px; background: white; border-radius: 20px; display: none; flex-direction: column; border: 1px solid var(--primary); margin-bottom: 10px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header">
        <div class="badge" id="idShow">🆔 TX-LOADING...</div>
        <div class="badge" id="planShow">⭐ GÓI: MIỄN PHÍ</div>
    </div>

    <div class="stats-bar">
        <div class="stat-item" style="border-right: 1px solid #eee;">
            <div class="stat-label">CƯỚC (VNĐ)</div>
            <div id="cost" class="stat-value">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">KHOẢNG CÁCH (KM)</div>
            <div id="km" class="stat-value">0.00</div>
        </div>
    </div>

    <div id="map"></div>

    <div id="tab-vi" class="tab-content">
        <div class="p-header"><b>VÍ TÀI KHOẢN</b><br><small id="trialCount">Đang kiểm tra gói cước...</small></div>
        <div class="p-grid" id="packContainer">
            <div class="p-card" onclick="selectPack(19000, 'BASIC')"><b>GÓI BASIC</b><span>19k/tháng</span></div>
            <div class="p-card" onclick="selectPack(29000, 'PRO')"><b>GÓI PRO</b><span>29k/tháng</span></div>
            <div class="p-card active" onclick="selectPack(49000, 'VIP')"><b>GÓI VIP</b><span>49k/tháng</span></div>
            <div class="p-card" onclick="selectPack(999000, 'FOREVER')"><b>TRỌN ĐỜI</b><span>999k</span></div>
        </div>
        <div style="text-align:center; padding: 20px;">
            <img id="qrImg" style="width:200px; border:5px solid #fff; border-radius:15px;">
            <p style="font-size:12px;">Nội dung: <b id="qrContent" style="color:var(--danger)"></b></p>
        </div>
    </div>

    <div id="tab-lichsu" class="tab-content">
        <div class="p-header">LỊCH SỬ CHUYẾN ĐI</div>
        <div id="historyList" style="padding:15px;"></div>
    </div>

    <div class="footer-panel">
        <div id="homeUI">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:12px; font-weight:bold;">
                <span>GIÁ/KM: <span id="rateLabel" style="color:var(--primary)">15,000</span>đ</span>
            </div>
            <input type="range" min="10000" max="50000" step="1000" value="15000" style="width:100%; accent-color:var(--primary)" oninput="updateRate(this.value)">
            <button id="mainBtn" class="btn-main" onclick="handleTrip()">BẮT ĐẦU CHUYẾN ĐI</button>
        </div>
        <div class="nav-grid">
            <button class="nav-item active" onclick="switchTab('home', this)">Trang chủ</button>
            <button class="nav-item" onclick="switchTab('vi', this)">Ví tiền</button>
            <button class="nav-item" onclick="switchTab('lichsu', this)">Lịch sử</button>
        </div>
        <div class="brand-footer">PHÁT TRIỂN BỞI: NGUYỄN XUÂN ĐẠT</div>
    </div>

    <div id="ai-wrapper">
        <div id="ai-chat">
            <div style="background:var(--primary); color:white; padding:10px; font-size:12px; text-align:center; border-radius:20px 20px 0 0;">AI TRỢ LÝ TAXI PROMAX</div>
            <div id="ai-msg" style="flex:1; overflow-y:auto; padding:10px; font-size:13px;"></div>
            <div style="display:flex; padding:10px; border-top:1px solid #eee;">
                <input type="text" id="ai-input" style="flex:1; border:1px solid #ddd; border-radius:15px; padding:5px 10px;" placeholder="Hỏi AI...">
                <button onclick="askAI()" style="background:none; border:none; color:var(--primary); font-weight:bold;">Gửi</button>
            </div>
        </div>
        <div id="ai-root"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 1. CONFIG & BẢO MẬT ---
        const TX_ID = localStorage.getItem('TX_ID') || 'TX' + Math.floor(Math.random()*899999 + 100000);
        localStorage.setItem('TX_ID', TX_ID);
        document.getElementById('idShow').innerText = "🆔 " + TX_ID;
        const CHECK_KEY = "309f930afb5691846cd5abbbd3624d507fa8fb5d715d9da03474a711cf262fb2";
        const GEMINI_KEY = "AIzaSyBYIpmslXFTkETW7cfiPeLJ0oPcgMJUn2g";
        
        let isRunning = false, totalKm = 0, lastPos = null, currentRate = 15000, wl = null;
        let map = L.map('map', { zoomControl: false }).setView([21.0285, 105.8542], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // --- 2. HỆ THỐNG GÓI CƯỚC & WEBHOOK ---
        async function checkSubscription() {
            try {
                const res = await fetch(`https://taxi-promax.vercel.app/api/webhook?id=${TX_ID}&key=${CHECK_KEY}`);
                const data = await res.json();
                if(data.active) {
                    document.getElementById('planShow').innerText = "⭐ GÓI: " + data.plan.toUpperCase();
                    document.getElementById('planShow').style.color = "var(--primary)";
                }
            } catch (e) { console.log("Offline mode - Dùng dữ liệu cache"); }
        }

        function selectPack(price, name) {
            const qr = `https://img.vietqr.io/image/bidv-4430269669-compact2.png?amount=${price}&addInfo=${TX_ID}%20${name}&accountName=NGUYEN%20XUAN%20DAT`;
            document.getElementById('qrImg').src = qr;
            document.getElementById('qrContent').innerText = `${TX_ID} ${name}`;
        }

        // --- 3. LOGIC VẬN HÀNH (CHỐNG GIAN LẬN GPS) ---
        function handleTrip() {
            isRunning = !isRunning;
            const btn = document.getElementById('mainBtn');
            if(isRunning) {
                btn.innerText = "DỪNG CHUYẾN (KẾT THÚC)";
                btn.style.background = "var(--danger)";
                totalKm = 0; updateUI();
                map.locate({watch: true, enableHighAccuracy: true});
                speak("Bắt đầu chuyến đi. Chúc anh Đạt thượng lộ bình an.");
                requestWakeLock();
            } else {
                saveHistory();
                btn.innerText = "BẮT ĐẦU CHUYẾN ĐI";
                btn.style.background = "var(--primary)";
                map.stopLocate();
                speak(`Chuyến đi kết thúc. Tổng cước là ${document.getElementById('cost').innerText} đồng.`);
            }
        }

        map.on('locationfound', (e) => {
            if(!isRunning) return;
            if(lastPos) {
                let dist = e.latlng.distanceTo(lastPos) / 1000;
                let speed = e.speed ? (e.speed * 3.6) : 0;
                
                // AI Lọc nhiễu: Chỉ tính nếu di chuyển trên 5m và tốc độ > 1km/h
                if(dist > 0.005 && (speed > 1 || dist < 0.1)) {
                    totalKm += dist;
                    updateUI();
                }
            }
            lastPos = e.latlng;
            map.panTo(e.latlng);
        });

        // --- 4. GIAO DIỆN & AI ---
        function updateUI() {
            document.getElementById('km').innerText = totalKm.toFixed(2);
            document.getElementById('cost').innerText = Math.floor(totalKm * currentRate).toLocaleString();
        }

        function updateRate(v) {
            currentRate = v;
            document.getElementById('rateLabel').innerText = parseInt(v).toLocaleString();
        }

        function switchTab(type, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            if(type !== 'home') document.getElementById('tab-' + type).style.display = 'flex';
        }

        async function askAI() {
            const input = document.getElementById('ai-input').value;
            const box = document.getElementById('ai-msg');
            box.innerHTML += `<div><b>Tài xế:</b> ${input}</div>`;
            
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_KEY}`, {
                    method: "POST",
                    body: JSON.stringify({contents: [{parts: [{text: input}]}]})
                });
                const data = await res.json();
                const reply = data.candidates[0].content.parts[0].text;
                box.innerHTML += `<div style="color:var(--primary)"><b>AI:</b> ${reply}</div>`;
            } catch(e) { box.innerHTML += `<div>AI đang bận, anh đợi tí...</div>`; }
        }

        // --- 5. TIỆN ÍCH ---
        function speak(txt) {
            const msg = new SpeechSynthesisUtterance(txt);
            msg.lang = 'vi-VN';
            window.speechSynthesis.speak(msg);
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) { wl = await navigator.wakeLock.request('screen'); }
        }

        function saveHistory() {
            const list = document.getElementById('historyList');
            const item = document.createElement('div');
            item.className = 'p-card';
            item.style.marginBottom = '10px';
            item.innerHTML = `📅 ${new Date().toLocaleTimeString()} - <b>${totalKm.toFixed(2)} KM</b> <span style="float:right">${document.getElementById('cost').innerText}đ</span>`;
            list.prepend(item);
        }

        // AI Root Drag
        const aiRoot = document.getElementById('ai-root');
        const aiChat = document.getElementById('ai-chat');
        aiRoot.onclick = () => aiChat.style.display = aiChat.style.display === 'flex' ? 'none' : 'flex';
        
        // Anti-Hack
        setInterval(() => { if(window.outerHeight - window.innerHeight > 200) location.reload(); }, 1000);
        
        checkSubscription();
        selectPack(49000, 'VIP');
    </script>
</body>
</html>
