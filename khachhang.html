<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <style>
        :root { --primary: #00ff9d; --bg: #090a0f; --text: #ffffff; --danger: #ff4757; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { width: 100%; height: 100vh; background: var(--bg); color: var(--text); overflow: hidden; }
        
        #map { width: 100%; height: 100%; }
        
        /* Hiệu ứng vầng quang định vị lớn hơn */
        .gps-halo { width: 24px; height: 24px; background: var(--primary); border: 4px solid #fff; border-radius: 50%; box-shadow: 0 0 20px var(--primary); }
        .gps-halo::after { content: ''; position: absolute; top: -20px; left: -20px; width: 64px; height: 64px; border: 3px solid var(--primary); border-radius: 50%; animation: halo 2s infinite; }
        @keyframes halo { 0% { transform: scale(0.2); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

        .bottom-sheet { position: absolute; bottom: 0; width: 100%; background: rgba(18, 22, 33, 0.95); backdrop-filter: blur(20px); border-radius: 30px 30px 0 0; padding: 25px; z-index: 1000; border-top: 1px solid rgba(255,255,255,0.1); }
        .price-display { font-size: 22px; font-weight: 800; color: var(--primary); }
        .btn-main { width: 100%; padding: 18px; background: linear-gradient(135deg, #00ff9d, #00bfff); border: none; border-radius: 16px; font-weight: 800; cursor: pointer; color: #000; }
    </style>
</head>
<body>

    <div id="mainAppScreen">
        <div id="map"></div>
        <div class="bottom-sheet">
            <div style="margin-bottom: 20px;">
                <input type="text" id="addr_to" placeholder="Điểm đến của bạn..." style="width:100%; padding:15px; border-radius:12px; background:#1a1d26; border:1px solid #333; color:#fff;">
            </div>
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <div id="lblDistance">Cự ly: 0 km</div>
                <div class="price-display" id="lblCash">0 đ</div>
            </div>

            <button class="btn-main" id="btnBook" onclick="handleBooking()">ĐẶT XE PROMAX NGAY</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const db = getDatabase(initializeApp({ databaseURL: "https://taxipromax-new-default-rtdb.asia-southeast1.firebasedatabase.app" }));
        let map = L.map('map').setView([21.0285, 105.8542], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Marker định vị vầng quang
        let userMarker = L.marker([21.0285, 105.8542], {
            icon: L.divIcon({ html: '<div class="gps-halo"></div>', className: 'custom-icon', iconSize: [24,24] })
        }).addTo(map);

        window.handleBooking = async () => {
            const priceText = document.getElementById('lblCash').innerText;
            const rideRef = await push(ref(db, 'rides'), {
                status: 'searching',
                price: priceText,
                timestamp: Date.now()
            });

            // Lắng nghe phản hồi từ app Tài xế
            onValue(ref(db, `rides/${rideRef.key}`), (snapshot) => {
                const data = snapshot.val();
                if(data.status === 'accepted') {
                    alert("Tài xế " + data.driverName + " đã nhận chuyến!");
                }
            });
        };
    </script>
</body>
</html>
