<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi ProMax - Khách Hàng Đặt Xe</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg-dark: #121212;
            --surface: #1e1e1e;
            --primary: #00ffaa;
            --text: #ffffff;
            --text-dim: #aaaaaa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; background-color: var(--bg-dark); color: var(--text); overflow: hidden; }
        
        /* Màn hình Đăng ký/Đăng nhập */
        #authScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .auth-card { background: var(--surface); padding: 30px; border-radius: 16px; border: 1px solid rgba(0,255,170,0.2); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .auth-card h2 { color: var(--primary); margin-bottom: 10px; font-size: 28px; }
        .auth-card p { color: var(--text-dim); margin-bottom: 25px; font-size: 14px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-dim); font-size: 14px; }
        .form-group input { width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 16px; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(0,255,170,0.3); }
        .btn-action { width: 100%; padding: 14px; background: var(--primary); border: none; border-radius: 8px; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn-action:hover { background: #00cc88; box-shadow: 0 4px 15px rgba(0,255,170,0.4); }
        
        /* Màn hình Ứng dụng chính */
        #mainAppScreen { display: none; width: 100%; height: 100%; flex-direction: column; position: relative; }
        #map { width: 100%; flex: 1; z-index: 1; }
        
        /* Khung điều khiển đặt xe phía dưới */
        .control-panel { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--surface); border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 20px; z-index: 999; box-shadow: 0 -8px 32px rgba(0,0,0,0.4); border-top: 1px solid rgba(255,255,255,0.05); }
        .header-panel { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        .welcome-text { font-weight: 600; font-size: 15px; color: var(--primary); }
        .btn-logout { background: none; border: none; color: #ff4a4a; font-size: 13px; cursor: pointer; font-weight: 500; }
        .quote-box { font-style: italic; font-size: 12px; color: var(--text-dim); text-align: center; margin-bottom: 15px; }
        
        .input-box { position: relative; margin-bottom: 12px; }
        .input-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); }
        .input-box input { width: 100%; padding: 12px 15px 12px 40px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; font-size: 14px; outline: none; }
        
        /* Gợi ý địa điểm */
        .suggestions { position: absolute; top: 100%; left: 0; width: 100%; background: #2a2a2a; border-radius: 8px; max-height: 200px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: none; border: 1px solid rgba(255,255,255,0.1); }
        .suggestion-item { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; font-size: 13px; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
        .suggestion-item:hover { background: rgba(0,255,170,0.1); color: var(--primary); }
        
        /* Địa điểm quen thuộc */
        .fav-section { display: none; align-items: center; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .fav-container { display: flex; gap: 8px; }
        .fav-badge { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .fav-badge:hover { border-color: var(--primary); color: var(--primary); }
        
        /* Chọn loại xe */
        .car-selector { display: flex; gap: 12px; margin-bottom: 15px; }
        .car-option { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: 0.3s; }
        .car-option i { font-size: 20px; margin-bottom: 6px; display: block; color: var(--text-dim); }
        .car-option.active { background: rgba(0,255,170,0.08); border-color: var(--primary); }
        .car-option.active i { color: var(--primary); }
        .car-option span { display: block; font-size: 13px; font-weight: 500; }
        
        /* Giá tiền & Quãng đường */
        .price-summary { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: rgba(0,255,170,0.04); padding: 12px 15px; border-radius: 10px; border: 1px dashed rgba(0,255,170,0.3); }
        .price-summary .distance { font-size: 13px; color: var(--text-dim); }
        .price-summary .price { font-size: 20px; font-weight: bold; color: var(--primary); }
        
        /* Khung trạng thái tracking cuốc xe */
        .tracker-box { display: none; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; margin-bottom: 15px; align-items: center; justify-content: space-between; gap: 10px; }
        .tracker-text { font-size: 13px; color: #fff; flex: 1; }
        .btn-cancel { background: #ff4a4a; border: none; padding: 8px 15px; color: white; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        
        /* Khung Thông Báo Modal */
        .app-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 10000; padding: 20px; }
        .modal-content { background: var(--surface); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 360px; text-align: center; }
        .modal-icon { font-size: 45px; margin-bottom: 15px; }
        .modal-text { font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
        .rating-container { display: none; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .star-rating i { font-size: 28px; color: #444; cursor: pointer; transition: 0.2s; }
        .star-rating i.active { color: #ffbb00; text-shadow: 0 0 8px rgba(255,187,0,0.4); }
        
        /* Ẩn bảng chỉ đường mặc định của Leaflet để app đẹp hơn */
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>

    <div id="authScreen">
        <div class="auth-card">
            <h2>TAXI PROMAX</h2>
            <p>Trải nghiệm dịch vụ di chuyển công nghệ chuẩn 5 sao</p>
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Họ và Tên quý khách:</label>
                <input type="text" id="reg_name" placeholder="Ví dụ: Nguyễn Văn A">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> Số điện thoại liên hệ:</label>
                <input type="tel" id="reg_phone" placeholder="Ví dụ: 0912345678">
            </div>
            <button class="btn-action" onclick="handleRegister()">BẮT ĐẦU HÀNH TRÌNH</button>
        </div>
    </div>

    <div id="mainAppScreen">
        <div id="map"></div>
        
        <div class="control-panel">
            <div class="header-panel">
                <div class="welcome-text" id="lblWelcomeUser">👤 Khách: Loading...</div>
                <button class="btn-logout" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
            </div>
            
            <div class="quote-box" id="lbQuote">✨ Chúc quý khách một ngày tốt lành cùng Taxi ProMax!</div>
            
            <div class="input-box">
                <i class="fa-solid fa-location-dot"></i>
                <input type="text" id="p_from" placeholder="Đang xác định vị trí hiện tại của bạn..." readonly>
            </div>
            
            <div class="input-box">
                <i class="fa-solid fa-flag-checkered"></i>
                <input type="text" id="p_to" placeholder="Nhập điểm đến bạn muốn tới..." oninput="suggestDestination(this.value)">
                <div class="suggestions" id="suggestionsBox"></div>
            </div>
            
            <div class="fav-section" id="favSection">
                <span style="font-size: 12px; color: var(--text-dim); white-space: nowrap;"><i class="fa-solid fa-history"></i> Lịch sử:</span>
                <div class="fav-container" id="favContainer"></div>
            </div>
            
            <div class="car-selector">
                <div class="car-option active" id="car4" onclick="selectCar('4_seats')">
                    <i class="fa-solid fa-car"></i>
                    <span>Xe 4 Chỗ</span>
                </div>
                <div class="car-option" id="car7" onclick="selectCar('7_seats')">
                    <i class="fa-solid fa-van-shuttle"></i>
                    <span>Xe 7 Chỗ</span>
                </div>
            </div>
            
            <div class="price-summary">
                <div class="distance" id="txtDistance">Quãng đường: 0 km</div>
                <div class="price" id="txtPrice">0 đ</div>
            </div>
            
            <div class="tracker-box" id="trackerBox">
                <div class="tracker-text" id="trackerText">
                    <i class="fa-solid fa-spinner fa-spin" style="color:var(--primary)"></i> Đang tìm xe công nghệ gần bạn...
                </div>
                <button class="btn-cancel" onclick="cancelBooking()">Hủy đặt</button>
            </div>
            
            <button class="btn-action" id="btnSubmit" onclick="submitBooking()"><i class="fa-solid fa-paper-plane"></i> ĐẶT XE NGAY</button>
        </div>
    </div>

    <div class="app-modal" id="appModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon"></div>
            <div class="modal-text" id="modalText">Thông báo hệ thống</div>
            
            <div class="rating-container" id="ratingContainer">
                <div class="star-rating">
                    <i class="fa-solid fa-star active" data-star="1" onclick="setStar(1)"></i>
                    <i class="fa-solid fa-star active" data-star="2" onclick="setStar(2)"></i>
                    <i class="fa-solid fa-star active" data-star="3" onclick="setStar(3)"></i>
                    <i class="fa-solid fa-star active" data-star="4" onclick="setStar(4)"></i>
                    <i class="fa-solid fa-star active" data-star="5" onclick="setStar(5)"></i>
                </div>
            </div>
            
            <button class="btn-action" style="padding: 10px 0;" onclick="closeAppModal()">ĐỒNG Ý</button>
        </div>
    </div>

    <script>
        // Khởi tạo các biến môi trường cấu trúc cốt lõi
        let currentUser = null; 
        let selectedCarType = "4_seats";
        let map, userMarker, driverMarker, routingControl;
        let clientLat = 21.0285, clientLng = 105.8542; // Tọa độ Hà Nội mặc định dự phòng
        let destLat = null, destLng = null;
        let currentBookingId = null;
        let selectedRating = 5;
        let eventSourceTracker = null; 
        let searchTimeout = null; 
        let calculatedPrice = 0;
        let calculatedDistance = 0;

        const friendlyQuotes = [
            "✨ Cảm ơn bạn đã lựa chọn Taxi ProMax. Sự an toàn của quý khách là niềm tự hào của chúng tôi!",
            "🌸 Mỗi chuyến đi là một niềm vui. Chúc quý khách vạn sự hanh thông, lộ trình suôn sẻ!",
            "🚖 Taxi ProMax cam kết đem tới trải nghiệm di chuyển xanh, êm ái và chuẩn 5 sao.",
            "🌟 Thời tiết hôm nay thật đẹp, hãy cùng hành trình với Taxi ProMax đến những nơi tuyệt vời nhé!"
        ]; 

        // 6.1. Cấu hình kết nối trực tiếp Firebase Realtime Database của anh Đạt
        const firebaseConfig = {
            databaseURL: "https://taxipromax-new-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        // Khởi tạo Firebase chạy ngầm tự động thông qua REST API URL Endpoint
        const BASE_DB_URL = firebaseConfig.databaseURL;

        window.onload = function() {
            const savedUser = localStorage.getItem('taxi_promax_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showMainApp();
            }
            document.addEventListener('click', function(e) {
                if (e.target && e.target.id !== 'p_to') {
                    const box = document.getElementById('suggestionsBox');
                    if(box) box.style.display = 'none';
                }
            });
        }; 

        function handleRegister() {
            const name = document.getElementById('reg_name').value.trim();
            const phone = document.getElementById('reg_phone').value.trim(); 

            if (!name || !phone) {
                alert("Vui lòng điền đầy đủ Họ tên và Số điện thoại!");
                return;
            } 

            currentUser = { name: name, phone: phone };
            localStorage.setItem('taxi_promax_user', JSON.stringify(currentUser));
            showMainApp();
        } 

        function showMainApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainAppScreen').style.display = 'flex';
            document.getElementById('lblWelcomeUser').innerText = `👤 Khách: ${currentUser.name} (${currentUser.phone})`; 

            setTimeout(() => {
                if (!map) {
                    map = L.map('map', { zoomControl: false }).setView([clientLat, clientLng], 14);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                    getCurrentLocation();
                }
                let randomQuote = friendlyQuotes[Math.floor(Math.random() * friendlyQuotes.length)];
                document.getElementById('lbQuote').innerText = randomQuote;
                loadFavoritePlaces();
            }, 200);
        } 

        function handleLogout() {
            localStorage.removeItem('taxi_promax_user');
            location.reload();
        } 

        function showAppModal(text, isSuccess = true, showStars = false) {
            document.getElementById('modalText').innerText = text;
            document.getElementById('modalIcon').innerHTML = isSuccess ? `<i class="fa-solid fa-circle-check" style="color: #00ffaa;"></i>` : `<i class="fa-solid fa-circle-exclamation" style="color: #ff4a4a;"></i>`;
            document.getElementById('ratingContainer').style.display = showStars ? 'flex' : 'none';
            document.getElementById('appModal').style.display = 'flex';
        } 

        function closeAppModal() {
            document.getElementById('appModal').style.display = 'none';
            if(document.getElementById('ratingContainer').style.display === 'flex' && currentBookingId) {
                fetch(`${BASE_DB_URL}/bookings/${currentBookingId}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rating: selectedRating })
                }).then(() => {
                    currentBookingId = null;
                    document.getElementById('p_to').value = '';
                    document.getElementById('txtPrice').innerHTML = "0 đ";
                    document.getElementById('txtDistance').innerHTML = "Quãng đường: 0 km";
                    if (routingControl) map.removeControl(routingControl);
                    loadFavoritePlaces();
                });
            }
        } 

        function setStar(starCount) {
            selectedRating = starCount;
            let stars = document.querySelectorAll('.star-rating i');
            stars.forEach(star => {
                let currentStarIdx = parseInt(star.getAttribute('data-star'));
                if(currentStarIdx <= starCount) star.classList.add('active');
                else star.classList.remove('active');
            });
        } 

        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    clientLat = position.coords.latitude;
                    clientLng = position.coords.longitude;
                    if(map) map.setView([clientLat, clientLng], 15);
                    
                    if (userMarker) userMarker.setLatLng([clientLat, clientLng]);
                    else userMarker = L.marker([clientLat, clientLng]).addTo(map).bindPopup('Vị trí của bạn').openPopup(); 

                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${clientLat}&lon=${clientLng}&accept-language=vi`)
                    .then(res => res.json()).then(data => {
                        if(data && data.display_name) {
                            let parts = data.display_name.split(',');
                            if(parts && parts.length > 0) {
                                document.getElementById('p_from').value = parts.slice(0, Math.min(3, parts.length)).join(',').trim();
                            } else {
                                document.getElementById('p_from').value = data.display_name;
                            }
                        }
                    }).catch(e => console.log("Lỗi lấy địa chỉ ngược:", e));
                }, function(err) {
                    document.getElementById('p_from').value = "Vị trí hiện tại của bạn";
                }, { enableHighAccuracy: true });
            }
        } 

        function suggestDestination(val) {
            clearTimeout(searchTimeout);
            const box = document.getElementById('suggestionsBox');
            let query = val.trim();
            
            if (query.length < 2) {
                box.style.display = 'none';
                return;
            } 

            searchTimeout = setTimeout(() => {
                let favs = localStorage.getItem('taxi_promax_favs');
                let aiSuggestions = [];
                if (favs) {
                    let list = JSON.parse(favs);
                    aiSuggestions = list.filter(item => item.name.toLowerCase().includes(query.toLowerCase()));
                }

                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&countrycodes=vn&accept-language=vi`)
                .then(res => res.json())
                .then(data => {
                    box.innerHTML = '';
                    
                    aiSuggestions.forEach(item => {
                        let div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.style.background = 'rgba(0, 255, 170, 0.08)';
                        div.innerHTML = `<i class="fa-solid fa-brain" style="color:var(--primary)"></i> <b>[Quen thuộc]</b> ${item.name.split(',')[0]}`;
                        div.onclick = function() {
                            selectTargetLocation(item.name, item.lat, item.lng);
                        };
                        box.appendChild(div);
                    });

                    if (data && data.length > 0) {
                        data.forEach(item => {
                            let cleanName = item.display_name.split(',').slice(0, 3).join(',').trim();
                            if (aiSuggestions.some(a => a.name.toLowerCase() === cleanName.toLowerCase())) return;

                            let div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.innerHTML = `<i class="fa-solid fa-location-arrow"></i> ${cleanName}`;
                            div.onclick = function() {
                                selectTargetLocation(cleanName, parseFloat(item.lat), parseFloat(item.lon));
                            };
                            box.appendChild(div);
                        });
                    }

                    if(box.children.length > 0) {
                        box.style.display = 'block';
                    } else {
                        box.style.display = 'none';
                    }
                }).catch(() => { box.style.display = 'none'; });
            }, 400);
        } 

        function selectTargetLocation(name, lat, lng) {
            document.getElementById('p_to').value = name;
            document.getElementById('suggestionsBox').style.display = 'none';
            destLat = lat;
            destLng = lng; 

            if (routingControl) map.removeControl(routingControl); 

            routingControl = L.Routing.control({
                waypoints: [L.latLng(clientLat, clientLng), L.latLng(destLat, destLng)],
                lineOptions: { styles: [{ color: '#00ffaa', opacity: 0.8, weight: 6 }] },
                createMarker: function() { return null; }
            }).addTo(map); 

            routingControl.on('routesfound', function(e) {
                calculatedDistance = e.routes[0].summary.totalDistance / 1000;
                document.getElementById('txtDistance').innerHTML = `Quãng đường: ${calculatedDistance.toFixed(1)} km`;
                let pricePerKm = (selectedCarType === "4_seats") ? 12000 : 15000;
                calculatedPrice = Math.round(calculatedDistance * pricePerKm);
                document.getElementById('txtPrice').innerHTML = calculatedPrice.toLocaleString('vi-VN') + " đ";
            });
        } 

        function saveToFavorites(name, lat, lng) {
            let favs = localStorage.getItem('taxi_promax_favs');
            favs = favs ? JSON.parse(favs) : []; 

            let exist = favs.find(f => f.name.toLowerCase() === name.toLowerCase());
            if (!exist) {
                favs.unshift({ name: name, lat: lat, lng: lng });
                if (favs.length > 4) favs.pop();
                localStorage.setItem('taxi_promax_favs', JSON.stringify(favs));
            }
        } 

        function loadFavoritePlaces() {
            let favs = localStorage.getItem('taxi_promax_favs');
            const sec = document.getElementById('favSection');
            const container = document.getElementById('favContainer');
            
            if (favs && sec && container) {
                let list = JSON.parse(favs);
                if(list.length > 0) {
                    container.innerHTML = '';
                    list.forEach(item => {
                        let shortName = item.name.split(',')[0];
                        let badge = document.createElement('div');
                        badge.className = 'fav-badge';
                        badge.innerHTML = `<i class="fa-solid fa-clock-rotate-left"></i> ${shortName}`;
                        badge.onclick = function() {
                            selectTargetLocation(item.name, item.lat, item.lng);
                        };
                        container.appendChild(badge);
                    });
                    sec.style.display = 'flex';
                    return;
                }
            }
            if (sec) sec.style.display = 'none';
        } 

        function selectCar(type) {
            selectedCarType = type;
            document.getElementById('car4').classList.remove('active');
            document.getElementById('car7').classList.remove('active');
            if(type === '4_seats') document.getElementById('car4').classList.add('active');
            else document.getElementById('car7').classList.add('active');
            if(destLat && destLng) {
                let address = document.getElementById('p_to').value;
                selectTargetLocation(address, destLat, destLng);
            }
        } 

        function submitBooking() {
            const from = document.getElementById('p_from').value.trim();
            const to = document.getElementById('p_to').value.trim();
            const btn = document.getElementById('btnSubmit'); 

            if (!to || !destLat) { 
                showAppModal("Vui lòng chọn chính xác địa chỉ Điểm Đến!", false); 
                return; 
            } 

            btn.disabled = true;
            document.getElementById('trackerBox').style.display = "flex"; 

            saveToFavorites(to, destLat, destLng); 

            const bookingData = {
                clientName: currentUser.name,
                phone: currentUser.phone,
                pickup: from,
                dropoff: to,
                carType: selectedCarType,
                pickupLat: clientLat,
                pickupLng: clientLng,
                destLat: destLat,
                destLng: destLng,
                status: "waiting",
                passengers: selectedCarType === "4_seats" ? 4 : 7,
                price: calculatedPrice,          
                distanceKm: parseFloat(calculatedDistance.toFixed(2)),   
                timestamp: Date.now()
            }; 

            fetch(`${BASE_DB_URL}/bookings.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bookingData)
            })
            .then(res => {
                if(!res.ok) throw new Error('Kết nối Firebase thất bại');
                return res.json();
            })
            .then(data => {
                currentBookingId = data.name; 
                showAppModal("Hệ thống đang điều phối tài xế gần nhất đến đón bạn.");
                startTrackingStatusRealtime(); 
            })
            .catch(err => {
                console.error(err);
                btn.disabled = false;
                document.getElementById('trackerBox').style.display = "none";
                showAppModal("Lỗi hệ thống, không thể đặt xe lúc này!", false);
            });
        }

        function startTrackingStatusRealtime() {
            if (eventSourceTracker) {
                eventSourceTracker.close();
            }
            
            eventSourceTracker = new EventSource(`${BASE_DB_URL}/bookings/${currentBookingId}.json`);
            
            eventSourceTracker.addEventListener('put', (event) => {
                const streamData = JSON.parse(event.data);
                if (!streamData) return;

                const path = streamData.path;
                const changeData = streamData.data;

                let currentStatus = "";

                if (path === "/") {
                    if (!changeData) return;
                    currentStatus = changeData.status;
                    if ((currentStatus === 'accepted' || currentStatus === 'in_progress') && changeData.driverId) {
                        trackDriverMovingRealtime(changeData.driverId);
                    }
                } 
                else if (path === "/status") {
                    currentStatus = changeData;
                }

                const trackerText = document.getElementById('trackerText');
                if (!trackerText) return;

                if (currentStatus === 'accepted' || currentStatus === 'in_progress') {
                    trackerText.innerHTML = `<i class="fa-solid fa-car fa-bounce" style="color:var(--primary)"></i> Tài xế đã nhận đơn và đang thực hiện hành trình đón bạn!`;
                } 
                else if (currentStatus === 'completed') {
                    if (eventSourceTracker) eventSourceTracker.close();
                    if (window.driverLocationSource) window.driverLocationSource.close(); 
                    
                    document.getElementById('trackerBox').style.display = "none";
                    document.getElementById('btnSubmit').disabled = false;
                    if (driverMarker) { map.removeLayer(driverMarker); driverMarker = null; }
                    
                    showAppModal("Hành trình hoàn thành! Cảm ơn bạn đã trải nghiệm dịch vụ Taxi ProMax. Xin vui lòng đánh giá dịch vụ:", true, true);
                } 
                else if (currentStatus === 'cancelled') {
                    if (eventSourceTracker) eventSourceTracker.close();
                    if (window.driverLocationSource) window.driverLocationSource.close();
                    
                    document.getElementById('trackerBox').style.display = "none";
                    document.getElementById('btnSubmit').disabled = false;
                    if (driverMarker) { map.removeLayer(driverMarker); driverMarker = null; }
                    showAppModal("Chuyến đi đã bị hủy bỏ bởi tài xế hoặc hệ thống.", false);
                }
            });
        }

        function trackDriverMovingRealtime() {
            // Hàm xử lý định vị chạy ngầm liên kết node tài xế
        }

        function cancelBooking() {
            if (!currentBookingId) return;
            
            if (confirm("Bạn có chắc chắn muốn hủy yêu cầu đặt xe này không?")) {
                fetch(`${BASE_DB_URL}/bookings/${currentBookingId}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'cancelled' })
                }).then(() => {
                    if (eventSourceTracker) eventSourceTracker.close();
                    if (window.driverLocationSource) window.driverLocationSource.close();
                    currentBookingId = null;
                    document.getElementById('trackerBox').style.display = "none";
                    document.getElementById('btnSubmit').disabled = false;
                    if (driverMarker) { map.removeLayer(driverMarker); driverMarker = null; }
                    showAppModal("Đã hủy chuyến đi thành công!");
                });
            }
        }
    </script>
