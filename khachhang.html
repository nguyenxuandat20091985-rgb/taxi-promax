<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - Khách Hàng Premium</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <style>
        :root {
            --bg-deep: #090a0f;
            --bg-card: rgba(24, 26, 32, 0.94);
            --bg-input: #1f222a;
            --primary: #00ff87;
            --primary-glow: rgba(0, 255, 135, 0.3);
            --primary-gradient: linear-gradient(90deg, #00ff87 0%, #60efff 100%);
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --border-line: rgba(255, 255, 255, 0.06);
            --danger: #ff4d4d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; letter-spacing: -0.01em; }
        body, html { width: 100%; height: 100%; background-color: var(--bg-deep); color: var(--text-main); overflow: hidden; }

        /* KHUNG CONTAINER ĐIỆN THOẠI */
        .app-container { width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; }

        /* MÀN HÌNH ĐĂNG NHẬP SANG TRỌNG */
        #authScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1c1f2e 0%, #050608 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; padding: 24px; }
        .auth-logo { font-size: 30px; font-weight: 800; color: var(--primary); text-shadow: 0 0 20px var(--primary-glow); margin-bottom: 6px; letter-spacing: 1px; }
        .auth-desc { color: var(--text-sub); font-size: 13px; text-align: center; margin-bottom: 32px; font-weight: 300; }
        .auth-card { background: var(--bg-card); padding: 32px 24px; border-radius: 24px; border: 1px solid var(--border-line); width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-sub); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-wrap i { position: absolute; left: 16px; color: var(--primary); font-size: 16px; }
        .input-wrap input { width: 100%; padding: 15px 16px 15px 46px; background: var(--bg-input); border: 1px solid transparent; border-radius: 14px; color: #fff; font-size: 15px; outline: none; transition: 0.2s ease; }
        .input-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }

        /* NÚT BẤM CHÍNH GRADIENT CAO CẤP */
        .btn-action { width: 100%; padding: 16px; background: var(--primary-gradient); border: none; border-radius: 14px; color: #000; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 4px 20px var(--primary-glow); transition: 0.2s ease; }
        .btn-action:active { transform: scale(0.98); }

        /* MÀN HÌNH CHÍNH & BẢN ĐỒ */
        #mainAppScreen { display: none; width: 100%; height: 100%; flex-direction: column; position: relative; }
        #map { width: 100%; flex: 1; z-index: 1; }

        /* HEADER THÔNG TIN NGƯỜI DÙNG */
        .app-header { position: absolute; top: 16px; left: 16px; right: 16px; z-index: 999; background: var(--bg-card); border: 1px solid var(--border-line); padding: 12px 16px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .user-block { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 38px; height: 38px; background: var(--bg-input); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); border: 1px solid var(--border-line); }
        .user-info-text { display: flex; flex-direction: column; }
        .user-info-text .wl { font-size: 11px; color: var(--text-sub); }
        .user-info-text .nm { font-size: 14px; font-weight: 600; color: #fff; }
        .btn-logout { background: none; border: none; color: var(--danger); font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; }

        /* NÚT TÂM ĐỊNH VỊ NỔI */
        .btn-float-locate { position: absolute; right: 16px; bottom: 375px; width: 46px; height: 46px; background: var(--bg-card); border: 1px solid var(--border-line); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--primary); font-size: 18px; cursor: pointer; z-index: 998; box-shadow: 0 4px 15px rgba(0,0,0,0.3); backdrop-filter: blur(8px); transition: 0.2s; }
        .btn-float-locate:active { transform: scale(0.9); }

        /* NÚT CHAT BONG BÓNG */
        #chatBubble { display: none; position: absolute; right: 16px; bottom: 435px; width: 46px; height: 46px; background: #0084ff; border-radius: 50%; justify-content: center; align-items: center; color: white; font-size: 18px; cursor: pointer; z-index: 998; box-shadow: 0 4px 15px rgba(0,132,255,0.4); animation: pulseBubble 2s infinite; }

        /* BOTTOM SHEET - KHUNG ĐIỀU KHIỂN ĐẶT XE THANH THOÁT */
        .bottom-sheet { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--bg-card); border-top-left-radius: 28px; border-top-right-radius: 28px; padding: 10px 20px 24px 20px; z-index: 999; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); border-top: 1px solid var(--border-line); backdrop-filter: blur(20px); }
        .sheet-handle { width: 44px; height: 5px; background: rgba(255,255,255,0.15); border-radius: 3px; margin: 0 auto 16px auto; }
        
        /* KHUNG NHẬP ĐỊA ĐIỂM SANG TRỌNG */
        .location-container { background: var(--bg-input); border-radius: 18px; padding: 14px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.02); position: relative; }
        .loc-row { display: flex; align-items: center; gap: 14px; position: relative; }
        .loc-icon { width: 20px; display: flex; justify-content: center; font-size: 14px; }
        .loc-icon.start { color: #00ffaa; }
        .loc-icon.end { color: #ff4757; }
        .loc-row input { flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; padding: 6px 0; outline: none; }
        .loc-line { width: 2px; height: 16px; background: rgba(255,255,255,0.1); margin-left: 9px; margin-top: 4px; margin-bottom: 4px; border-left: 2px dashed rgba(255,255,255,0.15); }

        /* HỘP GỢI Ý ĐỊA CHỈ THÔNG MINH */
        .search-suggestions { position: absolute; top: 100%; left: 0; width: 100%; background: #1f222a; border-radius: 14px; max-height: 180px; overflow-y: auto; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: none; border: 1px solid var(--border-line); margin-top: 6px; }
        .suggest-item { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.02); cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 12px; }
        .suggest-item:hover { background: rgba(0,255,135,0.06); color: var(--primary); }

        /* CHỌN LOẠI XE */
        .car-grid { display: flex; gap: 12px; margin-bottom: 16px; }
        .car-card { flex: 1; background: var(--bg-input); border: 1.5px solid transparent; border-radius: 16px; padding: 14px; text-align: center; cursor: pointer; transition: 0.2s ease; }
        .car-card i { font-size: 24px; color: var(--text-sub); margin-bottom: 6px; display: block; transition: 0.2s; }
        .car-card span { display: block; font-size: 13px; font-weight: 600; }
        .car-card.active { background: rgba(0, 255, 135, 0.05); border-color: var(--primary); }
        .car-card.active i { color: var(--primary); transform: scale(1.08); }

        /* TỔNG TIỀN VÀ QUÃNG ĐƯỜNG */
        .trip-summary { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 12px 16px; border-radius: 12px; margin-bottom: 18px; border: 1px solid rgba(255,255,255,0.03); }
        .trip-summary .km { font-size: 13px; color: var(--text-sub); }
        .trip-summary .cash { font-size: 18px; font-weight: 700; color: var(--primary); text-shadow: 0 0 10px rgba(0,255,135,0.2); }

        /* KHUNG TRẠNG THÁI TÌM XE REALTIME */
        .searching-box { display: none; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.05); padding: 16px; border-radius: 14px; margin-bottom: 16px; align-items: center; justify-content: space-between; gap: 12px; }
        .searching-text { font-size: 13px; color: #fff; flex: 1; line-height: 1.4; }
        .btn-abort { background: var(--danger); border: none; padding: 10px 18px; color: white; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }

        /* MODAL CHAT NỘI BỘ 3 CHIỀU */
        #chatModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; z-index: 10001; padding: 20px; }
        .chat-box { background: #1a1d24; width: 100%; max-width: 450px; margin: auto; height: 80vh; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border-line); }
        .chat-head { background: #222631; padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-line); }
        .chat-view { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0f1115; }
        .chat-row { max-width: 75%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.4; }
        .chat-row.driver { background: #2c313d; align-self: flex-start; color: white; border-top-left-radius: 4px; }
        .chat-row.client { background: #0084ff; align-self: flex-end; color: white; border-top-right-radius: 4px; }
        .chat-foot { padding: 12px; display: flex; gap: 8px; background: #1a1d24; border-top: 1px solid var(--border-line); }
        .chat-foot input { flex: 1; padding: 14px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; color: white; outline: none; }
        
        /* CỬA SỔ THÔNG BÁO & ĐÁNH GIÁ */
        .popup-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 10002; padding: 20px; }
        .popup-content { background: var(--bg-card); padding: 30px; border-radius: 24px; border: 1px solid var(--border-line); width: 100%; max-width: 380px; text-align: center; backdrop-filter: blur(10px); }
        .popup-icon { font-size: 48px; margin-bottom: 14px; }
        .popup-msg { font-size: 14px; line-height: 1.5; margin-bottom: 20px; color: #e5e7eb; }
        .stars-wrap { display: none; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .stars-wrap i { font-size: 30px; color: #374151; cursor: pointer; }
        .stars-wrap i.gold { color: #ffb800; text-shadow: 0 0 10px rgba(255,184,0,0.4); }
        
        /* Ẩn bảng chỉ đường thô của thư viện */
        .leaflet-routing-container { display: none !important; }
        @keyframes pulseBubble { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,132,255,0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(0,132,255,0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,132,255,0); } }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="authScreen">
            <div class="auth-logo">TAXI PROMAX</div>
            <div class="auth-desc">Hệ thống đặt xe công nghệ lõi Realtime thông minh</div>
            <div class="auth-card">
                <div class="form-group">
                    <label>Họ và Tên</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="reg_name" placeholder="Ví dụ: Nguyễn Xuân Đạt">
                    </div>
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="reg_phone" placeholder="Ví dụ: 090xxxxxxx">
                    </div>
                </div>
                <button class="btn-action" onclick="processLogin()">
                    BẮT ĐẦU SỬ DỤNG <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <div id="mainAppScreen">
            <div id="map"></div>
            
            <div class="app-header">
                <div class="user-block">
                    <div class="user-avatar"><i class="fa-solid fa-circle-user"></i></div>
                    <div class="user-info-text">
                        <span class="wl">Khách hàng thành viên</span>
                        <span class="nm" id="lblUserDisplay">Đang kết nối...</span>
                    </div>
                </div>
                <button class="btn-logout" onclick="processLogout()"><i class="fa-solid fa-power-off"></i> Thoát</button>
            </div>

            <div class="btn-float-locate" onclick="triggerImmediateGPS()" title="Định vị ngay lập tức">
                <i class="fa-solid fa-crosshairs"></i>
            </div>
            
            <div id="chatBubble" onclick="openChatView()">
                <i class="fa-solid fa-envelope"></i>
            </div>

            <div class="bottom-sheet">
                <div class="sheet-handle"></div>
                
                <div class="location-container">
                    <div class="loc-row">
                        <div class="loc-icon start"><i class="fa-solid fa-circle-dot"></i></div>
                        <input type="text" id="p_from" placeholder="Đang quét dữ liệu GPS toàn cầu..." readonly>
                    </div>
                    <div class="loc-line"></div>
                    <div class="loc-row">
                        <div class="loc-icon end"><i class="fa-solid fa-location-dot"></i></div>
                        <input type="text" id="p_to" placeholder="Quý khách muốn đi đâu?" oninput="executeSearchAddress(this.value)">
                        <div class="search-suggestions" id="suggestionsBox"></div>
                    </div>
                </div>

                <div class="car-grid">
                    <div class="car-card active" id="car4" onclick="toggleCarType('4_seats')">
                        <i class="fa-solid fa-car"></i>
                        <span>Xe 4 Chỗ</span>
                    </div>
                    <div class="car-card" id="car7" onclick="toggleCarType('7_seats')">
                        <i class="fa-solid fa-van-shuttle"></i>
                        <span>Xe 7 Chỗ</span>
                    </div>
                </div>

                <div class="trip-summary">
                    <div class="km" id="lblKm">Quãng đường: 0.0 km</div>
                    <div class="cash" id="lblCash">0 đ</div>
                </div>

                <div class="searching-box" id="trackerBox">
                    <div class="searching-text" id="trackerText">
                        <i class="fa-solid fa-spinner fa-spin" style="color:var(--primary)"></i> Đang quét luồng kết nối và tìm tài xế gần nhất...
                    </div>
                    <button class="btn-abort" onclick="abortBookingRequest()">Hủy chuyến</button>
                </div>

                <button class="btn-action" id="btnRequestRide" onclick="publishBookingToFirebase()">
                    <i class="fa-solid fa-paper-plane"></i> TIẾN HÀNH ĐẶT XE NGAY
                </button>
            </div>

        </div>

    </div>

    <div id="chatModal">
        <div class="chat-box">
            <div class="chat-head">
                <div style="font-weight:600;"><i class="fa-solid fa-comments" style="color:#0084ff"></i> Nhắn tin nội bộ chuyến đi</div>
                <i class="fa-solid fa-xmark" style="cursor:pointer; font-size:20px;" onclick="closeChatView()"></i>
            </div>
            <div class="chat-view" id="chatBody"></div>
            <div class="chat-foot">
                <input type="text" id="txtMsgInput" placeholder="Nhập tin nhắn gửi tài xế..." onkeypress="if(event.keyCode==13) pushChatMessage()">
                <button class="btn-action" style="width:auto; padding:0 20px; box-shadow:none;" onclick="pushChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <div class="popup-modal" id="appModal">
        <div class="popup-content">
            <div class="popup-icon" id="modalIcon"></div>
            <div class="popup-msg" id="modalText">Thông báo từ hệ thống</div>
            <div class="stars-wrap" id="ratingBox">
                <i class="fa-solid fa-star gold" data-val="1" onclick="updateStars(1)"></i>
                <i class="fa-solid fa-star gold" data-val="2" onclick="updateStars(2)"></i>
                <i class="fa-solid fa-star gold" data-val="3" onclick="updateStars(3)"></i>
                <i class="fa-solid fa-star gold" data-val="4" onclick="updateStars(4)"></i>
                <i class="fa-solid fa-star gold" data-val="5" onclick="updateStars(5)"></i>
            </div>
            <button class="btn-action" style="padding: 12px 0; box-shadow:none;" onclick="dismissModal()">XÁC NHẬN CHUNG</button>
        </div>
    </div>

    <script>
        let userData = null, selectedCar = "4_seats";
        let map = null, markerUser = null, markerDriver = null, routeEngine = null;
        let latClient = 21.0285, lngClient = 105.8542, latTarget = null, lngTarget = null;
        let activeBookingId = null, currentStar = 5;
        let streamTracker = null, streamChat = null, searchDelay = null;
        let finalCash = 0, finalKm = 0;

        // URL Database Firebase của anh Đạt
        const FB_REALTIME_ENDPOINT = "https://taxipromax-new-default-rtdb.asia-southeast1.firebasedatabase.app";

        window.onload = function() {
            const cachedUser = localStorage.getItem('taxi_promax_auth');
            if (cachedUser) {
                userData = JSON.parse(cachedUser);
                launchApplication();
            }
        };

        function processLogin() {
            const nm = document.getElementById('reg_name').value.trim();
            const ph = document.getElementById('reg_phone').value.trim();
            if (!nm || !ph) { alert("Vui lòng nhập họ tên và số điện thoại để tiếp tục!"); return; }
            userData = { name: nm, phone: ph };
            localStorage.setItem('taxi_promax_auth', JSON.stringify(userData));
            launchApplication();
        }

        function launchApplication() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainAppScreen').style.display = 'flex';
            document.getElementById('lblUserDisplay').innerText = `${userData.name} - ${userData.phone}`;
            
            setTimeout(() => {
                if (!map) {
                    map = L.map('map', { zoomControl: false }).setView([latClient, lngClient], 15);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                    triggerImmediateGPS(); // Tự động định vị ngay lập tức khi khởi động app thành công
                }
            }, 200);
        }

        function processLogout() { localStorage.removeItem('taxi_promax_auth'); location.reload(); }

        function triggerImmediateGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    latClient = position.coords.latitude;
                    lngClient = position.coords.longitude;
                    if(map) map.setView([latClient, lngClient], 16);
                    
                    if (markerUser) {
                        markerUser.setLatLng([latClient, lngClient]);
                    } else {
                        markerUser = L.marker([latClient, lngClient]).addTo(map).bindPopup('Vị trí đón của bạn').openPopup();
                    }

                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latClient}&lon=${lngClient}&accept-language=vi`)
                    .then(r => r.json()).then(res => {
                        if(res && res.display_name) {
                            document.getElementById('p_from').value = res.display_name.split(',').slice(0, 3).join(',').trim();
                        }
                    });
                }, function(err) {
                    console.log("Quyền vị trí chưa được cấp hoặc lỗi: ", err);
                    document.getElementById('p_from').value = "Hà An, Quảng Ninh (Mặc định)";
                }, { enableHighAccuracy: true });
            }
        }

        function executeSearchAddress(value) {
            clearTimeout(searchDelay);
            const box = document.getElementById('suggestionsBox');
            if (value.trim().length < 2) { box.style.display = 'none'; return; }

            searchDelay = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(value)}&limit=5&countrycodes=vn&accept-language=vi`)
                .then(r => r.json()).then(res => {
                    box.innerHTML = '';
                    if (res && res.length > 0) {
                        res.forEach(item => {
                            let formatName = item.display_name.split(',').slice(0, 3).join(',').trim();
                            let d = document.createElement('div');
                            d.className = 'suggest-item';
                            d.innerHTML = `<i class="fa-solid fa-location-dot" style="color:var(--text-sub)"></i> ${formatName}`;
                            d.onclick = function() { completeSelection(formatName, parseFloat(item.lat), parseFloat(item.lon)); };
                            box.appendChild(d);
                        });
                        box.style.display = 'block';
                    } else { box.style.display = 'none'; }
                });
            }, 400);
        }

        function completeSelection(name, lat, lng) {
            document.getElementById('p_to').value = name;
            document.getElementById('suggestionsBox').style.display = 'none';
            latTarget = lat; lngTarget = lng;

            if (routeEngine) map.removeControl(routeEngine);

            routeEngine = L.Routing.control({
                waypoints: [L.latLng(latClient, lngClient), L.latLng(latTarget, lngTarget)],
                lineOptions: { styles: [{ color: '#00ff87', opacity: 0.8, weight: 6 }] },
                createMarker: function() { return null; }
            }).addTo(map);

            routeEngine.on('routesfound', function(e) {
                finalKm = e.routes[0].summary.totalDistance / 1000;
                document.getElementById('lblKm').innerText = `Quãng đường: ${finalKm.toFixed(1)} km`;
                finalCash = Math.round(finalKm * (selectedCar === "4_seats" ? 12000 : 15000));
                document.getElementById('lblCash').innerText = finalCash.toLocaleString('vi-VN') + " đ";
            });
        }

        function toggleCarType(type) {
            selectedCar = type;
            document.getElementById('car4').classList.remove('active');
            document.getElementById('car7').classList.remove('active');
            document.getElementById(type === '4_seats' ? 'car4' : 'car7').classList.add('active');
            if(latTarget) completeSelection(document.getElementById('p_to').value, latTarget, lngTarget);
        }

        // ĐỒNG BỘ CORE KẾT NỐI: ĐẨY DỮ LIỆU LÊN NODE /bookings CHUẨN HOÀN TOÀN
        function publishBookingToFirebase() {
            const dest = document.getElementById('p_to').value.trim();
            if (!dest || !latTarget) { dispatchAppModal("Quý khách chưa nhập chính xác địa điểm đến!", false); return; }

            document.getElementById('btnRequestRide').disabled = true;
            document.getElementById('trackerBox').style.display = "flex";

            const payload = {
                clientName: userData.name, phone: userData.phone,
                pickup: document.getElementById('p_from').value, dropoff: dest,
                carType: selectedCar, pickupLat: latClient, pickupLng: lngClient,
                destLat: latTarget, destLng: lngTarget, status: "waiting", // Trạng thái 'waiting' để app tài xế quét tìm
                price: finalCash, distanceKm: parseFloat(finalKm.toFixed(2)),
                timestamp: Date.now()
            };

            fetch(`${FB_REALTIME_ENDPOINT}/bookings.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(r => r.json()).then(data => {
                activeBookingId = data.name;
                dispatchAppModal("Hệ thống đã phát lệnh gọi xe lên mạng lưới thành công!");
                establishRealtimeStatusMonitoring();
                establishRealtimeChatChannel();
            });
        }

        // LẮNG NGHE ĐỒNG BỘ TRẠNG THÁI CHUYẾN ĐI REALTIME
        function establishRealtimeStatusMonitoring() {
            if (streamTracker) streamTracker.close();
            streamTracker = new EventSource(`${FB_REALTIME_ENDPOINT}/bookings/${activeBookingId}.json`);
            
            streamTracker.addEventListener('put', (e) => {
                const parsed = JSON.parse(e.data);
                if (!parsed) return;
                
                // Trích xuất cấu trúc dữ liệu linh hoạt từ Firebase stream
                let currentStatus = (parsed.path === "/") ? parsed.data.status : (parsed.path === "/status" ? parsed.data : "");
                let incomingData = (parsed.path === "/") ? parsed.data : null;
                
                if (currentStatus === 'accepted' || currentStatus === 'in_progress') {
                    document.getElementById('trackerText').innerHTML = `<i class="fa-solid fa-car-side fa-bounce" style="color:var(--primary)"></i> Tài xế đang lái xe đến điểm đón của bạn!`;
                    document.getElementById('chatBubble').style.display = 'flex'; // Hiển thị nút chat ngay lập tức khi có xe nhận
                    
                    if (incomingData && incomingData.driverLat) {
                        renderDriverMovement(incomingData.driverLat, incomingData.driverLng);
                    }
                } 
                else if (currentStatus === 'completed') {
                    streamTracker.close();
                    document.getElementById('trackerBox').style.display = "none";
                    document.getElementById('btnRequestRide').disabled = false;
                    dispatchAppModal("Chuyến đi đã hoàn thành an toàn! Xin vui lòng đánh giá dịch vụ:", true, true);
                }
                else if (currentStatus === 'cancelled') {
                    streamTracker.close();
                    document.getElementById('trackerBox').style.display = "none";
                    document.getElementById('btnRequestRide').disabled = false;
                    dispatchAppModal("Chuyến đi đã bị hủy bỏ bởi tài xế hoặc hệ thống.", false);
                    flushTripContext();
                }
            });
        }

        // XE TÀI XẾ DI CHUYỂN TỊNH TIẾN THỜI GIAN THỰC TRÊN BẢN ĐỒ
        function renderDriverMovement(lat, lng) {
            if (markerDriver) {
                markerDriver.setLatLng([lat, lng]);
            } else {
                let textIcon = L.divIcon({
                    html: '<i class="fa-solid fa-car" style="color:#ffb800; font-size:26px; text-shadow:0 0 6px #000;"></i>',
                    className: 'custom-div-icon', iconSize: [26, 26]
                });
                markerDriver = L.marker([lat, lng], {icon: textIcon}).addTo(map).bindPopup('Tài xế ProMax đang tới').openPopup();
            }
        }

        function abortBookingRequest() {
            if (!activeBookingId) return;
            if (confirm("Xác nhận hủy yêu cầu đặt xe này?")) {
                fetch(`${FB_REALTIME_ENDPOINT}/bookings/${activeBookingId}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'cancelled' })
                }).then(() => { 
                    dispatchAppModal("Đã hủy chuyến đi thành công."); 
                    flushTripContext(); 
                    document.getElementById('trackerBox').style.display = "none"; 
                    document.getElementById('btnRequestRide').disabled = false; 
                });
            }
        }

        function flushTripContext() {
            activeBookingId = null;
            document.getElementById('p_to').value = '';
            document.getElementById('lblCash').innerText = "0 đ";
            document.getElementById('lblKm').innerText = "Quãng đường: 0.0 km";
            if (routeEngine) map.removeControl(routeEngine);
            if (markerDriver) { map.removeLayer(markerDriver); markerDriver = null; }
            document.getElementById('chatBubble').style.display = 'none';
        }

        // HỆ THỐNG TIN NHẮN NỘI BỘ CHAT 3 CHIỀU REALTIME
        function openChatView() { document.getElementById('chatModal').style.display = 'flex'; }
        function closeChatView() { document.getElementById('chatModal').style.display = 'none'; }

        function pushChatMessage() {
            const input = document.getElementById('txtMsgInput');
            const txt = input.value.trim();
            if(!txt || !activeBookingId) return;

            const chatNode = { sender: "client", text: txt, timestamp: Date.now() };
            fetch(`${FB_REALTIME_ENDPOINT}/bookings/${activeBookingId}/chats.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(chatNode)
            }).then(() => { input.value = ''; });
        }

        function establishRealtimeChatChannel() {
            if(streamChat) streamChat.close();
            const container = document.getElementById('chatBody');
            container.innerHTML = '';

            streamChat = new EventSource(`${FB_REALTIME_ENDPOINT}/bookings/${activeBookingId}/chats.json`);
            streamChat.addEventListener('put', () => {
                fetch(`${FB_REALTIME_ENDPOINT}/bookings/${activeBookingId}/chats.json`)
                .then(r => r.json()).then(data => {
                    container.innerHTML = '';
                    if(data) {
                        Object.keys(data).forEach(key => {
                            let item = data[key];
                            let node = document.createElement('div');
                            node.className = `chat-row ${item.sender}`;
                            node.innerText = item.text;
                            container.appendChild(node);
                        });
                        container.scrollTop = container.scrollHeight;
                    }
                });
            });
        }

        // QUẢN LÝ MODAL THÔNG BÁO VÀ ĐÁNH GIÁ SAO
        function dispatchAppModal(text, status = true, ratingActive = false) {
            document.getElementById('modalText').innerText = text;
            document.getElementById('modalIcon').innerHTML = status ? `<i class="fa-solid fa-circle-check" style="color: #00ff87;"></i>` : `<i class="fa-solid fa-triangle-exclamation" style="color: #ff4757;"></i>`;
            document.getElementById('ratingBox').style.display = ratingActive ? 'flex' : 'none';
            document.getElementById('appModal').style.display = 'flex';
        }

        function dismissModal() {
            document.getElementById('appModal').style.display = 'none';
            if(document.getElementById('ratingBox').style.display === 'flex' && activeBookingId) {
                fetch(`${FB_REALTIME_ENDPOINT}/bookings/${activeBookingId}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rating: currentStar })
                }).then(() => { flushTripContext(); });
            }
        }

        function updateStars(starCount) {
            currentStar = starCount;
            let el = document.querySelectorAll('.stars-wrap i');
            el.forEach(star => {
                if(parseInt(star.getAttribute('data-val')) <= starCount) star.classList.add('gold');
                else star.classList.remove('gold');
            });
        }
    </script>
</body>
</html>
