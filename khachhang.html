<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - Khách Hàng Luxury</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <style>
        :root {
            --bg-deep: #090a0f;
            --card-glass: rgba(18, 22, 33, 0.85);
            --island-bg: #000000;
            --primary: #00ff9d;
            --primary-glow: rgba(0, 255, 157, 0.25);
            --text-pure: #ffffff;
            --text-muted: #8fa0ba;
            --border-glass: rgba(255, 255, 255, 0.06);
            --danger: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body, html { width: 100%; height: 100%; background: var(--bg-deep); color: var(--text-pure); overflow: hidden; }

        /* MÀN HÌNH ĐĂNG NHẬP SANG TRỌNG */
        #authScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #141925 0%, #06070a 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; padding: 24px; }
        .auth-logo { font-size: 28px; font-weight: 800; color: var(--primary); text-shadow: 0 0 20px var(--primary-glow); letter-spacing: 2px; margin-bottom: 6px; }
        .auth-desc { color: var(--text-muted); font-size: 13px; margin-bottom: 30px; font-weight: 300; }
        .auth-card { background: var(--card-glass); border: 1px solid var(--border-glass); border-radius: 24px; padding: 28px; width: 100%; max-width: 380px; backdrop-filter: blur(20px); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.5px; }
        .input-box { position: relative; display: flex; align-items: center; }
        .input-box i { position: absolute; left: 16px; color: var(--primary); font-size: 15px; }
        .input-box input { width: 100%; padding: 14px 16px 14px 44px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; color: #fff; font-size: 14px; outline: none; transition: 0.25s; }
        .input-box input:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
        
        .btn-action { width: 100%; padding: 15px; background: linear-gradient(135deg, #00ff9d 0%, #00bfff 100%); border: none; border-radius: 14px; color: #000; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 20px rgba(0,255,157,0.3); display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-action:active { transform: scale(0.97); }

        /* MÀN HÌNH CHÍNH & BẢN ĐỒ TO TOÀN CẢNH */
        #mainAppScreen { display: none; width: 100%; height: 100%; position: relative; flex-direction: column; }
        #map { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }

        /* SIÊU PHẨM DYNAMIC ISLAND IPHONE 17 (ID KHÁCH HÀNG BIẾN HÌNH ĐỘNG) */
        .dynamic-island-container { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; justify-content: center; width: 100%; max-width: 360px; padding: 0 16px; }
        .dynamic-island { background: var(--island-bg); border-radius: 30px; padding: 8px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.12); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); min-width: 180px; max-width: 100%; }
        .island-avatar { width: 24px; height: 24px; background: linear-gradient(135deg, #00ff9d, #00bfff); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 11px; font-weight: 700; }
        .island-profile { display: flex; flex-direction: column; transition: opacity 0.3s; }
        .island-title { font-size: 10px; color: var(--text-muted); font-weight: 500; }
        .island-name { font-size: 12px; font-weight: 700; white-space: nowrap; }
        .btn-island-logout { background: none; border: none; color: var(--danger); font-size: 12px; cursor: pointer; padding-left: 8px; margin-left: auto;}

        /* TRẠNG THÁI MỞ RỘNG CỦA DYNAMIC ISLAND KHI TÌM TÀI XẾ */
        .dynamic-island.expanding { border-color: var(--primary); padding: 12px 20px; border-radius: 20px; background: #000; box-shadow: 0 0 20px rgba(0,255,157,0.15); }

        /* TAB ĐẶT XE BOTTOM SHEET THU HẸP THANH THOÁT (30% MÀN HÌNH) */
        .bottom-sheet { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--card-glass); border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 16px 20px 24px 20px; z-index: 998; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); border-top: 1px solid var(--border-glass); backdrop-filter: blur(25px); transition: all 0.4s ease; }
        .sheet-handle { width: 36px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; margin: 0 auto 12px auto; }
        
        .route-card { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; position: relative; }
        .route-card::before { content: ''; position: absolute; left: 19px; top: 22px; bottom: 22px; width: 1px; background: dashed rgba(255,255,255,0.15); }
        .box-address { position: relative; }
        .box-address i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 13px; }
        .box-address .fa-circle-dot { color: var(--primary); }
        .box-address .fa-location-dot { color: #ff4757; }
        .box-address input { width: 100%; padding: 12px 14px 12px 38px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; color: #fff; font-size: 13px; outline: none; }
        
        /* DANH SÁCH GỢI Ý ĐỊA CHỈ CAO CẤP */
        .suggest-holder { position: absolute; bottom: 100%; left: 0; width: 100%; background: #11141d; border-radius: 12px; max-height: 160px; overflow-y: auto; z-index: 1000; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); display: none; border: 1px solid var(--border-glass); margin-bottom: 8px; }
        .suggest-row { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.02); cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 10px; }
        .suggest-row:hover { background: rgba(0,255,157,0.05); color: var(--primary); }

        /* LOẠI XE THU GỌN MINI */
        .selector-car-mini { display: flex; gap: 10px; margin-bottom: 12px; }
        .opt-car-mini { flex: 1; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255,255,255,0.04); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .opt-car-mini i { font-size: 16px; color: var(--text-muted); }
        .opt-car-mini span { font-size: 12px; font-weight: 600; }
        .opt-car-mini.active { background: rgba(0,255,157,0.06); border-color: var(--primary); }
        .opt-car-mini.active i { color: var(--primary); }

        /* CƯỚC PHÍ TAXI PROMAX MINH BẠCH */
        .promax-pricing-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; background: rgba(0,0,0,0.25); padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.03); }
        .promax-pricing-bar .info-km { font-size: 12px; color: var(--text-muted); }
        .promax-pricing-bar .info-km strong { color: #fff; }
        .promax-pricing-bar .final-cash { font-size: 18px; font-weight: 800; color: var(--primary); text-shadow: 0 0 10px rgba(0,255,157,0.2); }

        /* NÚT ĐỊNH VỊ NỔI TRÊN BẢN ĐỒ */
        .btn-floating-locate { position: absolute; right: 16px; bottom: 210px; width: 42px; height: 42px; background: var(--card-glass); border: 1px solid var(--border-glass); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--primary); font-size: 16px; cursor: pointer; z-index: 997; box-shadow: 0 4px 15px rgba(0,0,0,0.3); backdrop-filter: blur(8px); }

        /* HIỆU ỨNG TÂM ĐỊNH VỊ CÓ VẦNG QUANG TỎA LIÊN TỤC */
        .gps-pulse-marker { position: relative; width: 14px; height: 14px; background: #00ff9d; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 8px rgba(0,255,157,1); }
        .gps-pulse-marker::before { content: ''; position: absolute; top: -13px; left: -13px; width: 36px; height: 36px; border: 2px solid var(--primary); border-radius: 50%; animation: gpsHaloAnimation 1.8s infinite ease-out; opacity: 0; }
        @keyframes gpsHaloAnimation {
            0% { transform: scale(0.4); opacity: 0; }
            30% { opacity: 0.6; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        /* KHUNG ĐANG TÌM KIẾM TRONG BOTTOM SHEET */
        .searching-loader-layout { display: none; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 12px; margin-bottom: 12px; border: 1px solid rgba(0,255,157,0.1); }
        .loader-txt { font-size: 12px; display: flex; align-items: center; gap: 8px; }
        .btn-abort-trip { background: var(--danger); border: none; padding: 8px 14px; color: #fff; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }

        .leaflet-routing-container { display: none !important; }
        .custom-gps-icon { background: none !important; border: none !important; }
    </style>
</head>
<body>

    <div id="authScreen">
        <div class="auth-logo">TAXI PROMAX</div>
        <div class="auth-desc">Hệ Thống Đặt Xe Công Nghệ Lõi Luxury</div>
        <div class="auth-card">
            <div class="input-group">
                <label>Họ tên quý khách</label>
                <div class="input-box">
                    <i class="fa-solid fa-user-tie"></i>
                    <input type="text" id="txtInputName" placeholder="Ví dụ: Nguyễn Xuân Đạt">
                </div>
            </div>
            <div class="input-group">
                <label>Số điện thoại</label>
                <div class="input-box">
                    <i class="fa-solid fa-phone-volume"></i>
                    <input type="tel" id="txtInputPhone" placeholder="Ví dụ: 0912345678">
                </div>
            </div>
            <button class="btn-action" onclick="execLogin()">
                KÍCH HOẠT HÀNH TRÌNH <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <div id="mainAppScreen">
        <div id="map"></div>
        
        <div class="btn-floating-locate" onclick="panToUserLocation()">
            <i class="fa-solid fa-location-crosshairs"></i>
        </div>

        <div class="dynamic-island-container">
            <div class="dynamic-island" id="islandBox">
                <div class="island-avatar" id="islandInitial">D</div>
                <div class="island-profile">
                    <span class="island-title">Hội viên ProMax</span>
                    <span class="island-name" id="islandUserDisplay">Đang tải...</span>
                </div>
                <button class="btn-island-logout" onclick="execLogout()"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </div>

        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            
            <div class="route-card">
                <div class="box-address">
                    <i class="fa-solid fa-circle-dot"></i>
                    <input type="text" id="addr_from" placeholder="Đang định vị tọa độ vệ tinh..." readonly>
                </div>
                <div class="box-address">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="addr_to" placeholder="Quý khách muốn đi đâu?" oninput="fireGeocodeSuggest(this.value)">
                    <div class="suggest-holder" id="suggestBox"></div>
                </div>
            </div>

            <div class="selector-car-mini">
                <div class="opt-car-mini active" id="type4" onclick="changeCarModel('4_seats')">
                    <i class="fa-solid fa-car-side"></i>
                    <span>Eco 4 Chỗ</span>
                </div>
                <div class="opt-car-mini" id="type7" onclick="changeCarModel('7_seats')">
                    <i class="fa-solid fa-van-shuttle"></i>
                    <span>Plus 7 Chỗ</span>
                </div>
            </div>

            <div class="promax-pricing-bar">
                <div class="info-km">Cự ly: <strong id="lblDistance">0.0 km</strong></div>
                <div class="final-cash" id="lblCash">0 đ</div>
            </div>

            <div class="searching-loader-layout" id="searchBarLayout">
                <div class="loader-txt">
                    <i class="fa-solid fa-circle-notch fa-spin" style="color:var(--primary)"></i> 
                    <span id="txtSearchNotify">Đang phát tín hiệu tìm tài xế gần nhất...</span>
                </div>
                <button class="btn-abort-trip" onclick="abortBookingNow()">Hủy chuyến</button>
            </div>

            <button class="btn-action" id="btnMainTrigger" onclick="executeSubmitRideToServer()">
                <i class="fa-solid fa-bolt"></i> ĐẶT XE PROMAX NGAY
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        // Cấu hình đồng bộ chuẩn tới Firebase Realtime Database của anh Đạt
        const firebaseConfig = {
            databaseURL: "https://taxipromax-new-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let sessionUser = null, currentCarType = "4_seats";
        let mainMap, clientMarker, driverMarker, mapRoutingEngine;
        let cLat = 21.0285, cLng = 105.8542, targetLat = null, targetLng = null;
        let activeRideId = null, debounceTimer = null, trackerEventSource = null;
        let currentKm = 0, currentPrice = 0;

        window.addEventListener('DOMContentLoaded', () => {
            const cached = localStorage.getItem('promax_premium_session');
            if (cached) {
                sessionUser = JSON.parse(cached);
                launchMainAppArea();
            }
        });

        window.execLogin = function() {
            const n = document.getElementById('txtInputName').value.trim();
            const p = document.getElementById('txtInputPhone').value.trim();
            if (!n || !p) { alert("Vui lòng điền đầy đủ danh tính cước vị!"); return; }
            sessionUser = { name: n, phone: p };
            localStorage.setItem('promax_premium_session', JSON.stringify(sessionUser));
            launchMainAppArea();
        }

        function launchMainAppArea() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainAppScreen').style.display = 'flex';
            
            // Đưa thông tin vào Dynamic Island
            document.getElementById('islandUserDisplay').innerText = sessionUser.name;
            document.getElementById('islandInitial').innerText = sessionUser.name.charAt(0).toUpperCase();

            setTimeout(() => {
                if (!mainMap) {
                    mainMap = L.map('map', { zoomControl: false, attributionControl: false }).setView([cLat, cLng], 15);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mainMap);
                    panToUserLocation(); // Gọi hàm định vị vầng quang tức thì
                }
            }, 350);
        }

        window.execLogout = function() {
            localStorage.removeItem('promax_premium_session');
            location.reload();
        }

        // ĐỊNH VỊ VÀ ĐƯA HÌNH TRÒN VẦNG QUANG LAN TỎA LÊN BẢN ĐỒ
        window.panToUserLocation = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    cLat = pos.coords.latitude;
                    cLng = pos.coords.longitude;
                    if(mainMap) mainMap.setView([cLat, cLng], 16);

                    // Thiết lập Marker có Class CSS vầng quang hiệu ứng tròn tỏa sáng
                    let haloGpsIcon = L.divIcon({
                        html: '<div class="gps-pulse-marker"></div>',
                        className: 'custom-gps-icon',
                        iconSize: [36, 36],
                        iconAnchor: [7, 7]
                    });

                    if (clientMarker) {
                        clientMarker.setLatLng([cLat, cLng]);
                    } else {
                        clientMarker = L.marker([cLat, cLng], { icon: haloGpsIcon }).addTo(mainMap);
                    }

                    // Gọi OpenStreetMap lấy chuỗi địa chỉ đưa vào ô Điểm Đi
                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${cLat}&lon=${cLng}&accept-language=vi`)
                    .then(r => r.json()).then(res => {
                        if(res && res.display_name) {
                            let items = res.display_name.split(',');
                            document.getElementById('addr_from').value = items.slice(0, 3).join(',').trim();
                        }
                    });
                }, null, { enableHighAccuracy: true });
            }
        }

        window.fireGeocodeSuggest = function(query) {
            clearTimeout(debounceTimer);
            const box = document.getElementById('suggestBox');
            if (query.trim().length < 2) { box.style.display = 'none'; return; }

            debounceTimer = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&countrycodes=vn&accept-language=vi`)
                .then(r => r.json()).then(data => {
                    box.innerHTML = '';
                    if(data && data.length > 0) {
                        data.forEach(row => {
                            let clean = row.display_name.split(',').slice(0, 3).join(',').trim();
                            let d = document.createElement('div');
                            d.className = 'suggest-row';
                            d.innerHTML = `<i class="fa-solid fa-street-view" style="color:var(--text-muted)"></i> ${clean}`;
                            d.onclick = () => { triggerApplyTargetRoute(clean, parseFloat(row.lat), parseFloat(row.lon)); };
                            box.appendChild(d);
                        });
                        box.style.display = 'block';
                    } else { box.style.display = 'none'; }
                });
            }, 400);
        }

        function triggerApplyTargetRoute(name, lat, lng) {
            document.getElementById('addr_to').value = name;
            document.getElementById('suggestBox').style.display = 'none';
            targetLat = lat; targetLng = lng;

            if (mapRoutingEngine) mainMap.removeControl(mapRoutingEngine);

            mapRoutingEngine = L.Routing.control({
                waypoints: [L.latLng(cLat, cLng), L.latLng(targetLat, targetLng)],
                lineOptions: { styles: [{ color: '#00ff9d', opacity: 0.85, weight: 5 }] },
                createMarker: function() { return null; }
            }).addTo(mainMap);

            mapRoutingEngine.on('routesfound', (e) => {
                currentKm = e.routes[0].summary.totalDistance / 1000;
                document.getElementById('lblDistance').innerText = `${currentKm.toFixed(1)} km`;
                
                // Thuật toán tính giá cước minh bạch chuẩn ProMax Taxi
                currentPrice = Math.round(currentKm * (currentCarType === "4_seats" ? 12000 : 16000));
                document.getElementById('lblCash').innerText = currentPrice.toLocaleString('vi-VN') + " đ";
            });
        }

        window.changeCarModel = function(type) {
            currentCarType = type;
            document.getElementById('type4').classList.remove('active');
            document.getElementById('type7').classList.remove('active');
            document.getElementById(type === '4_seats' ? 'type4' : 'type7').classList.add('active');
            if(targetLat) triggerApplyTargetRoute(document.getElementById('addr_to').value, targetLat, targetLng);
        }

        // HÀM GỬI YÊU CẦU ĐẶT XE - KẾT NỐI ĐỒNG BỘ TRỰC TIẾP FIREBASE REALTIME
        window.executeSubmitRideToServer = function() {
            const destinationStr = document.getElementById('addr_to').value.trim();
            if (!destinationStr || !targetLat) { alert("Quý khách chưa chọn điểm đến hợp lệ!"); return; }

            document.getElementById('btnMainTrigger').disabled = true;
            document.getElementById('searchBarLayout').style.display = 'flex';
            
            // Hiệu ứng Dynamic Island biến hình mở rộng sang trọng khi kích hoạt chuyến
            document.getElementById('islandBox').classList.add('expanding');
            document.getElementById('islandUserDisplay').innerText = "Đang tìm xe cứu hộ...";

            const nodeRidesRef = ref(db, 'rides');
            const newRideRecord = push(nodeRidesRef);
            activeRideId = newRideRecord.key;

            const structuredPayload = {
                rideId: activeRideId,
                clientName: sessionUser.name,
                phone: sessionUser.phone,
                pickup: document.getElementById('addr_from').value,
                dropoff: destinationStr,
                carType: currentCarType,
                pickupLat: cLat,
                pickupLng: cLng,
                destLat: targetLat,
                destLng: targetLng,
                status: "searching", // Đồng bộ trạng thái gốc để app tài xế bắt được
                price: currentPrice,
                distanceKm: parseFloat(currentKm.toFixed(1)),
                timestamp: Date.now()
            };

            set(newRideRecord, structuredPayload).then(() => {
                bindFirebaseRealtimeListener(activeRideId);
            });
        }

        // LẮNG NGHE REALTIME TUẦN TỰ ĐÚNG LỘ TRÌNH NGHIỆP VỤ GIỮA 2 APP
        function bindFirebaseRealtimeListener(rideId) {
            const specificRidePointer = ref(db, `rides/${rideId}`);
            
            onValue(specificRidePointer, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // THỐNG NHẤT 1: Khi tài xế đã bấm "Nhận Chuyến" (status chuyển sang 'accepted')
                if (data.status === 'accepted' || data.status === 'in_progress') {
                    document.getElementById('txtSearchNotify').innerHTML = `<span style="color:var(--primary); font-weight:700;">Tài xế ${data.driverName} đang đến đón!</span>`;
                    
                    // Cập nhật text Dynamic Island cực xịn
                    document.getElementById('islandUserDisplay').innerText = `Xe đón: ${data.driverName}`;
                    
                    // VẼ VỊ TRÍ XE TÀI XẾ CHẠY REALTIME TRÊN BẢN ĐỒ
                    if (data.driverLat && data.driverLng) {
                        if (driverMarker) {
                            driverMarker.setLatLng([data.driverLat, data.driverLng]);
                        } else {
                            let iconCarDriver = L.divIcon({
                                html: '<i class="fa-solid fa-taxi" style="color:#ffcc00; font-size:22px; text-shadow:0 0 6px #000;"></i>',
                                className: 'driver-car-node', iconSize: [24, 24]
                            });
                            driverMarker = L.marker([data.driverLat, data.driverLng], { icon: iconCarDriver }).addTo(mainMap)
                                .bindPopup(`Tài xế: ${data.driverName}`).openPopup();
                        }
                    }
                }
                // THỐNG NHẤT 2: Tài xế hoàn thành hành trình ('completed')
                else if (data.status === 'completed') {
                    alert("Hành trình Taxi ProMax hoàn thành xuất sắc! Xin cảm ơn quý khách.");
                    cleanUpTripAndResetApp();
                }
                // THỐNG NHẤT 3: Hủy chuyến đi ('cancelled')
                else if (data.status === 'cancelled') {
                    alert("Chuyến đi đã bị hủy bỏ.");
                    cleanUpTripAndResetApp();
                }
            });
        }

        window.abortBookingNow = function() {
            if (!activeRideId) return;
            if (confirm("Quý khách có chắc chắn muốn hủy yêu cầu đặt xe này?")) {
                update(ref(db, `rides/${activeRideId}`), { status: 'cancelled' }).then(() => {
                    cleanUpTripAndResetApp();
                });
            }
        }

        function cleanUpTripAndResetApp() {
            activeRideId = null;
            document.getElementById('addr_to').value = '';
            document.getElementById('lblCash').innerText = "0 đ";
            document.getElementById('lblDistance').innerText = "0.0 km";
            document.getElementById('btnMainTrigger').disabled = false;
            document.getElementById('searchBarLayout').style.display = 'none';
            
            // Trả Dynamic Island về diện mạo cũ
            document.getElementById('islandBox').classList.remove('expanding');
            document.getElementById('islandUserDisplay').innerText = sessionUser.name;

            if (mapRoutingEngine) mainMap.removeControl(mapRoutingEngine);
            if (driverMarker) { mainMap.removeLayer(driverMarker); driverMarker = null; }
        }
    </script>
</body>
</html>
