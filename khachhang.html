<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAXI PROMAX - ĐẶT XE SANG TRỌNG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { 
            --primary: #10b981; /* Màu xanh ngọc rực rỡ, sang trọng */
            --primary-hover: #059669; 
            --bg-main: #060c0a; /* Nền tối sâu thẳm đẳng cấp */
            --bg-card: #111916; /* Màu nền thẻ nổi phía trên */
            --bg-input: #192521; /* Nền của ô nhập liệu */
            --text-main: #ffffff;
            --text-muted: #8fa39e;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main); 
            margin: 0; 
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Thẻ bao ngoài được bo góc lớn, đổ bóng sâu */
        .app-container { 
            background: var(--bg-card); 
            border: 1px solid rgba(16, 185, 129, 0.15); 
            padding: 24px; 
            border-radius: 28px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(16, 185, 129, 0.05); 
            width: 100%;
            max-width: 450px; 
            box-sizing: border-box;
        }

        /* Tiêu đề ứng dụng phong cách thương hiệu */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h2 { 
            color: var(--primary); 
            font-size: 26px; 
            font-weight: 800;
            margin: 0 0 6px 0; 
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header p { 
            font-size: 13px; 
            color: var(--text-muted); 
            margin: 0;
            font-weight: 500;
        }

        /* Khu vực chọn dịch vụ loại xe giống Xanh SM */
        .service-selection {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        .service-card {
            flex: 1;
            background: var(--bg-input);
            border: 1.5px solid transparent;
            padding: 14px;
            border-radius: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .service-card i {
            font-size: 24px;
            color: var(--text-muted);
            margin-bottom: 8px;
            transition: color 0.25s;
        }
        .service-card .title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
        }
        /* Trạng thái khi thẻ xe được chọn */
        .service-card.active {
            border-color: var(--primary);
            background: rgba(16, 185, 129, 0.08);
        }
        .service-card.active i, .service-card.active .title {
            color: var(--primary);
        }

        /* Khung chứa ô nhập liệu */
        .input-box { 
            margin-bottom: 18px; 
        }
        .input-box label { 
            display: block; 
            font-size: 11px; 
            color: var(--primary); 
            margin-bottom: 6px; 
            font-weight: 700; 
            letter-spacing: 0.5px;
        }
        
        /* Đưa icon vào bên trong thanh nhập dữ liệu */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 16px;
            pointer-events: none;
            transition: color 0.2s;
        }
        .input-wrapper input { 
            width: 100%; 
            padding: 14px 14px 14px 42px; 
            border-radius: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            background: var(--bg-input); 
            color: var(--text-main); 
            box-sizing: border-box; 
            font-size: 14px; 
            font-weight: 500;
            transition: all 0.2s ease;
        }
        /* Hiệu ứng khi người dùng bấm chọn vào ô nhập liệu */
        .input-wrapper input:focus { 
            border-color: var(--primary); 
            background: rgba(25, 37, 33, 0.8);
            outline: none; 
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.1);
        }
        .input-wrapper input:focus + i {
            color: var(--primary);
        }

        /* Thiết kế nút bấm Đặt Xe Sang Trọng */
        .btn-send { 
            width: 100%; 
            padding: 16px; 
            border-radius: 50px; /* Bo cong hoàn toàn sang trọng */
            border: none; 
            background: linear-gradient(135deg, var(--primary), #059669); 
            color: white; 
            font-weight: 800; 
            font-size: 16px; 
            letter-spacing: 0.5px;
            cursor: pointer; 
            margin-top: 15px; 
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }
        .btn-send:active { 
            transform: translateY(1px);
            background: var(--primary-hover); 
        }
        .btn-send:disabled {
            background: #2d3748;
            color: #718096;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h2><i class="fa-solid fa-taxi"></i> TAXI PROMAX</h2>
            <p>Hệ thống đặt xe liên tỉnh cao cấp</p>
        </div>

        <div class="service-selection">
            <div class="service-card active" id="car4" onclick="selectCar('4_seats')">
                <i class="fa-solid fa-car-side"></i>
                <div class="title">Xe 4 Chỗ</div>
            </div>
            <div class="service-card" id="car7" onclick="selectCar('7_seats')">
                <i class="fa-solid fa- van-shuttle" style="font-style: normal; font-variant: normal;">
                    <i class="fa-solid fa-car-rear"></i>
                </i>
                <div class="title">Xe 7 Chỗ</div>
            </div>
        </div>
        
        <div class="input-box">
            <label>ĐIỂM ĐÓN</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-location-dot" style="color: #10b981;"></i>
                <input type="text" id="p_from" placeholder="Ví dụ: Cổng Sun World">
            </div>
        </div>

        <div class="input-box">
            <label>ĐIỂM ĐẾN</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-flag-checkered" style="color: #ef4444;"></i>
                <input type="text" id="p_to" placeholder="Ví dụ: Sân bay Nội Bài">
            </div>
        </div>

        <div class="input-box">
            <label>SỐ ĐIỆN THOẠI</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" id="p_phone" placeholder="Nhập SĐT để tài xế gọi lại">
            </div>
        </div>

        <div class="input-box">
            <label>SỐ HÀNH KHÁCH</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-users"></i>
                <input type="number" id="p_count" value="1" min="1">
            </div>
        </div>

        <button class="btn-send" id="btnSubmit" onclick="submitBooking()">
            <i class="fa-solid fa-paper-plane"></i> YÊU CẦU XE NGAY
        </button>
    </div>

    <script>
        // Lưu trữ loại xe mặc định được chọn ban đầu
        let selectedCarType = "4_seats";

        // Hàm xử lý đổi loại xe trực quan khi bấm tab
        function selectCar(type) {
            selectedCarType = type;
            document.getElementById('car4').classList.remove('active');
            document.getElementById('car7').classList.remove('active');
            
            if(type === '4_seats') {
                document.getElementById('car4').classList.add('active');
            } else {
                document.getElementById('car7').classList.add('active');
            }
        }

        function submitBooking() {
            const from = document.getElementById('p_from').value.trim();
            const to = document.getElementById('p_to').value.trim();
            const phone = document.getElementById('p_phone').value.trim();
            const count = document.getElementById('p_count').value;
            const btn = document.getElementById('btnSubmit');

            if (!from) { alert("Anh cho em xin địa chỉ Điểm Đón nhé!"); return; }
            if (!to) { alert("Anh cho em xin địa chỉ Điểm Đến nhé!"); return; }
            if (!phone) { alert("Anh cho em xin số điện thoại để liên hệ nhé!"); return; }

            // Khóa nút để bảo vệ hệ thống tránh click liên tục
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> ĐANG GỬI YÊU CẦU...`;

            // Gom dữ liệu chuyến đi có kèm cả phân loại xe
            const bookingData = {
                pickup: from,
                dropoff: to,
                phone: phone,
                passengers: count,
                carType: selectedCarType, // Thêm thông tin loại xe 4 hay 7 chỗ
                status: "waiting",
                timestamp: Date.now()
            };

            // Bắn dữ liệu trực tiếp lên Firebase Realtime Database của anh Đạt
            fetch('https://taxi-promax-default-rtdb.firebaseio.com/datxe.json', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bookingData)
            })
            .then(response => {
                if (!response.ok) { throw new Error('Kết nối mạng có vấn đề'); }
                return response.json();
            })
            .then(data => {
                alert("✅ Đã gửi yêu cầu thành công! Hệ thống tự động điều phối đang tìm tài xế gần nhất cho anh.");
                // Trả các trường dữ liệu về rỗng
                document.getElementById('p_from').value = '';
                document.getElementById('p_to').value = '';
                document.getElementById('p_phone').value = '';
                document.getElementById('p_count').value = '1';
                selectCar('4_seats'); // Trở về mặc định xe 4 chỗ
            })
            .catch(error => {
                console.error('Lỗi gửi đơn:', error);
                alert("❌ Gửi yêu cầu thất bại, anh kiểm tra lại kết nối mạng giúp em.");
            })
            .finally(() => {
                // Phục hồi lại nút bấm ban đầu
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> YÊU CẦU XE NGAY`;
            });
        }
    </script>
</body>
</html>
