<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taxi ProMax - Khách Hàng Chuyên Nghiệp</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0b0c10;
            --bg-card: rgba(23, 26, 33, 0.94);
            --bg-input: rgba(12, 14, 18, 0.8);
            --primary: #00ffaa;
            --primary-gradient: linear-gradient(135deg, #00ffaa 0%, #00bfff 100%);
            --primary-glow: rgba(0, 255, 170, 0.25);
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --border-light: rgba(255, 255, 255, 0.06);
            --danger: #ff4d4d;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; letter-spacing: -0.01em; }
        body, html { width: 100%; height: 100%; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; }
        
        /* MÀN HÌNH ĐĂNG NHẬP SANG TRỌNG */
        #authScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #171d2c 0%, #06070a 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; padding: 24px; }
        .auth-logo { font-size: 36px; font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 30px rgba(0, 255, 170, 0.2); margin-bottom: 6px; letter-spacing: 2px; }
        .auth-tagline { color: var(--text-sub); font-size: 13px; text-align: center; margin-bottom: 40px; font-weight: 300; }
        .auth-card { background: var(--bg-card); padding: 35px 28px; border-radius: 28px; border: 1px solid var(--border-light); width: 100%; max-width: 400px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); backdrop-filter: blur(15px); text-align: center; }
        .form-group { margin-bottom: 24px; text-align: left; }
        .form-group label { display: block; margin-bottom: 9px; color: var(--text-sub); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 16px; color: var(--primary); font-size: 16px; }
        .input-wrapper input { width: 100%; padding: 16px 16px 16px 48px; background: var(--bg-input); border: 1px solid var(--border-light); border-radius: 16px; color: #fff; font-size: 15px; outline: none; transition: 0.25s ease; }
        .input-wrapper input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
        
        /* ĐỔI MỚI NÚT BẤM CAO CẤP */
        .btn-prime { width: 100%; padding: 16px; background: var(--primary-gradient); border: none; border-radius: 16px; color: #040508; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 6px 20px var(--primary-glow); }
        .btn-prime:active { transform: scale(0.97); }
        
        /* MÀN HÌNH ỨNG DỤNG CHÍNH */
        #mainAppScreen { display: none; width: 100%; height: 100%; flex-direction: column; position: relative; }
        #map { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }
        
        /* HEADER NỔI THANH THOÁT */
        .app-header { position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10; background: rgba(15, 18, 25, 0.85); backdrop-filter: blur(12px); border: 1px solid var(--border-light); padding: 12px 18px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 38px; height: 38px; background: rgba(0, 255, 170, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 15px; }
        .user-details .welcome { display: block; font-size: 11px; color: var(--text-sub); }
        .user-details .username { font-size: 14px; font-weight: 700; color: #fff; }
        .btn-logout { background: none; border: none; color: var(--danger); font-size: 13px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        
        /* NÚT TÂM ĐỊNH VỊ DI ĐỘNG */
        .btn-locate-me { position: absolute; right: 16px; bottom: 395px; width: 46px; height: 46px; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--primary); font-size: 18px; cursor: pointer; z-index: 998; box-shadow: 0 6px 20px rgba(0,0,0,0.4); backdrop-filter: blur(8px); transition: 0.2s; }
        .btn-locate-me:active { transform: scale(0.9); }

        /* BONG BÓNG CHAT 3 CHIỀU */
        #chatBubble { display: none; position: absolute; right: 16px; bottom: 455px; width: 46px; height: 46px; background: #0084ff; border-radius: 50%; justify-content: center; align-items: center; color: white; font-size: 18px; cursor: pointer; z-index: 998; box-shadow: 0 6px 20px rgba(0,132,255,0.4); animation: pulse 2s infinite; }
        
        /* BOTTOM SHEET - KHUNG ĐẶT XE THANH THOÁT */
        .control-panel { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--bg-card); border-top-left-radius: 32px; border-top-right-radius: 32px; padding: 12px 20px 28px 20px; z-index: 999; box-shadow: 0 -15px 45px rgba(0,0,0,0.5); border-top: 1px solid var(--border-light); backdrop-filter: blur(25px); }
        .sheet-handle { width: 42px; height: 5px; background: rgba(255,255,255,0.15); border-radius: 10px; margin: 0 auto 16px auto; }
        
        /* KHUNG CHỌN ĐỊA ĐIỂM SẠCH SẼ */
        .route-inputs { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; position: relative; background: var(--bg-input); padding: 16px; border-radius: 20px; border: 1px solid var(--border-light); }
        .route-inputs::before { content: ''; position: absolute; left: 25px; top: 32px; bottom: 32px; width: 1.5px; background: dashed rgba(255,255,255,0.12); z-index: 2; }
        
        .input-box { position: relative; z-index: 3; display: flex; align-items: center; }
        .input-box i { position: absolute; left: 10px; font-size: 14px; }
        .input-box .fa-dot-circle { color: #00ffaa; }
        .input-box .fa-location-dot { color: #ff4757; }
        .input-box input { width: 100%; padding: 12px 12px 12px 36px; background: transparent; border: none; color: white; font-size: 14px; outline: none; }
        .input-box::after { content: ''; position: absolute; bottom: -6px; left: 36px; right: 0; height: 1px; background: rgba(255,255,255,0.04); }
        .input-box:last-child::after { display: none; }
        
        /* GỢI Ý ĐỊA ĐIỂM */
        .suggestions { position: absolute; top: 100%; left: 0; width: 100%; background: #171a21; border-radius: 16px; max-height: 180px; overflow-y: auto; z-index: 1000; box-shadow: 0 12px 35px rgba(0,0,0,0.6); display: none; border: 1px solid var(--border-light); margin-top: 8px; }
        .suggestion-item { padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.02); cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 12px; transition: 0.2s; color: #cbd5e0; }
        .suggestion-item:hover { background: rgba(0,255,170,0.05); color: var(--primary); }
        
        /* CHỌN XE GIÁ CƯỚC MINH BẠCH PROMAX */
        .car-selector { display: flex; gap: 12px; margin-bottom: 18px; }
        .car-option { flex: 1; background: var(--bg-input); border: 1.5px solid transparent; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
        .car-option i { font-size: 26px; margin-bottom: 8px; color: var(--text-sub); transition: 0.2s; }
        .car-option.active { background: rgba(0, 255, 170, 0.04); border-color: var(--primary); box-shadow: 0 0 15px rgba(0,255,170,0.08); }
        .car-option.active i { color: var(--primary); transform: scale(1.08); }
        .car-option .car-title { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
        .car-option .car-rate { font-size: 11px; color: var(--text-sub); }
        
        /* TỔNG TIỀN MINH BẠCH */
        .price-summary { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: rgba(255,255,255,0.02); padding: 14px 18px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.03); }
        .price-summary .distance { font-size: 13px; color: var(--text-sub); }
        .price-summary .price { font-size: 24px; font-weight: 800; color: var(--primary); text-shadow: 0 0 15px rgba(0,255,170,0.25); }
        
        /* HỘP TRACKING TRẠNG THÁI REALTIME */
        .tracker-box { display: none; background: rgba(255, 71, 87, 0.05); border: 1px solid rgba(255,71,87,0.15); padding: 16px; border-radius: 16px; margin-bottom: 18px; align-items: center; justify-content: space-between; gap: 12px; }
        .tracker-text { font-size: 13px; color: #edf2f7; flex: 1; line-height: 1.4; }
        .btn-cancel { background: #ff4757; border: none; padding: 11px 20px; color: white; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-cancel:hover { background: #ff2f44; }

        /* CỬA SỔ CHAT 3 CHIỀU */
        #chatModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; z-index: 10001; padding: 20px; }
        .chat-container { background: #171a21; width: 100%; max-width: 450px; margin: auto; height: 80vh; border-radius: 28px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border-light); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .chat-header { background: #212631; padding: 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); }
        .chat-body { flex: 1; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #0c0e12; }
        .msg { max-width: 78%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.45; word-break: break-word; }
        .msg.driver { background: #2d3139; align-self: flex-start; color: white; border-top-left-radius: 4px; }
        .msg.client { background: #0084ff; align-self: flex-end; color: white; border-top-right-radius: 4px; }
        .chat-footer { padding: 14px; display: flex; gap: 10px; background: #171a21; border-top: 1px solid var(--border-light); }
        .chat-footer input { flex: 1; padding: 14px; background: var(--bg-input); border: 1px solid var(--border-light); border-radius: 14px; color: white; outline: none; }
        
        /* MODAL THÔNG BÁO & ĐÁNH GIÁ */
        .app-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 10002; padding: 20px; }
        .modal-content { background: var(--bg-card); padding: 32px 24px; border-radius: 28px; border: 1px solid var(--border-light); width: 100%; max-width: 380px; text-align: center; backdrop-filter: blur(15px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .modal-icon { font-size: 55px; margin-bottom: 18px; }
        .modal-text { font-size: 15px; line-height: 1.5; margin-bottom: 24px; color: #e2e8f0; }
        .rating-container { display: none; justify-content: center; gap: 12px; margin-bottom: 24px; }
        .star-rating i { font-size: 34px; color: #2d3748; cursor: pointer; transition: 0.15s; }
        .star-rating i.active { color: #ffb800; text-shadow: 0 0 15px rgba(255,184,0,0.35); }
        
        /* Ẩn chỉ dẫn mặc định thô kệch của thư viện routing map */
        .leaflet-routing-container { display: none !important; }
        .custom-div-icon { background: none !important; border: none !important; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,132,255,0.6); } 70% { transform: scale(1.06); box-shadow: 0 0 0 12px rgba(0,132,255,0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,132,255,0); } }
    </style>
</head>
<body>

    <div id="authScreen">
        <div class="auth-logo">TAXI PROMAX</div>
        <div class="auth-tagline">Hệ thống đặt xe công nghệ lõi Realtime thế hệ mới</div>
        <div class="auth-card">
            <div class="form-group">
                <label>Họ và Tên quý khách</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="reg_name" placeholder="Ví dụ: Nguyễn Xuân Đạt">
                </div>
            </div>
            <div class="form-group">
                <label>Số điện thoại liên hệ</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="reg_phone" placeholder="Ví dụ: 0912345678">
                </div>
            </div>
            <button class="btn-prime" onclick="handleRegister()">
                BẮT ĐẦU HÀNH TRÌNH <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <div id="mainAppScreen">
        <div id="map"></div>
        
        <div class="app-header">
            <div class="user-info">
                <div class="avatar"><i class="fa-solid fa-user-astronaut"></i></div>
                <div class="user-details">
                    <span class="welcome">Xin chào</span>
                    <span class="username" id="lblWelcomeUser">Đang tải...</span>
                </div>
            </div>
            <button class="btn-logout" onclick="handleLogout()"><i class="fa-solid fa-power-off"></i> Đăng xuất</button>
        </div>
        
        <div class="btn-locate-me" onclick="getCurrentLocation()" title="Định vị vị trí của tôi">
            <i class="fa-solid fa-crosshairs"></i>
        </div>
        
        <div id="chatBubble" onclick="openChatWindow()">
            <i class="fa-solid fa-comment-dots"></i>
        </div>
        
        <div class="control-panel">
            <div class="sheet-handle"></div>
            
            <div class="route-inputs">
                <div class="input-box">
                    <i class="fa-solid fa-dot-circle"></i>
                    <input type="text" id="p_from" placeholder="Đang định vị tọa độ GPS của bạn..." readonly>
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="p_to" placeholder="Bạn muốn đi đâu hôm nay?" oninput="suggestDestination(this.value)">
                    <div class="suggestions" id="suggestionsBox"></div>
                </div>
            </div>
            
            <div class="car-selector">
                <div class="car-option active" id="car4" onclick="selectCar('4_seats')">
                    <i class="fa-solid fa-car"></i>
                    <span class="car-title">Eco 4 Chỗ</span>
                    <span class="car-rate">12.000đ/km</span>
                </div>
                <div class="car-option" id="car7" onclick="selectCar('7_seats')">
                    <i class="fa-solid fa-van-shuttle"></i>
                    <span class="car-title">Plus 7 Chỗ</span>
                    <span class="car-rate">15.000đ/km</span>
                </div>
            </div>
            
            <div class="price-summary">
                <div class="distance" id="txtDistance">Quãng đường: 0.0 km</div>
                <div class="price" id="txtPrice">0 đ</div>
            </div>
            
            <div class="tracker-box" id="trackerBox">
                <div class="tracker-text" id="trackerText">
                    <i class="fa-solid fa-circle-notch fa-spin" style="color:var(--primary)"></i> Hệ thống đang tìm tài xế gần nhất...
                </div>
                <button class="btn-cancel" onclick="cancelBooking()">Hủy</button>
            </div>
            
            <button class="btn-prime" id="btnSubmit" onclick="submitBooking()">
                <i class="fa-solid fa-paper-plane"></i> ĐẶT XE NGAY
            </button>
        </div>
    </div>

    <div id="chatModal">
        <div class="chat-container">
            <div class="chat-header">
                <div style="font-weight:700; font-size:15px;"><i class="fa-solid fa-headset" style="color:#0084ff"></i> Kênh liên lạc chuyến đi</div>
                <i class="fa-solid fa-xmark" style="cursor:pointer; font-size:22px; color:var(--text-sub)" onclick="closeChatWindow()"></i>
            </div>
            <div class="chat-body" id="chatBody"></div>
            <div class="chat-footer">
                <input type="text" id="txtChatMessage" placeholder="Nhập tin nhắn gửi tài xế..." onkeypress="if(event.keyCode==13) sendChatMessage()">
                <button class="btn-prime" style="width:auto; padding:0 22px; box-shadow:none;" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <div class="app-modal" id="appModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon"></div>
            <div class="modal-text" id="modalText">Thông báo</div>
            <div class="rating-container" id="ratingContainer">
                <div class="star-rating">
                    <i class="fa-solid fa-star active" data-star="1" onclick="setStar(1)"></i>
                    <i class="fa-solid fa-star active" data-star="2" onclick="setStar(2)"></i>
                    <i class="fa-solid fa-star active" data-star="3" onclick="setStar(3)"></i>
                    <i class="fa-solid fa-star active" data-star="4" onclick="setStar(4)"></i>
                    <i class="fa-solid fa-star active" data-star="5" onclick="setStar(5)"></i>
                </div>
            </div>
            <button class="btn-prime" style="padding: 14px 0; box-shadow:none; font-weight:700;" onclick="closeAppModal()">XÁC NHẬN</button>
        </div>
    </div>

    <script>
        let currentUser = null, selectedCarType = "4_seats";
        let map, userMarker, driverMarker, routingControl;
        let clientLat = 21.0285, clientLng = 105.8542, destLat = null, destLng = null;
        let currentBookingId = null, selectedRating = 5;
        let eventSourceTracker = null, eventSourceChat = null, searchTimeout = null;
        let calculatedPrice = 0, calculatedDistance = 0;

        // URL Cổng kết nối dữ liệu Firebase của anh Đạt
        const BASE_DB_URL = "https://taxipromax-new-default-rtdb.asia-southeast1.firebasedatabase.app";

        window.onload = function() {
            const savedUser = localStorage.getItem('taxi_promax_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showMainApp();
            }
        };

        function handleRegister() {
            const name = document.getElementById('reg_name').value.trim();
            const phone = document.getElementById('reg_phone').value.trim();
            if (!name || !phone) { alert("Vui lòng nhập đầy đủ thông tin!"); return; }
            currentUser = { name: name, phone: phone };
            localStorage.setItem('taxi_promax_user', JSON.stringify(currentUser));
            showMainApp();
        }

        function showMainApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainAppScreen').style.display = 'flex';
            document.getElementById('lblWelcomeUser').innerText = currentUser.name;
            
            setTimeout(() => {
                if (!map) {
                    map = L.map('map', { zoomControl: false }).setView([clientLat, clientLng], 15);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                    getCurrentLocation();
                }
            }, 300);
        }

        function handleLogout() { localStorage.removeItem('taxi_promax_user'); location.reload(); }

        function showAppModal(text, isSuccess = true, showStars = false) {
            document.getElementById('modalText').innerText = text;
            document.getElementById('modalIcon').innerHTML = isSuccess ? `<i class="fa-solid fa-circle-check" style="color: #00ffaa;"></i>` : `<i class="fa-solid fa-circle-exclamation" style="color: #ff4757;"></i>`;
            document.getElementById('ratingContainer').style.display = showStars ? 'flex' : 'none';
            document.getElementById('appModal').style.display = 'flex';
        }

        function closeAppModal() {
            document.getElementById('appModal').style.display = 'none';
            if(document.getElementById('ratingContainer').style.display === 'flex' && currentBookingId) {
                fetch(`${BASE_DB_URL}/bookings/${currentBookingId}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rating: selectedRating })
                }).then(() => { clearTripData(); });
            }
        }

        function clearTripData() {
            currentBookingId = null;
            document.getElementById('p_to').value = '';
            document.getElementById('txtPrice').innerHTML = "0 đ";
            document.getElementById('txtDistance').innerHTML = "Quãng đường: 0.0 km";
            if (routingControl) map.removeControl(routingControl);
            if (driverMarker) { map.removeLayer(driverMarker); driverMarker = null; }
            document.getElementById('chatBubble').style.display = 'none';
        }

        function setStar(starCount) {
            selectedRating = starCount;
            let stars = document.querySelectorAll('.star-rating i');
            stars.forEach(star => {
                if(parseInt(star.getAttribute('data-star')) <= starCount) star.classList.add('active');
                else star.classList.remove('active');
            });
        }

        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    clientLat = position.coords.latitude;
                    clientLng = position.coords.longitude;
                    if(map) map.setView([clientLat, clientLng], 16);
                    
                    if (userMarker) userMarker.setLatLng([clientLat, clientLng]);
                    else userMarker = L.marker([clientLat, clientLng]).addTo(map).bindPopup('Vị trí của bạn').openPopup();

                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${clientLat}&lon=${clientLng}&accept-language=vi`)
                    .then(res => res.json()).then(data => {
                        if(data && data.display_name) {
                            document.getElementById('p_from').value = data.display_name.split(',').slice(0, 3).join(',').trim();
                        }
                    });
                }, null, { enableHighAccuracy: true });
            }
        }

        function suggestDestination(val) {
            clearTimeout(searchTimeout);
            const box = document.getElementById('suggestionsBox');
            if (val.trim().length < 2) { box.style.display = 'none'; return; }

            searchTimeout = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}&limit=5&countrycodes=vn&accept-language=vi`)
                .then(res => res.json()).then(data => {
                    box.innerHTML = '';
                    if (data && data.length > 0) {
                        data.forEach(item => {
                            let cleanName = item.display_name.split(',').slice(0, 3).join(',').trim();
                            let div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.innerHTML = `<i class="fa-solid fa-location-dot"></i> ${cleanName}`;
                            div.onclick = function() { selectTargetLocation(cleanName, parseFloat(item.lat), parseFloat(item.lon)); };
                            box.appendChild(div);
                        });
                        box.style.display = 'block';
                    } else { box.style.display = 'none'; }
                });
            }, 400);
        }

        function selectTargetLocation(name, lat, lng) {
            document.getElementById('p_to').value = name;
            document.getElementById('suggestionsBox').style.display = 'none';
            destLat = lat; destLng = lng;

            if (routingControl) map.removeControl(routingControl);

            routingControl = L.Routing.control({
                waypoints: [L.latLng(clientLat, clientLng), L.latLng(destLat, destLng)],
                lineOptions: { styles: [{ color: '#00ffaa', opacity: 0.8, weight: 6 }] },
                createMarker: function() { return null; }
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                calculatedDistance = e.routes[0].summary.totalDistance / 1000;
                document.getElementById('txtDistance').innerHTML = `Quãng đường: ${calculatedDistance.toFixed(1)} km`;
                calculatedPrice = Math.round(calculatedDistance * (selectedCarType === "4_seats" ? 12000 : 15000));
                document.getElementById('txtPrice').innerHTML = calculatedPrice.toLocaleString('vi-VN') + " đ";
            });
        }

        function selectCar(type) {
            selectedCarType = type;
            document.getElementById('car4').classList.remove('active');
            document.getElementById('car7').classList.remove('active');
            document.getElementById(type === '4_seats' ? 'car4' : 'car7').classList.add('active');
            if(destLat) selectTargetLocation(document.getElementById('p_to').value, destLat, destLng);
        }

        // ĐỒNG BỘ ĐẶT XE LÊN NODE CHUNG ĐỂ APP TÀI XẾ NHẬN ĐƯỢC CHUẨN XÁC
        function submitBooking() {
            const to = document.getElementById('p_to').value.trim();
            if (!to || !destLat) { showAppModal("Vui lòng chọn địa chỉ điểm đến!", false); return; }

            document.getElementById('btnSubmit').disabled = true;
            document.getElementById('trackerBox').style.display = "flex";

            // Khởi tạo cấu trúc dữ liệu gửi lên Firebase Realtime Database
            const bookingData = {
                clientName: currentUser.name, phone: currentUser.phone,
                pickup: document.getElementById('p_from').value, dropoff: to,
                carType: selectedCarType, pickupLat: clientLat, pickupLng: clientLng,
                destLat: destLat, destLng: destLng, status: "waiting", // Đổi trạng thái 'waiting' để app tài xế bắt được sóng
                price: calculatedPrice, distanceKm: parseFloat(calculatedDistance.toFixed(2)),
                timestamp: Date.now()
            };

            fetch(`${BASE_DB_URL}/bookings.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bookingData)
            }).then(res => res.json()).then(data => {
                currentBookingId = data.name;
                showAppModal("Hệ thống ProMax đang quét tìm tài xế gần bạn!");
                startTrackingStatusRealtime();
                listenToChatRealtime();
            });
        }

        // LẮNG NGHE ĐỒNG BỘ TRẠNG THÁI REALTIME
        function startTrackingStatusRealtime() {
            if (eventSourceTracker) eventSourceTracker.close();
            eventSourceTracker = new EventSource(`${BASE_DB_URL}/bookings/${currentBookingId}.json`);
            
            eventSourceTracker.addEventListener('put', (e) => {
                const stream = JSON.parse(e.data);
                if (!stream) return;
                
                let status = (stream.path === "/") ? stream.data.status : (stream.path === "/status" ? stream.data : "");
                
                // Khi Tài xế bấm nhận chuyến (Trạng thái đổi sang accepted)
                if (status === 'accepted' || status === 'in_progress') {
                    document.getElementById('trackerText').innerHTML = `<i class="fa-solid fa-car-side fa-bounce" style="color:var(--primary)"></i> Tài xế ProMax đã nhận chuyến và đang di chuyển!`;
                    document.getElementById('chatBubble').style.display = 'flex';
                    
                    // Kiểm tra và cập nhật vị trí xe tài xế chạy ngầm trên bản đồ
                    if(stream.path === "/" && stream.data.driverLat) {
                        updateDriverMarkerOnMap(stream.data.driverLat, stream.data.driverLng);
                    }
                } 
                else if (status === 'completed') {
                    eventSourceTracker.close();
                    document.getElementById('trackerBox').style.display = "none";
                    document.getElementById('btnSubmit').disabled = false;
                    showAppModal("Chuyến đi hoàn tất! Mời quý khách đánh giá dịch vụ:", true, true);
                }
                else if (status === 'cancelled') {
                    eventSourceTracker.close();
                    document.getElementById('trackerBox').style.display = "none";
                    document.getElementById('btnSubmit').disabled = false;
                    showAppModal("Chuyến đi đã bị hủy bỏ từ hệ thống.", false);
                    clearTripData();
                }
            });
        }

        function updateDriverMarkerOnMap(lat, lng) {
            if (driverMarker) {
                driverMarker.setLatLng([lat, lng]);
            } else {
                let carIcon = L.divIcon({
                    html: '<i class="fa-solid fa-car" style="color:#ffb800; font-size:26px; text-shadow:0 0 4px #000;"></i>',
                    className: 'custom-div-icon', iconSize: [26, 26]
                });
                driverMarker = L.marker([lat, lng], {icon: carIcon}).addTo(map).bindPopup('Tài xế Taxi ProMax').openPopup();
            }
        }

        function cancelBooking() {
            if (!currentBookingId) return;
            if (confirm("Bạn chắc chắn muốn hủy yêu cầu đặt xe này?")) {
                fetch(`${BASE_DB_URL}/bookings/${currentBookingId}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'cancelled' })
                }).then(() => { showAppModal("Đã hủy chuyến thành công."); clearTripData(); document.getElementById('trackerBox').style.display = "none"; document.getElementById('btnSubmit').disabled = false; });
            }
        }

        // KÊNH LIÊN LẠC NỘI BỘ 3 CHIỀU
        function openChatWindow() { document.getElementById('chatModal').style.display = 'flex'; }
        function closeChatWindow() { document.getElementById('chatModal').style.display = 'none'; }

        function sendChatMessage() {
            const input = document.getElementById('txtChatMessage');
            const msgText = input.value.trim();
            if(!msgText || !currentBookingId) return;

            const chatData = { sender: "client", text: msgText, timestamp: Date.now() };
            fetch(`${BASE_DB_URL}/bookings/${currentBookingId}/chats.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(chatData)
            }).then(() => { input.value = ''; });
        }

        function listenToChatRealtime() {
            if(eventSourceChat) eventSourceChat.close();
            const body = document.getElementById('chatBody');
            body.innerHTML = '';

            eventSourceChat = new EventSource(`${BASE_DB_URL}/bookings/${currentBookingId}/chats.json`);
            eventSourceChat.addEventListener('put', (e) => {
                fetch(`${BASE_DB_URL}/bookings/${currentBookingId}/chats.json`)
                .then(res => res.json()).then(data => {
                    body.innerHTML = '';
                    if(data) {
                        Object.keys(data).forEach(key => {
                            let msg = data[key];
                            let div = document.createElement('div');
                            div.className = `msg ${msg.sender}`;
                            div.innerText = msg.text;
                            body.appendChild(div);
                        });
                        body.scrollTop = body.scrollHeight;
                    }
                });
            });
        }
    </script>
</body>
</html>
