<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAXI PROMAX - ĐẶT XE NHANH</title>
    <style>
        :root { --primary: #00bfa5; --dark: #002d26; }
        body { font-family: 'Segoe UI', sans-serif; background: #001a16; color: white; margin: 0; padding: 20px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid var(--primary); padding: 20px; border-radius: 20px; box-shadow: 0 0 20px rgba(0, 191, 165, 0.2); }
        h2 { color: var(--primary); text-align: center; font-size: 24px; }
        .input-box { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: var(--primary); margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #002d26; color: white; box-sizing: border-box; }
        .btn-send { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: 900; font-size: 16px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🚕 TAXI PROMAX</h2>
        <p style="text-align: center; font-size: 12px; color: #888;">Hệ thống đặt xe ghép của Nguyễn Xuân Đạt</p>
        
        <div class="input-box">
            <label>📍 ĐIỂM ĐÓN</label>
            <input type="text" id="p_from" placeholder="Ví dụ: Cổng Sun World">
        </div>
        <div class="input-box">
            <label>🏁 ĐIỂM ĐẾN</label>
            <input type="text" id="p_to" placeholder="Ví dụ: Sân bay Nội Bài">
        </div>
        <div class="input-box">
            <label>📞 SỐ ĐIỆN THOẠI</label>
            <input type="tel" id="p_phone" placeholder="Nhập SĐT để tài xế gọi lại">
        </div>
        <div class="input-box">
            <label>👥 SỐ NGƯỜI</label>
            <input type="number" id="p_count" value="1">
        </div>

        <button class="btn-send" onclick="submitBooking()">YÊU CẦU XE NGAY</button>
    </div>

    <script>
        function submitBooking() {
            const phone = document.getElementById('p_phone').value;
            if(!phone) { alert("Anh cho em xin số điện thoại nhé!"); return; }
            
            // Thông báo giả lập - Ở đây anh có thể nối với Bot Telegram hoặc Google Sheets
            alert("✅ Đã gửi yêu cầu! Tài xế Taxi ProMax sẽ gọi cho anh ngay.");
            console.log("Dữ liệu khách:", phone);
        }
    </script>
</body>
</html>
