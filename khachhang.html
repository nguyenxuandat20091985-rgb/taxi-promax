<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAXI PROMAX - ĐẶT XE CÔNG NGHỆ BẬT NHẤT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <style>
        :root { 
            --primary: #00ffaa; 
            --primary-hover: #00cc88; 
            --bg-main: #040a08; 
            --bg-card: #0d1613; 
            --bg-input: #162420; 
            --text-main: #ffffff;
            --text-muted: #a3b8b3;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main); 
            margin: 0; 
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container { 
            background: var(--bg-card); 
            border: 1px solid rgba(0, 255, 170, 0.2); 
            padding: 20px; 
            border-radius: 28px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 255, 170, 0.05); 
            width: 100%;
            max-width: 460px; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .header { text-align: center; margin-bottom: 2px; }
        .header h2 { 
            color: var(--primary); font-size: 26px; font-weight: 800; margin: 0 0 4px 0; 
            letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 10px;
            text-shadow: 0 0 15px rgba(0, 255, 170, 0.3);
        }
        
        /* KHUNG CÂU NÓI HAY VÀ THÂN THIỆN NHẮC KHÁCH */
        .quote-banner {
            background: rgba(0, 255, 170, 0.04);
            border-left: 3px solid var(--primary);
            padding: 10px 12px;
            border-radius: 0 12px 12px 0;
            font-size: 12px;
            color: #d1ebd6;
            font-style: italic;
            line-height: 1.5;
        }

        /* KHU VỰC THÔNG TIN KHÁCH TẢI APP */
        .user-profile-box {
            background: #111a17;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 16px;
            display: flex;
            gap: 10px;
        }
        .user-profile-box input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 10px;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }

        .map-wrapper {
            position: relative; width: 100%; height: 200px; border-radius: 20px; overflow: hidden;
            border: 1.5px solid rgba(0, 255, 170, 0.25);
        }
        #map { width: 100%; height: 100%; background: #111; }
        
        .btn-locate {
            position: absolute; bottom: 12px; right: 12px; z-index: 1000;
            background: var(--bg-card); border: 1.5px solid var(--primary); color: var(--primary);
            width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer;
        }

        .price-banner {
            background: #11221a; border: 1px dashed var(--primary); border-radius: 16px; padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .price-info .label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
        .price-info .value { font-size: 20px; color: var(--primary); font-weight: 800; }
        .distance-info { text-align: right; font-size: 13px; color: #ffffff; font-weight: 700; }

        .service-selection { display: flex; gap: 12px; }
        .service-card {
            flex: 1; background: var(--bg-input); border: 2px solid transparent; padding: 12px;
            border-radius: 18px; text-align: center; cursor: pointer; transition: all 0.2s ease;
        }
        .service-card i { font-size: 22px; color: var(--text-muted); margin-bottom: 6px; }
        .service-card .title { font-size: 13px; font-weight: 700; color: var(--text-muted); }
        .service-card.active { border-color: var(--primary); background: rgba(0, 255, 170, 0.05); }
        .service-card.active i, .service-card.active .title { color: var(--primary); }

        .form-grid { display: flex; flex-direction: column; gap: 12px; }
        .input-box { display: flex; flex-direction: column; gap: 6px; }
        .input-box label { font-size: 11px; color: var(--primary); font-weight: 700; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 14px; color: var(--text-muted); font-size: 14px; }
        .input-wrapper input { 
            width: 100%; padding: 12px 12px 12px 42px; border-radius: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.08); background: var(--bg-input); color: var(--text-main); 
            font-size: 13.5px; font-weight: 500; box-sizing: border-box;
        }

        /* THANH TRẠNG THÁI THEO DÕI VÀ HỦY ĐƠN CHUYÊN NGHIỆP */
        .status-tracker {
            background: #161f24; border: 1px solid #00bcff; border-radius: 16px; padding: 14px;
            font-size: 13px; font-weight: 600; text-align: center; color: #00bcff; display: none;
            flex-direction: column; gap: 10px;
        }
        .btn-cancel {
            background: #ff4a4a; color: white; border: none; padding: 8px 16px; border-radius: 50px;
            font-weight: 700; font-size: 12px; cursor: pointer; align-self: center;
        }

        .btn-send { 
            width: 100%; padding: 16px; border-radius: 50px; border: none; 
            background: linear-gradient(135deg, var(--primary), #00aa77); color: #030712; 
            font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 6px 20px rgba(0, 255, 170, 0.3);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }

        /* -------------------------------------------------------- */
        /* MODAL POPUP THÔNG BÁO CAO CẤP THAY THẾ KHUNG CŨ */
        /* -------------------------------------------------------- */
        .custom-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.85); z-index: 9999; display: none;
            justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            background: var(--bg-card); border: 2px solid var(--primary); border-radius: 24px;
            padding: 24px; width: 100%; max-width: 380px; text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.25);
        }
        .modal-icon { font-size: 40px; color: var(--primary); margin-bottom: 14px; }
        .modal-text { font-size: 15px; font-weight: 600; color: #ffffff; line-height: 1.6; margin-bottom: 20px; }
        
        /* Giao diện đánh giá sao */
        .star-rating { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .star-rating i { font-size: 28px; color: #374151; cursor: pointer; transition: color 0.1s; }
        .star-rating i.active { color: #ffca28; text-shadow: 0 0 10px rgba(255,202,40,0.3); }

        .btn-modal-close {
            background: linear-gradient(135deg, var(--primary), #00aa77); color: #030712;
            border: none; padding: 12px 30px; border-radius: 50px; font-weight: 800; font-size: 14px; cursor: pointer;
        }

        .leaflet-routing-container { display: none !important; }
        .leaflet-layer { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h2><i class="fa-solid fa-taxi"></i> TAXI PROMAX</h2>
        </div>

        <div class="quote-banner" id="lbQuote">
            "Chào mừng hành khách! Chúc anh chị một ngày tràn đầy niềm vui và may mắn cùng Taxi ProMax."
        </div>

        <div class="user-profile-box">
            <input type="text" id="cust_name" placeholder="Họ tên hành khách...">
            <input type="tel" id="cust_phone" placeholder="Số điện thoại...">
        </div>

        <div class="map-wrapper">
            <div id="map"></div>
            <div class="btn-locate" onclick="getCurrentLocation()">
                <i class="fa-solid fa-crosshairs"></i>
            </div>
        </div>

        <div class="price-banner">
            <div class="price-info">
                <div class="label">CHI PHÍ DỰ KIẾN</div>
                <div class="value" id="txtPrice">0 đ</div>
            </div>
            <div class="distance-info" id="txtDistance">Quãng đường: 0 km</div>
        </div>

        <div class="service-selection">
            <div class="service-card active" id="car4" onclick="selectCar('4_seats')">
                <i class="fa-solid fa-car-side"></i>
                <div class="title">Xe 4 Chỗ (12k/km)</div>
            </div>
            <div class="service-card" id="car7" onclick="selectCar('7_seats')">
                <i class="fa-solid fa-van-shuttle"></i>
                <div class="title">Xe 7 Chỗ (15k/km)</div>
            </div>
        </div>
        
        <div class="form-grid">
            <div class="input-box">
                <label>ĐIỂM ĐÓN (TỰ ĐỘNG ĐỊNH VỊ)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-location-dot" style="color: var(--primary);"></i>
                    <input type="text" id="p_from" placeholder="Đang xác định GPS...">
                </div>
            </div>

            <div class="input-box">
                <label>ĐIỂM ĐẾN</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-flag-checkered" style="color: #ff4a4a;"></i>
                    <input type="text" id="p_to" placeholder="Ví dụ: Cảng Tuần Châu, Sân bay..." onchange="searchDestination()">
                </div>
            </div>
        </div>

        <div class="status-tracker" id="trackerBox">
            <span id="trackerText"><i class="fa-solid fa-spinner fa-spin"></i> Hệ thống đang phân phối tài xế gần nhất...</span>
            <button class="btn-cancel" onclick="cancelBooking()">HỦY CHUYẾN ĐI</button>
        </div>

        <button class="btn-send" id="btnSubmit" onclick="submitBooking()">
            <i class="fa-solid fa-paper-plane"></i> ĐẶT XE CÔNG NGHỆ NGAY
        </button>
    </div>

    <div class="custom-modal" id="appModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon"><i class="fa-solid fa-circle-check"></i></div>
            <div class="modal-text" id="modalText">Nội dung thông báo</div>
            
            <div class="star-rating" id="ratingContainer" style="display: none;">
                <i class="fa-solid fa-star" data-star="1" onclick="setStar(1)"></i>
                <i class="fa-solid fa-star" data-star="2" onclick="setStar(2)"></i>
                <i class="fa-solid fa-star" data-star="3" onclick="setStar(3)"></i>
                <i class="fa-solid fa-star" data-star="4" onclick="setStar(4)"></i>
                <i class="fa-solid fa-star" data-star="5" onclick="setStar(5)"></i>
            </div>

            <button class="btn-modal-close" id="btnModalClose" onclick="closeAppModal()">XÁC NHẬN</button>
        </div>
    </div>

    <script>
        let selectedCarType = "4_seats";
        let map, userMarker, driverMarker, routingControl;
        let clientLat = 21.0285, clientLng = 105.8542;
        let destLat = null, destLng = null;
        let currentBookingId = null;
        let selectedRating = 5; // Mặc định 5 sao thân thiện
        let trackInterval = null;

        // DANH SÁCH CÂU NÓI THÂN THIỆN ĐỔI NGẪU NHIÊN
        const friendlyQuotes = [
            "✨ Cảm ơn anh chị đã lựa chọn Taxi ProMax. Sự an toàn của quý khách là niềm tự hào của chúng tôi!",
            "🌸 Mỗi chuyến đi là một niềm vui. Chúc anh chị thượng lộ bình an, vạn sự hanh thông!",
            "🚖 Taxi ProMax cam kết mang lại trải nghiệm đi xe điện êm ái, sang trọng và chuẩn 5 sao.",
            "🌟 Thời tiết hôm nay thật đẹp, hãy cùng Taxi ProMax đồng hành đến những địa điểm tuyệt vời nhé anh chị!"
        ];

        window.onload = function() {
            map = L.map('map', { zoomControl: false }).setView([clientLat, clientLng], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            getCurrentLocation();

            // Đổi câu nói ngẫu nhiên khi load app
            let randomQuote = friendlyQuotes[Math.floor(Math.random() * friendlyQuotes.length)];
            document.getElementById('lbQuote').innerText = randomQuote;
        };

        // HIỂN THỊ HỘP THOẠI POPUP TỰ CHẾ CHUYÊN NGHIỆP
        function showAppModal(text, isSuccess = true, showStars = false) {
            document.getElementById('modalText').innerText = text;
            document.getElementById('modalIcon').innerHTML = isSuccess ? `<i class="fa-solid fa-circle-check" style="color: #00ffaa;"></i>` : `<i class="fa-solid fa-circle-exclamation" style="color: #ff4a4a;"></i>`;
            document.getElementById('ratingContainer').style.display = showStars ? 'flex' : 'none';
            document.getElementById('appModal').style.display = 'flex';
        }

        function closeAppModal() {
            document.getElementById('appModal').style.display = 'none';
            // Nếu hoàn thành chuyến và có đánh giá, đẩy số sao lên Firebase
            if(document.getElementById('ratingContainer').style.display === 'flex' && currentBookingId) {
                fetch(`https://taxi-promax-default-rtdb.firebaseio.com/datxe/${currentBookingId}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rating: selectedRating })
                }).then(() => {
                    currentBookingId = null;
                    document.getElementById('p_to').value = '';
                });
            }
        }

        // CHỌN SAO ĐÁNH GIÁ TÀI XẾ
        function setStar(starCount) {
            selectedRating = starCount;
            let stars = document.querySelectorAll('.star-rating i');
            stars.forEach(star => {
                let currentStarIdx = parseInt(star.getAttribute('data-star'));
                if(currentStarIdx <= starCount) star.classList.add('active');
                else star.classList.remove('active');
            });
        }

        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    clientLat = position.coords.latitude;
                    clientLng = position.coords.longitude;
                    map.setView([clientLat, clientLng], 15);
                    
                    if (userMarker) userMarker.setLatLng([clientLat, clientLng]);
                    else userMarker = L.marker([clientLat, clientLng]).addTo(map).bindPopup('Vị trí đón xe').openPopup();

                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${clientLat}&lon=${clientLng}&accept-language=vi`)
                    .then(res => res.json()).then(data => {
                        if(data && data.display_name) {
                            document.getElementById('p_from').value = data.display_name.split(',').slice(0, 3).join(',').trim();
                        }
                    });
                }, null, { enableHighAccuracy: true });
            }
        }

        function searchDestination() {
            let address = document.getElementById('p_to').value.trim();
            if (!address) return;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`)
            .then(res => res.json())
            .then(results => {
                if (results.length > 0) {
                    destLat = parseFloat(results[0].lat);
                    destLng = parseFloat(results[0].lon);

                    if (routingControl) map.removeControl(routingControl);

                    routingControl = L.Routing.control({
                        waypoints: [L.latLng(clientLat, clientLng), L.latLng(destLat, destLng)],
                        lineOptions: { styles: [{ color: '#00ffaa', opacity: 0.8, weight: 6 }] },
                        createMarker: function() { return null; }
                    }).addTo(map);

                    routingControl.on('routesfound', function(e) {
                        let distanceKm = e.routes[0].summary.totalDistance / 1000;
                        document.getElementById('txtDistance').innerHTML = `Quãng đường: ${distanceKm.toFixed(1)} km`;
                        let pricePerKm = (selectedCarType === "4_seats") ? 12000 : 15000;
                        document.getElementById('txtPrice').innerHTML = Math.round(distanceKm * pricePerKm).toLocaleString('vi-VN') + " đ";
                    });
                }
            });
        }

        function selectCar(type) {
            selectedCarType = type;
            document.getElementById('car4').classList.remove('active');
            document.getElementById('car7').classList.remove('active');
            if(type === '4_seats') document.getElementById('car4').classList.add('active');
            else document.getElementById('car7').classList.add('active');
            searchDestination();
        }

        // HÀM ĐẶT XE VÀ HIỂN THỊ MODAL CHUẨN ĐẸP
        function submitBooking() {
            const name = document.getElementById('cust_name').value.trim();
            const phone = document.getElementById('cust_phone').value.trim();
            const from = document.getElementById('p_from').value.trim();
            const to = document.getElementById('p_to').value.trim();
            const count = document.getElementById('p_count').value;
            const btn = document.getElementById('btnSubmit');

            if (!name || !phone) { showAppModal("Anh chị vui lòng nhập Họ tên và Số điện thoại ở trên cùng ứng dụng nhé!", false); return; }
            if (!to || !destLat) { showAppModal("Anh chị vui lòng nhập chính xác địa chỉ Điểm Đến!", false); return; }

            btn.disabled = true;
            document.getElementById('trackerBox').style.display = "flex";

            const bookingData = {
                clientName: name, phone: phone, pickup: from, dropoff: to, passengers: count, carType: selectedCarType,
                pickupLat: clientLat, pickupLng: clientLng, destLat: destLat, destLng: destLng,
                status: "waiting", timestamp: Date.now()
            };

            fetch('https://taxi-promax-default-rtdb.firebaseio.com/datxe.json', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bookingData)
            })
            .then(res => res.json())
            .then(data => {
                currentBookingId = data.name;
                // Báo đặt đơn hàng thành công theo văn mẫu mới
                showAppModal("Cảm ơn anh chị đã đặt xe tại TAXI PROMAX. Hệ thống đang tiến hành điều phối tài xế gần nhất đến đón anh chị.");
                startTrackingTrip();
            })
            .finally(() => { btn.disabled = false; });
        }

        // CHỨC NĂNG HỦY CHUYẾN THEO Ý MUỐN CỦA KHÁCH
        function cancelBooking() {
            if (!currentBookingId) return;
            if (confirm("Anh chị có chắc chắn muốn hủy chuyến đi này không?")) {
                fetch(`https://taxi-promax-default-rtdb.firebaseio.com/datxe/${currentBookingId}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: "canceled" })
                }).then(() => {
                    clearInterval(trackInterval);
                    document.getElementById('trackerBox').style.display = "none";
                    if (driverMarker) map.removeLayer(driverMarker);
                    showAppModal("Đơn hàng đã được hủy theo yêu cầu thành công.", false);
                    currentBookingId = null;
                });
            }
        }

        // THEO DÕI HÀNH TRÌNH VÀ KẾT THÚC THÌ HIỂN THỊ ĐÁNH GIÁ SAO
        function startTrackingTrip() {
            if (!currentBookingId) return;
            if (trackInterval) clearInterval(trackInterval);

            trackInterval = setInterval(() => {
                fetch(`https://taxi-promax-default-rtdb.firebaseio.com/datxe/${currentBookingId}.json`)
                .then(res => res.json())
                .then(trip => {
                    if (!trip) return;

                    if (trip.status === "driving" && trip.driverId) {
                        document.getElementById('trackerText').innerHTML = `<i class="fa-solid fa-car-side fa-bounce" style="color:#00ffaa"></i> Tài xế đang đến đón. Anh chị hãy theo dõi vị trí xe di chuyển trên bản đồ nhé!`;
                        
                        fetch(`https://taxi-promax-default-rtdb.firebaseio.com/tai_xe_online/${trip.driverId}.json`)
                        .then(res => res.json())
                        .then(driverGps => {
                            if (driverGps && driverGps.lat && driverGps.lng) {
                                if (driverMarker) driverMarker.setLatLng([driverGps.lat, driverGps.lng]);
                                else {
                                    let carIcon = L.icon({
                                        iconUrl: 'https://cdn-icons-png.flaticon.com/512/3085/3085339.png',
                                        iconSize: [32, 32]
                                    });
                                    driverMarker = L.marker([driverGps.lat, driverGps.lng], {icon: carIcon}).addTo(map);
                                }
                            }
                        });
                    } else if (trip.status === "completed") {
                        clearInterval(trackInterval);
                        document.getElementById('trackerBox').style.display = "none";
                        if (driverMarker) map.removeLayer(driverMarker);
                        setStar(5); // Reset về 5 sao trước khi cho chọn
                        // Báo kết thúc hành trình theo mẫu mới + Mở bảng chấm sao tài xế
                        showAppModal("TAXI PROMAX cảm ơn anh chị, chúc anh chị vạn sự như ý! Vui lòng dành chút thời gian đánh giá độ thân thiện của tài xế nhé:", true, true);
                    }
                });
            }, 4000);
        }
    </script>
</body>
</html>
