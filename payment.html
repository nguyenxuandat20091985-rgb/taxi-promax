<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THANH TOÁN DỊCH VỤ AI</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        /* Danh sách gói cước */
        .pkg-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .pkg-card { border: 2px solid #eee; padding: 10px; border-radius: 12px; cursor: pointer; position: relative; }
        .pkg-card.active { border-color: #27ae60; background: #e8f5e9; }
        .pkg-name { font-weight: bold; font-size: 13px; display: block; }
        .pkg-price { color: #27ae60; font-weight: bold; font-size: 15px; }

        /* Vùng hiển thị QR */
        .qr-area { background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 15px; margin-bottom: 15px; }
        .qr-img { width: 100%; max-width: 180px; }
        .id-text { font-size: 12px; color: #666; margin-top: 5px; }
        .red-bold { color: #e74c3c; font-weight: bold; }

        /* Vòng xoay chờ */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #27ae60; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; display: none; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Kết quả */
        .result-box { display: none; background: #fff3cd; border: 1px dashed #ffc107; padding: 15px; border-radius: 12px; margin-top: 15px; }
        .btn-main { background: #27ae60; color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; }
        input { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 10px; text-align: center; font-size: 18px; margin-top: 15px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h3 style="margin: 0 0 15px 0;">CHỌN GÓI CƯỚC AI</h3>

    <div class="pkg-list">
        <div class="pkg-card active" onclick="selectPkg('BASIC', 19000, this)">
            <span class="pkg-name">GÓI BASIC</span>
            <span class="pkg-price">19.000đ</span>
        </div>
        <div class="pkg-card" onclick="selectPkg('PRO', 29000, this)">
            <span class="pkg-name">GÓI PRO</span>
            <span class="pkg-price">29.000đ</span>
        </div>
        <div class="pkg-card" onclick="selectPkg('VIP 1TH', 49000, this)">
            <span class="pkg-name">GÓI VIP 1TH</span>
            <span class="pkg-price">49.000đ</span>
        </div>
        <div class="pkg-card" onclick="selectPkg('TRỌN ĐỜI', 999000, this)">
            <span class="pkg-name">VIP TRỌN ĐỜI</span>
            <span class="pkg-price">999.000đ</span>
        </div>
    </div>

    <div class="qr-area">
        <img id="qr-img" src="" class="qr-img">
        <p class="id-text">Nội dung CK: <span class="red-bold" id="ck-info"></span></p>
    </div>

    <p id="status-note" style="font-size: 13px; color: #666;">Chuyển khoản xong, hãy bấm nút xác nhận dưới đây.</p>
    
    <button class="btn-main" id="btn-submit" onclick="startCheck()">TÔI ĐÃ CHUYỂN TIỀN</button>
    
    <div class="loader" id="loading-spin"></div>

    <div class="result-box" id="result-box">
        <p style="margin:0; font-weight:bold; color:#856404;">Hệ thống đã khớp lệnh!</p>
        <p style="margin:5px 0; font-size:14px;">Mã kích hoạt của bạn là:</p>
        <span id="display-code" style="font-size: 24px; color: #e74c3c; font-weight: bold;"></span>
    </div>

    <div id="active-area" style="display:none;">
        <input type="number" id="input-verify" placeholder="Nhập mã số ở trên vào đây">
        <button class="btn-main" onclick="finalActive()" style="background: #2c3e50;">KÍCH HOẠT NGAY</button>
    </div>
</div>

<script>
    // Tạo ID máy riêng
    let deviceID = localStorage.getItem('m_id');
    if(!deviceID) {
        deviceID = Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('m_id', deviceID);
    }

    let currentPrice = 19000;
    let currentPkg = "BASIC";

    function selectPkg(name, price, el) {
        document.querySelectorAll('.pkg-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        currentPrice = price;
        currentPkg = name;
        updateQR();
    }

    function updateQR() {
        const qrUrl = `https://img.vietqr.io/image/bidv-4430269669-compact.jpg?amount=${currentPrice}&addInfo=NAP%20${currentPkg}%20${deviceID}`;
        document.getElementById('qr-img').src = qrUrl;
        document.getElementById('ck-info').innerText = `NAP ${currentPkg} ${deviceID}`;
    }

    function startCheck() {
        document.getElementById('btn-submit').style.display = 'none';
        document.getElementById('loading-spin').style.display = 'block';
        document.getElementById('status-note').innerText = 'Đang kiểm tra giao dịch trên hệ thống...';

        // Chờ 30 giây (Sửa 3000 thành 30000 để đúng 30 giây nhé anh)
        setTimeout(() => {
            document.getElementById('loading-spin').style.display = 'none';
            document.getElementById('status-note').style.display = 'none';
            document.getElementById('result-box').style.display = 'block';
            document.getElementById('active-area').style.display = 'block';
            document.getElementById('display-code').innerText = deviceID;
        }, 30000); 
    }

    function finalActive() {
        const userVal = document.getElementById('input-verify').value;
        if(userVal === deviceID.toString()) {
            localStorage.setItem('user_role', 'PAID_USER');
            alert('Cảm ơn bạn! Dịch vụ đã được kích hoạt.');
            window.location.href = 'index.html';
        } else {
            alert('Vui lòng nhập đúng mã số hiển thị!');
        }
    }

    // Khởi tạo lần đầu
    window.onload = updateQR;
</script>

</body>
</html>
