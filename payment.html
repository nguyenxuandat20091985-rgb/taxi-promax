<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - Taxi Promax v5.1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white text-center">
                        <h3><i class="fas fa-credit-card"></i> Thanh toán Taxi Promax</h3>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="display-6">Taxi Promax v5.1</div>
                            <p class="text-muted">Nâng cấp gói dịch vụ</p>
                        </div>

                        <div id="payment-process">
                            <div class="alert alert-info">
                                <i class="fas fa-info-circle"></i> Vui lòng hoàn tất thanh toán trong <strong id="countdown">05:00</strong>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="card mb-3">
                                        <div class="card-body">
                                            <h6>Thông tin thanh toán</h6>
                                            <p><strong>Số tiền:</strong> <span id="payment-amount-display">0 đ</span></p>
                                            <p><strong>Gói:</strong> <span id="payment-package">BASIC</span></p>
                                            <p><strong>Mã đơn hàng:</strong> <span id="payment-order-id">TAXI-123456</span></p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card">
                                        <div class="card-body text-center">
                                            <h6>QR Code thanh toán</h6>
                                            <div id="payment-qrcode" class="my-3" style="width: 250px; height: 250px; margin: 0 auto; background-color: #f8f9fa; display: flex; align-items: center; justify-content: center;">
                                                <p class="text-muted">QR Code sẽ hiển thị</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-4 text-center">
                                <div class="btn-group">
                                    <button class="btn btn-success" id="btn-confirm-payment">
                                        <i class="fas fa-check"></i> Tôi đã thanh toán
                                    </button>
                                    <button class="btn btn-outline-secondary" id="btn-cancel-payment">
                                        <i class="fas fa-times"></i> Hủy thanh toán
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div id="payment-success" style="display: none;">
                            <div class="alert alert-success text-center">
                                <i class="fas fa-check-circle fa-3x mb-3"></i>
                                <h4>Thanh toán thành công!</h4>
                                <p>License của bạn đã được kích hoạt.</p>
                            </div>
                            <div class="text-center">
                                <a href="index.html" class="btn btn-primary">
                                    <i class="fas fa-home"></i> Về trang chủ
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const amount = urlParams.get('amount') || 50000;
            const pkg = urlParams.get('package') || 'basic';
            
            document.getElementById('payment-amount-display').textContent = 
                new Intl.NumberFormat('vi-VN').format(amount) + ' đ';
            document.getElementById('payment-package').textContent = pkg.toUpperCase();
            
            const orderId = 'TAXI-' + Date.now().toString().slice(-8);
            document.getElementById('payment-order-id').textContent = orderId;
            
            let timeLeft = 300;
            const countdownElement = document.getElementById('countdown');
            const countdownInterval = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                countdownElement.textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('payment-process').style.display = 'none';
                }
            }, 1000);
            
            document.getElementById('btn-confirm-payment').addEventListener('click', function() {
                clearInterval(countdownInterval);
                document.getElementById('payment-process').style.display = 'none';
                document.getElementById('payment-success').style.display = 'block';
                
                const licenseData = {
                    key: 'ACTIVATED-' + orderId,
                    package: pkg,
                    activated: new Date().toISOString(),
                    expires: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString()
                };
                
                localStorage.setItem('taxi_license', JSON.stringify(licenseData));
            });
            
            document.getElementById('btn-cancel-payment').addEventListener('click', function() {
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
