<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kích Hoạt AI - NGUYEN XUAN DAT</title>
    <style>
        :root { --primary: #27ae60; --danger: #e74c3c; --dark: #2c3e50; }
        body { font-family: sans-serif; margin: 0; background: #f4f7f6; user-select: none; -webkit-user-select: none; }
        .payment-body { padding: 15px; text-align: center; }
        .package-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .pkg-card { 
            background: white; padding: 12px; border-radius: 15px; border: 2px solid transparent;
            transition: 0.3s; cursor: pointer; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .pkg-card.active { border-color: var(--primary); background: #f0fff4; transform: scale(1.02); }
        .pkg-name { font-weight: bold; font-size: 14px; color: var(--dark); }
        .pkg-price { font-size: 13px; color: var(--primary); font-weight: bold; display: block; }
        
        .qr-section { 
            background: white; padding: 20px; border-radius: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: 10px;
        }
        .qr-code { 
            width: 100%; max-width: 200px; border-radius: 10px; border: 5px solid #fff; 
            transition: 0.5s; touch-action: none; -webkit-touch-callout: none;
        }
        .pay-detail { text-align: left; font-size: 13px; margin-top: 15px; background: #f9f9f9; padding: 10px; border-radius: 10px; }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .highlight { color: var(--danger); font-weight: bold; font-size: 15px; }
        .btn-confirm { 
            background: var(--primary); color: white; border: none; width: 100%; 
            padding: 12px; border-radius: 10px; margin-top: 15px; font-weight: bold; 
        }
    </style>
</head>
<body>

<div id="app">
    <div class="user-header" style="background: var(--dark); color: white; padding: 15px; display: flex; justify-content: space-between;">
        <span onclick="window.location.href='index.html'" style="cursor:pointer">⬅ QUAY LẠI</span>
        <span style="font-weight: bold;">HỆ THỐNG THANH TOÁN AI</span>
    </div>

    <div class="payment-body">
        <div class="package-grid">
            <div class="pkg-card active" id="default-pkg" onclick="selectPackage('BASIC', 19000, '1 Tháng')">
                <span class="pkg-name">BASIC 🟢</span>
                <span class="pkg-price">19.000đ/tháng</span>
            </div>
            <div class="pkg-card" onclick="selectPackage('PRO', 29000, '1 Tháng')">
                <span class="pkg-name">PRO 🔵</span>
                <span class="pkg-price">29.000đ/tháng</span>
            </div>
            <div class="pkg-card" onclick="selectPackage('VIP', 49000, '1 Tháng')">
                <span class="pkg-name">VIP 🔥</span>
                <span class="pkg-price">49.000đ/tháng</span>
            </div>
            <div class="pkg-card" onclick="selectPackage('TRON_DOI', 999000, 'Vĩnh viễn')">
                <span class="pkg-name">LIFETIME ⭐</span>
                <span class="pkg-price">999.000đ</span>
            </div>
        </div>

        <div class="qr-section">
            <h4 id="selected-name" style="margin-bottom:10px">Gói BASIC - 1 Tháng</h4>
            <img id="qr-bidv" class="qr-code" src="" alt="QR BIDV" oncontextmenu="return false;">
            <p style="font-size: 10px; color: #999;">(Nhấn giữ mã QR 3 giây để kích hoạt Admin)</p>
            
            <div class="pay-detail">
                <div class="detail-row"><span>Số tiền:</span> <span class="highlight" id="pay-amount">19.000đ</span></div>
                <div class="detail-row"><span>Nội dung:</span> <span class="highlight" id="pay-note">Đang tạo mã...</span></div>
                <div class="detail-row"><span>Chủ TK:</span> <b>NGUYEN XUAN DAT</b></div>
                <div class="detail-row"><span>Ngân hàng:</span> <b>BIDV</b></div>
            </div>
            
            <button class="btn-confirm" onclick="checkPayment()">XÁC NHẬN ĐÃ CHUYỂN TIỀN</button>
        </div>
    </div>
</div>

<script>
    function selectPackage(tier, price, duration) {
        document.querySelectorAll('.pkg-card').forEach(c => c.classList.remove('active'));
        if(event) event.currentTarget.classList.add('active');

        const randomID = Math.floor(1000 + Math.random() * 9000);
        const note = `DAT ${tier} ${randomID}`;
        
        document.getElementById('selected-name').innerText = `Gói ${tier} - ${duration}`;
        document.getElementById('pay-amount').innerText = price.toLocaleString() + 'đ';
        document.getElementById('pay-note').innerText = note;

        const qrUrl = `https://img.vietqr.io/image/bidv-4430269669-compact.jpg?amount=${price}&addInfo=${encodeURIComponent(note)}&accountName=NGUYEN%20XUAN%20DAT`;
        document.getElementById('qr-bidv').src = qrUrl;
    }

    function checkPayment() {
        alert("Hệ thống đang kiểm tra số dư. Anh vui lòng đợi giây lát!");
    }

    // --- KÍCH HOẠT BÍ MẬT DÀNH CHO ANH ĐẠT ---
    let timer;
    const qrImg = document.getElementById('qr-bidv');

    // Xử lý nhấn giữ cho cả máy tính và điện thoại
    const startAction = (e) => {
        // e.preventDefault(); 
        timer = setTimeout(() => {
            let pass = prompt("NHẬP MÃ ADMIN:");
            if(pass === "19000") {
                localStorage.setItem('active_package', 'LIFETIME');
                localStorage.setItem('user_role', 'ADMIN');
                alert("XÁC NHẬN CHỦ NHÂN: NGUYỄN XUÂN ĐẠT. Đang mở khóa toàn bộ hệ thống!");
                window.location.href = 'index.html';
            }
        }, 3000);
    };

    const stopAction = () => clearTimeout(timer);

    qrImg.addEventListener('mousedown', startAction);
    qrImg.addEventListener('touchstart', startAction);
    qrImg.addEventListener('mouseup', stopAction);
    qrImg.addEventListener('mouseleave', stopAction);
    qrImg.addEventListener('touchend', stopAction);

    window.onload = () => selectPackage('BASIC', 19000, '1 Tháng');
</script>

</body>
</html>
