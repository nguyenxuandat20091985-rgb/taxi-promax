<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONFIG - LỄ TẾT</title>
    <style>
        body { font-family: sans-serif; background: #fff5f5; margin: 0; }
        .header-tet { background: #d32f2f; color: white; padding: 20px; text-align: center; }
        .card { background: white; margin: 20px; padding: 20px; border-radius: 15px; border: 2px solid #ffcdd2; }
        select, input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; }
        .btn-save { background: #d32f2f; color: white; width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header-tet">
        <h1>🧧 CẤU HÌNH SỰ KIỆN</h1>
    </div>

    <div class="card">
        <label><b>Chọn Sự Kiện:</b></label>
        <select id="event">
            <option value="none">Bình thường (Mặc định)</option>
            <option value="tet">Tết Nguyên Đán (X2 Giá)</option>
            <option value="noel">Giáng Sinh (Tặng Quà)</option>
        </select>

        <label><b>Thông báo tới tài xế:</b></label>
        <input type="text" id="msg" placeholder="Ví dụ: Chúc anh em năm mới phát tài!">

        <button class="btn-save" onclick="saveEvent()">LƯU & PHÁT HÀNH TOÀN APP</button>
    </div>

    <a href="admin.html" class="back-link">← Quay lại trang Quản lý</a>

    <script>
        function saveEvent() {
    const event = document.getElementById('event').value;
    const msg = document.getElementById('msg').value;
    
    // Lưu vào bộ não trình duyệt
    localStorage.setItem('taxi_event', event);
    localStorage.setItem('taxi_msg', msg);
    
    alert("🧧 Đã phát hành cấu hình: " + event.toUpperCase());
}
    </script>
</body>
</html>
