<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - TAXI PROMAX</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body { 
            text-align: center; 
            padding: 20px; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h2 { color: #002d26; margin-bottom: 30px; }
        
        .btn {
            width: 100%;
            padding: 18px;
            margin-bottom: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-tet { 
            background: #d32f2f; 
            color: white; 
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3);
        }
        .btn-tet:active { transform: scale(0.95); background: #b71c1c; }

        .btn-normal { 
            background: #455a64; 
            color: white;
            box-shadow: 0 4px 15px rgba(69, 90, 100, 0.3);
        }
        .btn-normal:active { transform: scale(0.95); background: #37474f; }

        .status-tag {
            margin-top: 20px;
            font-size: 13px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🧧 ĐIỀU KHIỂN APP</h2>
        
        <button class="btn btn-tet" onclick="changeMode('tet')">
            🧧 BẬT CHẾ ĐỘ TẾT
        </button>

        <button class="btn btn-normal" onclick="changeMode('normal')">
            ⚙️ VỀ BÌNH THƯỜNG
        </button>

        <div class="status-tag" id="statusText">Đang sẵn sàng...</div>
    </div>

    <script>
        // Cấu hình Firebase của anh Đạt
        const firebaseConfig = {
            apiKey: "AIzaSyDWX-YyE_1-F0yNqW9Kk8-G-Y4fG-Z-Y4f",
            authDomain: "taxi-promax-9f79b.firebaseapp.com",
            databaseURL: "https://taxi-promax-9f79b-default-rtdb.firebaseio.com",
            projectId: "taxi-promax-9f79b",
            storageBucket: "taxi-promax-9f79b.appspot.com",
            messagingSenderId: "338804599298",
            appId: "1:338804599298:web:b1d70a31270438"
        };
        
        // Khởi tạo Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const database = firebase.database();
        const statusText = document.getElementById('statusText');

        function changeMode(type) {
            statusText.innerText = "Đang gửi lệnh...";
            
            database.ref('currentEvent').set(type)
            .then(() => {
                statusText.innerText = "✅ Đã chuyển sang: " + (type === 'tet' ? 'Chế độ Tết' : 'Bình thường');
                // Phát giọng nói thông báo nếu anh đang mở trang này
                if ('speechSynthesis' in window) {
                    const msg = new SpeechSynthesisUtterance("Đã đổi chế độ hệ thống");
                    msg.lang = 'vi-VN';
                    window.speechSynthesis.speak(msg);
                }
            })
            .catch((e) => {
                statusText.innerText = "❌ Lỗi: " + e.message;
                alert("Lỗi kết nối Firebase!");
            });
        }
    </script>
</body>
</html>
