<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ADMIN CONTROL - TAXI PROMAX</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root {
            --primary: #0054a3;
            --danger: #d32f2f;
            --success: #2ecc71;
            --bg: #f4f7f6;
        }
        body { 
            margin: 0;
            padding: env(safe-area-inset-top, 20px) 15px;
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg);
            color: #333;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
        }
        .admin-card {
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2 { color: var(--primary); margin: 0 0 20px; font-size: 1.5rem; }
        
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }
        .btn-tet { background: var(--danger); box-shadow: 0 4px 10px rgba(211,47,47,0.3); }
        .btn-normal { background: #455a64; }
        .btn:active { transform: scale(0.95); }

        /* Danh sách chờ duyệt */
        .order-list {
            text-align: left;
            margin-top: 20px;
        }
        .order-item {
            background: #f8f9fa;
            border-left: 4px solid var(--primary);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-approve {
            background: var(--success);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
        }
        .status-tag {
            font-size: 12px;
            color: #888;
            background: #fff;
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="admin-card">
            <h2>🧧 ĐIỀU KHIỂN SỰ KIỆN</h2>
            <div class="btn-grid">
                <button class="btn btn-tet" onclick="updateFirebase('currentEvent', 'tet')">🧧 CHẾ ĐỘ TẾT</button>
                <button class="btn btn-normal" onclick="updateFirebase('currentEvent', 'normal')">⚙️ BÌNH THƯỜNG</button>
            </div>
            <div class="status-tag" id="eventStatus">Sự kiện: Đang tải...</div>
        </div>

        <div class="admin-card">
            <h2>🔔 DUYỆT GÓI CƯỚC</h2>
            <div class="order-list" id="orderList">
                <p style="color:#999; text-align:center;">Đang theo dõi yêu cầu nạp tiền...</p>
            </div>
        </div>
        
        <div style="font-size: 10px; color: #bdc3c7;">HỆ THỐNG QUẢN TRỊ TAXI PROMAX v2.0</div>
    </div>

    <script>
        // Cấu hình Firebase đồng bộ của anh Đạt
        const firebaseConfig = {
            apiKey: "AIzaSyDWX-YyE_1-F0yNqW9Kk8-G-Y4fG-Z-Y4f",
            authDomain: "taxi-promax-9f79b.firebaseapp.com",
            databaseURL: "https://taxi-promax-9f79b-default-rtdb.firebaseio.com",
            projectId: "taxi-promax-9f79b",
            storageBucket: "taxi-promax-9f79b.appspot.com",
            messagingSenderId: "338804599298",
            appId: "1:338804599298:web:b1d70a31270438"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Cập nhật trạng thái sự kiện
        function updateFirebase(node, value) {
            db.ref(node).set(value).then(() => {
                speakNotification("Đã cập nhật hệ thống");
            });
        }

        // 2. Lắng nghe thay đổi sự kiện để hiển thị giao diện Admin
        db.ref('currentEvent').on('value', (s) => {
            document.getElementById('eventStatus').innerText = "Sự kiện: " + (s.val() === 'tet' ? "🧧 TẾT" : "⚙️ BÌNH THƯỜNG");
        });

        // 3. Lắng nghe danh sách nạp tiền (Đồng bộ với pending_plan từ app chính)
        db.ref('paymentRequests').on('value', (snapshot) => {
            const list = document.getElementById('orderList');
            list.innerHTML = "";
            const data = snapshot.val();
            
            if (!data) {
                list.innerHTML = "<p style='color:#999; text-align:center;'>Chưa có yêu cầu mới</p>";
                return;
            }

            for (let id in data) {
                const req = data[id];
                const div = document.createElement('div');
                div.className = 'order-item';
                div.innerHTML = `
                    <div>
                        <b>${req.phone}</b><br>
                        <span>Gói: ${req.plan}</span>
                    </div>
                    <button class="btn btn-approve" onclick="approvePayment('${id}', '${req.phone}', '${req.plan}')">DUYỆT</button>
                `;
                list.appendChild(div);
            }
        });

        // 4. Hàm duyệt nạp tiền
        function approvePayment(orderId, phone, plan) {
            // Gửi tín hiệu thành công về máy tài xế
            db.ref('users/' + phone + '/subscription').set({
                status: 'PAID',
                plan: plan,
                timestamp: Date.now()
            }).then(() => {
                // Xóa yêu cầu sau khi duyệt xong
                db.ref('paymentRequests/' + orderId).remove();
                speakNotification("Đã duyệt gói cho tài xế " + phone);
            });
        }

        function speakNotification(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'vi-VN';
                window.speechSynthesis.speak(msg);
            }
        }
    </script>
</body>
</html>
