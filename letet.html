<!DOCTYPE html>
<html>
<head>
    <title>BẢNG ĐIỀU KHIỂN - TAXI PROMAX</title>
    <meta charset="utf-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body style="text-align:center; padding:50px; font-family:sans-serif;">
    <h2>🧧 ĐIỀU KHIỂN HỆ THỐNG</h2>
    
    <button onclick="changeMode('tet')" style="padding:20px; background:red; color:white; font-weight:bold; border-radius:10px; cursor:pointer; width:250px; margin-bottom:20px;">
        BẬT CHẾ ĐỘ TẾT (VIỀN ĐỎ)
    </button>
    <br>
    <button onclick="changeMode('normal')" style="padding:20px; background:gray; color:white; font-weight:bold; border-radius:10px; cursor:pointer; width:250px;">
        TẮT - VỀ BÌNH THƯỜNG
    </button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDWX-YyE_1-F0yNqW9Kk8-G-Y4fG-Z-Y4f",
            authDomain: "taxi-promax-9f79b.firebaseapp.com",
            databaseURL: "https://taxi-promax-9f79b-default-rtdb.firebaseio.com",
            projectId: "taxi-promax-9f79b",
            storageBucket: "taxi-promax-9f79b.appspot.com",
            messagingSenderId: "338804599298",
            appId: "1:338804599298:web:b1d70a31270438"
        };
        firebase.initializeApp(firebaseConfig);
        
        function changeMode(type) {
            firebase.database().ref('currentEvent').set(type)
            .then(() => alert("✅ Lệnh đã gửi: " + type))
            .catch((e) => alert("❌ Lỗi: " + e.message));
        }
    </script>
</body>
</html>
