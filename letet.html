<!DOCTYPE html>
<html>
<head>
    <title>CÀI ĐẶT LỄ TẾT - TAXI PROMAX</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body style="font-family:sans-serif; text-align:center; padding:50px; background:#f4f4f4;">

    <h2>🧧 CÀI ĐẶT SỰ KIỆN & GIÁ CƯỚC</h2>
    <p>Bấm nút dưới đây để thay đổi toàn bộ hệ thống:</p>

    <div style="margin-top:20px;">
        <button onclick="setEvent('tet')" style="padding:15px 30px; background:red; color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">
            BẬT CHẾ ĐỘ TẾT (ĐỔI GIAO DIỆN)
        </button>
    </div>

    <div style="margin-top:20px;">
        <button onclick="setEvent('normal')" style="padding:15px 30px; background:green; color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">
            VỀ CHẾ ĐỘ BÌNH THƯỜNG
        </button>
    </div>

    <script>
        // Mã kết nối tổng đài của anh Đạt
        const firebaseConfig = {
            apiKey: "AIzaSyDWX-YyE_1-F0yNqW9Kk8-G-Y4fG-Z-Y4f",
            authDomain: "taxi-promax-9f79b.firebaseapp.com",
            databaseURL: "https://taxi-promax-9f79b-default-rtdb.firebaseio.com",
            projectId: "taxi-promax-9f79b",
            storageBucket: "taxi-promax-9f79b.appspot.com",
            messagingSenderId: "338804599298",
            appId: "1:338804599298:web:b1d70a31270438"
        };
        
        // Khởi tạo Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function setEvent(type) {
            db.ref('currentEvent').set(type)
            .then(() => {
                alert("✅ Đã kích hoạt chế độ: " + (type === 'tet' ? 'LỄ TẾT' : 'BÌNH THƯỜNG'));
            })
            .catch((error) => {
                alert("❌ Lỗi: " + error.message);
            });
        }
    </script>
</body>
</html>
